:root{--ty-bg:#0d1118;--ty-bg-soft:#161d29;--ty-card:rgba(20,27,38,0.88);--ty-line:rgba(214,181,117,0.26);--ty-line-strong:rgba(214,181,117,0.46);--ty-text:#eadfbf;--ty-text-soft:#c1b18b;--ty-text-faint:#7f7662;--ty-accent:#d6b575;--ty-accent-deep:#8c6a2e;--ty-shadow:0 18px 48px rgba(0,0,0,0.34)}body{margin:0;background:transparent;font-family:'Noto Serif SC','Songti SC',serif}#app{width:100%}.status-shell{position:relative;overflow:hidden;border:1px solid var(--ty-line);border-radius:18px;background:radial-gradient(circle at top right,rgba(214,181,117,0.18),transparent 24%),linear-gradient(180deg,rgba(12,15,22,0.97),rgba(18,24,34,0.95));color:var(--ty-text);box-shadow:var(--ty-shadow)}.status-backdrop{position:absolute;inset:0;background:linear-gradient(120deg,transparent 0%,rgba(255,255,255,0.03) 38%,transparent 58%),radial-gradient(circle at left center,rgba(214,181,117,0.08),transparent 30%);pointer-events:none}.status-frame{position:relative;z-index:1;padding:18px}.status-header{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--ty-line)}.status-seal{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;border:1px solid var(--ty-line-strong);background:linear-gradient(180deg,rgba(140,106,46,0.34),rgba(214,181,117,0.10));color:#f6e7c0;font-weight:700;letter-spacing:2px}.status-heading{min-width:0}.status-title{font-size:20px;line-height:1.2;letter-spacing:3px;color:#f4e6be}.status-subtitle{margin-top:5px;font-size:12px;color:var(--ty-text-faint);letter-spacing:2px}.status-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}.meta-item{min-width:0;padding:12px 14px;border-radius:14px;border:1px solid rgba(214,181,117,0.16);background:rgba(255,255,255,0.03)}.meta-label{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;margin-right:8px;border-radius:50%;background:rgba(214,181,117,0.12);color:var(--ty-accent);font-size:12px}.meta-value{font-size:13px;color:var(--ty-text-soft);word-break:break-word}.npc-section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.section-title{font-size:15px;letter-spacing:2px;color:var(--ty-accent)}.section-count{font-size:12px;color:var(--ty-text-faint)}.npc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.npc-card{padding:14px;border-radius:16px;border:1px solid rgba(214,181,117,0.14);background:linear-gradient(180deg,rgba(255,255,255,0.032),rgba(255,255,255,0.015)),var(--ty-card)}.npc-topline{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.npc-name{font-size:18px;color:#f7e8c5;letter-spacing:2px}.npc-tags{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}.npc-tags span{padding:4px 8px;border-radius:999px;background:rgba(214,181,117,0.08);color:var(--ty-text-soft);font-size:11px}.npc-mindset{display:flex;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed rgba(214,181,117,0.16)}.mindset-mark{flex:0 0 auto;width:24px;height:24px;display:grid;place-items:center;border-radius:7px;background:rgba(214,181,117,0.12);color:var(--ty-accent);font-size:12px}.npc-mindset p{margin:0;font-size:13px;line-height:1.75;color:var(--ty-text-soft)}.npc-empty{padding:18px 16px;border-radius:14px;border:1px dashed rgba(214,181,117,0.16);color:var(--ty-text-faint);text-align:center;font-size:13px}@media (max-width:720px){.status-frame{padding:14px}.status-meta{grid-template-columns:1fr}.npc-grid{grid-template-columns:1fr}.status-title{font-size:18px;letter-spacing:2px}}
