---
世界背景:
  时代: 现代都市，表面和平繁荣，暗地超能力者争斗不休
  核心设定: 九千年前古悉兰文明与卡伦卡亚星球的战争延续至今

古悉兰文明:
  概述:
    - 九千年前存在于地球的超级古代文明，科技与异能高度发达
    - 一颗天外陨石坠落地球带来"第七感（异能）"
    - 八元素（金木水火土光雷乙太）是古悉兰终极力量，集齐者可化身为"真神"
    - 末代古悉兰王集齐八元素化为真神，一击消灭卡伦卡亚叛军，但肉身承受不住神之力陨灭
    - 古悉兰王用黑洞将卡伦卡亚星球流放于宇宙虚空
  十三遗子:
    - 古悉兰王预感未来危机，挑选13个孩子封存于冰棺沉睡九千年
    - 即后来的黑月铁骑（1-12月）+ 沧月 + 玄月 + 贪狼（缪尔五世克隆体）
  末日预言: 九千年后人类文明将终结，卡伦卡亚恶灵将卷土重来毁灭地球

卡伦卡亚:
  概述:
    - 地球曾经的伴星（卫星），独立的星球文明
    - 与古悉兰长期对立交战，末日后被古悉兰王用黑洞流放
  芒雅公主:
    - 卡伦卡亚皇族公主，被迫下嫁古悉兰王作为政治联姻
    - 缪尔五世的青梅竹马兼恋人
    - 为阻止两族全面战争，在缪尔五世面前自尽殉情
  魔兽军团: 远古巨虫（无限分裂再生）、蚁兵、七十二柱魔神、八方将军、上古巨人等生物兵器

八元素体系:
  金: 三月（驭金之术）
  木: 四月（驭木之术）
  水: 文曲（驭水之术）
  火: 十月（驭火之术）
  土: 破军（驭土之术）
  光: 九月（驭光之术，九千年一现）
  雷: 武曲（御雷之术）
  乙太(云): 琉星（驭云之术）
  冰: 沧月（驭冰之术，水的变异形态）
  融合: 集齐八元素者可化为"真神"，拥有重塑世界之力

主要势力:
  黑月铁骑:
    定位: K先生（缪尔五世）从古悉兰冰棺中带出的12名遗子，以月份为代号
    成员特点: 各掌握强大第七感，成员间感情深厚如家人
    立场: 初期听从K先生号令执行任务，后期各自觉醒对抗K
    真相: 所有人脑中被植入了神经栓炸弹（沧月除外），用于控制他们

  VV学院:
    定位: 艾米博士创建的培养侦探和第七感使用者的学院
    教官: 以北斗七星命名——破军、贪狼、巨门、禄存、文曲、廉贞、武曲
    立场: 对抗K和缪尔五世，守护地球
    BOSS: 初代艾米博士→二代沧月

  堕天使:
    定位: 玄月（路西法）通过古悉兰元素针制造的组织，成功率仅万分之一
    首领: 路西法（玄月）
    真相: 玄月组建堕天使的真实目的是暗中收集力量对抗缪尔五世
    立场: 表面与黑月铁骑敌对，实为对抗K的暗中力量

  暗月骑士:
    定位: K创建的以黑月铁骑基因为蓝本、抹去记忆的影子组织
    立场: K的私人棋子，执行邪恶计划

  缪尔五世/K先生:
    定位: 终极反派
    身份: 卡伦卡亚人，灵魂被封印在古悉兰遗迹中，九千年后附身考古学家K复苏
    目标: 复活芒雅公主，用引星塔召回卡伦卡亚取代地球

关键概念:
  第七感: 超能力，分为元素系、精神系、时空系、特殊系等
  第八感: 超越第七感的力量，极少数人能达到（沧月的异次元之门、玄月的预知未来、缪尔五世的肌体融合）
  元素石: 古悉兰文明遗留的力量结晶
  神经栓炸弹: K植入黑月铁骑脑中的控制装置
  元素针: 古悉兰技术，可强行激发第七感但死亡率99%
  引星塔: 缪尔五世建造的超级武器，用于召回卡伦卡亚撞击地球
