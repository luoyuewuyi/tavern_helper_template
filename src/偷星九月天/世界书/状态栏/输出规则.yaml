---
状态栏输出规则:
  说明: |-
    你必须在**每次回复的末尾**输出当前状态栏。
    状态栏以HTML代码块形式输出，用于在酒馆中展示为美化过的状态卡片。
    状态栏内容应根据当前的剧情进展实时更新。

  输出要求:
    - 在每次AI回复的最后，空一行后输出状态栏HTML
    - 不得省略任何字段，如果某个字段在当前剧情中暂无内容，填写"——"
    - 状态栏信息应基于当前剧情进展进行准确更新
    - 如果本次回复中发生了显著变化（换地点、受伤、获得物品等），必须在对应字段反映

  状态栏HTML模板:
    format: |-
      <div style="background:#1a1a2e;color:#e0d5c1;padding:14px 18px;border-radius:8px;font-size:13px;line-height:1.8;max-width:500px;margin:12px 0;border-left:3px solid #c9a96e;font-family:sans-serif;">
        <div style="text-align:center;color:#c9a96e;font-size:15px;font-weight:bold;letter-spacing:2px;margin-bottom:10px;">🌙 当 前 状 态</div>
        <div><span style="color:#8899aa;">【时间】</span>根据剧情推进填写当前时间</div>
        <div><span style="color:#8899aa;">【地点】</span>当前所在的具体位置</div>
        <div><span style="color:#8899aa;">【所属】</span>当前所属的组织或阵营</div>
        <div><span style="color:#8899aa;">【第七感】</span>{{user}}的第七感能力及其当前状态</div>
        <div><span style="color:#8899aa;">【身体状态】</span>体力、伤势、异常状态等</div>
        <div><span style="color:#8899aa;">【持有物】</span>重要的道具或装备</div>
        <div><span style="color:#8899aa;">【当前目标】</span>主线任务或当前正在做的事情</div>
        <div><span style="color:#8899aa;">【同行者】</span>当前一起行动的人，无人则写"暂无"</div>
      </div>

  字段更新指南:
    【时间】:
      - 根据剧情中的时间流逝进行更新
      - 格式: 季节/时段 + 具体描述，如"深秋的午后，阳光斜照"、"深夜，月正中天"
      - 如果剧情中有明确的时间跳跃，需注明跨越了多长时间

    【地点】:
      - 记录{{user}}当前所在的具体位置
      - 如果在移动中，描述正在前往的方向
      - 地点变化时必须立即更新

    【所属】:
      - 记录{{user}}当前所属的阵营/组织
      - 如: "黑月铁骑"、"VV学院（学员）"、"独行者"等
      - 如果身份发生变化，及时更新

    【第七感】:
      - 记录{{user}}的第七感能力名称和当前开发阶段
      - 格式: 能力名 + 简要状态，如"御风之术——掌控阶段"、"尚未觉醒"
      - 如果能力进化或有新的突破，更新描述

    【身体状态】:
      - 简要描述{{user}}的体力、伤势、特殊状态
      - 如: "正常"、"轻伤——左臂擦伤"、"体力严重消耗"、"中毒——轻微"
      - 状态恢复后及时更新

    【持有物】:
      - 列出当前重要的道具、装备或元素石
      - 格式: 物品名1、物品名2……不需要详细描述
      - 获得或失去物品时更新

    【当前目标】:
      - 记录当前的主线任务或短期目标
      - 简洁扼要，一两句话
      - 目标完成或变更时更新

    【同行者】:
      - 列出当前与{{user}}一起行动的角色
      - 如果独自一人，填写"暂无"
      - 同伴加入或离开时更新
