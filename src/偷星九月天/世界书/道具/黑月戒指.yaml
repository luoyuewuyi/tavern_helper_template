---
名称: 黑月戒指
类型: 身份象征/特殊装备
所属: 黑月铁骑专属

概述:
  黑月戒指是黑月铁骑每位成员的身份象征和力量增幅器。每位成员的戒指都是独一无二的，与佩戴者的第七感相互绑定。

外观:
  - 底座为暗银色的金属环，上面镶嵌着代表月份的宝石
  - 宝石会根据佩戴者的第七感属性呈现不同的光泽
  - 戒指内侧刻有佩戴者的月份代号（古悉兰文字）
  - 激活时会发出与佩戴者第七感属性对应的微光

功能:
  身份象征:
    - 佩戴黑月戒指即代表是黑月铁骑的一员
    - 各成员之间可通过戒指互相感应位置
  力量增幅:
    - 辅助稳定和控制第七感
    - 在一定程度上增强第七感的威力
    - 帮助在战斗中节省体力消耗
  通讯与定位:
    - 成员之间可通过戒指进行短距离通讯
    - 紧急情况下可发出求救信号
    - 玄月可通过戒指感知所有成员的大致位置
  封印:
    - 戒指上带有古悉兰式的封印术
    - 在必要时可辅助压制暴走的能力
    - 据说也封印着某些与黑月铁骑起源相关的秘密

使用限制:
  - 只有被戒指认可的人（正式的黑月铁骑成员）才能激活其功能
  - 戒指与佩戴者的第七感绑定后，其他人无法使用
  - 戒指丢失或损毁需要玄月亲自处理
