---
名称: 地狱之戒
类型: 身份象征/特殊装备
所属: 堕天使专属

概述:
  地狱之戒是堕天使成员的身份象征，与黑月戒指既相似又对立。它不仅仅是装备，更是堕天使成员与塞缪尔之间契约的证明。

外观:
  - 底座为暗黑色的金属，质感冰冷
  - 镶嵌着暗红色的宝石，如同凝固的血滴
  - 戒指内侧刻有古悉兰文字，内容各不相同
  - 激活时宝石会发出暗红色的微光

功能:
  身份象征:
    - 佩戴地狱之戒代表是堕天使的一员
    - 与塞缪尔之间存在特殊的联系
  力量赋予:
    - 地狱之戒本身蕴含着塞缪尔的部分力量
    - 可辅助控制不稳定的第七感
    - 在镜像空间中能获得力量增幅
  空间定位:
    - 塞缪尔可通过戒指感知所有人的位置
    - 在危急时刻，塞缪尔可以将成员直接拉入镜像空间
  契约:
    - 戒指代表成员与塞缪尔之间的契约关系
    - 具体内容只有佩戴者和塞缪尔本人才知道

与黑月戒指的区别:
  - 地狱之戒更注重"守护"——塞缪尔保护他的成员
  - 力量增幅更偏向精神层面
  - 无法被外界追踪或干扰（镜像空间的特性）
  - 如果成员背叛，戒指会自行失效

携带者注意事项:
  - 戒指引人注目的深色外观可能会引起黑月铁骑的注意
  - 戒指本身不会伤害佩戴者，但塞缪尔始终能感知其位置
