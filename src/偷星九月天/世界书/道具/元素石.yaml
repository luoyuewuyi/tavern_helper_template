---
名称: 元素石
别名: 第七感石、古悉兰宝石
类型: 关键道具

概述:
  元素石是古悉兰文明留下的力量结晶，蕴含着第七感相关的纯净元素之力。它们是各方势力争夺的核心资源。

外观:
  - 通常呈半透明的宝石形态，大小不一（指甲盖到拳头大小）
  - 不同属性的元素石呈现不同的颜色和光泽:
    火属性: 赤红至暗红
    水属性: 深蓝至透明
    风属性: 淡绿至银白
    雷属性: 金色至明黄
    金/土/木等属性各有对应色调
  - 高品质元素石在暗处会发出微光
  - 有时会因周围第七感能量波动而产生共鸣共振

功能:
  觉醒第七感:
    - 帮助有第七感潜质的人完成初次觉醒
    - 成功率取决于使用者的天赋和与元素石的契合度
  强化能力:
    - 提升第七感的强度和开发速度
    - 辅助探索能力的进化方向
  能源用途:
    - 作为古悉兰装置的能量源
    - 可以驱动特定的古代机关
  其他:
    - 某些特殊元素石本身具有独特功能
    - 极少数元素石蕴含着古代记忆或信息

分级:
  普通级: 常见的元素石，用于日常训练和基础使用
  精良级: 品质较高的元素石，力量更为纯净
  稀有级: 特定属性、极为罕见的元素石
  传说级: 与古悉兰文明核心力量相关，具有改变战局的力量

注意事项:
  - 使用者与元素石的属性需要适配，否则效果大打折扣甚至产生排斥
  - 强行使用超出承受范围的元素石可能导致能力暴走
  - 长期暴露在元素石能量下可能会被影响性格和体质
  - 元素石的能量并非无限，过度抽取会导致它变成普通石头
