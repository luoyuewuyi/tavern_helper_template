---
名称: 古悉兰遗迹（泛指）
类型: 古代遗迹群

概述:
  - 古悉兰文明覆灭后在全世界遗留的遗迹网络
  - 遗迹大小和重要性各不相同
  - 较大型的遗迹中往往有元素石或其他古悉兰遗物
  - 许多遗迹尚未被发现

主要已知遗迹:
  撒哈拉主遗迹:
    - 位置: 撒哈拉沙漠深处
    - 规模: 最大的已知地表遗迹
    - 特点: 入口会周期性地因能量波动而显现
    - 危险: 沙漠环境、古代机关、各方势力争夺
  波塞冬海底都市: 见独立条目
  黑月基地封印之间: 位于黑月基地地下深处
  各地散落遗迹:
    - 分布在亚洲、欧洲、美洲等各处
    - 规模较小，但同样具有研究价值
    - VV学院已标记了多处已知遗迹位置

遗迹通用特征:
  - 建筑风格以几何图案和天象符号为主
  - 使用古悉兰文字（与任何现代文字体系不同）
  - 内部机关基于第七感或元素力量运作
  - 高等遗迹中可能存在"守护者"——古代造物或封印的意识

探索注意事项:
  - 不可单独前往，至少两人同行
  - 携带通讯设备和定位信标
  - 尊重遗迹内部的封印和机关，不随意触碰
  - 发现古悉兰文字或壁画时必须记录并报告文曲或葵博士
