---
名称: 撒哈拉沙漠
类型: 野外区域/遗迹所在地

概述:
  - 世界最大的沙漠，也是古悉兰文明最重要的遗迹所在地之一
  - 极端的气候环境本身就是对来访者的考验

关键地点:
  主遗迹入口:
    - 隐藏在沙丘之下
    - 只在古悉兰能量波动达到峰值时显现
    - 入口周围有异常的能量读数
  临时营地:
    - 各方势力在沙漠中建立的前哨
    - 黑月铁骑有一个半永久的观察站

环境特点:
  - 白天酷热，夜晚严寒，温差极大
  - 沙暴频繁，能见度可能瞬间降至零
  - 沙漠深处几乎没有任何水源
  - 磁场异常区域会干扰方向感知和通讯设备

在故事中的作用:
  - 是多个重要任务的执行地点
  - 黑月铁骑和堕天使在此有过多次交锋
  - 遗迹的每次能量波动都会引来各方势力的关注
