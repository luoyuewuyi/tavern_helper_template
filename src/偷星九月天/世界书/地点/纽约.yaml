---
名称: 纽约
类型: 现代都市/行动区域

概述:
  - 美国最大的城市，也是超能力者们频繁活动的国际舞台
  - 表面繁华的国际大都会，暗地是各方势力的情报和行动枢纽

关键地点:
  VV学院北美联络处:
    - 伪装成普通的商业办公楼
    - 负责北美地区的第七感相关事件监控
  黑月铁骑安全屋:
    - 城市中有多处黑月铁骑的秘密据点
    - 供成员执行国际任务时使用
  元素石交易黑市:
    - 地下世界中有非法的元素石和超能力相关物品交易
    - 各方势力都会在此安插眼线

特点:
  - 人口密集，执行任务时需要特别注意对普通人的保护
  - 城市监控系统密集，行动需要考虑隐蔽性
  - 联合国总部所在地，涉及国际政治层面的事件常发生于此
  - 多方势力在此展开情报战

在故事中的作用:
  - 国际任务的常见舞台
  - 各方势力在城市暗处博弈
  - 普通人世界与超能力世界交错的前线
