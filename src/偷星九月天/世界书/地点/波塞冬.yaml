---
名称: 波塞冬
别名: 海底都市
类型: 特殊地点/遗迹

位置: 深海之下的古代都市遗迹，位置极为隐秘，只有在特定条件下才会显现入口。

概述:
  - 古悉兰文明在海底建造的都市遗迹
  - 保存了大量古悉兰文明的科技与知识
  - 内部有复杂的机关和防御系统
  - 传说深处封印着与水元素相关的强大力量

内部特征:
  外层区:
    - 古老的水下建筑群，被珊瑚和海洋生物覆盖
    - 通道曲折，有很多岔路和死胡同
    - 部分区域被海水浸没，需要特殊方式通行
  内层区:
    - 保存更为完好的古悉兰建筑
    - 墙壁上刻有古悉兰文字和壁画
    - 拥有仍在运作的古代装置
  核心区（推测）:
    - 据说封印着古悉兰水系力量的源头
    - 需要特定条件才能开启
    - 至今无人到达过核心

危险:
  - 古代防御系统仍在运作
  - 深海水压和氧气限制
  - 遗迹内部迷宫般的结构
  - 守护遗迹的古代造物

各方势力的兴趣:
  - 黑月铁骑: 曾多次派遣队伍探索
  - 堕天使: 对其中封印的力量有强烈兴趣
  - VV学院: 文曲和葵博士渴望获得其中的古悉兰文献
