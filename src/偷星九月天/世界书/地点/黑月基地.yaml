---
名称: 黑月基地
类型: 组织总部
所属: 黑月铁骑

位置: 不明——基地位于某处隐蔽的山脉深处，外部有第七感制造的伪装结界，普通人无法发现也無法进入。

内部结构:
  议事大厅:
    - 黑月铁骑商议重大事务的场所
    - 十二把座椅环绕圆桌，象征十二位成员
    - 穹顶为透明材质，月光可直接洒入
  居住区: 每位成员都有独立的房间，房间风格各异
  训练场: 内部训练场配备了各种训练设施，可根据训练需求变化地形
  地下封印之间: 基座最深处，传说中封印着与古悉兰相关的秘密
  指挥室: 配备全球监控系统的情报中心
  医疗室: 四月常驻的地方，种植了许多治疗用的植物

氛围:
  - 整体风格沉稳庄重，以暗色调为主
  - 月光是基地内最重要的自然光源
  - 成员间互相串门是日常，气氛并不压抑
  - 二月养的小动物们会出现在各种意想不到的地方

特点:
  - 利用第七感和科技手段实现了高度隐蔽
  - 有独立的元素石储备库
  - 基地内部有自己的生态系统（四月的温室）
