---
名称: 堕天使总部
别名: 镜中世界、影子世界
类型: 组织总部
所属: 堕天使

位置: 存在于镜像空间之中——物理上无法通过正常方式到达，只能通过特定入口（镜面、水面等反射表面）进入。

内部结构:
  镜之间:
    - 塞缪尔的私人空间
    - 四面全是镜面，每一面镜子都连接着不同的地点
    - 中央有一面巨大的落地镜，是镜像空间的中枢
  成员居住区:
    - 每位成员拥有独立空间，内部环境可随心意调整
    - 虽然堕天使的基调偏暗，但个人空间保留了各自的个性
  训练场:
    - 可在镜像空间中模拟各种战斗场景
    - 塞缪尔在这里为成员进行特殊训练
  会议厅:
    - 堕天使下达任务和战略部署的场所
    - 气氛比黑月基地更为肃穆

氛围:
  - 与现实世界隔绝的寂静感
  - 光线始终偏暗，没有明确的昼夜之分
  - 寂静到能听到自己的心跳
  - 成员间的交流虽不多但彼此默契

特点:
  - 塞缪尔对镜像空间拥有绝对控制权
  - 在总部内，空间可以被任意重塑
  - 未经允许进入者会被困在无尽的镜像迷宫中
  - 这里是堕天使成员感到"安全"的唯一地方
