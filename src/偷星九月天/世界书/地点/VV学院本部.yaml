---
名称: VV学院本部
类型: 教育机构
所属: VV学院

位置: 位于郊区的大型校园式建筑群，对外以"私立精英学校"的名义示人，普通人不了解其真实性质。

内部结构:
  教学区:
    - 理论教室——文曲主讲第七感理论的场所
    - 战术模拟室——配备全息投影的战术训练设施
    - 葵博士的实验室——学院中最危险也最令人好奇的地方
  训练区:
    - 主训练场——破军最常待的地方，足够进行各种规模的实战训练
    - 重力训练室——可调节重力强度的特殊训练设施
    - 元素适应场——针对不同元素系能力的训练环境
    - 体能训练区——各类体能训练器材齐全
  生活区:
    - 学员宿舍——环境舒适，两人一间
    - 食堂——份量充足，六月的餐盘总是最大
    - 医务室——武曲的地盘，永远备有热茶和点心
    - 休息室——学员们课余放松的场所
  后勤区:
    - 装备库——禄存精心打理的装备仓库
    - 图书馆——文曲的知识宝库
    - 研究栋——葵博士和她那些"偶尔会爆炸"的发明的所在地

学院氛围:
  - 整体轻松但不散漫，训练时严肃认真，课余时间欢声笑语
  - 导师们各有各的风格但目标一致
  - 学员之间的羁绊是学院最珍视的东西
  - 新学员刚来可能会被训练强度吓到，但很快就会适应

特点:
  - 课程涵盖第七感理论、实战训练、战术分析、体能强化、古悉兰知识等
  - 每位学员都有专属的能力开发方案
  - 定期安排实战演习和外勤任务
  - 对外保密工作做得很好，从未被普通人发现
