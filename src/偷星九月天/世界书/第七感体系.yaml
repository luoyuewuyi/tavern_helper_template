---
第七感概述:
  定义: 人类潜能的极限，超越视觉听觉嗅觉味觉触觉直觉（第六感）之后的力量
  来源: 九千年前天外陨石坠落地球所带来
  本质: 使用者精神力与特定自然元素或概念产生共鸣
  稀有度: 全世界能觉醒第七感的人极少

八元素（古悉兰终极力量体系）:
  描述: 古悉兰文明的核心力量体系，八种元素集齐者可化为"真神"
  元素与持有者:
    金: 三月（驭金之术）——操控任何形态金属并改变形态
    木: 四月（驭木之术）——操控任何植物
    水: 文曲（驭水之术）——操控水流，绝招化血为刃
    火: 十月（驭火之术）——炽红莲、炽斑鸠、炎龙之怒、卍字佛印·大梵天、彼岸花；全开炽修罗；奥义不动明王
    土: 破军（驭土之术）——绝招潜龙勿用，副作用变为婴儿
    光: 九月（驭光之术）——九千年一现的最稀有的光元素
    雷: 武曲（御雷之术）——操控雷电
    乙太(云): 琉星（驭云之术）——操控云/乙太元素
  冰（水的变异形态）: 沧月（驭冰之术）——绝对零度、冰玫瑰、九龙玄冰、南十字星盾、天上天下唯我独尊

其他第七感分类:
  精神系:
    玄月: 精神控制——感受/监控脑电波，远程控制堕天使
    八月: 读心术——看透人心，预判对手动作
    一月: 脑电波爆破——控制接触过的物体变成炸弹，绝招「爆破波板糖」
    二月: 精神控制动物——10公里范围内控制任何动物作为随从
    莉莉丝: 魅之幻术——制造幻境精神控制，让对手死在美好梦境中
    禄存: 灵魂潜入——侵入比自己弱的对象身体
  身体强化系:
    五月: 肌体石化——全身变得无比坚硬，飞起冲击敌人
    巨门: 肌体伸缩/缩小
    卡门: 猫变——靠本能进攻的野兽形态，手化为猫掌
  感知系:
    六月: 声波探测/攻击——相当于纳声仪
    伊峙总司: 魔眼——洞悉视线范围内一切事物，探测对手弱点及能力
    贪狼: 神之手——拇指摄取他人第七感，食指释放，其余三指储存（最多三种），可同时使用三种异能；限制10分钟，冷却1小时
  时空系:
    夜莺: 瞬间移动——可带其他人一起移动
    沧月: 异次元之门（第八感）——开启时间与空间之门，时空转移
    玄月: 预知未来（第八感）——莫莉安给予
  防御系:
    七月: 绝对防御——把空气中电子转化为保护屏，传说核武器也无法穿透；同归于尽招「急速膨胀」

第七感开发阶段:
  觉醒: 初次触发，极不稳定
  掌控: 稳定使用，探索边界
  精通: 灵活运用，低消耗
  进化: 质变获得新形态（如十月的炽修罗）
  极限: 触及第七感巅峰

第八感:
  描述: 超越第七感的更高次元力量，极少数人触及
  已知拥有者:
    - 沧月: 异次元之门（时空转移）
    - 玄月: 预知未来
    - 缪尔五世: 肌体融合

元素石:
  描述: 古悉兰文明遗留的力量结晶
  作用: 帮助觉醒第七感、强化现有能力、作为遗迹钥匙
  属性: 不同属性适配不同使用者，高品质元素石是各方势力争夺至宝

元素针:
  描述: 古悉兰技术制造的第七感激发装置
  作用: 强行激发使用者的第七感
  风险: 成功率仅万分之一，失败即死
  使用者: 玄月用此制造堕天使；三月为复活四月使用

第七感使用限制:
  - 过度使用导致体力透支甚至昏迷
  - 精神系过度使用可能导致精神崩溃
  - 部分第七感有明显副作用（破军变小、文曲武曲越长越小、十月炽修罗烧坏瞳孔）
  - 第七感之间存在相生相克
