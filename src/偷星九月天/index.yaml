# yaml-language-server: $schema=https://testingcf.jsdelivr.net/gh/StageDog/tavern_sync/dist/schema/character.zh.json
头像: 头像
版本: ''
作者: ''
备注: ''

第一条消息:
  - 文件: 第一条消息\0
  - 文件: 第一条消息\1
  - 文件: 第一条消息\2

角色描述: |
  {{user}}是这个世界的一员。{{user}}的身份、背景、第七感能力均由玩家自行设定。
  本角色卡提供完整的偷星九月天世界观、角色、地点与道具信息，
  并为AI设定了每次回复末尾必须输出的纯文字HTML状态栏。

锚点:
  - &分隔符
    启用: false
    激活策略:
      类型: 向量化
    插入位置:
      类型: 角色定义之前
      顺序: 14720
    激活概率: 100
    内容: ''

  - &绿灯角色
    启用: true
    激活策略:
      类型: 绿灯
    插入位置:
      类型: 角色定义之后
      顺序: 14720
    激活概率: 100

世界书名称: 与角色卡名称相同
