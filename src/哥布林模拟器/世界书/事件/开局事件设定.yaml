开局事件设定

## 系统说明
开局事件决定{{user}}的初始处境、资源和面临的第一道抉择。每个事件提供不同的初始路线和特殊优势。

## 七大开局事件

### 1. 勇者遗孤
- **背景**：一支冒险者小队杀入哥布林巢穴，屠杀了大部分哥布林后撤退。{{user}}是巢穴中唯一幸存的幼体，在一具勇者的尸体旁醒来。
- **初始资源**：破损的勇者佩剑（铁器）、半瓶治疗药水、冒险者残骸（可吸收基因）
- **特殊优势**：对「冒险者」类型目标有额外伤害加成；天然理解人类语言和基础战术
- **风险**：该冒险者小队的其他成员可能回来寻找同伴；初始恶名较高
- **初始位置**：幽暗沼泽深处的废弃巢穴

### 2. 血月降临
- **背景**：千年一遇的血月之夜，魔力潮汐达到顶峰。{{user}}在这一夜出生，刚睁眼便沐浴在血月之光中，体内的残缺神性与血月共振，引发了第一次突变。
- **初始资源**：随机一项初级突变（额外肢体/强化感官/元素亲和之一）、血月碎片（一次性道具，使用后可强制触发一次突变）
- **特殊优势**：突变概率永久提升；血月之夜全属性翻倍
- **风险**：突变自带不确定性——可能获得有益的，也可能获得负面突变；各方势力会因血月异象前来调查
- **初始位置**：幽暗沼泽的血月祭坛遗迹

### 3. 奴隶起义
- **背景**：{{user}}原本是人类奴隶贩子捕获的一只哥布林，与其他种族的奴隶关在一起。一夜，奴隶们发动起义，混乱中{{user}}咬断了绳索。牢笼破碎，自由在眼前——但外面的世界只会更残酷。
- **初始资源**：一同逃出的两名奴隶同伴（受伤的半兽人工兵 + 恐惧的人类农奴少女）、奴隶贩子的钥匙（可开普通锁）
- **特殊优势**：开局即有潜在同伴；解放奴隶可获得忠诚追随者
- **风险**：奴隶贩子的追捕队正在搜捕；两名同伴处于极度虚弱状态需要保护
- **初始位置**：中央平原边境的奴隶商队废墟

### 4. 矿脉大亨
- **背景**：{{user}}在幽暗沼泽地下发现了一处富魔矿脉。这种矿石对法师和附魔师来说价值连城。但矿脉也散发出强烈的魔力波动，很快会引来其他掠食者。
- **初始资源**：一处小型富魔矿脉（可采集10-15次）、三块高纯度魔力结晶
- **特殊优势**：初始资产价值高，可以尝试与地下商人交易换取装备或情报；魔力结晶可加速进化
- **风险**：魔力波动会不断吸引附近的魔物和冒险者来探查；开采需要时间和劳力
- **初始位置**：幽暗沼泽地下的隐秘矿洞

### 5. 魔族遗产
- **背景**：{{user}}在沼泽深处发现了一具大恶魔的遗骸——数百年前神陨之战中陨落的深渊领主。遗骸中残留的恶魔精华渗入{{user}}体内，在他身体上留下了一道恶魔刻痕。
- **初始资源**：恶魔刻痕（自带基础火焰抗性和低级恶魔威慑）、一片断角（可锻造或交易）
- **特殊优势**：对低级恶魔具有天然威慑；解锁隐藏的恶魔进化路线；可感知到附近其他恶魔遗物
- **风险**：地狱的某些存在已经感知到遗骸被触碰；恶魔刻痕可能逐渐侵蚀理智
- **初始位置**：幽暗沼泽深处的大恶魔陨落地

### 6. 森林之王
- **背景**：{{user}}并非在沼泽中出生，而是诞生于翡翠森林的边缘。森林中的一位古老树精在他觉醒神性的瞬间感应到了他，并决定——不是杀死他，而是给他一个机会。树精在你身上种下了一枚「森之种」。
- **初始资源**：森之种（缓慢吸收自然魔力，解锁自然系进化路线）、与树精的契约联系（树精偶尔会给提示）
- **特殊优势**：在森林地形中全属性获得小幅加成；自然系生物初始中立态度；解锁隐藏的自然进化路线
- **风险**：森之种会吸引以魔力为食的魔物；精灵巡林者如果发现一只哥布林身上有森之种，会毫不犹豫地杀死他以「净化」
- **初始位置**：翡翠森林边缘的古老树洞

### 7. 战争遗民
- **背景**：一片战场。奥斯特王国与兽人部落的战役刚刚结束三天。满地尸骸，乌鸦漫天。{{user}}从一具兽人战士的头盔下钻出来——那是他五天前的藏身处。战场上到处都是可吞噬的残骸，但食腐者已经闻到了气味。
- **初始资源**：大量可吸收的尸骸（人类+兽人基因碎片）、随机一件残破装备（从战场拾取）
- **特殊优势**：开局基因碎片充足，可能直接触发第一次进化；对「战场」地形有天然嗅觉，可感知附近的战争遗迹
- **风险**：战场的食腐者（食尸鬼、巨乌鸦、亡灵）正在赶来；战场附近可能有双方的清理部队
- **初始位置**：荒芜之地边境的万人战场
