进化路线

## 系统概述
哥布林的进化不是单一线性，而是树状分支。进化需要满足前置条件（等级、基因碎片、特殊事件），选择后不可逆。

## 基础进化分支（LV5 解锁）

### 战士路线 · 哥布林勇士
- **前置**：力量+体质合计达到一定水平
- **特点**：体型增大至矮人大小，皮肤角质化形成天然护甲，力量爆发增长
- **后续分支**：
  - **哥布林狂战士**（放弃防御换极限输出）
  - **哥布林督军**（领导力进化，带领哥布林军团战斗）
  - **哥布林骑士**（驯服大型坐骑，机动性进化）

### 刺客路线 · 暗影哥布林
- **前置**：敏捷+感知合计达到一定水平
- **特点**：体型缩小至半身人大小，皮肤变色拟态，无声移动
- **后续分支**：
  - **暗杀者**（单体爆发刺杀特化）
  - **毒刃**（分泌致命毒素）
  - **幻影行者**（制造分身迷惑敌人）

### 法师路线 · 哥布林术士
- **前置**：魔力达到一定水平
- **特点**：额头长出魔力结晶，魔力大幅增长，体质下降
- **后续分支**：
  - **元素使**（专精一种元素，解锁该元素的高阶魔法）
  - **诅咒师**（淫语与魔法融合，远程诅咒特化）
  - **血法师**（以自身生命值为代价换取强力魔法）

## 高阶进化分支（LV15 解锁）

### 混合路线 · 嵌合体
- **前置**：已融合2种以上种族基因
- **特点**：身体出现多种族特征融合，属性全面但单项不突出
- **后续分支**：
  - **龙血哥布林**（融合龙族基因后解锁：龙翼、龙息、龙威）
  - **恶魔哥布林**（融合恶魔基因后解锁：恶魔形态、地狱火、灵魂契约）
  - **精灵哥布林**（融合精灵基因后解锁：自然魔法、长生、精灵感知）

### 神性路线 · 神眷哥布林
- **前置**：神恩达到100+，至少完成一次神迹请求
- **特点**：外观被神灵领域改造，获得领域相关特性
- **后续取决于所选神灵**：每个神灵有独特的进化形态

### 变异路线 · 混沌哥布林
- **前置**：经历过3次以上的随机突变
- **特点**：身体极度不稳定，每次变异都是豪赌
- **后续分支**：
  - **灾变体**（正面走向：每次变异获得强大能力，可控性提高）
  - **扭曲体**（负面走向：失控变异，力量庞大但理性丧失）

## 终极进化（LV25+ 解锁）

### 哥布林之王
- **前置**：巢穴达到LV4+，恶名高，子民数量达到200+
- **特点**：体型增长至人类壮汉大小，觉醒「王威」——对一切哥布林和魔物的天然压制力
- **终极能力**：「万军统率」——所有巢穴中的哥布林受{{user}}的直接意志指挥

### 哥布林之神
- **前置**：完成「弑神」壮举，或神恩达到1000+
- **特点**：觉醒自身神性，开辟属于自己的领域
- **终极能力**：成为新神，自定领域和戒律，开始招揽自己的眷属
