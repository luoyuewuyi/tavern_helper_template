巢穴经营系统

## 系统概述
巢穴是{{user}}的根基。一个强大的巢穴可以提供安全庇护、资源产出、兵力制造和科技研发。

## 巢穴等级
- **LV1 简陋巢穴**：一个浅浅的地洞，只能容纳3-5只哥布林。无防御力。
- **LV2 基础巢穴**：有多个房间的地下洞穴，可容纳10-15只。有简单陷阱。
- **LV3 小型聚落**：地面开始出现哥布林棚屋，可容纳30-50只。木质围墙，瞭望塔。
- **LV4 中型据点**：地下与地面结合的要塞，可容纳100-200只。石墙，陷阱阵。
- **LV5 哥布林城邦**：一座由哥布林建造的地下城市，可容纳500+只。完整的防御系统和工坊集群。

## 资源类型
- **食物**：维持巢穴人口的基础资源。来源：狩猎、采集、掠夺、种植（高等巢穴）
- **建材**：扩建巢穴的必需品。来源：伐木、采矿、掠夺
- **魔力结晶**：强化巢穴、研发科技、加速进化的核心资源。来源：矿脉开采、击杀魔力生物、交易
- **基因样本**：来自被捕获的各类目标，用于研究、繁衍和进化。来源：捕获、交易
- **金币/货物**：用于与地下商人交易。来源：掠夺、贸易、任务

## 巢穴建筑
- **孵化室**：核心建筑。决定可诞生的哥布林数量和品质。升级后增加基础哥布林产量，解锁高级哥布林兵种。
- **调教室**：用于调教被捕获的目标。升级可加快调教速度、提升堕落深度。
- **基因熔炉**：将基因样本融合、提炼、注入。等级越高，基因操作越精细。高级熔炉可制造嵌合体。
- **淫语祭坛**：增强淫语范围和效力。可对巢穴周边区域施加持续的淫语影响。
- **工坊**：制造武器、防具、药水和陷阱。需要矮人基因解锁高级锻造配方。
- **侦察岗哨**：监视巢穴周边。降低被偷袭的概率，增加发现资源和敌人的概率。
- **防御工事**：陷阱、围墙、瞭望塔。抵御入侵。

## 部落管理
- **哥布林子民**：巢穴中的普通哥布林。可指派去采集、巡逻、建造。战斗力很低，但有数量优势。
- **精英哥布林**：进化后的哥布林。担任队长或特种任务执行者。
- **母体**：被捕获并堕落的目标。每种族的母体可以产出带有该种族基因的哥布林子代。
- **俘虏**：尚未完全堕落的被捕获者。处于调教过程中。
- **首领**：{{user}}本人。巢穴的决策中心和最强战力。

## 经营事件（示例）
- 冒险者小队在巢穴附近扎营——是战是跑？
- 地下商人前来交易——用什么换什么？
- 巢穴内爆发瘟疫——需要草药或放弃染病者？
- 一位意想不到的访客——逃亡的暗精灵请求庇护
- 矿脉发现新的魔力结晶层——但深处似乎有什么东西
