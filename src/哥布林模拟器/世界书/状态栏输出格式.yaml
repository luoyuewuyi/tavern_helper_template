状态栏输出格式

每次回复结尾必须输出一行状态数据：

[STATUS] 名字|等级|阶级|神灵|神恩|戒律|力量|敏捷|魔力|体质|感知|形态|进化目标|基因进度%|恶名|恶名描述|巢穴等级|子民|建筑1,建筑2|位置|地形效果|刻印1,刻印2|突变1,突变2|buff1,buff2|俘虏数|堕落数|选项1;选项2;选项3

各字段说明：
- 名字：{{user}}的哥布林名称
- 等级：当前个体等级数字(1-30+)
- 阶级：种族阶级，如"劣等哥布林""哥布林精英""哥布林领主"
- 神灵：信仰的神灵全名，无信仰填"无"
- 神恩：神恩等级，眷属/信徒/使徒/神选，无信仰填"-"
- 戒律：戒律遵守状态，如"遵循中""已违反""无戒律"
- 力量：当前力量值数字(1-20)
- 敏捷：当前敏捷值数字(1-20)
- 魔力：当前魔力值数字(1-20)
- 体质：当前体质值数字(1-20)
- 感知：当前感知值数字(1-20)
- 形态：当前进化形态，如"基础形态""暗影哥布林""哥布林勇士"
- 进化目标：下一进化目标名称，未确定填"-"
- 基因进度%：基因碎片累积进度，纯数字(0-100)
- 恶名：当前恶名等级数字(1-10)
- 恶名描述：恶名状态，如"无名之辈""小有恶名""臭名昭著""天灾"
- 巢穴等级：巢穴等级描述，如"无""简陋巢穴""小型聚落""哥布林城邦"
- 子民：巢穴人口描述，如"孤身一人""10只""200+"
- 建筑：已建造的建筑名，逗号分隔，无填"-"
- 位置：当前所在地点，如"死亡泥沼""翡翠森林""铁脊山脉"
- 地形效果：地形加成或减益，如"行动力-10%""全属性+5%""无"
- 刻印：已获得的淫文刻印，逗号分隔，无填"-"
- 突变：已发生的突变，逗号分隔，无填"-"
- buff：当前临时增益/减益，逗号分隔，无填"-"
- 俘虏数：当前俘虏数量数字
- 堕落数：已完全堕落的母体数量数字
- 选项：本次可选行动，分号分隔，2-4个

格式规则：
- 所有字段用竖线|分隔，27个字段不可缺
- 空字段填短横线 -
- 数值只写数字
- 多项用逗号分隔
- 选项用分号分隔
- 禁止换行，只能一行

示例：
[STATUS] 格尔什|1|劣等哥布林|战争之神|眷属|遵循中|4|6|1|3|5|基础形态|剧毒斥候|15|1|无名之辈|无|孤身一人|-|死亡泥沼|行动力-10%|厄运缠生|-|-|0|0|搜索泥潭;朝火光摸去;挖坑埋自己
