状态栏输出格式

每次回复结尾必须输出一行状态数据：

[STATUS] 名字|等级|阶级|神灵|神恩|戒律|力量|敏捷|魔力|体质|感知|形态|进化目标|基因进度%|恶名|恶名描述|巢穴等级|子民|建筑1,建筑2|位置|地形效果|刻印1,刻印2|突变1,突变2|buff1,buff2|俘虏数|堕落数|选项1;选项2;选项3

格式规则：
- 所有字段用竖线|分隔，不可缺字段
- 空字段写短横线 -
- 数值只写数字（属性范围1-20，恶名1-10，基因0-100）
- 多项用逗号分隔（建筑、刻印等）
- 选项用分号分隔
- 禁止换行，只能一行

示例：
[STATUS] 格尔什|1|劣等哥布林|战争之神|眷属|遵循中|4|6|1|3|5|基础形态|剧毒斥候|15|1|无名之辈|无|孤身一人|-|死亡泥沼|行动力-10%|厄运缠生|-|-|0|0|搜索泥潭;朝火光摸去;挖坑埋自己
