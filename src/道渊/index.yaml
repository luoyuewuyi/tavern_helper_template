      不可激活其他条目: true
    内容: |-
      玄天界·雷劫设定
       
      玄天界雷劫为天道法则显化，是修士突破境界时，天道对其“窃取天地灵气、触碰更高道途”的考验与惩戒，与心魔劫共生双生，雷劫炼肉身、淬道基，心魔劫磨神魂、凝道心，二者缺一不可，需同时硬抗。雷劫强度由修士突破方式、道途罪孽、天地气运决定：靠血腥丹药/掠夺他人突破者，雷劫引“业火之力”；走杀伐道/身负滔天罪孽者，雷劫凝“噬魂雷光”；天纵奇才/身负大气运者，雷劫召“法则神雷”，反之，苦修突破、道心纯良者，雷劫仅为普通淬体雷光。

