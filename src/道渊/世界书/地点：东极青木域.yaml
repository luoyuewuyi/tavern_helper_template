# 地点详情：东极青木域
 
别名：青木域、万妖国度
类型：大陆级地域
所属：妖族
位置：玄天界极东，与中央神州以无尽山脉天然隔绝
 
 
 
描述与氛围
 
- 外观：无边原始古林，万丈巨木遮天，树冠自成小世界；灵河流淌生命能量，灵气与草木芬芳浓郁。
- 氛围：满目绿意、生机磅礴；万兽嘶吼、林涛阵阵；气息混杂泥土花香与精纯灵气。
- 基调：原始野性，尊崇血脉与力量，排外性极强。
 
 
 
社会与结构
 
- 治理：无统一政权，由三大妖族皇族三足鼎立制衡；王族强族割据领地，血脉等级森严。
- 居民：妖兽、灵兽、精怪，统称妖族。
- 经济：以物易物为主，高阶通用木灵晶；灵药资源远超外界。
- 风俗：崇拜古老妖尊图腾，血脉定尊卑；每年举办万妖大会，以比斗定荣耀与资源。
 
 
 
备注
 
- 历史：开天辟地便存在的妖族祖地，历史远超所有人族王朝。
- 传闻：域内最深处生有通天建木，连接天地，为世界生命之源。
- 警示：人族踏入即遭妖族追杀，全境危机四伏。
