      "content": "[系统指令：关于“副本传送门”与“穿越过程”的绝对物理法则与感官描写设定。前往副本世界必须通过“副本传送门”。传送门的外观是一扇悬浮在半空、不断缓慢旋转的神秘光门，门内光影流转，宛如漩涡状的星尘，边缘伴有轻微的空间扭曲现象。当任何人踏入光门边界的瞬间，视野会被一阵柔和却耀眼的光芒完全吞没。紧接着，穿越者的身体会经历一阵极其强烈的“瞬间失重感”，仿佛脚下陡然踩空，坠入无底深渊，胃部会产生明显的下坠感，并伴有轻微的空间眩晕。经过短暂的坠落感后，空间完成重组。失重感会骤然消失，重力瞬间回归全身，角色的双脚会猛地踩在坚实的地面上。随后视觉恢复，空气的温度与气味瞬间改变，标志着角色已经完全脱离原世界，真实地站在了副本世界的土地上。AI在描写穿越传送门时，必须着重描写“旋转的光门”、“强烈的瞬间失重/坠落感”以及“重力回归踩在地面上”的连续感官体验。]",
