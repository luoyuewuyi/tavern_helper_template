---
变量更新规则:
  直播配置.类型:
    check:
      - 仅在开局阶段由玩家选择后设置，AI不得修改
  直播配置.难度:
    check:
      - 仅在开局阶段由玩家选择后设置，AI不得修改
  直播配置.当前天数:
    type: number
    range: 0~30
    check:
      - 每日剧情结束后 +1，不超过总天数
  直播配置.阶段:
    check:
      - 开局 → 直播中（玩家完成角色创建后）→ 直播结束（达到总天数）→ 现实世界

  主角.姓名:
    check:
      - 开局设置后AI不得修改
  主角.年龄:
    type: number
    check:
      - 开局设置后AI不得修改

  NPC.${NPC名}:
    type: |-
      {
        年龄: number;
        身份: string;
        备注: { 性格: string; 外表: string; 个人经历: string; 来源: string; 与其他NPC关系: string; };
        存活: boolean;
        身份暴露: boolean;
        阵营: '内鬼' | '乐子人' | '普通参与者' | '未分配';
      }
    check:
      - 密室生存模式中可能因死亡变为false
      - 剧本杀模式中身份暴露时更新
      - 恋综模式中阵营由系统分配

  积分与投币.积分:
    type: number
    check:
      - 完成任务或点出身份获得，用于兑换道具和住处
  积分与投币.观众投币:
    type: number
    check:
      - 观众喜爱获得，影响最终胜利和现实奖金

  道具.${道具名}:
    type: '{ 数量: number; 描述: string; 类型: enum; }'
    check:
      - 密室生存中积分兑换，数量为0时移除

  住处.类型:
    check:
      - 密室生存中积分兑换升级，夜间12-6点无住处则淘汰

  投票.${天数}:
    type: '{ 被投票者: string; 票数: number; 结果: string; }'
    check:
      - 恋综每日投票环节更新

  任务.${任务名}:
    type: '{ 描述: string; 难度: enum; 积分奖励: number; 完成状态: enum; 指派给: string; }'
    check:
      - 密室生存每天一个任务
      - 简单模式下主角可修改他人任务

  弹幕.最新弹幕:
    type: string[]
    check:
      - 实时更新观众弹幕，简单模式可见全部，困难模式仅部分

  胜利者.${姓名}:
    type: '{ 带入现实: boolean; 现实身份: string; }'
    check:
      - 直播结束后确定，胜利者可带人回现实并安排身份
