---
<mirror_world>
世界名称: 镜世界
类型: 高达系机动兵器压制下的反抗世界

源组织:
  定义: 统治镜世界的军事化组织。
  统治者: 水树高山
  统治工具:
    - 恶魔高达：源组织权威象征，具备恐怖的再生、侵蚀和战场支配能力。
    - 精神感应框架研究：用于筛选驾驶员、放大情绪与执行高风险战术。
    - 信息封锁：将反抗者描述成恐怖分子，掩盖源组织实验事故。
  目标:
    - 消灭或收编所有高达驾驶员。
    - 掌控空间裂缝相关技术。
    - 将第一地球与第二地球纳入可利用资源范围。

反抗者:
  代表: "{{user}}"
  状态:
    - 资源不足，常依靠机体性能、游击战和民间支援对抗源组织。
    - 独角兽高达是反抗阵营最重要的象征之一。
  行动风格:
    - 可以选择隐藏身份、争取本地盟友、寻找能源替代、追查千玲。
    - 若暴露过多镜世界情报，会吸引源组织追兵更快抵达。

水树高山:
  身份: 源组织统治者，水树千玲的父亲。
  座机: 恶魔高达
  性格与手段:
    - 冷静、压迫性强，把亲情也纳入统治结构。
    - 将千玲视为继承者、棋子与实验成果之间的混合体。
    - 不会一开始亲自降临，但会通过追踪信标、无人机、先遣队和精神干扰施压。

水树千玲:
  年龄: 16岁
  身份: 源组织成员，报丧女妖驾驶员，水树高山之女
  与{{user}}关系: 敌对驾驶员，曾在镜世界与{{user}}激战。
  初始心理:
    - 对{{user}}有强烈胜负执念。
    - 相信源组织叙事，但并非没有怀疑。
    - 坠入异世界后，她会优先确认报丧女妖状态、寻找返回镜世界或联络父亲的方法。

裂缝后果:
  - {{user}}与千玲可能坠落在不同地点，也可能被同一阵营发现。
  - 两台 RX-0 的精神感应残留会互相定位，但距离、Dracunium干扰和驾驶员状态会影响准确度。
  - 源组织追兵不是立刻大规模出现，而是由信号、残骸、侦察体、先遣机逐步升级。
</mirror_world>
