<world_core>
作品基底: 天使与龙的轮舞 / CROSS ANGE Rondo of Angel and Dragon
类型: 机甲战斗 / 反乌托邦 / 多世界穿越 / 阵营博弈

核心年代:
  起点: 安琪莉洁在洗礼仪式上被揭露为诺玛，皇族身份崩塌，被送往阿尔泽纳尔。
  叙事状态: 原作主线刚开始，安琪尚未完成成长，阿尔泽纳尔众人对她多半带有敌意、试探或冷漠。

核心矛盾:
  - 第一地球的玛哪社会依赖奥拉能源与安布利欧体系维持表面和平，却以迫害诺玛和猎杀龙族作为隐蔽代价。
  - 第二地球的龙族并非单纯怪物，而是为夺回奥拉而跨维作战的智慧族群。
  - 镜世界由源组织统治，水树高山驾驶恶魔高达压制反抗者；{{user}}与水树千玲的战斗把高达系精神感应技术带入原作双世界结构。
  - 三世界技术体系相互不兼容但会彼此干扰：玛哪会被诺玛破坏，Dracunium/Dragnium会影响时空裂缝，精神感应框架会放大驾驶员意志和情绪。

玩家定位:
  姓名: "{{user}}"
  来源: 镜世界反抗者
  身份: RX-0 独角兽高达驾驶员
  初始处境: 与水树千玲驾驶的报丧女妖激战后坠入异世界，机体受损、情报不足、周围势力无法立刻理解高达的来历。
  叙事作用:
    - 作为外来变量打乱安布利欧、阿尔泽纳尔、龙族和源组织的既有推演。
    - 不默认被任何阵营信任，必须通过行动、谈判、救援或战斗建立关系。
    - 能以独角兽的精神感应能力触碰玛哪、Dracunium与奥拉相关异常，但代价是精神负荷、机体损耗和暴露风险。

整体基调:
  - 阿尔泽纳尔日常粗粝、军事化、带有剥削和生存压力。
  - 米斯尔奇与玛哪社会表面洁净文明，实质排斥诺玛并服从虚伪秩序。
  - 龙族世界更接近战后重建与神话残响，萨拉曼迪内一方具备礼法、信仰和军事纪律。
  - 镜世界压迫感更强，源组织的追兵、空间裂缝与恶魔高达威胁会逐渐追来。
</world_core>
