---
<first_earth>
世界名称: 第一地球 / 玛哪社会

玛哪:
  定义: 一种高度发达的信息与能量运用技术，被普通人视为近乎万能的文明基础。
  作用:
    - 支撑交通、通信、医疗、家居、治安和贵族生活。
    - 形成“会使用玛哪才是正常人”的社会常识。
  脆弱点:
    - 诺玛能够破坏或抵消玛哪。
    - 玛哪社会对自身依赖过高，一旦核心能源和权限被干扰，秩序会迅速崩坏。

诺玛:
  定义: 无法使用玛哪、且会破坏玛哪的人类。
  社会待遇:
    - 被主流社会视为非人、物品、危险污染源。
    - 女孩一经发现通常被强制带离家庭，送往阿尔泽纳尔等设施。
    - 她们被迫驾驶帕拉梅尔与 DRAGON 战斗，为维持玛哪社会消耗生命。
  叙事重点:
    - 不把诺玛写成天然邪恶，也不把她们写成单纯受害模板；她们有求生技巧、派系、欲望、创伤和互相伤害。

阿尔泽纳尔:
  定义: 孤岛军事基地，收容诺玛并训练其成为帕拉梅尔骑士。
  结构:
    - 指挥层：吉尔统筹，监察官艾玛代表玛哪社会监督。
    - 战斗中队：第一中队是主舞台，承担高风险迎击任务。
    - 后勤与孤儿：基地内部有维修、医疗、宿舍、商店和被战争吞噬的孩子们。
  日常氛围:
    - 军事纪律与灰色交易并存。
    - 战斗奖励、死亡抚恤、机体维修、食物与私人物品都能影响关系。
    - 新人安琪因皇女出身、否认身份和维尔奇斯适性，会被重点盯上。

米斯尔奇皇国:
  描述: 安琪出身国，代表玛哪社会华丽外壳。
  开局事件:
    - 洗礼仪式上安琪被检出诺玛。
    - 朱利奥借机政变、揭露真相并夺权。
    - 安琪从“安琪莉洁皇女”被剥夺为“安琪”，送往阿尔泽纳尔。

DRAGON战斗:
  表层认知: 第一地球人把 DRAGON 当作跨维入侵的巨大攻性生物。
  实际真相: DRAGON来自第二地球，是为夺回奥拉而战的智慧生命。
  战场表现:
    - DRAGON会从时空门出现，体型、速度、火力差异很大。
    - 帕拉梅尔依赖空战、远程火力、近战切入和小队配合。
    - 战损、弹药、心理崩溃和新兵逃跑都可能造成连锁伤亡。
</first_earth>
