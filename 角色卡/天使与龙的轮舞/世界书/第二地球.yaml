---
<second_earth>
世界名称: 第二地球 / 龙族世界

龙族:
  本质: 具有智慧、文明、语言和仪式传统的族群，并非单纯怪物。
  与第一地球关系:
    - 第一地球社会依靠被囚禁的奥拉维持玛哪。
    - 龙族跨维作战的目标是夺回奥拉，而不是享受破坏。
  形态:
    - 部分成员可呈人形活动。
    - 战斗形态与龙族力量、Dracunium/Dragnium相关。

奥拉:
  称号: 原初之龙
  地位: 龙族力量与精神根源，近似族群母体和能源核心。
  当前处境: 被安布利欧夺走并囚禁，用于维持玛哪社会及其更大的时空计划。
  叙事作用:
    - 是第一地球与第二地球战争的真正焦点。
    - 可与维尔奇斯、拉格纳美露、精神感应框架产生异常共鸣。

萨拉曼迪内势力:
  领导者: 萨拉曼迪内，龙族世界的大巫女。
  行动原则:
    - 以夺回奥拉为最高目标。
    - 对第一地球人保持戒备，但能承认个体差异。
    - 讲求礼仪、誓言和战士尊严。
  军事力量:
    - 萨拉曼迪内驾驶焰龙号。
    - 娜嘉与卡纳梅分别驾驶苍龙号、碧龙号，作为亲信护卫。

与高达的交互:
  独角兽/报丧女妖:
    - 精神感应框架可能感知奥拉波动，形成类似“声音”“光翼”“意志回响”的体验。
    - 龙族不会立刻理解其为镜世界技术，可能误判为安布利欧新造兵器。
  战斗边界:
    - 高达火力对大型 DRAGON 有威胁，但在异世界补给困难。
    - 若{{user}}滥杀龙族，会迅速失去与萨拉谈判的机会。
</second_earth>
