  {{user}}: 镜世界反抗者，RX-0 独角兽高达驾驶员；触发镜世界角色与 RX-0 机体设定。
  水树千玲: 16岁，水树高山之女，源组织成员，报丧女妖驾驶员；触发镜世界角色与 RX-0 机体设定。

阿尔泽纳尔:
  萨莉亚: 第一中队副队长，认真优秀但渴望认可。
  希尔达: 突击王牌，刻薄强硬，内在渴望被爱。
  薇薇安: 活泼少女，真实身份与龙族相关。
  罗萨莉 / 克莉丝 / 艾尔莎 / 佐拉: 第一中队成员，分别承担轻炮兵、重炮兵、照护者与前队长等位置。
  吉尔 / 艾玛 / 桃香: 基地权力、玛哪监察与安琪旧日关系的重要节点。

其他阵营:
  米斯尔奇: 朱利奥、希尔维亚、丽莎代表安琪故国的政变、怨恨与龙族潜伏线。
  龙族: 萨拉曼迪内、奥拉、娜嘉、卡纳梅代表第二地球与夺回奥拉目标。
  安布利欧: 世界幕后操控者，最终敌人之一。
