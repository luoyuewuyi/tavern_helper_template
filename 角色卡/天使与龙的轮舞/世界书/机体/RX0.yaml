---
<mecha_rx0>
RX-0 独角兽高达:
  驾驶员: "{{user}}"
  阵营: 镜世界反抗者
  基础设定:
    - 白色机体，精神感应框架机。
    - 常态为独角兽模式，限制器开启。
    - NT-D 启动后进入毁灭模式，性能暴涨但会给驾驶员精神与机体带来负担。
  形态:
    独角兽模式:
      特征: 纯白装甲、独角、面罩闭合、限制器开启。
      尺寸: 19.7m
      重量: 23.7t
      用途: 巡航、隐蔽、节制战斗、节省精神负荷。
    毁灭模式:
      特征: 装甲展开、V字天线、高达脸、红色精神感应框架发光。
      尺寸: 21.7m
      限制: 通常短时爆发，长时间维持会造成精神负荷和系统风险。
    全装甲独角兽:
      特征: 追加双管光束炮、导弹舱、多盾牌等重火力组件。
      重量: 45.1t
      用途: 火力压制、突破大型目标、防线压制。
      限制: 弹药和推进剂消耗巨大，异世界补给困难。
    全装甲毁灭模式:
      特征: 全装甲配置叠加精神感应框架展开，终战级火力与机动。
      限制: 对驾驶员和整备条件要求极高，不适合早期频繁使用。
    觉醒形态:
      特征: 精神感应框架绿色发光、机体呈半透明光辉，可出现翼状光。
      用途: 超越 NT-D 的共鸣/奇迹表现。
      限制: 只能在强烈意志、重大危机与精神共鸣条件下触发；不可日常化。
  常见武装:
    - 60mm火神炮
    - 光束军刀
    - 光束麦林枪
    - 盾牌及精神感应盾联动

RX-0 报丧女妖:
  驾驶员: 水树千玲
  阵营: 源组织
  基础设定:
    - 黑金配色，与独角兽一号机对应。
    - 精神感应框架呈金色发光。
    - 千玲对报丧女妖的同步率高，但情绪越被压抑，NT-D 越容易走向危险极端。
  形态:
    独角兽模式:
      特征: 黑底金纹、多角鬃毛感头部、面罩闭合、限制器开启。
      尺寸: 19.7m
      重量: 24.0t
    毁灭模式:
      特征: 装甲展开、V形金角、高达脸、金色精神感应框架发光。
      尺寸: 21.7m
      限制: 短时高压战斗模式，对千玲情绪状态敏感。
    命运女神模式:
      英文: Banshee Norn
      特征: 强化版报丧女妖，追加武装装甲XC/DE、双管光束麦林、I力场等。
      重量: 46.7t全备
      用途: 高强度单机追击、对独角兽压制。
    全装甲报丧女妖:
      特征: 黑金黄重火力组件，导弹舱、双管炮、强化盾牌等。
      用途: 远程压制与据点战。
      限制: 衍生/改修形态，出现前需要源组织补给或异世界改造理由。
    觉醒形态:
      特征: 绿/金双色精神感应框架，半透明光翼，与独角兽共鸣时可能出现。
      限制: 需要千玲自身意志突破，不是源组织命令即可触发。
  核心武装:
    标配: [60mm火神炮, 光束军刀, 光束麦林枪]
    专属:
      - 武装装甲BS：右腕高精度光束射击系统。
      - 武装装甲VN：左腕振动利爪，毁灭模式展开。
      - 命运女神专属：武装装甲XC/DE、I力场、转轮式光束麦林。

恶魔高达:
  驾驶员: 水树高山
  阵营: 源组织
  叙事定位: 镜世界压迫和最终级威胁之一。
  能力:
    - 极强再生与自我扩张。
    - 可污染战场、侵蚀机械或生体系统。
    - 对空间裂缝和精神感应框架有危险牵引力。
  使用限制:
    - 初期只以信号、残片、先遣污染或远程威压出现。
    - 本体降临应是阶段性大事件，不能作为开局杂兵。
</mecha_rx0>
