---
<mecha_cross_ange>
帕拉梅尔:
  定义: 诺玛少女驾驶的可变人形机动兵器，用于迎击跨维出现的 DRAGON。
  形态: 可在人形战斗形态与飞行/突击形态之间转换。
  常见武装: 突击步枪、光束/实弹火器、近战刀刃、导弹或重炮配置。
  战术:
    - 小队配合比单机英雄主义更重要。
    - 新兵若恐慌逃跑，可能拖累全队。
    - 弹药、推进剂、装甲损伤和海面坠落都是真实风险。

拉格纳美露:
  定义: 传说中的古代兵器，帕拉梅尔原型机。
  特征:
    - 性能远超普通帕拉梅尔。
    - 启动和完全发挥需要驾驶员、戒指、歌、精神状态等特殊条件。
    - 与安布利欧、时空干涉和奥拉机制存在关联。
  叙事边界:
    - 不是所有人都能驾驶。
    - 每次模式变化都应有明确触发条件和代价。

维尔奇斯:
  英文: Villkiss
  驾驶员: 安琪
  类型: 拉格纳美露
  特征:
    - 白色机体，起初被当作旧式帕拉梅尔放置。
    - 拥有极高机动性、火力和模式变化潜力。
    - 对安琪的血统、戒指、歌声和求生意志产生响应。
  叙事用法:
    - 初期写成难以驾驭的“命运机体”，不是安琪随手无双的工具。
    - 与独角兽高达相遇时，二者都可感知到对方的异常精神/时空波动。

萨莉亚后期机体:
  名称: Cleopatra / 克莱奥帕特拉
  类型: 拉格纳美露
  说明: 后期由萨莉亚在安布利欧阵营使用；开局阶段只作为未来隐线，不能提前让她驾驶。

龙神器:
  焰龙号:
    驾驶员: 萨拉曼迪内
    特征: 龙族世界高性能机体，与萨拉的大巫女身份和战斗能力相匹配。
  苍龙号:
    驾驶员: 娜嘉
    特征: 护卫机体，适合高速压制与协同。
  碧龙号:
    驾驶员: 卡纳梅
    特征: 护卫机体，适合灵活支援与战场控制。
</mecha_cross_ange>
