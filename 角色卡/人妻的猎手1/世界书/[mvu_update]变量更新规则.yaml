---
变量更新规则:
  世界:
    当前时间:
      format: "HH:MM"
      check:
        - 每次场景推进后更新
        - 日常互动每次推进10~30分钟
        - 性爱场景每阶段推进5~15分钟
        - 课堂按真实课时推进（一节课45分钟）
    当前日期:
      format: "YYYY年MM月DD日 星期X"
      check:
        - 时间超过24:00时自动进入下一天
        - 星期必须与日期对应正确

  建议选项:
    type: array
    check:
      - 每次回复末尾必须生成4个建议选项，供玩家选择下一步行动
      - 选项应贴合当前剧情和场景，涵盖不同互动方向
      - 包含：1个推进主线的选项、1个与当前场景角色深入互动的选项、1个探索/日常的选项、1个大胆/冒险的选项
      - 每个选项用简洁的第一人称表述，10~25字
      - 使用replace操作整体替换建议选项数组，不要使用insert

  ${陆沉雪|陆美玲|柳如玉|何美兰|李淑慧|张雪|白曼文}:
    ❤️攻略值:
      type: number
      range: 0~100
      check:
        - 仅在{{user}}对该女主做出明确的攻略性行为时才更新（如刻意调情、暧昧暗示、展示魅力、英雄救美、触碰身体等）
        - 日常问候、普通对话、正常交流、例行互动等不涨攻略值
        - 每次上涨1~8点，必须为整数，不允许小数
        - 只有关键突破性事件才可+5~8，普通攻略行为+1~4
        - 不允许单次超过3点，不允许下降，到100后不再增长
        - 如果本轮回复中{{user}}没有对该女主的攻略行为，则不使用delta更新该女主攻略值
        - 【临界锁定】当攻略值到达19/39/59/79/100时，若对应的突破事件未完成（非"已完成"），则攻略值被锁定在该临界点不再增长
        - 攻略值被锁定期间，即使{{user}}有攻略行为也不增长，直到当前突破事件完成
    突破事件.${🔑破冰试探|🔥禁忌之吻|⛓身心交融|🔒烙印宣誓|👑认主仪式}:
      type: "'未触发' | '进行中' | '已完成'"
      check:
        - 当攻略值到达对应临界点（19→🔑破冰试探，39→🔥禁忌之吻，59→⛓身心交融，79→🔒烙印宣誓，100→👑认主仪式）且该事件为"未触发"时，将其改为"进行中"
        - 事件"进行中"期间，应在剧情中自然推进该事件的内容（参考阶段突破事件世界书中的描述）
        - 当事件描述中的核心剧情已在回复中完成并得到角色回应时，将事件状态改为"已完成"
        - 只能按顺序触发：🔑→🔥→⛓→🔒→👑，前一个必须"已完成"才能触发下一个
        - 状态只能单向变化：未触发→进行中→已完成，不可回退
    攻略阶段:
      check:
        - 禁止手动更新，由系统根据❤️攻略值自动推导
    登场状态:
      type: "'登场中' | '未登场' | '离场'"
      check:
        - 当该女主出现在当前场景中时设为"登场中"
        - 当该女主不在当前场景中但已被{{user}}接触过时设为"离场"
        - 当该女主从未与{{user}}互动过时保持"未登场"
        - 场景切换时，离开场景的角色从"登场中"变为"离场"
    身体状态:
      check:
        - 当该女主的衣物、身体部位发生状态变化时更新对应子字段
        - 描述当前实际状态，参考该女主基础档案中的身材和穿着设定
        - 无相关事件发生的子字段保持原值不变
    💃体态姿势:
      check:
        - 每次回复更新，描述该女主当前所在位置和身体姿势
    💭内心想法:
      check:
        - 每次回复更新，用该女主自己的语气写一到两句当前核心想法
        - 必须符合当前攻略阶段的心理状态
        - 不可泄露该女主尚不知道的信息
