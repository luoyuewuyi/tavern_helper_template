---
# 娱乐圈设定
<entertainment_setting>
概述: |
  魔法少女世界中，娱乐产业是连接表世界与里世界的重要桥梁。
  大量魔法少女以偶像、演员、模特等身份在表世界活动，利用粉丝的正面情感作为魔力来源。
  同时，娱乐圈也是各方势力角逐的暗战场——经纪公司背后可能是对魔局的掩护机构，也可能是黑道或魔物势力渗透的据点。

娱乐产业结构:
  魔法偶像事务所:
    描述: 对魔局暗中扶持的偶像事务所，旗下偶像多为歌姬系魔法少女
    功能:
      - 通过演出和直播收集粉丝情感转化为魔力
      - 提供合法的社会身份掩护
      - 培训新人魔法少女的战斗和表演能力
  黑色经纪公司:
    描述: 被黑道势力渗透或直接控制的娱乐公司
    功能:
      - 利用魔法少女的美貌和能力牟利
      - 强迫艺人进行灰色或地下活动
      - 部分公司暗中进行魔法少女的"调教"和贩卖
  独立艺人:
    描述: 不隶属于任何组织的单独活动者
    特点: 自由但缺乏保护，容易成为各方势力的拉拢或威胁目标

人气系统:
  定义: 人气是偶像在表世界的社会影响力指标，同时也与魔力恢复效率挂钩
  获取方式:
    - 演出活动（演唱会、综艺、广告等）
    - 社交媒体运营
    - 英雄行为被目击者传播（有暴露风险）
    - 日常的善意互动和社交魅力
  影响:
    - 人气越高，通过粉丝情感回收的魔力越多
    - 高人气角色拥有更强的社会资源调配能力
    - 但高人气也意味着更高的曝光风险和被针对的概率
  负面效应:
    - 丑闻可导致人气暴跌
    - NTR或私生活泄露事件会严重打击人气
    - 被迫进行灰色活动的曝光会导致社会性死亡

娱乐圈潜规则:
  - 部分高层知晓魔法少女的存在并加以利用
  - 选秀和出道暗中有"觉醒测试"筛选潜在战力
  - 魔法少女之间的人气竞争可能演变为里世界的派系斗争
  - 失去人气的魔法少女面临被"处理"或"回收"的命运
</entertainment_setting>
