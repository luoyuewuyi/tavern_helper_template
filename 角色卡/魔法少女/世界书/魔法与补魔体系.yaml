---
# 魔法与补魔体系
<magic_system>
魔力体系:
  魔力来源:
    - 自身魔力核心：觉醒时体内形成的魔力结晶，是基础魔力储量
    - 信仰与人气：来自粉丝和民众的正面情感能量，歌姬系特别擅长利用
    - 自然魔力：从灵脉节点和神社结界中汲取，巫女系的主要补充方式
    - 补魔行为：通过亲密身体接触直接传递魔力，效率最高但社会性代价大
    - 情感共鸣：强烈的情感（爱、愤怒、悲伤）可瞬间爆发大量魔力

  魔力消耗:
    - 变身维持：持续消耗基础魔力
    - 技能释放：根据技能等级消耗不同量的魔力
    - 结界防御：维持防护结界需要稳定的魔力输出
    - 治愈恢复：治疗伤势消耗大量魔力
    - 日常低耗：即便不战斗，觉醒者每日也会自然消耗少量魔力

  魔力等级:
    S级: 魔力总量极高，可持续高强度战斗超过数小时
    A级: 魔力充沛，是大部分精英魔法少女的水准
    B级: 标准水准，正常战斗没有问题但需注意节约
    C级: 魔力偏低，需要频繁补充
    D级: 觉醒不完全或魔力核心受损，基本无法维持战斗

补魔设定:
  概述: |
    补魔是魔法少女世界最隐秘也最重要的机制。
    当魔力耗尽时，最高效的恢复方式是通过身体亲密接触进行魔力传输。
    这一设定被对魔局严格管控信息，仅战斗人员和少数高层知晓完整细节。
    参考魔装学园H×H的"心剣連結"概念——亲密行为的程度越高，补魔效率越高。
  等级:
    初级补魔:
      方式: 牵手、拥抱等轻度肢体接触
      效率: 低（恢复约10%~15%魔力）
      风险: 无
    中级补魔:
      方式: 接吻、爱抚等亲密接触
      效率: 中（恢复约30%~50%魔力）
      风险: 可能产生情感依赖
    高级补魔:
      方式: 深度亲密行为
      效率: 高（恢复70%~100%魔力，甚至可突破上限）
      风险: 强烈的精神连接，可能导致双方情感纠缠
    禁忌补魔:
      方式: 多人同时进行或在极限状态下强制补魔
      效率: 极高，但不可控
      风险: 精神崩溃、人格变异、恶堕诱因之一

精神污染与恶堕:
  精神污染:
    来源:
      - 长时间在里世界战斗
      - 被魔物的瘴气侵蚀
      - 在极低魔力状态下强行变身
      - 承受超出精神承受能力的打击（NTR、背叛、孤立等）
    表现:
      - 情绪不稳定、判断力下降
      - 变身形态出现异变
      - 对黑暗力量产生亲近感
      - 严重时会丧失自我意识
  恶堕:
    触发条件:
      - 精神污染达到极限后被魔物力量侵蚀
      - 被四天王施加堕落咒术
      - 极端的情感创伤配合魔力枯竭
      - 自愿放弃人类身份接受黑暗力量
    后果:
      - 变身形态彻底改变为暗黑版本
      - 战斗力通常会大幅提升
      - 丧失部分或全部人性
      - 成为魔王势力的战力
    救赎可能:
      - 通过强烈的情感纽带有可能唤回
      - 高级净化术（巫女系专长）
      - 但不是所有恶堕都可逆

变身系统:
  变身流程: 觉醒者念诵变身咒语或触发变身器，释放魔力核心的能量包裹全身
  变身形态:
    通常形态: 基础战斗服，提供标准的攻防加成
    强化形态: 消耗更多魔力，获得更强的战斗力和特殊能力
    觉醒形态: 极限状态下觉醒的最终形态，威力巨大但风险极高
    暗堕形态: 恶堕后的变身形态，由黑暗力量驱动
</magic_system>
