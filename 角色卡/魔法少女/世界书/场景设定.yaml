---
# 场景设定
<scene_collection>
艾因贵族学院:
  场景名称: 艾因贵族学院（アイン貴族学院）
  类型: 主要据点/日常场景
  描述: |
    坐落于城市高地的顶级私立学院，表面是培养精英的名门学校，
    实际上是对魔局暗中设立的魔法少女培育机构。
    学院建筑融合了欧式古典与现代风格，校园广阔优美。
  区域:
    教学楼:
      - 普通教室区（1-3楼）
      - 社团活动室（4楼）
      - 学生会办公室（5楼顶层，水宫希的领地）
    特殊设施:
      - 地下训练场（对魔局秘密设置，用于魔法少女训练）
      - 灵脉教室（位于地下二层，巫女系的修炼场所）
      - 医疗翼（配备魔力恢复设备的特殊医务室）
    户外:
      - 樱花中庭（约会和日常交流的热门地点）
      - 屋顶天台（适合密谈和告白）
      - 后山小神社（神代雪经常出没的地方）
  氛围: 表面华丽安宁的校园生活下暗流涌动

神代神社:
  场景名称: 神代神社
  类型: 巫女据点/灵脉节点
  描述: |
    位于学院后山深处的古老神社，是神代家代代守护的灵脉关键节点。
    结界强大，魔物无法靠近。是巫女系魔法少女的修炼圣地。
  特征:
    - 有天然温泉（灵泉）可以恢复魔力
    - 神社内有封印着强大魔物的御札
    - 夜晚的神社笼罩在月光中格外神圣
    - 神代雪经常在此独自修行

里世界・异界裂缝:
  场景名称: 异界裂缝
  类型: 战斗场景
  描述: |
    表世界与里世界之间出现的空间裂缝，是魔物入侵的通道。
    裂缝周围空间会扭曲，形成独特的战场环境。
    只有觉醒者才能感知和进入。
  特征:
    - 空间扭曲导致地形不稳定
    - 瘴气浓厚，长时间停留会增加精神污染
    - 可能连接到里世界的不同区域
    - 大型裂缝可能释放四天王级别的敌人

地下格斗场:
  场景名称: 泷泽地下格斗场
  类型: 黑暗场景
  描述: |
    泷泽组经营的非法地下格斗场，建于废弃工厂的地下空间。
    暗中进行魔法少女与魔物的强制战斗表演。
  特征:
    - 被改造过的魔物作为格斗对手
    - 高额赌注吸引地下社会的权贵
    - 部分被俘获的魔法少女在此被迫战斗
    - 泷泽景经常在此进行"交易"

偶像Live House:
  场景名称: STARDUST Live House
  类型: 娱乐圈场景
  描述: |
    城市繁华地段的人气Live House，是歌姬系魔法少女活动的主要舞台。
    风间悠经常在此进行偶像表演。
  特征:
    - 舞台下有对魔局设置的魔力收集装置
    - 粉丝的热情可以直接转化为魔力
    - 后台有专用的补魔休息室
    - 偶尔会被魔物势力盯上作为袭击目标
</scene_collection>
