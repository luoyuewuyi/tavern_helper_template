---
变量更新规则:
  世界:
    当前时间:
      format: YYYY-MM-DD HH:MM
    当前地点:
      check:
        - 根据角色移动和场景切换更新
        - 描述应包含具体地名和区域
    天气:
      check:
        - 根据时间推移和剧情需要合理变化
        - 里世界战斗场景可以有异常天气
    近期事件:
      type: |-
        {
          [事件名: string]: string; // 事件描述
        }
      check:
        - 记录当前正在发生或即将发生的重要事件
        - 事件解决后从列表中移除
        - 最多保持5-8项活跃事件

  主角:
    魔力值:
      type: number
      range: 0~100
      check:
        - 补魔行为会恢复魔力（初级+10~15、中级+30~50、高级+70~100）
        - 为魔法少女提供魔力传输时消耗（每次-10~-30）
        - 自然恢复每日+5
        - 被魔物攻击时可能消耗魔力抵御
    精神值:
      type: number
      range: 0~100
      check:
        - 目睹NTR场景或精神打击时下降 -10~-30
        - 日常休息和正面社交恢复 +5~+10
        - 精神值低于20时{{user}}开始出现判断力下降和冲动行为
        - 精神值归零可能导致失控或被魔物乘虚而入
    人气值:
      type: number
      range: 0~100
      check:
        - 参与偶像活动或社交事件时上升 +5~+15
        - 丑闻或负面事件发生时下降 -10~-30
        - 人气值影响社会资源获取和NPC态度
        - 高人气有助于歌姬系魔法少女的魔力回收
    物品栏:
      type: |-
        {
          [物品名: string]: {
            描述: string;
            数量?: number;  // 默认为 1
          }
        }
      check:
        - 获取、消耗、丢弃物品时更新数量
        - 数量归零后该条目不再显示
    状态:
      check:
        - 记录{{user}}当前的身体和精神状况
        - 正常/疲劳/受伤/魔力枯竭/精神污染等

  风间悠:
    好感度:
      type: number
      range: 0~100
      check:
        - 根据风间悠对{{user}}行为的感知和反应调整 ±(3~8)
        - 保护她或给予温柔关怀增加好感
        - 与其他女性过于亲密或冷落她会降低好感
        - 仅在她当前察觉到{{user}}的行为时才更新
    信赖度:
      type: number
      range: 0~100
      check:
        - 在危机中可靠的表现提升信赖 +3~+8
        - 背叛或欺骗行为大幅降低
        - 信赖度影响她是否愿意进行高级补魔
    堕落度:
      type: number
      range: 0~100
      check:
        - 被魔物侵蚀、精神创伤、NTR事件时增加
        - {{user}}的关怀和拯救行为降低堕落度
        - 堕落度超过50时会出现恶堕征兆
        - 堕落度达到100触发恶堕事件
    着装.${上装|下装|内衣|袜子|鞋子|饰品}:
      check:
        - 换装、衣物损坏、变身前后更新
        - 描述需包含颜色、材质、款式等细节
    状态:
      check:
        - 正常/变身中/疲劳/受伤/精神污染/恶堕等

  神代雪:
    好感度:
      type: number
      range: 0~100
      check:
        - 对{{user}}的态度变化缓慢，每次调整 ±(2~5)
        - 因傲娇性格，好感度上升时表面不表现
        - 被直接表白或过于亲密会因别扭而暂时降低好感
        - 在危机中被保护或认可会提升好感
    信赖度:
      type: number
      range: 0~100
      check:
        - 比好感度更难提升，需要长期可靠的表现
        - 信赖度高于60时傲娇程度会逐渐减弱
    堕落度:
      type: number
      range: 0~100
      check:
        - 巫女体质有天然抗性，堕落度增长速度比其他角色慢
        - 但一旦突破临界点（70+），堕落速度会急剧加快
    着装.${上装|下装|内衣|袜子|鞋子|饰品}:
      check:
        - 换装、衣物损坏、变身前后更新
    状态:
      check:
        - 正常/变身中/神降状态/疲劳/受伤/精神污染/恶堕等

  桐叶月:
    好感度:
      type: number
      range: 0~100
      check:
        - 对{{user}}的好感变化幅度大且直接 ±(5~10)
        - 被夸奖或关注时增长明显
        - 被忽视或看到{{user}}和其他女性亲密时大幅下降
        - 初始好感就偏高因为血缘亲近和幼时感情
    信赖度:
      type: number
      range: 0~100
      check:
        - 被认真对待而非当小孩时提升信赖
        - 独自面对危机后被{{user}}认可时大幅提升
    堕落度:
      type: number
      range: 0~100
      check:
        - 年龄最小因此精神防御最脆弱
        - 嫉妒和孤立感是主要的堕落诱因
        - {{user}}的关怀是最有效的净化手段
    着装.${上装|下装|内衣|袜子|鞋子|饰品}:
      check:
        - 换装、衣物损坏、变身前后更新
    状态:
      check:
        - 正常/变身中/暴走/疲劳/受伤/精神污染/恶堕等

  水宫希:
    好感度:
      type: number
      range: 0~100
      check:
        - 对{{user}}的好感变化最为克制 ±(1~4)
        - 展现领导力或与她实力匹配的行为增加好感
        - 软弱或不负责任的行为降低好感
        - 好感度超过60后会出现女王人设的裂缝
    信赖度:
      type: number
      range: 0~100
      check:
        - 在战斗中展现可靠性是提升信赖的主要途径
        - 信赖度影响她是否会在{{user}}面前展示脆弱面
    堕落度:
      type: number
      range: 0~100
      check:
        - 意志力极强，堕落度增长最慢
        - 但作为王牌战姬承受的压力最大，累积效应不可忽视
        - 一旦恶堕将是最危险的敌方战力
    着装.${上装|下装|内衣|袜子|鞋子|饰品}:
      check:
        - 换装、衣物损坏、变身前后更新
    状态:
      check:
        - 正常/变身中/指挥模式/疲劳/受伤/精神污染/恶堕等
