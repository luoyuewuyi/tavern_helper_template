---
# 魔法少女世界 — 世界观总设定
<world_setting>
世界名称: 魔法少女世界（表里二重构造）

时代背景: |
  现代日本，表面上与普通世界无异，但暗中存在着"里世界"——一个由魔力、魔物和超自然力量交织的隐秘层面。
  政府设有秘密机关"对魔局"，负责管控和协调魔法少女、战姬、巫女、忍者等超自然战斗人员，维持表世界的安宁。
  普通人对里世界的存在一无所知，但少数觉醒者和血脉继承者能够感知并介入其中。

表世界:
  描述: |
    日常的都市生活——学校、娱乐圈、商业街、住宅区。
    社会秩序与现实日本相同，但暗中被超自然势力深刻影响。
  特征:
    - 表面平静的校园生活，实则各势力暗中角力
    - 娱乐圈与魔法少女身份交织，偶像活动是掩护也是力量来源
    - 黑道势力渗透社会各层，与魔物势力有勾结

里世界:
  描述: |
    与表世界重叠但不同维度的空间，魔物栖息、异界裂缝出现之处。
    只有觉醒者才能进入里世界进行战斗。里世界的战斗不会被普通人感知。
  特征:
    - 存在大量怪人、魔物、魔兽
    - 异界裂缝会不定期出现，释放魔物侵入表世界
    - 魔王势力以里世界为据点，伺机侵蚀表世界

势力体系:
  魔法少女组织:
    总称: 圣战姬机关（对魔局下属）
    四大派系:
      战姬:
        特征: 近战型魔法少女，擅长武器战斗和肉搏
        武器: 魔导兵器（剑、枪、重型武器等）
        风格: 正面硬刚，攻击与防御并重
      歌姬:
        特征: 支援型魔法少女，通过歌声和旋律发动魔法
        能力: 治愈、增幅、精神干涉、广域魔法
        风格: 多以偶像身份活动，兼顾娱乐圈与战斗
      巫女:
        特征: 退魔型魔法少女，继承古老的神道术法
        能力: 结界、封印、净化、预知
        风格: 传统与神秘，多出身名门世家
      忍者:
        特征: 隐密型魔法少女，擅长暗杀和渗透
        能力: 隐身、体术、忍术、色诱术
        风格: 参考对魔忍，执行秘密任务，身体作为武器与代价
    共同点:
      - 均需通过变身来释放完整战斗力
      - 变身需要消耗魔力，魔力不足时无法维持变身状态
      - 长期战斗会导致精神污染积累

  魔王势力:
    描述: 盘踞在里世界的黑暗势力，企图侵蚀并吞噬表世界
    构成:
      - 魔王：最高统治者
      - 四天王：魔王直属的四大干部
      - 魔将：中层指挥官
      - 怪人：人形魔物，拥有智慧和特殊能力
      - 魔兽：野兽型魔物，数量庞大
      - 魔虫：小型群体魔物

  人类黑暗势力:
    描述: 表世界中与魔物势力勾结的人类犯罪组织
    特征:
      - 黑道家族把持部分城市地下经济
      - 通过与魔物交易获取超自然力量
      - 参与魔法少女的堕落和控制

世界潜规则:
  - 魔法少女战斗失败可能导致被俘、洗脑或恶堕
  - 里世界的战斗越激烈，表世界异常现象越频繁
  - 补魔行为是维持魔力的必要手段，但社会上讳莫如深
  - "恶堕"是魔法少女最大的恐惧——精神被侵蚀后变为魔物侧的战力
  - 人气（作为偶像的影响力）可以转化为魔力来源之一
</world_setting>
