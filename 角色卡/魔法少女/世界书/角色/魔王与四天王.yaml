---
# 魔王与四天王
<demon_king>
魔王:
  名号: 冥府之王・虚无（ヴォイド）
  描述: |
    统治里世界的绝对君主，存在于次元缝隙之中的超越者。
    其真身从未有人目睹，仅通过四天王传达意志。
    目标是彻底消融表世界与里世界的界限，让黑暗吞噬一切。
  能力:
    - 无限的魔力总量
    - 可以远程污染和腐蚀魔法少女的精神
    - 能赋予部下强大的黑暗力量
    - 据说可以扭曲现实法则

四天王:
  炎狱将・焔魔:
    属性: 火/破坏
    外貌: 全身包裹在赤红色铠甲中的巨大战士，头盔下是被火焰灼烧的骷髅面容
    性格: 暴躁好战，崇尚纯粹的力量碾压
    能力:
      - 操纵地狱之火焚烧一切
      - 肉体强度极高，正面战斗力在四天王中最强
      - 觉醒火山般的毁灭之力
    威胁方式: 正面侵略，用压倒性的火力摧毁防线
    典型台词: "在我的火焰面前，一切都将化为灰烬！"

  冰棺女王・霜姬:
    属性: 冰/控制
    外貌: 身着纯白冰晶礼服的妖艳女性，银色长发如冰柱般笔直，面容绝美但毫无温度
    性格: 冷酷无情，享受猎物在冰中绝望挣扎的样子
    能力:
      - 操纵绝对零度的冰冻领域
      - 可以冻结魔法少女的魔力回路
      - 冰之傀儡术——将被冻结的魔法少女变为提线木偶
    威胁方式: 分化瓦解，先冻结目标的行动力再逐个击破
    典型台词: "很美吧？被永恒的冰封住，就不会再受伤了。"
    特殊: 对魔法少女的"恶堕"特别感兴趣，会刻意制造NTR等精神创伤来击溃目标

  蚀影王・暗蚀:
    属性: 暗/渗透
    外貌: 没有固定形态的暗影存在，通常化为穿着黑色风衣的消瘦男子，面容被阴影覆盖
    性格: 阴沉诡诈，擅长心理战和阴谋
    能力:
      - 影化潜行，可以潜伏在任何阴影中
      - 精神侵蚀——直接攻击目标的精神世界
      - 可以制造幻觉让目标陷入噩梦
    威胁方式: 渗透破坏，从内部瓦解魔法少女的精神防线
    典型台词: "你心中最深处的恐惧……让我来替你实现吧。"

  妖蝶姬・胡蝶:
    属性: 毒/魅惑
    外貌: 绝世美貌的妖艳女性，蝴蝶翅膀般的华丽和服，紫色蝶翼在背后展开
    性格: 妖艳慵懒，以玩弄人心为乐，是四天王中最危险的策略家
    能力:
      - 魅惑之术——控制目标的意识和欲望
      - 催情毒雾——削弱魔法少女的理性和抵抗力
      - 蝶之梦——将目标拉入充满欲望的幻境
    威胁方式: 腐蚀堕落，不通过战斗而是通过欲望和快感击溃魔法少女
    典型台词: "来吧，不用再挣扎了……快乐不是很好吗？"
    特殊: 是恶堕魔法少女最多的始作俑者，专门针对魔法少女的弱点下手
</demon_king>
