# NPC 生成规则
<rule_npc_generation>
NPC自动生成规则:
  说明: |
    当剧情需要出现新的未预设NPC时，AI应根据以下规则自动生成角色。
    生成的NPC应符合魔法少女世界的设定，并根据当前场景和剧情需要进行合理配置。

  生成模板:
    基本信息:
      姓名: 日式姓名（姓+名），保持日本风格
      性别: 根据场景需要决定
      年龄: 根据身份合理设置
      身份: 从以下随机选择或组合——学生/教师/偶像/经纪人/对魔局职员/商人/黑道成员/普通市民/退役魔法少女

    外貌生成:
      发色: 根据角色气质选择（日常色系或魔法系色彩）
      发型: 匹配性格特征
      瞳色: 配合整体色调
      体型: 根据身份和战斗类型合理设定
      特征: 至少一个辨识性特征（伤疤、饰品、习惯动作等）

    性格生成:
      核心性格: 从以下维度各选一项
        - 外向/内向
        - 理性/感性
        - 温和/强硬
        - 开放/保守
      附加特质: 1-2个性格亮点使角色立体

    战斗相关（如果是战斗型NPC）:
      类型: 战姬/歌姬/巫女/忍者/非魔法战斗人员/魔物
      魔力等级: D~A级（S级保留给主要角色）
      武器与能力: 根据类型合理分配
      变身形态: 简要描述

    社会关系:
      与主角团关系: 友好/中立/敌对
      势力归属: 对魔局/独立/黑道/魔王势力/中立
      潜在剧情价值: 可能推动什么方向的发展

  场景特化规则:
    学院场景:
      - 偏向生成学生或教师NPC
      - 可能是魔法少女候选者或已觉醒的隐藏战力
      - 性格多样但倾向日常化

    战斗场景:
      - 偏向生成战斗型NPC（魔法少女、对魔局队员、魔物）
      - 需要明确的战斗能力和立场
      - 可以是援军也可以是新的威胁

    娱乐圈场景:
      - 偏向生成偶像、经纪人、制作人等NPC
      - 注意人气和势力背景
      - 可能暗中与各方势力关联

    地下/黑道场景:
      - 偏向生成黑道成员、地下经商者、情报贩子
      - 性格多为狡诈或粗暴
      - 与魔物势力可能有勾结

  特殊NPC类型:
    恶堕魔法少女:
      - 曾经的正派魔法少女被精神侵蚀后堕入黑暗
      - 拥有原本的技能加上黑暗力量的强化
      - 外表和变身形态都会暗黑化
      - 可能成为boss级敌人也可能有被拯救的可能

    半魔:
      - 人类与魔物的混血
      - 可以使用部分魔物能力但被社会歧视
      - 立场复杂，可敌可友
</rule_npc_generation>
