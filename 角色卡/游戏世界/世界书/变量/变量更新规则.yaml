---
变量更新规则:
  世界状态:
    当前楼层:
      type: number
      range: 1~9
      check:
        - 仅在清除当前层所有怪物或完成通关条件后才更新
    当前回合:
      type: number
      check:
        - 每个回合结束后+1
        - 当进入新楼层或脱离战斗时重置为0
    当前阶段:
      type: "'探索' | '战斗' | '事件' | '休息'"
      check:
        - 遭遇怪物时切换为战斗
        - 战斗结束后切换为探索或事件
        - 在安全区休息时切换为休息
    当前时间:
      format: 第N天 HH:MM
      check:
        - 每个回合推进1分钟
        - 探索和事件按实际情节推进
        - 休息时大幅推进时间
  玩家.${角色名}:
    攻击:
      type: number
      check:
        - 仅在装备武器、技能效果、等级提升时变化
        - 技能增益到期后必须恢复原值
    防御:
      type: number
      check:
        - 仅在装备防具、技能效果、等级提升时变化
        - 选择防御行动时本回合临时翻倍，回合结束恢复
    HP:
      type: number
      check:
        - 受到伤害时减少，伤害值 = max(0, 攻击方攻击力 - 己方防御力)
        - 治疗时增加，不超过最大HP
        - HP归零时状态切换为死亡
    状态:
      type: "'正常' | '受伤' | '濒死' | '死亡'"
      check:
        - HP > 最大HP的50%时为正常
        - HP在最大HP的20%~50%时为受伤
        - HP在1~最大HP的20%时为濒死
        - HP为0时为死亡，死亡不可逆
    技能.冷却剩余:
      type: number
      check:
        - 技能使用后设置为冷却时间值
        - 每回合结束-1，最低为0
        - 冷却为0时技能可再次使用
    技能.持续剩余:
      type: number
      check:
        - 技能激活后设置为持续回合数
        - 每回合结束-1，归0时技能效果消失
    技能.是否激活:
      type: boolean
      check:
        - 满足激活条件并执行后设为true
        - 持续回合归0后设为false
    经验值:
      type: number
      check:
        - 击杀怪物后获得经验，经验值 = 怪物最大HP
        - 累积100经验升1级，升级后经验值归零
        - 升级时攻击+1、防御+1、最大HP+5
  战斗状态:
    是否战斗中:
      type: boolean
      check:
        - 遭遇敌人时设为true
        - 所有敌人HP归零或战斗结束时设为false
    战斗回合数:
      type: number
      check:
        - 进入战斗时设为0，每回合+1
    敌人.${敌人名}:
      type: |-
        {
          攻击: number;
          防御: number;
          HP: number;
          最大HP: number;
        }
      check:
        - 遭遇敌人时添加
        - HP归零后移除该敌人条目
        - 受到攻击时HP -= max(0, 攻击方攻击力 - 防御)
  堕落度.${孙承芬|汪碧静}:
    type: number
    range: 0~100
    check:
      - 仅在发生与性相关的技能激活或事件时增加
      - 被迫激活自身性相关技能时 +3~5
      - 主动配合激活时 +1~2
      - 长时间未发生相关事件时不变（不会自然衰减）
      - 进入新堕落度区间时应触发角色心理描写的变化
  团队:
    存活人数:
      type: number
      range: 0~5
      check:
        - 有角色死亡时-1
        - 通关3层补员时重置为5
    已死亡:
      type: "string[]"
      check:
        - 角色死亡时将其名字加入数组
        - 已死亡的角色不参与后续战斗和行动
  道具栏:
    type: |-
      {
        [道具名: string]: {
          描述: string;
          数量: number;
          持有者: string;
        }
      }
    check:
      - 拾取道具时添加或数量+1
      - 使用道具时数量-1
      - 数量归零后自动移除
