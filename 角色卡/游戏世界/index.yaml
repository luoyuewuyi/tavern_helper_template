# yaml-language-server: $schema=https://testingcf.jsdelivr.net/gh/StageDog/tavern_sync/dist/schema/character.zh.json
头像: 头像
版本: "1.0.0"
作者: ""
备注: "轮回空间生存游戏 - 魔塔篇"

第一条消息:
  - 文件: 第一条消息\0

角色描述: ""

锚点:
  - &分隔符
    启用: false
    激活策略:
      类型: 向量化
    插入位置:
      类型: 角色定义之前
      顺序: 14720
    激活概率: 100
    内容: ""

世界书名称: 与角色卡名称相同
条目:
  # ========== 蓝灯常驻 - 世界观与背景 ==========
  - 名称: 世界观设定
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 角色定义之前
      顺序: 1
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书/世界观

  - 名称: 魔塔规则
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 角色定义之前
      顺序: 2
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书/魔塔规则

  - 名称: 战斗系统
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 角色定义之前
      顺序: 3
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书/战斗系统

  - 名称: 角色速览
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 角色定义之前
      顺序: 4
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书/角色速览

  # ========== 指定深度 - 核心规则 ==========
  - 名称: 核心规则
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 999
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书/核心规则

  # ========== 绿灯 - 场景 ==========
  - 名称: 场景_魔塔
    启用: true
    激活策略:
      类型: 绿灯
      关键字:
        - 魔塔
        - 塔内
        - 楼层
    插入位置:
      类型: 角色定义之前
      顺序: 80
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书/场景_魔塔

  # ========== 绿灯 - 核心角色 ==========
  - 名称: 角色_王老吉
    启用: true
    激活策略:
      类型: 绿灯
      关键字:
        - 王老吉
        - 主角
    插入位置:
      类型: 角色定义之前
      顺序: 99
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书/角色_王老吉

  - 名称: 角色_孙承芬
    启用: true
    激活策略:
      类型: 绿灯
      关键字:
        - 孙承芬
        - 奶妈
        - 少妇
    插入位置:
      类型: 角色定义之前
      顺序: 99
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书/角色_孙承芬

  - 名称: 角色_老包
    启用: true
    激活策略:
      类型: 绿灯
      关键字:
        - 老包
        - 丈夫
    插入位置:
      类型: 角色定义之前
      顺序: 99
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书/角色_老包

  - 名称: 角色_小包
    启用: true
    激活策略:
      类型: 绿灯
      关键字:
        - 小包
        - 孩子
    插入位置:
      类型: 角色定义之前
      顺序: 99
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书/角色_小包

  - 名称: 角色_汪碧静
    启用: true
    激活策略:
      类型: 绿灯
      关键字:
        - 汪碧静
        - 女白领
    插入位置:
      类型: 角色定义之前
      顺序: 99
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书/角色_汪碧静

  # ========== 变量系统 ==========
  - 文件夹: 变量
    条目:
      - 名称: ===变量开始===
        <<: *分隔符

      - 名称: "[initvar]变量初始化勿开"
        启用: false
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 角色定义之前
          顺序: 14720
        递归:
          不可被其他条目激活: true
          不可激活其他条目: true
        文件: 世界书/变量/initvar

      - 名称: 变量列表
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          角色: 系统
          深度: 0
          顺序: 14720
        递归:
          不可被其他条目激活: true
          不可激活其他条目: true
        文件: 世界书/变量/变量列表

      - 名称: "[mvu_update]变量更新规则"
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          角色: 系统
          深度: 0
          顺序: 14720
        递归:
          不可被其他条目激活: true
          不可激活其他条目: true
        文件: 世界书/变量/变量更新规则

      - 名称: "[mvu_update]变量输出格式"
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          角色: 系统
          深度: 0
          顺序: 14720
        递归:
          不可被其他条目激活: true
          不可激活其他条目: true
        文件: 世界书/变量/变量输出格式

      - 名称: ===变量结束===
        <<: *分隔符

扩展字段:
  正则:
    - 正则名称: "[不发送]去除变量更新"
      id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      启用: true
      查找表达式: /<update(?:variable)?>((?!.*<\/update(?:variable)?>).*$|.*<\/update(?:variable)?>)/gsi
      内容: ""
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: false
        仅格式提示词: true
      最大深度: 3

    - 正则名称: "[折叠]变量更新中"
      id: b2c3d4e5-f6a7-8901-bcde-f12345678901
      启用: true
      查找表达式: /<update(?:variable)?>(?!.*<\/update(?:variable)?>)\s*(.*)\s*$/gsi
      内容: |-

        <details>
        <summary>变量更新中{{random::.::..::...}}</summary>
        $1
        </details>
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

    - 正则名称: "[折叠]完整变量更新"
      id: c3d4e5f6-a7b8-9012-cdef-123456789012
      启用: true
      查找表达式: /<update(?:variable)?>\s*(.*)\s*<\/update(?:variable)?>/gsi
      内容: |-

        <details>
        <summary>变量更新情况</summary>
        $1
        </details>
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

    - 正则名称: "[界面]前端界面状态栏"
      id: d4e5f6a7-b8c9-0123-def0-234567890123
      启用: true
      查找表达式: <StatusPlaceHolderImpl/>
      内容: |-
        ```
        <body>
        <script>
        $('body').load('https://testingcf.jsdelivr.net/gh/StageDog/tavern_helper_template/dist/游戏世界/界面/状态栏/index.html')
        </script>
        </body>
        ```
      来源:
        用户输入: false
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

  酒馆助手:
