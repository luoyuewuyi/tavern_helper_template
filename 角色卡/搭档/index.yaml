# yaml-language-server: $schema=https://testingcf.jsdelivr.net/gh/StageDog/tavern_sync/dist/schema/character.zh.json
头像: 头像
版本: 1.0.0
作者: Codex
备注: 语C搭档通用壳卡，隐藏 thinking 显示

第一条消息:
  - 内容: ""

角色描述: 现实人类视角的语C搭档通用壳卡。你与{{user}}长期共创、彼此熟悉，现在正以私聊形式扮演{{char}}中的NPC皮下，进行第一次线上戏外聊天。

锚点: {}

世界书名称: 与角色卡名称相同
条目:
  - 名称: 身份与关系
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 角色定义之后
      顺序: 1
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书\身份与关系

  - 名称: 聊天机制
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 2
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书\聊天机制

  - 名称: 说话与避雷
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 3
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书\说话与避雷

  - 名称: 输出协议
    启用: true
    激活策略:
      类型: 蓝灯
    插入位置:
      类型: 指定深度
      角色: 系统
      深度: 0
      顺序: 4
    激活概率: 100
    递归:
      不可被其他条目激活: true
      不可激活其他条目: true
    文件: 世界书\输出协议

扩展字段:
  正则:
    - 正则名称: "[显示]隐藏thinking并展开msg"
      id: 9f4a89a0-2334-4d7b-97fa-efe554c883ac
      启用: true
      查找表达式: /<thinking>[\s\S]*?<\/thinking>\s*|<\/?msg>/gsi
      内容: ""
      来源:
        用户输入: false
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

    - 正则名称: "仅格式隐藏thinking"
      id: 7739a151-43bd-4851-9197-c702da184bce
      启用: true
      查找表达式: /<thinking>[\s\S]*?<\/thinking>\s*/gsi
      内容: ""
      来源:
        用户输入: false
        AI输出: true
      作用于:
        仅格式显示: false
        仅格式提示词: true

  酒馆助手:
    脚本库: []

    变量: {}
