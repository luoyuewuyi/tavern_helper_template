---
变量更新规则:
  角色状态.${主角境界|白荔境界|庭玉境界}:
    check:
      - 仅在角色明确突破、跌境、封印、解封、重伤损毁根基或设定性修为变化时更新
      - 必须使用完整境界名，格式为“境界+阶段”，例如“炼气巅峰”“元婴前期”“化神中期”
      - 普通战斗、日常互动、情绪变化或功法领悟进度增加，不等于境界变化
  羁绊系统.${白荔羁绊值|庭玉羁绊值}:
    type: number
    range: 0~100
    check:
      - 根据<user>的互动行为、态度以及共同经历的事件，每次合理增加或减少1~5点
  功法领悟系统.${白荔七情进度|主角有情剑进度}:
    type: number
    range: 0~100
    check:
      - 仅在经历重大事件（如生死搏杀、极度情绪波动、顿悟等）时取得进展，平时日常互动不应增加
