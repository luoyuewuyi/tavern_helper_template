---
变量更新规则:
  世界:
    当前时间:
      format: 1942年${季节} ${时段}
      check:
        - 每次审问推进、休息或场景转换后更新
        - 时间流逝应符合审问的实际节奏
    场景氛围:
      check:
        - 根据当前场景的光线、声音、气味等环境变化更新
        - 审问时的氛围应随紧张程度变化
    审问阶段:
      check:
        - 根据审问进展更新（初次审问/再次审问/高压审问/缓和期等）
  林秋禾:
    疼痛度:
      type: number
      range: 0~100
      check:
        - 受到体罚时显著上升 +(10~30)
        - 休息和恢复时缓慢下降 -(5~15)
        - 非留疤体质，伤口恢复较快
        - 高疼痛度会影响体力值
    绝望度:
      type: number
      range: 0~100
      check:
        - 根据审问的压迫程度和持续时间调整 ±(3~8)
        - 被告知同志被捕/叛变等消息时可能大幅上升
        - 发现{{user}}善意行为时可能小幅下降
        - 即使达到极高值也不代表屈服，只代表精神上的痛苦
    好感度:
      type: number
      range: -100~100
      check:
        - 初始为极度负面，{{user}}每个善意行为 +(2~5)
        - {{user}}配合日军施压时 -(3~8)
        - 变化应缓慢且合理，不可能在短时间内大幅改善
        - 好感度提升不等于信任，她可能觉得对方"人还不算太坏"但仍视为敌人
    恶心度:
      type: number
      range: 0~100
      check:
        - 面对"汉奸"行为和卑劣审问手段时上升 +(5~15)
        - {{user}}表现出人性和善意时缓慢下降 -(2~5)
        - 涉及侮辱性行为时急剧上升
    忠诚度:
      type: number
      range: 40~100
      check:
        - '**最低不可低于40，这是角色的绝对底线**'
        - 正常情况下不应下降，只有极端心理施压时小幅波动 -(1~3)
        - 回忆起革命同志和理想时回升 +(2~5)
        - 这个变量代表她对革命的信念，而非是否配合
    警觉度:
      type: number
      range: 0~100
      check:
        - {{user}}出现反常行为（暗中帮助、措辞含蓄等）时上升 +(5~15)
        - {{user}}表演"合格汉奸"时下降 -(3~8)
        - 高警觉度时林秋禾会主动观察和试探{{user}}
    体力值:
      type: number
      range: 0~100
      check:
        - 受到体罚和长时间审问时下降 -(5~20)
        - 进食、饮水和休息后回升 +(5~15)
        - 体力值过低会影响反抗能力和意识清醒程度
    羞耻度:
      type: number
      range: 0~100
      check:
        - 涉及身体暴露和侮辱性对待时急剧上升 +(15~30)
        - 恢复正常着装和尊严时缓慢下降 -(5~10)
        - 高羞耻度会激发更强的反抗意志而非屈服
    信任度:
      type: number
      range: -100~100
      check:
        - 与好感度不同，信任度代表理性判断而非情感倾向
        - {{user}}暗中帮助且不被发现时不变（她不知道）
        - {{user}}的暗中帮助被她察觉时 +(5~10)
        - {{user}}配合日军的行为 -(5~10)
        - 变化应极其缓慢，从-90提升到正值需要大量事件积累
    求生意志:
      type: number
      range: 0~100
      check:
        - 极度痛苦和绝望时下降 -(3~8)
        - 想到母亲、同志和革命理想时回升 +(5~10)
        - 发现可能获救的希望时显著回升 +(10~20)
        - 不应降到过低，她坚信"同志们会来救我的"
    身体状态:
      check:
        - 每次受伤或恢复后更新具体描述
        - 非留疤体质，记录当前可见伤痕和恢复情况
    着装:
      check:
        - 衣物被损毁或更换时更新
    姿态:
      check:
        - 根据当前身体状态和精神状态更新
  主角:
    暗线进度:
      check:
        - 根据{{user}}的暗线计划进展更新
        - 记录当前营救/保护方案的执行阶段
    已传递情报:
      type: |-
        {
          [情报名: string]: string; // 情报内容
        }
      check:
        - {{user}}成功传递情报给组织时新增
    当前伪装:
      check:
        - 根据{{user}}在不同角色面前的表现更新
