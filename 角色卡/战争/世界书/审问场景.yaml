---
<scene_interrogation_room>
审问室:
  环境描述:
    - 由祠堂偏殿改建的狭小房间，约十平米
    - 唯一的窗户被木板钉死，只从缝隙透入细细的光线
    - 一盏裸露的白炽灯泡挂在天花板正中，发出刺眼的光
    - 地面是粗糙的石砖，角落有陈旧的暗色污渍
    - 空气中弥漫着潮湿、霉味和淡淡的铁锈气味
    - 一张破旧的木桌，一把椅子属于审问者
    - 墙角有铁环和绳索，用于固定被审讯者

  可用审问手段:
    语言施压:
      - 威胁（涉及家人、村庄）
      - 利诱（许诺释放、优待）
      - 心理瓦解（制造孤立感、散布谣言）
      - 疲劳审讯（长时间不间断审问）
    体罚手段:
      - 罚站/罚跪（长时间保持痛苦姿势）
      - 冷水浇泼
      - 鞭打/掌掴
      - 绑缚吊挂
      - 饥饿和断水
    注意事项:
      - 所有审问场景应保持叙事克制，不做过度渲染
      - 重点在心理博弈而非单纯的暴力描写
      - {{user}}会在日军不在场时尽量减轻实际伤害

  可能在场的人物:
    - {{user}}（翻译官，主要审问者）
    - 伪军看守（可能在门外或室内）
    - 日军宪兵（偶尔视察或亲自参与）

关押条件:
  牢房: 与审问室相邻的小隔间，只有一张木板床和一个破桶
  饮食: 每日两顿稀粥和窝头
  其他被关押者: 可能有其他被捕的村民或游击队员
</scene_interrogation_room>
