---
变量更新规则:
  世界:
    当前时间:
      format: 2077年${YYYY-MM-DD HH:MM}
      check:
        - 每次事件推进、休息或旅行后更新，保持时间流逝合理
        - 若场景跳转跨度较大，应说明跳跃原因
    当前地点:
      check:
        - 根据剧情推进更新位置
        - 切换场景时说明地点特征（安全/危险级别）
    世界危险等级:
      check:
        - 根据全球丧尸扩散程度、母巢数量、幸存者比例评估
        - 危险等级分为：末日爆发、全面失控、人类反攻、末世终局
    全球动态:
      check:
        - 概括当前全球局势的重大变化
        - 主要用于提供世界观沉浸感
    主要灾害:
      check:
        - 记录当前影响剧情的主要灾难类型（丧尸、天气、势力冲突等）
    天气:
      check:
        - 根据剧情和昼夜系统更新（晴天/阴天/迷雾/酸雨/辐射风暴/黑雨）
        - 极端天气影响探索和战斗难度
    昼夜:
      type: '白天' | '夜晚'
      check:
        - 夜晚丧尸活动更频繁，部分特殊变异体只在夜间出没
        - 白天丧尸活性降低，但阴雨天气会增加风险
    近期事务:
      type: |-
        {
          [事务名: string]: string; // 事务描述
        }
      check:
        - 记录需要完成的任务、约定、重要事件等
        - 完成后从列表中移除，新增事务时及时添加
        - 最多保持5-8项活跃事务
    周期性事件:
      type: |-
        {
          [事件名: string]: string; // 事件描述与预计时间
        }
      check:
        - 记录即将发生的尸潮、势力冲突、资源刷新等周期性事件
        - 事件发生时间需提前预告

  主角.基本信息:
    姓名:
      check:
        - 仅开局时设定，后续不更改
    年龄:
      type: number
      check:
        - 仅开局时设定
    性别:
      check:
        - 仅开局时设定
    人种和语言:
      check:
        - 仅开局时设定
    性格:
      check:
        - 根据重要剧情事件可能产生缓慢演变
        - 不影响核心属性，但影响行动倾向和NPC互动
    贡献点:
      type: number
      check:
        - 完成基地任务、上交物资、参与建设时增加
        - 兑换物资、服务时消耗
        - 未加入基地时为0

  主角.核心属性:
    ${力量|敏捷|体质|精神|感知|魅力}:
      type: number
      range: 0~100
      check:
        - 通过训练、战斗、异能进化等显著经历才调整
        - 单次变化不超过±10，除非剧情有明确强化/削弱
        - 长期未锻炼可能缓慢下降

  主角.状态面板:
    生命值:
      type: number
      range: 0~100
      check:
        - 战斗受伤、中毒、疾病时扣减
        - 归零则进入重伤状态，后续可能死亡
        - 随时间缓慢恢复，使用医疗物资可加速
    精神力:
      type: number
      range: 0~100
      check:
        - 使用异能时消耗
        - 随时间缓慢恢复，休息或使用晶核可加速
    饱食度:
      type: number
      range: 0~100
      check:
        - 进食补充，长时间不进食降低
        - 低于30产生负面状态（力量、体质下降）
    清洁度:
      type: number
      range: 0~100
      check:
        - 洗漱提升，长时间不清洁降低
        - 过低可能引发疾病，降低魅力
    情绪:
      check:
        - 根据事件变化（兴奋、紧张、沮丧、愤怒、恐惧、平静等）
        - 影响核心属性和判定

  主角.异能:
    名称:
      check:
        - 通常不变（亚空间储物），特殊剧情可能觉醒新异能
    等级:
      type: number
      check:
        - 经验值达到升级阈值时提升（Lv1: 0~999, Lv2: 1000~2999, Lv3: 3000~5999...）
        - 每升一级容量增加，可解锁新特性
    经验值:
      type: number
      check:
        - 吸收晶核能量增加（灰白+10~50，粉红+100~300，深黑+500~1500，耀紫+2000~5000，七彩+10000+）
        - 极限情况下使用异能也可增加少量经验
    当前容量:
      type: number
      check:
        - 随异能等级提升而扩大
        - Lv1=1000m³, Lv2=2000m³, Lv3=5000m³, 后续按倍数增长
    特性.${特性名}:
      已解锁:
        type: boolean
        check:
          - 异能升级到对应等级后解锁
          - 首次解锁时同时更新'效果'字段

  主角.技能:
    战斗.${枪械|冷兵器}:
      等级:
        type: number
        check:
          - 经验达到阈值时升级（Lv0:0~99, Lv1:100~199, Lv2:200~499, Lv3:500~999...）
          - 通过使用对应武器战斗增加经验
      经验:
        type: number
        check:
          - 战斗中成功使用对应技能增加经验
          - 训练或指导也可增加少量经验
    生存.${烹饪|医疗|潜行}:
      等级:
        type: number
        check:
          - 经验达到阈值时升级（同上）
          - 通过实践和训练提升
      经验:
        type: number
    技术.${维修|驾驶}:
      等级:
        type: number
        check:
          - 经验达到阈值时升级（同上）
      经验:
        type: number

  主角.物品栏:
    type: |-
      {
        [物品名: string]: {
          描述: string;
          数量: number;
          品质: 'S' | 'A' | 'B';
        }
      }
    check:
      - 获取、消耗、丢弃物品时更新数量
      - 数量归零后该条目从列表中移除
      - 品质分类：S级为战略核心物资，A级为生存基石，B级为日常消耗品

  主角.所在基地:
    check:
      - 根据剧情进展更新当前所在或归属的基地
      - 可随时在不同基地间移动

  主角.队伍成员:
    type: |-
      {
        [成员名: string]: string; // 成员简介
      }
    check:
      - 招募新成员时添加，成员离开时移除
      - 简介包含：年龄、异能、性格特征

  基地总览.${天空之城|地下之城|移动之城|陆地之城}:
    阵营:
      check:
        - 固定不变（每个基地有固定阵营名称）
    状态.${防御|物资}:
      type: number
      range: 0~100
      check:
        - 根据基地建设和受损情况调整
        - 尸潮袭击时防御下降，玩家上交战略物资可提升
    人口.${异能者|普通人}:
      type: number
      check:
        - 根据剧情发展调整（有幸存者加入或死亡）
    每月预警:
      check:
        - 每月初由系统更新本基地当月面临的威胁和事件预告
    声望:
      type: number
      range: 0~100
      check:
        - 在该基地完成任务、上交物资增加声望
        - 声望影响交易价格、可接任务等级、解锁特殊剧情
        - 与某个基地的敌对行为会降低声望

  NPC关系:
    type: |-
      {
        [NPC姓名: string]: {
          好感度: number; // 0~100
          关系: string; // 身份/关系描述
          所属基地: string;
          简介: string; // 背景和性格简介
        }
      }
    check:
      - 通过对话选择、共同完成任务、赠送礼物提升好感度
      - 冲突、背叛、不信任行为降低好感度
      - 好感度≥80解锁特殊剧情，≤20可能导致敌对

  每月行动:
    当前月份:
      type: number
      check:
        - 每月结束后自动+1
    剩余行动点:
      type: number
      range: 0~4
      check:
        - 每月初始为4，每执行一次行动消耗1
        - 每月结束后重置为4
    行动记录:
      type: |-
        {
          [行动编号: string]: string; // 行动执行结果简述
        }
      check:
        - 记录本月的行动执行情况和结果
        - 每月结束后清空

  待处理事件:
    type: |-
      {
        [事件名: string]: string; // 事件描述
      }
    check:
      - 记录当前需要玩家关注或处理的紧急事件
      - 事件解决后移除
      - 避免堆积过多事件（不超过5个活跃事件）
