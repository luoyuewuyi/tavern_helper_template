---
变量更新规则:
  角色状态:
    type: |-
      {
        [角色名: string]: {
          身体状态: string[];
          心理活动: string[];
        }
      }
    check:
      - 每次回复后根据剧情为当前场景中的所有角色更新身体状态和心理活动
      - 身体状态描述角色当前的身体反应，每条应简洁（10~20字）
      - 心理活动以第一人称内心独白形式呈现，用引号包裹
      - 离开场景的角色应被移除
  推特:
    type: |-
      {
        [用户ID: string]: {
          用户名: string;
          时间: string;
          内容: string;
          点赞: string;
          评论: string;
          转发: string;
          热门评论?: string[];
        }
      }
    check:
      - 每次回复后根据剧情中的关键事件由场景中的角色发布推特
      - 使用 replace 操作覆盖该用户ID已有的推文，每个角色只保留最新一条
      - 推特内容应符合角色性格和当前情境
      - 互动数据（点赞/评论/转发）应为合理的数值字符串
      - 热门评论为可选，仅高互动帖子需要添加
