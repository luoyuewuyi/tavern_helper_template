---
变量更新规则:
  时间与天气:
    日期:
      format: YYYY-MM-DD
      check:
        - 根据剧情推进更新日期
        - 中央议会在每季度初召开（3月1日、6月1日、9月1日、12月1日）
    季节:
      type: enum
      values: [春季, 夏季, 秋季, 冬季]
      check:
        - 3-5月为春季，6-8月为夏季，9-11月为秋季，12-2月为冬季
        - 季节变化时触发季度结算（油矿区产油、产业区产物资）
    时刻:
      check:
        - 描述当前时段（清晨、上午、中午、下午、傍晚、夜晚、深夜）
        - 根据剧情推进自然更新
    天气:
      check:
        - 根据季节和剧情合理更新（晴、多云、阴、小雨、大雨、暴风雨、雾等）
        - 天气会影响出击和港区活动

  议会事务:
    待办事务:
      type: |-
        [
          {
            事项: string;
            物资消耗: number;
            用油消耗: number;
            是否完成: boolean;
          }
        ]
      check:
        - 中央议会结束后将确定的事项添加到待办列表
        - 事务完成后将"是否完成"标记为true，并从仓储中心扣除对应的物资或用油
        - 物资或用油不足时不可完成该事务，触发预警
        - 每个事项需明确记录消耗的物资量和用油量
    下次中央议会天数:
      type: number
      range: 0~92
      check:
        - 按天递减，到达0时表示应召开中央议会
        - 新季度开始后重置为该季度天数（春季92天、夏季92天、秋季91天、冬季90天）
        - 重大突发事件可临时召开中央议会（将天数设为0）

  常务委员会:
    type: |-
      [
        {
          姓名: string;
          阵营: string; // 白鹰|皇家|铁血|重樱|东煌|北方联合|自由鸢尾|维希教廷|撒丁帝国
        }
      ]
    check:
      - 每个阵营固定一位常务委员，共9位
      - 仅在中央议会期间可替换委员
      - 替换时需由该阵营的中央议会代表中选出

  秘书舰:
    type: |-
      [
        {
          姓名: string;
          阵营: string;
        }
      ]
    check:
      - 指挥官可从任意阵营的舰娘中挑选秘书舰
      - 秘书舰名单可随时调整
      - 标注每位秘书舰所属阵营

  油矿区:
    等级:
      type: number
      range: 1~6
      check:
        - 升级需消耗600物资，从仓储中心扣除
        - 物资不足时不可升级，触发"物资告急"预警
        - 产量自动计算（等级×100油量每季度），无需手动更新产量
        - 季度结算时将产量加入仓储中心的特殊用油

  产业区:
    等级:
      type: number
      range: 1~6
      check:
        - 升级需消耗600物资，从仓储中心扣除
        - 物资不足时不可升级，触发"物资告急"预警
        - 产量自动计算（等级×1000物资每季度），无需手动更新产量
        - 季度结算时将产量加入仓储中心的物资

  船坞:
    等级:
      type: number
      range: 1~5
      check:
        - 升级需消耗600物资，从仓储中心扣除
        - 物资不足时不可升级，触发"物资告急"预警
        - 舰队上限自动计算：水面舰队上限=等级+1，水下舰队上限=等级
        - 组建新舰队时检查是否超过上限

  舰队:
    水面舰队:
      type: |-
        [
          {
            舰队名称: string;
            成员: [
              {
                姓名: string;
                舰种: string; // 驱逐舰|轻型巡洋舰|重型巡洋舰|战列巡洋舰|战列舰|轻型航空母舰|航空母舰
              }
            ]
          }
        ]
      check:
        - 每支水面舰队由6位舰娘组成
        - 添加或移除成员时更新对应舰队
        - 耗油量自动计算（各成员舰种基础油耗之和），无需手动更新
        - 水面舰队数量不得超过船坞等级限制的上限
    水下舰队:
      type: |-
        [
          {
            舰队名称: string;
            成员: [
              {
                姓名: string;
                舰种: string; // 潜艇
              }
            ]
          }
        ]
      check:
        - 每支水下舰队由3位舰娘组成
        - 水下舰队仅由潜艇组成
        - 水下舰队数量不得超过船坞等级限制的上限

  研究中心:
    等级:
      type: number
      range: 1~8
      check:
        - 升级需消耗600物资，从仓储中心扣除
        - 物资不足时不可升级，触发"物资告急"预警
        - 科技点、缩短月数、同时研发数量均自动计算，无需手动更新

  科研:
    研发中:
      type: |-
        [
          {
            姓名: string;
            舰种: string;
            总研发时间: number;   // 月
            剩余研发时间: number; // 月
            研发消耗物资: number;
          }
        ]
      check:
        - 开始研发时从科研舰娘名单中选取，记录舰种对应的研发时间和物资消耗
        - 基础研发时间：驱逐舰12月/1200物资，巡洋舰16月/1600物资，战列舰或航母20月/2000物资
        - 实际研发时间 = 基础时间 - 研究中心缩短月数（最低不低于1个月）
        - 研发中的舰娘数量不得超过研究中心的同时研发数量上限
        - 每月递减剩余研发时间，归零后转入"已研发"列表
        - 开始研发时从仓储中心扣除物资，物资不足时无法启动研发
    已研发:
      type: |-
        [
          {
            姓名: string;
            舰种: string;
          }
        ]
      check:
        - 研发完成的科研舰娘自动转入此列表
        - 已研发的舰娘可编入舰队

  仓储中心:
    特殊用油:
      type: number
      check:
        - 季度结算时加入油矿区当季产量
        - 舰队出击、事务完成、设施升级等操作会扣减用油
        - 不可低于0，低于0时操作应被拒绝
    物资:
      type: number
      check:
        - 季度结算时加入产业区当季产量
        - 事务完成、设施升级、科研研发等操作会扣减物资
        - 不可低于0，低于0时操作应被拒绝

  预警:
    type: string[]
    check:
      - 预警由系统自动生成（schema.ts中计算），通常无需AI手动更新
      - 当物资不足以完成当前所有未完成事务+科研项目时，显示"物资告急"
      - 当用油不足以覆盖未完成事务用油+每季度舰队总耗油时，显示"用油告急"
      - 预警出现时，系统会拒绝执行导致资源不足的项目
      - 用户需选择放弃该项目或放弃其他项目来释放资源
