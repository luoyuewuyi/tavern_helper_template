---
变量更新规则:
  世界:
    当前时间:
      format: YYYY-MM-DD HH:MM
    当前地点:
      check:
        - 主角移动到新位置时更新为当前所在的具体地点名称
    近期事务:
      type: |-
        {
          [事务名: string]: string; // 事务描述
        }
      check:
        - 记录需要完成的任务、约定、重要事件等
        - 完成后从列表中移除，新增事务时及时添加
        - 最多保持5-8项活跃事务，避免过度复杂

  主角:
    LV:
      type: number
      range: 1~50
      check:
        - EXP达到EXP上限时LV+1，EXP归零，EXP上限增加50
        - 每达到10/20/30/40/50级时可获得新替身
    EXP:
      type: number
      range: 0~EXP上限
      check:
        - 击败弱敌+5~10，击败强敌+20~50
        - 完成任务+30~100，根据任务难度调整
    HP:
      type: number
      range: 0~HP上限
      check:
        - 战斗受伤时减少，休息/治疗时恢复
        - HP归零时进入濒死状态
    心情值:
      type: number
      range: 0~100
      check:
        - 正面事件+5~15，负面事件-5~20
        - 影响与NPC的互动和某些技能效果
    金币:
      type: number
      range: 0~∞
      check:
        - 获得报酬+X，购买物品-X
        - 最小为0，不可负数

  替身系统:
    已拥有替身:
      type: |-
        [
          {
            名称: string;
            类型: string;  // 近战型/远程型/辅助型/特殊型
            能力: string;
          }
        ]
      check:
        - 达到10/20/30/40/50级时从替身候选池中选择一个加入
        - 需要待选择为true且有候选替身可选
    激活替身:
      check:
        - 主角切换使用的替身时更新为当前激活替身的名称
    替身候选池:
      type: |-
        [
          {
            名称: string;
            类型: string;
            能力: string;
          }
        ]
      check:
        - 达到可获得新替身的等级时系统生成3个随机替身供选择
        - 选择完成后清空候选池
    待选择:
      type: boolean
      check:
        - 达到10/20/30/40/50级时设为true
        - 选择完成后设为false

  周围人物:
    type: |-
      [
        {
          名称: string;
          关系: string;  // 同伴/陌生人/敌人/商人等
          好感度: number;  // -100~100
          当前状态: string;
          备注?: string;
        }
      ]
    check:
      - 当新NPC出现在剧情中时，添加到列表（字段名必须为“名称”而非“姓名”）
      - 当NPC离开当前场景或剧情结束时，移除该条目
      - 好感度根据互动调整：友善行为+5~15，敌对行为-10~30
      - 关系根据剧情发展更新（如从陌生人变为同伴）
      - 当前状态反映NPC的即时状态（战斗中/受伤/正常等）
      - 最多保持8-10个周围人物，优先保留重要NPC
