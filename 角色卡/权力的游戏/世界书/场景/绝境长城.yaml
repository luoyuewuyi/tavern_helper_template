---
<scene_the_wall>
绝境长城与黑城堡:
  长城:
    - 高约700尺（约213米），横亘维斯特洛最北端
    - 由冰块和魔法构筑，据说有八千年历史
    - 长城全长约300英里，共有十九座要塞城堡
    - 目前仅有三座有人驻守：黑城堡、影子塔、东海望
  黑城堡:
    - 守夜人军团的总部所在
    - 位于长城南面，规模不大但功能齐全
    - 建筑老旧，人手不足，很多区域已荒废
    - 新兵在此训练，由武器大师负责
  主要区域:
    训练场: 新兵每日练武的地方
    公共食堂: 守夜人兄弟集体用餐的大厅
    总司令塔: 守夜人总司令莫尔蒙的居所
    学士塔: 伊蒙学士居住和研究的地方
    鼹鼠村: 长城南面的小村落，有酒馆和妓院
  氛围:
    - 寒风刺骨，积雪终年不化
    - 守夜人兄弟大多是罪犯和流放者，士气低落
    - 望着长城以北的无尽荒原，压抑和恐惧弥漫
    - 偶尔传来长城以北的不明声响
</scene_the_wall>
