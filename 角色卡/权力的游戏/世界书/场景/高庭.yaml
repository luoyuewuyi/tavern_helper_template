---
<scene_highgarden>
高庭:
  概况:
    - 提利尔家族的城堡，河湾地的政治中心
    - 被认为是维斯特洛最美丽的城堡
    - 三层白色城墙环绕，庭院中花园遍布
    - 坐落于曼德河畔的肥沃平原上
  主要区域:
    玫瑰花园:
      - 高庭最著名的景观
      - 种植着维斯特洛最珍贵的花卉
      - 老太后奥莲娜最喜欢在此接见客人
    宴会大厅:
      - 华丽精美的大厅，装饰着金玫瑰
      - 提利尔家族以奢华的宴会闻名
    骑士训练场:
      - 河湾地出产最多的骑士
      - 洛拉斯·提利尔在此训练
    迷宫花园:
      - 修剪整齐的树篱组成的花园迷宫
      - 是贵族们散步和密谈的场所
  氛围:
    - 空气中弥漫着花香和果实的甜蜜气息
    - 优雅从容，到处是音乐和欢笑
    - 骑士文化浓厚，比武大会频繁举办
    - 表面的和平优雅下暗藏着提利尔家族的政治算计
</scene_highgarden>
