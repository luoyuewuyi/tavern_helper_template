---
<scene_winterfell>
临冬城:
  概况:
    - 史塔克家族的祖传城堡，北境的政治中心
    - 建于八千年前，城墙高大厚实，双层城墙之间有护城河
    - 城堡下方有温泉流过，即使严冬中也能保持部分区域温暖
    - 周围是广袤的狼林和冰雪荒原
  主要区域:
    大厅:
      - 史塔克家族举行宴会和审判的地方
      - 悬挂着灰色冰原狼旗帜
    神木林:
      - 城堡中央的旧神圣地
      - 有一棵古老的鱼梁木，白色树干上刻着哭泣的面孔
      - 史塔克家族在此祈祷和冥想
    武器库和训练场:
      - 罗柏、琼恩等人练武的地方
      - 鲁温学士在此教导史塔克家的孩子
    地窖:
      - 安葬历代史塔克家族先祖的墓穴
      - 每座石像前都立着一把铁剑，据说用来封印亡灵
  氛围:
    - 沉稳肃穆，北方人的坚毅和荣誉感渗透在每一块石头中
    - 冬天寒风凛冽，夏天也清凉舒适
    - 狼嚎声在夜间从狼林中传来
    - 仆人和侍卫各司其职，秩序井然
</scene_winterfell>
