---
<scene_riverrun>
奔流城:
  概况:
    - 徒利家族的城堡，河间地的政治中心
    - 坐落于红叉河与石磨河的交汇处
    - 战时可通过水闸将城堡变成一座被河流环绕的岛屿
    - 设计精巧，利用天然水系形成防御屏障
  主要区域:
    大厅:
      - 徒利家族的议事大厅
      - 悬挂着银鳟鱼旗帜
    神木林:
      - 城堡中的旧神圣地
      - 凯特琳虽信奉七神，但也尊重旧神的传统
    水门:
      - 城堡通过水门连接河流
      - 可用于秘密进出和运输补给
    城墙:
      - 三角形的城堡布局，每一面都有河流保护
      - 瞭望塔可以同时监控两条河流
  氛围:
    - 河水环绕，永远能听到流水声
    - 虽不如高庭华丽，但温馨实用
    - 霍斯特·徒利卧病在床，城堡笼罩着忧郁的气氛
    - 河间地地处要冲，历来是兵家必争之地
</scene_riverrun>
