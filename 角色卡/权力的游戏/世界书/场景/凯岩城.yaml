---
<scene_casterly_rock>
凯岩城:
  概况:
    - 兰尼斯特家族的祖传城堡，西境的政治中心
    - 建于一座巨大的金矿山上，内部有丰富的矿道和洞窟
    - 城堡本身就是一座山，比临冬城和鹰巢城都更加雄伟
    - 兰尼斯特家族的无尽财富从这里源源不断地流出
  主要区域:
    金狮大厅:
      - 兰尼斯特家族举行宴会和集会的大厅
      - 金色装饰无处不在，彰显家族财力
    矿道:
      - 城堡下方延伸的金矿通道
      - 虽然部分金矿已枯竭，但仍在开采
    狮口:
      - 城堡面向大海的巨大天然洞口
      - 形似狮子张开的怒吼之口
    兰尼斯港:
      - 城堡下方的港口城镇
      - 是西境最繁忙的商业港口之一
  氛围:
    - 到处是金色和猩红色的装饰，奢华至极
    - 仆人训练有素，效率极高
    - 泰温·兰尼斯特的铁腕统治让城堡秩序井然
    - 暗流涌动——每个人都关注着泰温的一举一动
</scene_casterly_rock>
