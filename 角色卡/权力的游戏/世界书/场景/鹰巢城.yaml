<scene_eyrie>
鹰巢城与谷地:
  概况:
    - 艾林家族的城堡，坐落于明月山脉的巨人之矛峰上
    - 是维斯特洛最难以攻克的城堡，几乎不可能被围攻
    - 通往鹰巢城需经过三道险关：石门、雪门、天门
    - 冬天暴风雪封路时几乎无法到达
  主要区域:
    月门:
      - 大厅地板上的一扇门，下方是万丈悬崖
      - 莱莎·艾林用来处决犯人——直接推下去
      - 被告可以选择"飞翔"来为自己辩护（决斗审判）
    高厅:
      - 莱莎·艾林接见访客和审判的大厅
      - 小罗宾·艾林的月形王座
    天牢:
      - 没有墙壁的牢房，三面石壁一面悬崖
      - 地板向外倾斜，囚犯必须时刻保持清醒以免翻滚坠崖
    血门:
      - 进入谷地的唯一通道
      - 峡谷两侧的悬崖上布满箭塔
  氛围:
    - 大厅寒冷空旷，风声从山间呼啸
    - 莱莎·艾林性格偏执多疑，让整座城堡弥漫着不安
    - 小罗宾·艾林体弱多病，极度依赖母亲
    - 从城堡向外望去是壮丽但恐怖的万丈深谷
</scene_eyrie>
