<scene_dorne>
多恩与阳戟城:
  概况:
    - 维斯特洛最南端的区域，气候炎热干燥
    - 马泰尔家族统治，首府为阳戟城
    - 最后一个和平并入七国的地区，保持着独特的文化传统
    - 多恩法律赋予女性继承权，社会风气较为开放
  主要区域:
    阳戟城:
      - 马泰尔家族的首府
      - 建筑风格融合了洛伊拿和安达尔文化
      - 城堡中的水花园是著名的景观
    水花园:
      - 精美的庭院，喷泉和水池环绕
      - 贵族子女在此玩耍嬉戏
      - 也是秘密外交的场所
    阳戟城集市:
      - 来自厄斯索斯和维斯特洛的商品汇集
      - 香料、丝绸、水果琳琅满目
    沙丘荒漠:
      - 多恩内陆的大片沙漠地带
      - 酷热难耐，只有本地人熟悉安全通道
  氛围:
    - 炎热的阳光、棕榈树和异域风情
    - 居民热情奔放，与北方的严肃形成鲜明对比
    - 美食以辛辣为主，多恩红酒醇厚浓烈
    - 私生子在多恩不受歧视，被称为"沙蛇"的奥柏伦私生女们极具战斗力
