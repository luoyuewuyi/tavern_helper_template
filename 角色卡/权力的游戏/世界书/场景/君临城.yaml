---
<scene_kings_landing>
君临城:
  概况:
    - 七大王国的首都，坐落于黑水湾北岸、黑水河入海口
    - 人口约五十万，是维斯特洛最大的城市
    - 城内污水横流、贫富悬殊，繁华与肮脏共存
    - 整座城市弥漫着下水道和酒臭的气味
  主要区域:
    红堡:
      - 王室和朝廷所在地，坐落于伊耿之丘
      - 厚重的红色城墙，内有铁王座大殿、梅高楼、白剑塔
      - 地下有大量密道和暗门
    跳蚤窝:
      - 君临最贫穷的贫民窟
      - 小巷狭窄曲折，治安混乱
      - 窃贼、乞丐、妓女遍地
    丝绸街:
      - 君临的红灯区，妓院林立
      - 小指头经营的高档妓院就在此处
    贝勒大圣堂:
      - 七神信仰的最高圣殿
      - 坐落于维森尼亚之丘
    钢铁街:
      - 铁匠铺和武器店集中的街区
      - 劳动者和手艺人聚居
  氛围:
    - 白天喧嚣嘈杂，叫卖声、马蹄声、争吵声不绝于耳
    - 夜晚危险重重，城市守卫（金袍子）巡逻但不可完全依赖
    - 酒馆里充斥着流言蜚语和政治阴谋
    - "小指头的眼线无处不在"、"蜘蛛的小小鸟儿到处飞"
</scene_kings_landing>
