---
<scene_dragonstone>
龙石岛:
  概况:
    - 位于黑水湾入口的火山岛，曾是坦格利安家族在维斯特洛的第一个据点
    - 城堡以龙的形象建造，到处是龙形石雕和装饰
    - 目前由史坦尼斯·拜拉席恩镇守
    - 岛上蕴含龙晶（黑曜石）矿脉
  主要区域:
    龙山:
      - 岛上的活火山，至今仍偶尔冒烟
      - 火山地热使岛上气候温暖
    石鼓塔:
      - 城堡的主塔，鼓形结构
      - 城堡中最高的建筑
    彩绘桌:
      - 征服者伊耿曾在此桌上规划统一维斯特洛的战略
      - 桌面是一幅巨大的维斯特洛地图
    龙晶矿洞:
      - 蕴藏丰富龙晶的洞穴
      - 龙晶是克制异鬼的重要武器
  氛围:
    - 阴暗潮湿，暴风雨频繁袭击
    - 到处弥漫着硫磺和海盐的气味
    - 龙形石雕在雾中若隐若现，令人不安
    - 驻军不多，气氛压抑
</scene_dragonstone>
