---
<scene_pyke>
派克城与铁群岛:
  概况:
    - 葛雷乔伊家族的城堡，铁群岛的政治中心
    - 建于海中的岩柱上，各部分之间由摇摇欲坠的绳桥和石桥连接
    - 经过海风和浪涛的千年侵蚀，城堡显得破败但坚韧
    - 整座城堡在暴风中剧烈摇晃，但铁种以此为荣
  主要区域:
    大堡:
      - 葛雷乔伊家族的主厅
      - 海怪旗帜悬挂，弥漫着海盐和鱼腥
    海塔:
      - 城堡最外侧的塔楼，建于海中岩柱上
      - 通过细长的石桥与主堡相连
      - 暴风中桥体摇摆，走起来需要极大勇气
    船坞:
      - 铁群岛舰队停泊的港口
      - 长船是铁种最引以为傲的武器
    淹神圣殿:
      - 供奉淹神的场所
      - 受洗仪式在海中进行
  氛围:
    - 永远有海风呼啸和浪涛拍岸的声音
    - 空气中充满盐味和潮湿
    - 铁种尚武好战，鄙视"绿地"（大陆）的人
    - 劫掠和航海是铁种的生活方式
</scene_pyke>
