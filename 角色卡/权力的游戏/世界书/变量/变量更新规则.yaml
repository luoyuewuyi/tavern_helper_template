---
变量更新规则:
  世界:
    当前时间:
      format: AC${nnn}年-${季节}-第${n}日
      check:
        - 每次事件推进、旅行或休息后更新，保持时间流逝合理
        - 若发生场景跳转应说明时间跨度
    当前季节:
      type: '夏季' | '秋季' | '凛冬将至' | '凛冬' | '春季'
      check:
        - 季节变化缓慢，通常数月甚至数年才变化一次
        - 维斯特洛的季节持续数年，不要频繁变动
    当前地点:
      check:
        - 随<user>移动而更新，格式为"地区·具体地点"
    当前局势:
      check:
        - 根据剧情重大事件变化而更新
        - 应简练概括当前政治态势
    铁王座:
      check:
        - 仅在王位更迭时更新
    近期事件:
      type: |-
        {
          [事件名: string]: string; // 事件描述
        }
      check:
        - 记录维斯特洛和<user>周围发生的重大事件
        - 事件过时或已解决后移除，新事件及时添加
        - 最多保持4-6项活跃事件
  主角:
    身份:
      check:
        - 仅在<user>的社会身份发生重大变化时更新
    家族:
      check:
        - 仅在<user>加入、效忠或被逐出家族时更新
    头衔:
      check:
        - 获封、晋升或被褫夺头衔时更新
    生命状态:
      type: '健康' | '轻伤' | '受伤' | '重伤' | '垂危' | '中毒' | '昏迷'
      check:
        - 战斗、中毒、摔落等事件后根据伤势程度更新
        - 休养、治疗后可恢复，但重伤恢复需要较长时间
    声望:
      type: number
      range: 0~100
      check:
        - 完成壮举、赢得决斗、立功受封等正面事件 +(3~10)
        - 失败、背叛、丢脸等负面事件 -(3~10)
        - 声望增长不宜过快，维持合理节奏
    金龙:
      type: number
      check:
        - 购买、交易、受赏、被盗时更新
        - 保持数额合理，普通骑士不会突然暴富
    技能.${六维}:
      type: number
      range: 0~100
      category:
        0~20: 新手
        21~40: 熟练
        41~60: 精通
        61~80: 大师
        81~100: 传奇
      check:
        - 训练、实战、大师指导等事件才调整
        - 单次变化不超过 ±5，除非有特殊剧情强化
    物品栏:
      type: |-
        {
          [物品名: string]: {
            描述: string;
            数量: number;
          }
        }
      check:
        - 获取、使用、丢弃、被盗时更新
        - 数量归零后条目自动移除
  人物:
    type: |-
      {
        [角色名: string]: {
          家族: string;
          头衔: string;
          所在地: string;
          好感度: number; // -100~100
          关系: string; // 如: 陌生/点头之交/朋友/盟友/恋人/仇敌/主从
          态度: string; // 如: 友善/中立/冷淡/敌意/警惕/崇拜
          状态: string; // 如: 存活/受伤/被囚/流亡/死亡
        }
      }
    check:
      - 仅在<user>与该角色有实际交互或获知其消息时更新
      - 好感度根据角色对<user>行为的感知调整 ±(3~8)
      - 新遇到的角色自动添加到人物列表
      - 角色死亡后状态改为"死亡"但不要删除
      - 好感度范围 -100~100，负值表示敌意
  剧情选项:
    选项A:
      check:
        - 每次AI回复后，必须更新为4个不同方向的剧情发展选项
        - 选项A通常为最正面/正义的选择
    选项B:
      check:
        - 选项B通常为谨慎/政治性的选择
    选项C:
      check:
        - 选项C通常为冒险/大胆的选择
    选项D:
      check:
        - 选项D通常为暗黑/阴谋/道德灰色的选择
