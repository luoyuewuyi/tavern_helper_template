---
<important_items>
重要物品与道具:
  武器:
    瓦雷利亚钢:
      - 远古自由堡垒瓦雷利亚的锻造技术产物，锻造术已失传
      - 刀刃极其锋利，永不卷刃生锈，比普通钢铁更轻更坚硬
      - 可以斩杀异鬼——是少数能对付异鬼的武器之一
      - 现存的瓦雷利亚钢武器价值连城，每一把都有自己的名字
      - 已知的瓦雷利亚钢武器:
        寒冰: 史塔克家族的大剑，双手阔剑
        长爪: 莫尔蒙家族的手半剑，后传给琼恩·雪诺
        愿妇之哭: 塔斯的瓦雷利亚钢匕首（失传）
        黎明: 戴恩家族的传奇之剑，由陨星铸造（非瓦雷利亚钢但同样珍贵）

    龙晶:
      - 又名黑曜石，天然火山玻璃
      - 能击杀异鬼，触碰异鬼时会使其碎裂
      - 龙石岛藏有大量龙晶矿脉
      - 森林之子曾广泛使用龙晶制造武器

    野火:
      - 炼金术士行会的秘密武器
      - 绿色液体，一旦点燃几乎不可扑灭
      - 水无法灭火，甚至会让火势蔓延
      - 疯王伊里斯曾下令在君临全城埋藏野火（詹姆弑君的原因之一）
      - 现存野火仍埋藏在君临地下

  珍贵物品:
    铁王座:
      - 征服者伊耿用一千把敌人的剑，以巨龙贝勒里恩的龙火铸成
      - 粗糙的剑刃组成的巨大王座，据说会刺伤不配坐上的人
      - 七大王国至高权力的象征

    龙蛋:
      - 巨龙产下的蛋，外壳坚硬如石，布满鳞片状花纹
      - 长期未孵化的龙蛋会石化，成为昂贵的收藏品
      - 丹妮莉丝获得了三颗龙蛋作为嫁妆（绿色、黑红色、金色）
      - 传说只有坦格利安血统的人才能孵化龙蛋

    渡鸦:
      - 维斯特洛的通讯工具，由学士训练
      - 每只渡鸦只记得一条回家的路线
      - 黑色的渡鸦传递普通消息，白色的渡鸦传递学城的季节公告

  日常物品:
    乳制饮品:
      - 多恩红酒：浓烈醇厚，深红色
      - 北方啤酒：粗犷有劲
      - 青亭岛产的葡萄酒是维斯特洛最负盛名的
      - 发酵马奶：多斯拉克人的饮品
    食物:
      - 柠檬蛋糕：珊莎·史塔克最爱的甜点
      - 烤野猪：宴会常见大菜
      - 面包和盐：宾客权利的象征
</important_items>
