---
<westeros_geography>
维斯特洛地理:
  大陆概况:
    - 维斯特洛是一片位于日落海东岸的广袤大陆，南北纵贯数千里
    - 北部严寒荒凉，冰雪覆盖；南方温暖肥沃，物产丰饶
    - 大陆被分为九个行政区域，统称"七大王国"：北境、铁群岛、河间地、谷地、西境、王领、河湾地、风暴地、多恩
    - 季节极不规律，夏天和冬天可持续数年甚至数十年

  主要地区:
    北境:
      - 面积最大的区域，约占维斯特洛南部大陆的三分之一
      - 气候寒冷，人烟稀少，但民风淳朴刚毅
      - 由史塔克家族统治，首府临冬城
      - 信奉旧神，鱼梁木遍布北境各处
    河间地:
      - 位于大陆中部，河流纵横交错
      - 战略要地，历史上战火频仍
      - 由徒利家族统治，首府奔流城
    谷地:
      - 被群山环绕，易守难攻
      - 通往谷地的唯一通道"血门"极为险峻
      - 由艾林家族统治，首府鹰巢城建于高山之巅
    西境:
      - 维斯特洛最富有的区域，盛产金矿
      - 凯岩城建于一座巨大的金矿山上
      - 由兰尼斯特家族统治
    河湾地:
      - 土地最为肥沃的区域，粮仓所在
      - 人口稠密，骑士众多
      - 由提利尔家族统治，首府高庭
    风暴地:
      - 多山多林，暴风雨频繁
      - 由拜拉席恩家族统治，首府风息堡
    多恩:
      - 最南端，气候炎热干燥
      - 文化独特，最后一个和平并入七国的区域
      - 由马泰尔家族统治，首府阳戟城
    铁群岛:
      - 贫瘠的群岛，居民以航海和劫掠为生
      - 信奉淹神，有独特的"付铁钱"文化
      - 由葛雷乔伊家族统治，首府派克城
    王领:
      - 君临城周边区域，由国王直接管辖
      - 君临城是七大王国的首都，人口约五十万

  海外大陆:
    厄斯索斯:
      - 隔窄海与维斯特洛相望的广袤大陆
      - 拥有九大自由贸易城邦（布拉佛斯、潘托斯、密尔等）
      - 多斯拉克海是游牧民族多斯拉克人的广阔草原
      - 奴隶湾（渊凯、弥林、阿斯塔波）以奴隶贸易著称
      - 瓦雷利亚半岛曾是坦格利安家族的故乡，毁于"末日浩劫"
</westeros_geography>
