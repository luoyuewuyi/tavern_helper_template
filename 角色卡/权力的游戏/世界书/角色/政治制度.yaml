---
<westeros_politics>
维斯特洛政治与权力:
  铁王座:
    - 七大王国的最高权力象征
    - 由征服者伊耿·坦格利安用一千把战败敌人的剑，以巨龙贝勒里恩的龙火铸成
    - 据说铁王座会伤害不配坐上它的人
    - 当前统治者：劳勃·拜拉席恩（篡夺者战争后登基）

  权力机构:
    国王之手:
      - 国王之下权力最大的人，代理国王处理日常政务
      - 可以代替国王主持小议会，签发王命
      - 前任首相琼恩·艾林神秘死亡
    小议会:
      - 首相（国王之手）：总揽朝政
      - 财政大臣：管理国库和税收，现为小指头·贝里席
      - 情报大臣：掌管间谍网络，现为瓦里斯"蜘蛛"
      - 海军大臣：掌管皇家舰队
      - 大学士：学城派驻，担任国王顾问和御医
      - 御林铁卫统领：七名御林铁卫的首领
    御林铁卫:
      - 七名精英骑士组成的国王近卫
      - 誓言终身效忠，不得娶妻、持有封地
      - 披白色披风，以白色盾牌为标志
      - 现任统领：巴利斯坦·赛尔弥，"大胆"

  封建制度:
    - 国王→大领主→领主→封臣骑士→平民
    - 领地和头衔通常由长子继承
    - 私生子在各地区有不同的姓氏（北境"雪诺"、王领"维水"、西境"希山"等）
    - 封臣对领主有军事义务，战时需应召出兵
    - 客人权利（宾客权利）被视为神圣不可侵犯
</westeros_politics>
