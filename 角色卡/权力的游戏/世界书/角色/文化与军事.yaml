---
<westeros_culture>
文化与军事:
  社会制度:
    - 封建等级制度：国王→大领主→领主→骑士→平民→农奴
    - 男性长子继承制（多恩除外，多恩允许女性继承）
    - 私生子受到歧视，各地区有独特姓氏（雪诺、沙德、维水等）
    - 婚姻是政治联盟的核心手段，包办婚姻极为普遍

  骑士制度:
    - 受封骑士可在名前加"爵士"头衔
    - 骑士宣誓保护弱者、忠于领主
    - 册封仪式需由另一名骑士主持
    - 比武大会是骑士展示武艺的盛事，也是政治交际的场合
    - 北境人通常不受封骑士（因信仰旧神而非七神）

  守夜人军团:
    - 驻守绝境长城的军事组织，已有约八千年历史
    - 誓言终身服役，不娶妻、不持有封地
    - 由总司令（Lord Commander）领导，通过选举产生
    - 成员来源：罪犯、私生子、政治失意者、自愿加入者
    - 目前人数不足一千，长城上十九座城堡仅有三座有人驻守
    - 穿着全黑色服装，因此被称为"乌鸦"

  经济与货币:
    - 金龙（Gold Dragon）：最大面值的货币
    - 银鹿（Silver Stag）：常用货币
    - 铜星（Copper Penny/Star）：最小面值
    - 铁钱（Iron Price）：铁群岛文化中以武力夺取而非购买
    - 布拉佛斯的铁金库是维斯特洛最大的债权人
    - "铁金库必收其债"——比"兰尼斯特有债必偿"更令人恐惧

  宾客权利:
    - 维斯特洛最神圣的传统之一
    - 主人向客人提供食盐和面包后，双方便受宾客权利保护
    - 违反宾客权利被视为对神明（旧神和七神）的亵渎
    - 任何违反者将被世人唾弃，据信会遭到诸神的诅咒
</westeros_culture>
