---
<westeros_supernatural>
超自然与宗教:
  异鬼与凛冬:
    - 异鬼（White Walkers）是远古的冰雪生物，蓝色双眼，冰冷的触感能冻裂钢铁
    - 能将死者复活为没有思想的尸鬼（Wights），组建亡者大军
    - 异鬼惧怕龙晶（黑曜石）和瓦雷利亚钢
    - 传说在"长夜"中几乎毁灭了人类文明，最终被筑墙者布兰登击退
    - 绝境长城便是为了抵御异鬼而建造

  巨龙:
    - 坦格利安家族曾驾驭巨龙征服维斯特洛
    - 巨龙能喷射毁灭性的龙火，鳞片坚硬如铠甲
    - 最后的巨龙在约一百五十年前死亡，据信已经灭绝
    - 龙蛋如今被视为无价之宝，多数已石化

  宗教信仰:
    旧神:
      - 北境和长城以北的主要信仰
      - 没有固定的庙宇，在鱼梁木前祈祷
      - 鱼梁木是白色树干、红色叶子的古老神木，上面刻有面孔
      - 绿之先知能通过鱼梁木窥视过去
    七神:
      - 南方维斯特洛的主流信仰（安达尔人带来）
      - 七位一体：天父、圣母、战士、少女、铁匠、老妪、陌客
      - 圣堂骑士是七神信仰的武装力量
      - 总主教居住在君临的贝勒大圣堂
    淹神:
      - 铁群岛的信仰
      - "逝者不死，必将更强而起"
      - 受洗仪式是将人溺入海水中再救起
    红神拉赫洛:
      - 起源于厄斯索斯的火焰信仰
      - 红袍僧侣和女祭司拥有火焰魔法
      - 信奉"光之王"与"暗夜使者"的对立
      - 梅丽珊卓是史坦尼斯身边的红袍女祭司
    千面之神:
      - 布拉佛斯的死亡之神信仰
      - "无面者"是神秘的刺客组织，能改变容貌
      - 黑白之院是无面者的总部

  魔法与预言:
    - 三眼乌鸦拥有绿之视野（greensight），能看到过去、现在和可能的未来
    - 易形者（Warging）能将意识投入动物体内控制其行动
    - 瓦雷利亚钢锻造术已失传，现存的瓦雷利亚钢武器极其珍贵
    - "王子的承诺"预言流传于坦格利安家族
</westeros_supernatural>
