---
伪同层前端命令协议:
  定位:
    - 伪前端会把界面点击结果整理成结构化命令块，再与玩家补充文本一起作为同一条 user 输入发送。
    - 这些命令是玩家意图的前端映射，不是旁白，也不是可忽略的装饰文本。
  输入协议:
    - 若 user 输入中出现 `<SessionHostCommands>...</SessionHostCommands>`，其内部一定是 JSON 数组。
    - 当前前端默认发送单元素数组；一次点击只对应一条结构化命令。
    - 若出现 `<SessionHostUserText>...</SessionHostUserText>`，其内部是玩家本次主动补充的自由文本。
    - 纯自由输入时，不会包裹任何宿主标签，直接把自然语言当作玩家输入处理。
  解释规则:
    - 先读取命令数组，再结合自由文本统一理解这一回合的真实意图。
    - 命令只表示玩家通过前端点击得到的结构化意图，不替代正文自由表达。
    - 若自由文本与命令冲突，以 `<SessionHostUserText>` 内的自由文本为准，命令仅作辅助上下文。
    - 不要把 XML 标签名、JSON 键名、花括号或数组字面量写回正文。
  命令类型:
    - `travel-region`: 玩家想前往某个地区并推进旅程。
    - `travel-place`: 玩家想进入某个具体地点并推进场景切换。
    - `event`: 玩家想推进某个动作、调查或事件。
    - `npc`: 玩家想主动接触某个成员并展开互动。
  回复要求:
    - 无论输入是纯文本、纯命令还是“命令 + 自由补充”，都只产出一条自然连贯的正常正文回复。
    - 回复必须产出 `<maintext>` 与 `<option>`；其中 `<maintext>` 只保留可见叙事正文，`<option>` 一行一个快捷选项。
    - `<sum>` 与 `<UpdateVariable>` 可按需要追加在后面，但若给出 `<UpdateVariable>`，必须只更新本轮真正变化的状态。
    - `<UpdateVariable>` 只能写 `场景 / 主角 / 地图 / 地点 / 成员 / 法则`，不得回写旧结构。
