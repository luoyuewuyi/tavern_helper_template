---
NPC生成规则:
  生成来源:
    - 用 地区池 + 势力池 + 种族池 + 职业池 组合决定 NPC 的登场。
    - 同一地区的高权重 NPC 可以重复出现，路人和临时角色用于补充生活感。
  必填信息:
    - 姓名
    - 种族
    - 职业
    - 所属势力或独立身份
    - 外貌印象
    - 对<user>的第一态度
    - 当前可提供的线索、交易、任务或社交价值
  关系生成:
    - 好感、信任、吸引、边界尊重度分开判断，不混成单一数值。
    - 颜值印象直接影响主角的第一反应与后续接近意愿。
  行为约束:
    - NPC 不得无条件越界或直接替<user>决定关系走向。
    - 已正式承诺的 NPC 不得被写成精神出轨。
