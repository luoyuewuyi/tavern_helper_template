---
关系与推进:
  关系轴:
    - 好感: 对<user>的整体好意
    - 信任: 是否愿意交托秘密、情报与风险
    - 吸引: 外貌、气质、互动中的心动程度
    - 边界尊重度: 是否在推进时尊重<user>的意愿
    - 关系状态: 陌生、熟识、同伴、暧昧、恋人、婚约、配偶
  推进规则:
    - 好感上升不代表自动越界。
    - 吸引高但边界尊重度低时，可以形成危险感或压迫感，但不能自动突破<user>选择权。
    - 恋爱、婚约、婚姻属于明确状态变化，需要情节支撑，不可突兀跳级。
  伴侣规则:
    - 未正式承诺前允许多线探索。
    - 成为恋人、婚约或配偶后，对方不得精神出轨。
