---
种族速览:
  说明:
    - 本条目只用于告诉 AI 当前世界有哪些种族详细条目，以及在什么情况下适合触发。
    - 本条目不承担详细设定，详细内容全部在对应绿灯条目中。
  绿灯索引:
    - 人类: 当剧情涉及国家、城市、贵族、法师、商会、学院、骑士团时触发
    - 半人马族: 当剧情涉及草原、驿路、骑兵、重体型异种族、部族商路时触发
    - 人鱼族: 当剧情涉及中央岛、海湾、暗礁、沉船、海中救援、潮汐遗迹时触发
    - 精灵族: 当剧情涉及森林腹地、长寿种族、魔法工坊、守林体系、边站贸易时触发
    - 矮人: 当剧情涉及矿城、锻造、武具、工坊契约、地下都市时触发
    - 兽人: 当剧情涉及荒原、战团、边贸护卫、部族政治、强战力群体时触发
    - 龙裔: 当剧情涉及边境堡、血统家系、威压、火山遗迹、古誓约时触发
    - 翼族: 当剧情涉及高地、空桥、信使、空域巡察、风系文化时触发
    - 魔族与魔人: 当剧情涉及裂隙地带、废墟城、异质魔法、危险盟友、污名化群体时触发
    - 亚人混血支系: 当剧情涉及港口混居区、翻译、掮客、夹缝生存、跨族通路时触发
