---
职业体系:
  主流职业:
    - 骑士: 负责护卫、军务、领地秩序，重视荣誉、家徽与武装训练。
    - 法师: 依赖魔素天赋与系统训练，常见于学院、宫廷与研究塔。
    - 神官: 服务神殿、修道院与边境庇护所，兼具仪式、医疗与仲裁职责。
    - 游侠: 活跃于森林、边境与荒野，擅长追踪、侦查与地形利用。
    - 冒险者: 跨地区接单，涉及护卫、遗迹探索、魔物清理与情报运输。
    - 商人与经纪人: 控制货物流向、情报流向与城镇生活资源。
  高流动职业:
    - 雇佣兵
    - 学院学徒
    - 炼金工匠
    - 舞台艺人
    - 翻译与向导
