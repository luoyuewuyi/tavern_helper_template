---
变量更新规则:
  场景:
    标题:
      check:
        - 进入新事件、阶段切换或核心冲突变更时更新
    副标题:
      check:
        - 用一句话概括当前推进目标、压迫感或局势变化
    状态徽章:
      type: string[]
      check:
        - 只保留高频摘要信息，如日期、时段、天气、身份或特殊状态
        - 维持 3~6 个，避免塞入长句说明
    候选动作:
      type: |-
        {
          标签: string;
          描述: string;
          类型: string;
          目标: string;
          需要确认: boolean;
          命令类型: 'travel-region' | 'travel-place' | 'event' | 'npc';
        }[]
      check:
        - 默认保留 2~5 个高质量动作
        - 文案必须直接体现“点下去会发生什么”
        - 高风险动作才标记 `需要确认=true`

  主角:
    金钱:
      type: number
      range: 0~无上限
    声望:
      type: number
      range: -100~100
    体力:
      type: number
      range: 0~100
    欲望波动:
      type: number
      range: 0~100
    实际接受度:
      type: number
      range: 0~100
      check:
        - 只能由明确选择、信任变化、安全感变化和边界是否被尊重来推动
    周期:
      type: |-
        {
          当前天数: number;
          周期长度: number;
          状态: '经期' | '经后' | '排卵前' | '排卵期' | '黄体期';
          身体感受: string;
        }
    偏好摘要:
      check:
        - 属于稳定设定，除非玩家明确调整，否则不要频繁改写

  地图:
    当前区域:
      check:
        - 只有实际移动到新地区时才更新
    当前区域文案:
      check:
        - 用一句话概括该区域当前最重要的氛围或功能
    已发现地区:
      type: |-
        {
          名称: string;
          摘要: string;
          是否当前: boolean;
          目标: string;
        }[]
      check:
        - 初次抵达、被可靠告知或拿到正式地图时加入
        - `是否当前=true` 只能出现一个

  地点:
    名称:
      check:
        - 每次场景切换都应更新到更具体的落点
    所属城镇:
      check:
        - 与地点和地区变化保持一致
    候选动作:
      type: 与场景.候选动作相同
      check:
        - 用于地点面板，不需要和场景动作完全相同，但必须服务当前地点

  成员:
    列表:
      type: |-
        {
          姓名: string;
          种族: string;
          职业: string;
          外观摘要: string;
          好感: number;
          信任: number;
          吸引: number;
          边界尊重度: number;
          关系状态: string;
          当前评价: string;
          是否正式承诺: boolean;
          头像: string | null;
          目标: string;
        }[]
      check:
        - 好感、信任、吸引、边界尊重度独立更新
        - 关系推进必须与正文事件相符，不得无因跳级

  法则:
    分组:
      type: |-
        {
          名称: string;
          描述: string;
          项目: 法则项[];
        }[]
      check:
        - 前端写回时只改 `项目[].值`
        - AI 不得擅自删改分组结构、项目类型和选项集合
