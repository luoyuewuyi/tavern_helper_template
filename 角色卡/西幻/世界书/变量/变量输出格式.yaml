---
变量输出格式:
  rule:
    - `<UpdateVariable>` is optional and should only appear after `<maintext>`, `<option>`, and optional `<sum>`
    - if no state changes happened in this turn, omit `<UpdateVariable>` entirely
    - you must output the update analysis and the actual update commands together at the end of the reply
    - the update commands follow a JSON Patch-like array and only support: replace, delta, insert, remove, move
    - only write paths that still exist in the current schema
    - every path must start directly from `/场景` `/主角` `/地图` `/地点` `/成员` `/法则`, never prepend `/stat_data`
    - never write legacy paths such as /世界, /遭遇, /关系, /名录, /系统
    - only patch fields that actually changed in this turn
    - `候选动作` 的 value 必须是完整动作对象数组，绝不能只给字符串数组
    - 新增 `成员.列表` 时，必须使用当前 schema 字段：`姓名 / 种族 / 职业 / 外观摘要 / 好感 / 信任 / 吸引 / 边界尊重度 / 关系状态 / 当前评价 / 是否正式承诺 / 头像 / 目标`
    - never use ad-hoc member fields such as `外貌印象` `对主角第一态度` `可提供价值` `所属势力`
  format: |-
    <UpdateVariable>
    <Analysis>$(IN ENGLISH, no more than 80 words)
    - ${time progress analysis}
    - ${whether dramatic state shifts are justified}
    - ${which UI-facing fields must update after this reply}
    </Analysis>
    <JSONPatch>
    [
      { "op": "replace", "path": "/场景/标题", "value": "..." },
      { "op": "replace", "path": "/场景/状态徽章", "value": ["...", "..."] },
      { "op": "replace", "path": "/主角/体力", "value": 72 },
      { "op": "delta", "path": "/主角/金钱", "value": -15 },
      { "op": "replace", "path": "/地图/当前区域", "value": "..." },
      { "op": "replace", "path": "/地点/候选动作", "value": [] },
      { "op": "replace", "path": "/成员/列表/0/当前评价", "value": "..." },
      { "op": "replace", "path": "/法则/分组/0/项目/0/值", "value": 35 }
    ]
    </JSONPatch>
    </UpdateVariable>
