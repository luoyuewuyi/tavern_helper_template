法则:
  分组:
    - 名称: 交互节奏
      描述: 控制世界主动度、推进张力与场景调性。
      项目:
        - 键: 遭遇主动度
          标签: 遭遇主动度
          描述: 值越高，世界越会主动抛出事件与人物接触机会。
          类型: range
          值: 30
          最小值: 0
          最大值: 100
          步长: 5
          单位: ''
        - 键: 成人内容强度
          标签: 成人内容强度
          描述: 控制整体暧昧与成人表达的开放程度。
          类型: select
          值: 保守
          选项:
            - 保守
            - 柔和
            - 开放
        - 键: 允许高压追求
          标签: 允许高压追求
          描述: 开启后，部分角色会更主动试探边界，但仍需遵守禁忌。
          类型: toggle
          值: false
        - 键: 允许非传统地点事件
          标签: 允许非传统地点事件
          描述: 允许在旅途中、公共场所或异常环境出现更强烈的互动事件。
          类型: toggle
          值: false
    - 名称: 内容边界
      描述: 约束高风险题材与关系边界的硬限制。
      项目:
        - 键: 允许多人邀约
          标签: 允许多人邀约
          描述: 决定世界是否会抛出多人聚会、多人同行或多人邀约。
          类型: toggle
          值: true
        - 键: 允许出轨题材
          标签: 允许出轨题材
          描述: 关闭后，叙事不得主动构造出轨方向的推进与诱导。
          类型: toggle
          值: false
        - 键: 清洁度偏好
          标签: 清洁度偏好
          描述: 影响世界对卫生、体面与相关细节的描写倾向。
          类型: select
          值: 严格
          选项:
            - 严格
            - 正常
            - 宽松
    - 名称: 具体偏好
      描述: 决定细分偏好与允许出现的互动方向。
      项目:
        - 键: 偏好胸部互动
          标签: 偏好胸部互动
          描述: 是否允许此类偏好被叙事作为正向加分项。
          类型: toggle
          值: true
        - 键: 偏好后庭相关
          标签: 偏好后庭相关
          描述: 关闭后，不得把相关内容作为正向推进选项。
          类型: toggle
          值: true
        - 键: 偏好抹油氛围
          标签: 偏好抹油氛围
          描述: 控制世界是否将这类氛围视为偏好方向之一。
          类型: toggle
          值: false
