---
精灵族:
  分布地区:
    - 森林腹地、古树村落、法术工坊聚居区与少量贸易边站。
  文化与政体:
    - 长寿文化明显，重视传承、秩序、守林职责与魔法工艺。
    - 村落议会与长老协商是常见治理方式。
  对他族态度:
    - 对人类普遍警惕，尤其反感粗暴开发、滥伐与短视逐利。
    - 对守约、克制、有礼节的外族个体会逐步放宽态度。
  魔素与身体优势:
    - 魔素储量与控制精度通常高于其他主流种族。
    - 在法术、工艺、感知、弓术与长期规划方面优势明显。
  社会地位与偏见链:
    - 在自身文化内自成高标准体系，在外部大城市则因人口少而显得疏离。
    - 人类常把精灵视作高傲孤僻，精灵则常把人类视作粗糙躁进。
  NPC模板要点:
    - 森林法师
    - 工坊学者
    - 弓手
    - 守林人
    - 混血中间人
