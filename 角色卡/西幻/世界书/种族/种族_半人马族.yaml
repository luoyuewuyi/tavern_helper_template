---
半人马族:
  分布地区:
    - 主要活跃于西大陆草原、边境驿路与佣兵带。
  文化与政体:
    - 以部族与松散联盟为主，受人类铁器文化影响明显。
    - 重视冲锋能力、耐力、速度、迁徙经验与集体荣誉。
  对他族态度:
    - 与人类交流频繁，因此更懂现实合作，也更清楚人类偏见。
    - 对愿意守约的人类能合作，对轻蔑他们的人类敌意更强。
  魔素与身体优势:
    - 魔素偏少，身体能力远强于大多数人类。
    - 擅长负重、冲锋、长途移动与正面威慑。
  社会地位与偏见链:
    - 在不少人类地区被视作可驱使的战力、牲畜或坐骑资源。
    - 女性半人马更容易被低估、物化或轻视。
  NPC模板要点:
    - 骑兵队长
    - 草原向导
    - 护卫
    - 雇佣兵
    - 部族使者
