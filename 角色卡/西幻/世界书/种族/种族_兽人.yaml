---
兽人:
  分布地区:
    - 西大陆草原边缘、荒原要塞、迁徙带与资源争夺区。
  文化与政体:
    - 部族与战团并行，讲究战力、荣誉、猎获与内部资源分配。
    - 不同部族差异很大，不能一概而论。
  对人类与他族态度:
    - 对侵占者、欺骗者与奴役者敌意很强。
    - 对强者、守信者与共同战斗者更容易产生尊重。
  魔素与身体优势:
    - 身体素质、恢复力、战场爆发与野外求生能力优秀。
  社会地位与偏见链:
    - 常被人类简化成野蛮族，真实内部有严密秩序、禁忌与谈判逻辑。
  NPC模板要点:
    - 战士
    - 斥候
    - 边贸护卫
    - 部族继承人
