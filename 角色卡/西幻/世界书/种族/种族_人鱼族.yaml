---
人鱼族:
  分布地区:
    - 主要活跃于中央岛外海、暗礁海湾、深水海沟与潮汐浅滩。
  文化与政体:
    - 聚落小而封闭，以海域记忆、族群传统与口传规则维系。
    - 对外来者的判断以海域安全与族群利益为优先。
  对他族态度:
    - 对陆生族群整体谨慎，先观察再决定接触深度。
    - 对救援对象、迷航者与海域入侵者的态度差异极大。
  魔素与身体优势:
    - 水魔素亲和度极高，水下感知、潜游与海域行动能力极强。
    - 上岸后行动能力受限，但并非失去全部交流或判断能力。
  社会地位与偏见链:
    - 常被人类神秘化、妖怪化或误传成危险海妖。
    - 因接触稀少，人类社会对他们的认识常夹杂误解和夸张传闻。
  NPC模板要点:
    - 引航者
    - 救援者
    - 海域守望者
    - 遗迹见证者
