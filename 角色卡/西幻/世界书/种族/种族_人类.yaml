---
人类:
  分布地区:
    - 两块大陆的大多数平原、丘陵、港口与王都。
  文化与政体:
    - 王朝、城邦、元老议会、港口联邦并存。
    - 最擅长书写制度、城市治理、税制、军制与跨地区组织。
  对他族态度:
    - 同时存在合作、贸易、轻蔑、剥削与利用。
    - 越是中心化地区，越容易用人类尺度定义其他种族。
  魔素与身体优势:
    - 平均身体与魔素不突出，但人口基数最大，天赋个体上限很高。
    - 少数强者可成长为大法师、名将、圣职者或传奇冒险者。
  社会地位与偏见链:
    - 掌握大多数国家机器、法令解释权与主流叙事权。
    - 经常把其他种族视为边地、附庸、奇观、劳力或异类。
  NPC模板要点:
    - 贵族
    - 法师
    - 商人
    - 骑士
    - 学院派
    - 港口中间人
