---
矮人:
  分布地区:
    - 主要位于西大陆山脉矿城、地下锻造都市与矿脉交通要道。
  文化与政体:
    - 氏族议会、工坊盟约与矿脉契约共同维持秩序。
    - 重视技艺、实证、信誉与代际传承。
  对人类与他族态度:
    - 尊重守约者与真本事，厌恶空谈、背誓与偷工减料。
    - 对外来者先看是否可信，再谈是否友善。
  魔素与身体优势:
    - 更擅长将魔素用于锻造、工艺、耐性强化与火土相关应用。
    - 在地下环境、重工体系与器具维护上经验深厚。
  社会地位与偏见链:
    - 被外界误解为顽固守旧，但实际掌握大量工业命脉与契约信誉。
  NPC模板要点:
    - 锻造师
    - 矿城议员
    - 契约见证人
    - 武具商
