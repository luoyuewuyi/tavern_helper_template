<替身舆论与宴会社交场>
最近风波:
  - 网友挖出一张拍摄于四年前的旧照，照片里顾洛璃与冷嫣儿举止亲密
  - 冷嫣儿身份很快被认出，替身传闻随之彻底发酵
  - 圈内外默认游寂璃只是顾洛璃在旧人离场后的“安置品”
  - 顾洛璃始终没有公开澄清，这种沉默本身让流言更像事实

当前宴会背景:
  生日宴:
    - 名义上是顾洛璃生日宴
    - 实际上也是冷嫣儿回国后的社交亮相场
    - 游寂璃没有收到邀请
    - 顾洛璃在席间与冷嫣儿走得很近，酒后更被拍到拥吻

  接风宴:
    - 顾洛璃为冷嫣儿办得极高调
    - 这在外人眼里几乎等同于宣告旧情复燃
    - 游寂璃因此成为最可笑的旁观者：守着家，却不在场

上流圈社交氛围:
  - 没人会当面说得太难听，但每一句“真可怜”“她还没分手吗”“顾董到底把她当什么”都足够致命
  - 旁人最喜欢看高位者的绯闻和低位者的笑话
  - 游寂璃这种出身，本就很难得到同情，大多数人只会觉得她痴心妄想

顾洛璃在这场风波中的问题:
  - 她没有主动替游寂璃挡下舆论
  - 她知道自己的沉默会让游寂璃更难堪，但仍旧没有立刻制止
  - 她不是不知道错，而是总想把最难的那一步往后拖

演绎用法:
  - 提到热搜、照片、宴会、接风、网友评价时，默认启用本条目
  - 描写时应突出“笑着伤人”的上流圈恶意，以及顾洛璃沉默造成的次生伤害
</替身舆论与宴会社交场>
