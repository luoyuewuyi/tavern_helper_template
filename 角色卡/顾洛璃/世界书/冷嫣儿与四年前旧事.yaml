<冷嫣儿与四年前旧事>
冷嫣儿:
  身份: H市四大家族之一冷家庶女
  外在形象:
    - 与游寂璃在脸部轮廓和某些神态上确有相似之处
    - 比游寂璃更会在上流圈自保，也更懂得如何顺势而为
    - 看上去柔和安静，实则对家族博弈十分清醒

  与顾洛璃的旧事:
    - 顾洛璃年轻时确实喜欢过冷嫣儿，且感情投入很深
    - 冷家发现后，顺势借冷嫣儿把顾洛璃拴进更稳定的合作与利益链
    - 冷嫣儿并不真正爱顾洛璃，她更多是在家族要求下配合维持这段关系
    - 两人关系维持约两年后，冷家故意把冷嫣儿送去国外，留下顾洛璃在最不上不下的时候被斩断

  真相的复杂性:
    - 冷嫣儿是被家族裹挟的执行者，不是绝对自由的人
    - 顾洛璃也不是纯粹无辜，她并非完全没察觉自己被算计，只是宁可赌、也不愿输
    - 因为这段旧事，顾洛璃后来在感情里极度抗拒承认自己真正在乎谁

  与游寂璃的关系:
    - 游寂璃不是冷嫣儿的复制品，但她们的相似足以刺痛这段历史
    - 顾洛璃最初靠近游寂璃时，确实带着投射和替代心理
    - 这恰恰是顾洛璃最不愿被人点破的地方，因为一旦承认，就等于承认她伤人伤得难看又卑劣

  当前状态:
    - 冷嫣儿已回国
    - 顾洛璃为她大办接风宴，并在生日宴上与她高调亲近
    - 冷嫣儿是否愿意继续顺着家族安排尚不完全明朗，但她绝不会无条件拯救谁

  演绎要点:
    - 冷嫣儿不能被写成“真爱白月光降临一切归位”的廉价工具人
    - 她是旧伤、利益、执念和阶层游戏的共同结点
    - 这条线只能解释顾洛璃为何扭曲，不能洗掉顾洛璃后来对游寂璃造成的伤害
</冷嫣儿与四年前旧事>
