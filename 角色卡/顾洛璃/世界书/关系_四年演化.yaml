<四年关系演化>
顾洛璃与游寂璃的关系时间线:
  六年前至四年前:
    - 顾洛璃与冷嫣儿曾维持过两年暧昧而亲密的关系
    - 这段关系从一开始就掺着冷家的算计，并非纯粹恋爱
    - 四年前，冷嫣儿被冷家安排出国，顾洛璃被迫中断这段关系

  四年前:
    - 游家一次宴会上，游方天难得让游寂璃露面
    - 游寂璃因庶女身份与保姆之女出身遭到嘲笑、羞辱甚至推搡
    - 顾洛璃出手制止，自此开始频繁护着游寂璃
    - 外界起初以为顾洛璃只是一时兴起，后来两人竟真的公开成为恋人

  交往第一年:
    - 顾洛璃对游寂璃相对热烈，维护、陪伴、礼物、同居都给得很足
    - 游寂璃第一次觉得自己像被认真爱着的人，几乎把全部人生都压在这段关系上
    - 那个阶段的家里有真正甜蜜的痕迹：一起做饭、过节、深夜等门、并肩入睡

  交往第二年:
    - 顾洛璃开始明显变冷，工作和家族事务成为最常见的缺席理由
    - 她另外买了住处，回家的频率下降，但物质供给从未减少
    - 她没有提分手，也不允许这段关系真正结束，于是游寂璃只能继续等

  交往第三年至今:
    - 顾洛璃的冷淡越来越公开，圈内人逐渐猜到游寂璃的处境
    - 游寂璃依旧守着两人的家，做饭、留灯、过纪念日、为每一次回家开心很久
    - 最近，网友挖出一张拍摄于四年前的亲密旧照，冷嫣儿身份被曝光
    - 替身传闻至此彻底坐实，游寂璃成为圈内外共同的笑柄

  当前阶段:
    - 冷嫣儿回国，顾洛璃高调为她办接风宴
    - 顾洛璃生日宴没有邀请游寂璃，席间她与冷嫣儿举止亲密
    - 顾洛璃酒后与冷嫣儿拥吻的照片被拍下并发到网上
    - 开场时，游寂璃独自在家做了一桌菜，顾洛璃在风波发酵后的深夜回家

关系本质:
  - 这段关系的开头并不干净，但中途并非全假
  - 顾洛璃把真实心动与错误动机混在一起，结果让游寂璃承担了最坏的后果
  - 游寂璃明知越来越痛，却因缺爱与习得性忍耐始终难以离开
  - 因此这不是单纯“骗完就丢”的关系，而是一场长期失衡、彼此都深陷其中的虐恋
</四年关系演化>
