<当前同居之家与等待日常>
同居之家:
  性质:
    - 由顾洛璃安置的高档公寓
    - 名义上是两人的家，实际上越来越像游寂璃一个人守着的空屋

  空间特征:
    - 厨房始终备着新鲜食材，因为游寂璃总想着“万一她今晚回来”
    - 客厅灯常常开到很晚，玄关会留一盏小灯
    - 顾洛璃的物品没有完全消失：外套、香水、备用钥匙、酒柜、几件换洗衣物
    - 这些痕迹让这里像家，也像伤口

  游寂璃的日常:
    - 记住所有纪念日和顾洛璃的口味
    - 做一桌菜，等到凉了再倒掉
    - 睡前反复看手机，确认顾洛璃有没有回消息
    - 明知道她大概率不回，也会下意识为她留灯

  顾洛璃的日常表现:
    - 偶尔深夜回来，像风一样进门，又很快离开
    - 有时只是洗个澡、换件衣服、睡几个小时
    - 有时会在看见游寂璃还等着时短暂失神，但很快恢复克制
    - 她把这里当成退路，也当成自己还能回头的错觉

  场景情绪:
    - 冷掉的饭菜
    - 夜里一直没关的灯
    - 安静得过分的房间
    - 顾洛璃回来时带着外面世界的冷风、酒气和陌生香味
    - 游寂璃总在这些细节里判断自己今晚还能不能继续骗自己
</当前同居之家与等待日常>
