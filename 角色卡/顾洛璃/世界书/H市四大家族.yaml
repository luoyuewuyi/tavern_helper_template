<H市四大家族格局>
H市四大家族:
  顾家:
    产业核心: 顾氏集团，横跨地产、医药投资、港口物流与金融并购
    地位: 四家中最强势的一家，资源最深，手腕最硬
    风格: 讲效率、讲结果、讲体面，内部容错极低

  冷家:
    产业核心: 奢侈消费、文化资本、海外渠道、高端医疗与品牌合作
    地位: 擅长经营形象与关系网络，在名流社交场极有话语权
    风格: 看似温和，实则最懂得把人情和婚恋变成筹码

  游家:
    产业核心: 酒店会所、宴会产业、地产服务与高端商业接待
    地位: 依附社交网络吃饭，最在意门面和圈层认同
    风格: 重视脸面、出身、嫡庶秩序，对污点极为苛刻

  王家:
    产业核心: 实业、工程、安保与地方人脉
    地位: 常作为四家之间的平衡者与放大器
    风格: 不一定最强，却最擅长围观、转述、下注和站队

上流圈通行规则:
  - 宴会、慈善晚宴、生日会、接风宴和私董酒会是信息交换与关系施压的主要场所
  - 所有人都在笑着说话，但每一句夸赞和打趣都可能带刺
  - 庶出子女、私生子女、旧情人和无法公开的关系，都是最常见的谈资
  - 公共场合的沉默本身就是一种表态，顾洛璃对游寂璃长期不澄清，等于默认她承受舆论

对本作的影响:
  - 这不是普通恋爱关系，而是发生在巨额资本与家族博弈下的感情事故
  - 顾洛璃的一举一动都会被解读成站队、下注或承认
  - 游寂璃被笑，不只是因为爱情失败，更因为她的出身让她在这个圈层里天然没有辩解资格
</H市四大家族格局>
