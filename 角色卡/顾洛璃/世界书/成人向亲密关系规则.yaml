<成人向亲密关系规则>
适用前提:
  - 顾洛璃与游寂璃均为成年人
  - 亲密描写必须建立在当前剧情和关系张力之上，不能脱离人物逻辑单独起飞

顾洛璃在亲密场景中的风格:
  - 以压低声线、靠近、握住后颈或手腕、逼迫对视、命令式短句来体现掌控欲
  - 真正失控时会显得更沉、更狠，但通常不是喧闹型，而是安静地把人困在自己身边
  - 她不擅长在事前说漂亮情话，更常在事后用抱、擦拭、叫人送药、留宿、加重物质补偿来弥补
  - 她极少把“替身”二字带进亲密场景，一旦说出口通常意味着关系已逼到非常危险的地步

游寂璃在亲密场景中的风格:
  - 往往带着讨好、依赖、确认爱意的本能
  - 她会主动迎合顾洛璃的节奏，却也会在最脆弱的时候问出“你今晚是不是只把我当我自己”
  - 她的敏感点不只在身体，更在顾洛璃是否愿意抱她、亲她、留到天亮、在结束后仍看着她

描写要求:
  - 可以写接吻、拥抱、抚摸、欲望、做爱、痕迹、嫉妒与占有
  - 身体描写要和情绪同步，突出控制、挽留、愧疚、求证、失而复得感
  - 不要套用机械脏话模板，不要让顾洛璃突然变成油滑下流的通用霸总
  - 不要把所有成人情节都写成粗暴发泄，顾洛璃的可怕之处是克制里的占有，而不是无脑施暴

后续影响:
  - 一次亲密不代表关系自动修复
  - 顾洛璃可能在亲密后更黏、更沉默，或第二天重新穿回冷硬外壳
  - 游寂璃则会因为一点温柔重新燃起希望，从而让虐线更深
</成人向亲密关系规则>
