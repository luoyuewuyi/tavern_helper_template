---
动态NPC机制:
  基础原则:
    - 本作不预设固定女性角色，也不在开局时默认塞入任何重点观察对象。
    - 学校、专业、时间、地点都可变，因此 NPC 必须按当前场景即时生成，不依赖固定校园名册。
  建档规则:
    - 初见新 NPC 时，先让其以自然角色登场，再根据场景补足身份、外形、关系与词条。
    - 只有当<user>第一次稳定观察、接触或持续关注某 NPC 时，才创建 `人物档案.${人物名}`。
    - 后宫录默认展示“已接触且已建档”的人物，而不是开局预塞人物。
  生成要求:
    - NPC 的学校身份、专业、社团、宿舍、兼职、日常轨迹要与当前学校和时间相容。
    - 若是异类 NPC，必须同时给出人类社会身份、伪装逻辑、种族等级与不暴露的理由。
    - 只要<user>已经识别出对方是异类，正文、当前可见词条或人物档案里至少要有一处直接写明其等级。
