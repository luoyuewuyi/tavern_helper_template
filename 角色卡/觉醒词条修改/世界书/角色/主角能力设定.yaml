---
主角能力设定:
  能力名称: 关键词观察/修改能力
  能力基础:
    - <user>能看见人物、少数事件与部分关系背后对应的半透明关键词条。
    - 若目标被能力识别为异类，<user>会额外看到其种族等级标签（D~S）。
    - 关键词条长度不能越改越短到失去原意；修改时必须保留足够语义承载力。
    - 除 S级外，所有改写都必须落在现实可自洽的范围内；高阶现实改写优先通过世界逻辑自发演化兑现，而不是凭空生效。
  修改原则:
    - E级只能修改情绪、心情与气氛倾向，不能碰思想、现实和核心人格，也不能把结果彻底翻成原义反面。
    - D级开始才允许触及思想偏转；C级开始才允许反义改写与短词条增删；B级开始才允许现实层面改写。
    - 若人物词条为“看着文弱其实嗜酒如命”，E级最多把“嗜酒如命”缓和成“爱喝酒”一类；D级可把“抗拒接触”偏转成“愿意接近”；C级才可把“自卑”改成“自信”这类反义词条。
    - 若现实结果需要兑现，例如把“因贫穷而自卑”改成“因中奖而自信”，B级与A级都必须通过彩票中奖、意外遗产、社会评价变化等世界事件自行补出因果，而不是直接空降结果。
  六级能力边界:
    E级:
      - 只能接触后修改。
      - 单次最多修改3字。
      - 只能修改情绪与心情，只能做轻微偏转，不能改现实、思想，也不能彻底反转。
      - 当前等级内成功修改3次后升至D级。
    D级:
      - 3米内可修改。
      - 单次最多修改5字。
      - 可修改情绪心情与思想，允许偏转，但不能直接改成反义词。
      - 当前等级内成功修改5次且其中异类1次后升至C级。
    C级:
      - 5米内可修改。
      - 单次最多修改7字。
      - 可修改情绪心情与思想，也可直接改成反义词。
      - 可新增和彻底删除7字以内的词条。
      - 当前等级内成功修改5次且其中异类3次后升至B级。
    B级:
      - 10米内可修改。
      - 单次最多修改12字。
      - 可修改现实，但结果必须通过世界逻辑自发演化兑现，不能凭空造物。
      - 当前等级内成功修改7次且其中异类5次后升至A级。
    A级:
      - 50米内可修改。
      - 本等级不再限制可使用次数，可连续高频改写。
      - 现实层改写仍应保持世界自洽，不能直接把常识写崩。
      - 当前等级内异类成功修改10次后升至S级。
    S级:
      - 言出法随，可直接改写人物、事件、环境与无机物。
      - 可跨越原本的事件链限制，但仍需保证结果明确、可描写、可承接。
  自我约束:
    - <user>严格控制能力使用频率和影响范围，不让能力暴露给校方、政府或异类势力。
    - 即便达到最高等级，<user>依然只是危险世界里的普通个体，面对军队和有组织的异类力量依旧脆弱。
