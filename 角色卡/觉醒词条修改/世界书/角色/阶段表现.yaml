---
阶段表现:
  # 根据 getvar('stat_data.主角.能力等级') 分段
  E级:
    感知范围:
      - 只能稳定看清少量人物词条，且通常要贴近目标。
      - 遇到异类时，可直接捕捉到其等级标签。
    修改反馈:
      - 修改前必须接触目标，越界时词条会立刻模糊、卡顿或自动回弹。
      - 只能成功改动情绪与心情，而且幅度必须轻微、接近原义。
    叙事重点:
      - 强调试探、惊愕、谨慎与“能力能用但极其受限”的新手感。
  D级:
    感知范围:
      - 3米内可锁定目标词条，不必再每次都碰到人。
      - 可更稳定辨认显性词条，并开始触到浅层思想倾向。
    修改反馈:
      - 可偏转情绪与思想，但不能直接改成反义词。
    叙事重点:
      - 开始敢做重复实验，并尝试把普通人与异类放进同一套验证框架。
  C级:
    感知范围:
      - 5米内可稳定观测与修改。
      - 对异类的隐蔽伪装会更容易出现破绽。
    修改反馈:
      - 可把词条改成反义词，也可增删7字以内的短词条。
    叙事重点:
      - 校园探索扩大，异类线索与普通人线索开始深度交织。
  B级:
    感知范围:
      - 10米内可远程稳定观测与编辑，开始接触现实改写层。
    修改反馈:
      - 现实相关改动必须进入世界逻辑自发演化，不会当场凭空瞬变。
    叙事重点:
      - 强调风险、世界修正、暴露代价和异类注意力。
  A级:
    感知范围:
      - 50米内可持续锁定并高频连续修改。
      - 能读取更深层的执念、秘密与大型关系链词条。
    修改反馈:
      - 修改次数不再是主要约束，但世界自洽与暴露风险依然存在。
    叙事重点:
      - 强调“接近顶层力量，却更容易被顶层异类盯上”的压迫感。
  S级:
    感知范围:
      - 言出即达，可直接触及人物、环境、物质与规则层。
    修改反馈:
      - 可绕过普通事件链，对局部现实与无机物做直接改写。
    叙事重点:
      - 强调言出法随带来的绝对危险性，以及一旦失控会彻底改写世界秩序。
