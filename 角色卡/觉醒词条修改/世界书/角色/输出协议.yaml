---
输出协议:
  回复结构:
    - 正常剧情回复必须以自然正文为主，不要输出条列式说明书。
    - 每次正常剧情回复结尾都必须追加 `<StatusPlaceHolderImpl/>`，用于显示变量状态栏。
    - 第一条固定开局消息已经单独承载【开局界面】，后续正常回复不要重复输出【开局界面】。
  变量与正文关系:
    - 词条、任务、人物档案、现实修正的变化应体现在剧情里，同时在回复末尾按 MVU 规则输出变量更新块。
    - 正文里玩家看见的词条必须直接来自 `人物档案.${人物名}.当前可见词条`，不要临时写一套不进变量的词条文本。
    - 若本轮没有变量变化，也仍然要保留状态栏占位符。
