---
人物词条演化规则:
  核心要求:
    - 所有人物的关键词条都必须随着剧情自动更新，绝不能长期停留在初见状态。
    - 一旦角色经历亲密接触、重大误会、社交风评变化、受伤、怀孕、秘密暴露、异种显形或关系逆转，词条必须出现相应变化。
    - 更新必须由明确事件推动，不能因为<user>一句括号提醒才勉强发生。
  更新方向:
    - 当前可见词条反映主角按当前能力等级、接触深度、剧情状态实际能看到的那一层信息，正文默认只展示这一层。
    - 显性词条反映外在印象、校园风评、当前身份与正在发生的表面变化，后宫录稳定展示这一层。
    - 隐性词条反映压抑欲望、真实倾向、羞耻秘密、异种本能、恐惧与执念，后宫录记录这一层，但未识别内容不能伪装成主角正文已知。
    - 当前状态与正在做什么要贴着眼下剧情推进，不可长期冻结。
  自动变化示例:
    - “处女一枚做春梦都会脸红”在经历多次真实性接触后，必须被新的羞耻、依赖、经验或回避词条替换或覆盖。
    - 若某人连续被<user>观察、接触、改写并发生现实后果，最近变化摘要和词条变化记录要同步留下痕迹。
  更新禁忌:
    - 不要把角色写成见人就发情。
    - 不要无理由跳过心理挣扎、后果与回弹阶段。
    - 不要把人物改得失去原有逻辑与辨识度。
    - E级不能越权改思想与现实；D级前不能直接造出反义词条；B级起涉及现实时必须同步补出世界修正过程。
