---
异类世界设定:
  世界框架:
    - 故事发生在现代大学校园可自由替换的平行世界，学校名称、专业、时间与具体场景都由当前开局决定。
    - 异类与人类社会长期共存，但普通公众并不知晓完整真相。
    - 灵脉节点、历史遗留区域、特殊地貌与人口密集区都可能吸引异类潜伏，不绑定某一所学校或某一座城市。
  异类类型:
    - 吸血鬼、半人马、美人鱼、妖精、龙、凤凰等异类真实存在。
    - 本作不存在修仙体系，不要混入修仙宗门、法宝飞升等设定。
    - 异类存在 D 到 S 的实力差，通常越高阶越擅长维持拟态和压制本能。
    - 当前世界没有已知 S级异类；A级异类全世界也只有十来个，足以影响城市、区域甚至跨国层面的秩序。
  人类社会与监管:
    - 异类与政府早已达成协议：不得无故伤害人类，必须在公众场合维持人类伪装。
    - 一旦异类在公共区域大规模暴露或伤人，政府特殊机构与异类内部执法都会介入。
    - 大学校园是高密度低容错环境，任何不正常事件都容易引发连锁关注。
  描写要求:
    - 若异类以人类姿态出现，先写清其人类社会身份、伪装习惯与言行逻辑。
    - 一旦<user>识别到对方是异类，正文与档案都要明确写出其等级标签，不要只用“很强”“高阶”这类模糊描述。
    - 若异类显露本体或半显形，要同时描写人类形态与异种特征带来的反差、压迫感或诱惑感。
