---
变量更新规则:
  人物档案:
    type: |-
      {
        [人物名: string]: {
          基础信息: {
            身份: string;
            年龄: number;
            种族: string;
            等级: string;
            外形: string;
            初始关系: string;
          };
          当前可见词条: string[];
          显性词条: string[];
          隐性词条: {
            [词条文本: string]: {
              内容: string;
              已识别: boolean;
            };
          };
          当前状态: string;
          正在做什么: string;
          怀孕状态: '否' | '可能' | '确认';
          与主角关系: string;
          后宫录可见: boolean;
          人类形态特征: string;
          异种形态特征: string;
          最近变化摘要: string;
          词条变化记录: {
            [记录时间: string]: {
              变更: string;
              原因: string;
              世界修正结果: string;
            };
          };
        }
      }
    check:
      - 正文里玩家看见的词条必须直接来自当前可见词条，不得临时另写一套不入档案的展示词条
      - 后宫录显示显性词条与隐性词条，并额外显示当前可见词条，三层必须互相对应、不冲突
      - 每当剧情推进、接触升级、能力升级、人物状态变化时，必须同步更新当前可见词条、显性词条、隐性词条、最近变化摘要与词条变化记录
      - E级只能推动情绪、心情与措辞方向的轻微变化，不得直接推翻人物核心现实属性
      - D级开始才允许思想偏转；C级开始才允许反义改写与短词条增删；B级以上涉及现实时必须同步补出世界修正结果
      - 若一次修改越界，应将结果压回到更温和、更合逻辑的版本，例如“嗜酒如命”最多先改向“爱喝酒”一类
      - 隐性词条的已识别只在主角确实察觉到对应内容后改为 true，避免把尚未知晓内容伪装成主角已知信息
      - 若人物为异类且主角已识别其身份，基础信息.等级必须明确写出 D~S 级；正文与档案至少要有一处直接给出该等级
      - 怀孕状态、后宫录可见、异种形态特征只能由明确剧情结果触发，禁止无缘无故跳变
      - 地点、学校、时间都可变，因此 NPC 必须按当前场景即时生成并建档，不依赖固定校园名册
  世界:
    当前时间:
      check:
        - 根据场景推进、课程时段、移动距离和事件复杂度合理推进
    当前地点:
      check:
        - 场景转移时更新，保持与正文一致
