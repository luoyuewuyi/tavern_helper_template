---
变量更新规则:
  现实修正队列:
    type: |-
      {
        [修正编号: string]: {
          目标人物: string;
          被修改词条: string;
          目标结果: string;
          修正方式: '事件链兑现' | '小范围即时生效';
          当前阶段: '待观察' | '酝酿中' | '兑现中' | '已完成' | '失败回弹';
          是否允许即时兑现: boolean;
          剧情说明: string;
        }
      }
    check:
      - 只有在能力系统.允许现实改写为 true 时才允许新增队列
      - B级默认使用事件链兑现，通过事故、舆论、误会、受伤、形象崩塌、中奖、遗产等合理过程逐步实现
      - A级可在更大范围连续推动现实偏转，但仍必须让世界自己补出因果链，不得凭空造物
      - S级才允许把局部现实或无机物直接写成“小范围即时生效”
      - 若目标结果过于夸张、缺乏逻辑支点或会立即暴露能力，应标记失败回弹而不是强行实现
  世界:
    校园公开事件:
      type: |-
        {
          [事件名: string]: {
            描述: string;
            热度: number;
          }
        }
      check:
        - 当现实修正开始影响校园舆论、社团风评、受伤事故或异类相关新闻时新增或更新
    异类暴露风险:
      type: number
      range: 0~100
      check:
        - 它是全局背景态势值，只在全局异类事件、政府搜查、公共事故升级时缓慢变化
        - 不要把它当成玩家日常频繁跳动的即时风险条
