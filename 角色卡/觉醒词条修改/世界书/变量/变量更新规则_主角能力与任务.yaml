---
变量更新规则:
  主角:
    能力等级:
      type: enum('E' | 'D' | 'C' | 'B' | 'A' | 'S')
      check:
        - E→D 需要当前等级内成功修改3次
        - D→C 需要当前等级内成功修改5次且其中异类1次
        - C→B 需要当前等级内成功修改5次且其中异类3次
        - B→A 需要当前等级内成功修改7次且其中异类5次
        - A→S 只看当前等级内异类成功修改10次，不额外要求普通成功次数
        - 升级后当前等级进度清零，不累计到下一阶
        - S为最终级，任何情况下都不能再升级
    暴露值:
      type: number
      range: 0~100
      check:
        - 它表示能力使用痕迹被他人察觉、怀疑、记录、追踪的累计风险，不是羞耻值、不是犯罪值、也不是异类敌意值
        - 普通观察通常不涨，极特殊场景最多 +1
        - 低调成功修改通常不涨或 +1
        - 在监控、人群中心、校方注意、异类注视下使用能力时才明显上涨
        - 失败修改、现实修正失控、异常被连续察觉时中幅上涨
        - 低调一段时间、合理掩饰、场景切换或成功转移注意力时可小幅下降
        - 单次变化默认限制在 0~3，只有重大事故才允许更高
    成功修改次数:
      type: number
      range: 0~999
      check:
        - 只有成功完成一次符合当前等级限制的修改才 +1
        - 失败修改、越界修改、被系统压回但未真正生效的不计数
        - 它是全局累计成功次数，只用于回顾与展示，不再单独决定升级
    当前等级进度:
      type: |-
        {
          成功修改: number;
          异类修改: number;
        }
      check:
        - 只统计当前等级内的成功修改
        - 目标为异类且修改成功时，成功修改与异类修改都 +1
        - 目标为普通人时，只成功修改 +1
        - 升级结算完成后清零，作为下一等级的新进度
    修改统计:
      type: |-
        {
          普通人: number;
          异类: number;
          现实修正: number;
        }
      check:
        - 成功修改普通人、异类或现实修正成功时分别累加
        - 这些统计是全局累计值，不因升级清零
    当前目标:
      check:
        - 根据当前正在观察的人物、正在尝试的修改或即将验证的能力边界更新
  能力系统:
    当前等级限制:
      check:
        - 必须与当前能力等级完全一致，不得出现与等级冲突的描述
        - 若主角升级，需同步刷新限制文案与权限边界
        - E级只能改情绪心情，不能改思想、现实，也不能彻底反转
        - D级开始允许在3米内改情绪与思想，但不可直接改为反义词
        - C级开始允许7字内反义改写，并可新增或彻底删除7字内短词条
        - B级开始允许10米内改现实，且现实结果必须通过世界逻辑自发演化兑现
        - A级开始允许50米内高频连续修改
        - S级为言出法随，可改万物含无机物
    单次最大改字数:
      type: number
      range: 3~999
      check:
        - E级 3 字，D级 5 字，C级 7 字，B级 12 字
        - A级与S级不再设置硬性字数上限
    最大作用距离:
      type: string
      check:
        - E级为接触，D级 3米，C级 5米，B级 10米，A级 50米，S级言出即达
    必须身体接触:
      type: boolean
      check:
        - 仅 E级 为 true，D级起保持 false
    允许短距观察修改:
      type: boolean
      check:
        - D级起为 true，表示进入非接触距离修改
    允许修改思想:
      type: boolean
      check:
        - E级为 false，D级起为 true
    允许新增词条:
      type: boolean
      check:
        - 仅 C级及以上为 true
    允许删除词条:
      type: boolean
      check:
        - 仅 C级及以上为 true
    允许现实改写:
      type: boolean
      check:
        - 仅 B级及以上为 true
        - 即使为 true，S级前也不得直接无视世界逻辑瞬间完成大幅现实变化
    现实小范围即时生效:
      type: boolean
      check:
        - 仅 S级 为 true；B级与A级仍以世界逻辑演化兑现为主
    允许修改无机物:
      type: boolean
      check:
        - 仅 S级 为 true
    可见异类等级:
      type: boolean
      check:
        - 只要目标被识别为异类，就应让主角直接看到其 D~S 等级
    即时生效阈值:
      type: string
      check:
        - 当前固定为 S，不允许在 S级 前用“言出即成”处理无机物或大尺度现实
