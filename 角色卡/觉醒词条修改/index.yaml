扩展字段:
  正则:
    - 正则名称: '[不发送]去除变量更新'
      id: 6fb4d2e2-fb6f-463b-b9c3-e2647a7fd241
      启用: true
      查找表达式: /<UpdateVariable>(?:(?!.*<\/UpdateVariable>).*$|.*<\/UpdateVariable>)/gsi
      内容: ''
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: false
        仅格式提示词: true
      最大深度: 3

    - 正则名称: '[折叠]变量更新中'
      id: 52264b14-02b0-4b6d-bae7-7a3b4027bd5c
      启用: true
      查找表达式: /<UpdateVariable>(?!.*<\/UpdateVariable>)\s*(.*)\s*$/gsi
      内容: |-

        <details>
        <summary>变量更新中{{random::.::..::...}}</summary>
        $1
        </details>
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

    - 正则名称: '[折叠]完整变量更新'
      id: 0dc983a6-1423-4ea5-ac8f-82d427630af1
      启用: true
      查找表达式: /<UpdateVariable>\s*(.*)\s*<\/UpdateVariable>/gsi
      内容: |-

        <details>
        <summary>变量更新情况</summary>
        $1
        </details>
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

    - 正则名称: '[界面]状态栏'
      id: 48b4f94f-4426-4ff9-8628-d8f446610b85
      启用: true
      查找表达式: <StatusPlaceHolderImpl/>
      内容: |-
        ```
        <body>
        <script>
        $('body').load('https://testingcf.jsdelivr.net/gh/StageDog/tavern_helper_template/dist/觉醒词条修改/界面/状态栏/index.html')
        </script>
        </body>
        ```
      来源:
        用户输入: false
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

    - 正则名称: '[界面]开局界面'
      id: f95b5fa7-a1db-4424-9af3-d7ea5a1f0cb2
      启用: true
      查找表达式: 【开局界面】
      文件: 正则/开局界面
      来源:
        用户输入: false
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

