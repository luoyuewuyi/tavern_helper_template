---
变量更新规则:
  世界:
    难度:
      type: enum(简单, 普通, 困难, 地狱)
      lock_rule: |-
        仅在玩家首次发言（游戏开局）时可以更改：
        - 如果玩家首句消息中明确指定难度，则设置为该难度
        - 如果玩家未指定，保持初始值"普通"
        - 首次互动后，难度锁定，整局游戏不可再更改
      effect:
        - 简单：NPC态度偏友善，坏事较少发生，恢复速度快
        - 普通：NPC态度正常，剧情平衡
        - 困难：NPC态度偏恶意，陷阱和危机更多，恢复速度慢
        - 地狱：NPC近乎全部敌意，处处充满算计，生存极为艰难
    当前时间:
      format: YYYY-MM-DD HH:MM
      check:
        - 根据剧情推进合理推算时间流逝
        - 重要事件、场景转换时更新时间
    当前地点:
      check:
        - 主角移动到新地点时更新
        - 需要明确标注区域层级（上层区/中层区/下层区/城市外围）和具体地点
    所在阶层:
      type: enum(上层区, 中层区, 下层区, 城市外围)
      check:
        - 仅在主角实际进入不同阶层区域时更新
    近期事务:
      type: |-
        {
          [事务名: string]: string; // 事务描述
        }
      check:
        - 记录需要完成的任务、危机、机遇等
        - 完成后从列表中移除，新增事务时及时添加
        - 保持5-8项活跃事务

  主角:
    生命值:
      type: number
      range: 0~100
      check:
        - 受到伤害时合理扣减（轻微-5~15，中等-15~30，重伤-30~50）
        - 休息、治疗时恢复
        - 机械改造程度高可减少伤害
        - 抗击打能力影响腹部攻击伤害
    身体状态:
      check:
        - 基于当前生命值、受伤部位描述整体状态
        - 需要体现机械义体和药剂强化的影响
    腹部状态:
      check:
        - 受到腹部攻击时详细描述状态变化
        - 抗击打能力影响恢复速度和受损程度
        - 描述需包含：红肿程度、淤青范围、肌肉状态等
    心情:
      type: number
      range: 0~100
      check:
        - 根据事件、互动、环境变化调整 ±(5~15)
        - 快感值高时可能影响心情
    快感值:
      type: number
      range: 0~100
      check:
        - 女性被击打腹部时会获得快感，根据设定合理增加
        - 自然衰减
        - 影响对腹部打击的反应
    货币:
      type: number
      check:
        - 交易、工作、掠夺时更新
        - 不同阶层货币量级差异巨大
    物品栏:
      type: |-
        {
          [物品名: string]: {
            描述: string;
            数量?: number;  // 默认为 1
          }
        }
      check:
        - 获取、消耗、丢弃物品时更新数量
        - 数量归零后该条目不再显示
        - 物品描述需体现赛博朋克世界观特色
    装备.${义体|武器|防具|植入物|药剂}:
      check:
        - 安装、更换、损坏时更新
        - 需要描述名称和具体效果
        - 高级装备需要符合主角阶层和经济能力

  NPC:
    type: |-
      {
        [姓名: string]: {
          身份: string;
          对主角态度: string;
          内心OS: string;
          当前状态?: string;
        }
      }
    check:
      - 每次与NPC互动后更新态度和内心OS
      - 【难度影响】根据世界.难度调整NPC态度倾向：
        - 简单：好人较多，NPC态度偏友善，愿意帮助主角
        - 普通：好坏参半，NPC态度正常，保持世界观一致性
        - 困难：坏人较多，NPC态度偏恶意，容易算计主角
        - 地狱：几乎全是坏人，NPC极度阴险狡诈，随时可能背叛
      - NPC设定倾向：勾心斗角、阴险狡诈、心狠手辣（程度受难度影响）
      - 离开场景后不再更新该NPC，除非再次出现
