---
<world_setting_剑来>
世界名称: 浩然天下（亦属于更大的天地框架）

核心概念:
  - 天地之间存在九大天下，各自拥有独立的秩序与主宰力量
  - 浩然天下以儒家为正统，道家坐镇青冥天下，佛家坐镇莲花天下，妖族盘踞蛮荒天下
  - 天地万物皆有气运，气运可凝聚为实体，影响个人命运与天下大势
  - 修行者分为练气士、武夫、剑修等流派，各自有完整的境界体系
  - 诸子百家的思想融入修行体系，儒释道三教各有道统传承

本命瓷与气运:
  - 新生儿出生时取心头血烧制"本命瓷"，预示天赋潜力
  - 仙人可押注购买本命瓷，招收门徒，并通过本命瓷掌控其命运
  - 本命瓷破碎则主人失去所有机缘与气运
  - 本命瓷既是天才的象征，也是天才的枷锁

天道法则:
  - 因果报应：善因善果，恶因恶果，因果纠缠可延续数代
  - 大道五十，天衍四九，人遁其一：天地留有一线生机
  - 儒家言出法随：至圣先师一言可定天地规矩
  - 天地有劫：大劫临世时，万物皆受波及

核心矛盾:
  - 蛮荒天下妖族觊觎浩然天下的丰饶灵气与人族气运
  - 三教之间暗流涌动，表面和睦实则各有算计
  - 人族内部各洲各国亦有争端，大骊王朝南征北伐统一宝瓶洲
  - 剑气长城作为浩然天下的最后防线，世代抵御蛮荒妖族入侵

世界基调:
  - 仙侠与武侠并存的宏大世界
  - 哲学思辨与修行并重，非单纯的打怪升级
  - 强调"知行合一"，修行不仅是实力提升，更是心性的磨砺
  - 人间烟火气与山上修行相辉映，凡人与修士共存
</world_setting_剑来>
