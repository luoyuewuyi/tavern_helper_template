---
<cultivation_system_剑来>
修炼总纲:
  - 天地之间修行者众多，主要分为练气士、武夫、剑修三大流派
  - 练气士以吸纳天地灵气为主，武夫以锤炼肉身为主，剑修以剑证道
  - 各流派境界体系独立，但可兼修（如陈平安兼修武道与练气）
  - 境界越高，寿元越长，飞升境修士可活数千年

练气士境界（十四境）:
  初窥境: 初步感知天地灵气，开辟体内窍穴
  洞虚境: 灵气入体，开辟气府
  观海境: 气海成形，可驾驭法宝
  龙门境: 鲤鱼跃龙门，实力质变，可御剑飞行
  金丹境: 凝结金丹，寿元大增，山上宗门核心战力
  元婴境: 金丹碎裂，元婴凝聚，可神游天外
  玉璞境: 返璞归真，浑然天成，一洲之地的顶尖强者
  仙人境: 超脱凡俗，长生不老，执掌一方天地法则
  飞升境: 已至人间巅峰，可尝试飞升上界
  十四境: 传说中的至高境界，可与天地大道共鸣，搬山倒海

武夫境界（十境）:
  第一境·淬体境: 以药浴拳法淬炼肉身，筋骨如铁
  第二境·通脉境: 打通体内经脉，气血奔涌
  第三境·远游境: 内气外放，可远距攻击，气息绵长
  第四境·金身境: 铸就不坏金身，刀枪难入
  第五境·归真境: 武道返璞归真，一拳可碎金丹修士护体罡气
  第六境·神到境: 武意通神，出拳可引动天地异象
  第七境·山巅境: 武道登顶，一拳开山，一脚断江
  止境第一境: 拳意自生，天地为我所用
  止境第二境: 归真之上的归真，人剑合一的极致
  止境第三境: 天人合一，武道至极，可与飞升境修士抗衡

剑修体系:
  定义: 练气士中以剑证道的修行流派，战力远超同阶练气士
  特点:
    - 拥有本命飞剑，与心神相通
    - 一人一剑即可敌十余同阶修士
    - 剑气长城的剑修是浩然天下抵御蛮荒妖族的主力
  剑修境界: 与练气士相同，但每一境的战力数倍于普通练气士
  著名剑修: 陈清都（老大剑仙）、宁姚、阿良、陈平安

三教修行:
  儒家:
    - 诚意正心→立言立德→三不朽→亚圣→至圣
    - 言出法随，以浩然正气为根基
    - 文圣一脉、礼圣一脉等各有传承
  道家:
    - 天人感应，顺应自然，炼丹服药
    - 坐镇青冥天下，抵御化外天魔
  佛家:
    - 修佛证果，金身罗汉→菩萨→佛陀
    - 坐镇莲花天下，镇压阴间冥府
</cultivation_system_剑来>
