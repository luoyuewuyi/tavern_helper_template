<location_剑气长城>
剑气长城:
  位置: 浩然天下与蛮荒天下的交界处
  概述: 一座绵延千万里的防御工事，世代阻挡蛮荒天下妖族入侵浩然天下
  特征:
    - 浩然天下的最后防线，数万年来剑修世代镇守
    - 老大剑仙陈清都坐镇其上
    - 剑修是长城的主要战力，宁姚等天才辈出
    - 隐官一脉负责情报和暗杀
    - 蛮荒大战中，长城经历了最惨烈的攻防战
    - 最终在危机时刻整体飞升至第五座天下
  重要地点:
    - 城头：剑修驻守和战斗之处
    - 隐官府邸：陈平安曾任隐官之所
    - 酒铺和坊市：长城上的生活设施
  氛围: 苍凉壮烈，剑气冲天，但剑修们依旧乐观豁达
  关联角色: [陈清都,宁姚,阿良,陈平安,徐东来]
</location_剑气长城>
