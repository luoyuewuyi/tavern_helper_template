<location_骊珠洞天>
骊珠洞天:
  位置: 宝瓶洲，大骊王朝境内
  概述: 三千年前一条真龙在此陨落，截取龙运形成的特殊福地，陈平安的家乡
  特征:
    - 汇聚众多机缘的福地，诸多仙人在此押注本命瓷
    - 泥瓶巷是陈平安出生成长之地
    - 齐静春曾以一己之力坐镇此地，守护镇中百姓
    - 后来骊珠洞天崩塌，化为宝瓶洲的一部分
  重要地点:
    - 泥瓶巷：陈平安幼年居住之地
    - 齐先生的私塾：齐静春教书育人之所
    - 窑口：陈平安曾在此烧制瓷器谋生
  氛围: 小镇烟火气十足，凡人与潜伏的高人共居，看似平凡实则暗流涌动
  关联角色: [陈平安,齐静春,宁姚,李宝瓶]
</location_骊珠洞天>
