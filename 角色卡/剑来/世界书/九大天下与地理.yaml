---
<geography_剑来>
九大天下:
  浩然天下:
    简介: 人族主要栖息地，儒家正统所在，九洲八海，修士与凡人并存
    特征: 灵气充沛，宗门林立，王朝更迭，是三教共同守护的天下
  蛮荒天下:
    简介: 妖族盘踞之地，灵气稀薄，大妖横行
    特征: 妖族觊觎浩然天下，数万年来不断入侵，与浩然天下之间以剑气长城相隔
  青冥天下:
    简介: 道教领地，道家正统所在
    特征: 拥有三十六洞天、七十二福地，抵御化外天魔的渗透入侵
  莲花天下:
    简介: 佛教领地，几乎人人信佛
    特征: 拥有一千八百零八座净土佛国，镇压不断抬升的阴间冥府
  其他天下: 尚有第五座天下等更多天下存在，但鲜为人知

浩然天下各洲:
  宝瓶洲:
    特征: 故事的起点所在，主角陈平安的家乡骊珠洞天位于此
    重要势力: 大骊王朝、青萍剑宗、龙泉剑宗
    备注: 大骊宋氏统一宝瓶洲，实力最强的王朝之一
  桐叶洲:
    特征: 位于宝瓶洲以东，宗门众多
    重要势力: 太平山、玉圭宗
    备注: 蛮荒入侵时损失惨重
  北俱芦洲:
    特征: 武风彪悍，修士好斗，散修众多
    重要势力: 火龙真人、北俱芦洲各大仙家
    备注: 陈平安曾在此游历
  南婆娑洲:
    特征: 靠近蛮荒天下，常年战乱
    备注: 与蛮荒妖族接壤，战事频繁
  中土神洲:
    特征: 浩然天下的中心，最为繁华强盛，顶尖宗门汇聚
    重要势力: 文庙、兵家、百家争鸣
    备注: 天下第一洲，实力最为雄厚
  流霞洲: 浩然天下的一部分，详情较少
  皑皑洲: 浩然天下的一部分，气候寒冷，北部大洲
  金甲洲: 浩然天下的一部分，曾沦陷于蛮荒妖族
</geography_剑来>
