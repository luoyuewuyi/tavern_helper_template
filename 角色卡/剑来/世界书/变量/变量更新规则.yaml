---
变量更新规则:
  天下:
    当前时间:
      format: "浩然历YYYY年 季节 时辰"
      check:
        - 根据剧情推进合理更新时间
        - 季节为春/夏/秋/冬
        - 时辰使用古代十二时辰制（子/丑/寅/卯/辰/巳/午/未/申/酉/戌/亥）
    当前地点:
      check:
        - 场景转换时更新为具体地名
        - 格式为"洲名·区域·具体位置"
    当前事件:
      check:
        - 概括当前主要事件或正在发生的事情
        - 事件结束后更新为新事件
  user:
    姓名:
      check:
        - 通常不变，除非{{user}}主动更改称呼
    年龄:
      type: number
      check:
        - 随时间推移合理增长
        - 修行者寿元延长后年龄增长可能放缓
    性别:
      check:
        - 固定不变
    境界:
      check:
        - 根据修炼进展合理调整，不允许跳跃式提升
        - 突破境界需要有合理的剧情铺垫和机缘
    修炼流派:
      check:
        - 初次选择修炼道路时确定
        - 可选练气士/武夫/剑修/兼修等
    气运:
      type: number
      range: 0~100
      check:
        - 根据因果机缘变化 ±(1~5)
        - 做善事、获得机缘时增加
        - 作恶、破坏因果时减少
        - 气运过低会招致灾厄
    物品栏:
      type: |-
        {
          [物品名: string]: {
            描述: string;
            数量?: number;  // 默认为 1
          }
        }
      check:
        - 获取、消耗、丢弃物品时更新数量
        - 数量归零后该条目不再显示
        - 描述需包含物品的外观和用途
  人物关系:
    ${角色名}:
      境界:
        check:
          - 根据该角色的实际修为填写
          - 角色突破时更新
      好感度:
        type: number
        range: -100~100
        check:
          - 根据互动内容调整 ±(1~10)
          - 仅在该角色当前能察觉到{{user}}的行为时才更新
          - 善意互动增加，恶意行为降低
      当前状态:
        check:
          - 描述该角色当前在做什么
          - 该角色出场或被提及时更新
      内心活动:
        check:
          - 描述该角色对{{user}}的当前想法
          - 该角色出场或发生相关事件时更新
          - 需符合角色性格和当前好感度
