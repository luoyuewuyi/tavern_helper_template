---
<factions_剑来>
儒家:
  总纲: 浩然天下的正统力量，以文庙为最高机构，统御天下书院
  文庙: 儒家最高圣地，至圣先师坐镇，言出法随
  文圣一脉:
    简介: 儒家重要传承，门下弟子有崔瀺、齐静春、左右、陈平安等
    特点: 强调知行合一，弟子各有独特的道路选择
  山崖书院: 宝瓶洲的重要儒家书院，齐静春曾坐镇于此

道家:
  总纲: 坐镇青冥天下，在浩然天下亦有广泛传承
  特点: 天人感应，炼丹修真，追求长生，青冥天下三十六洞天七十二福地

佛家:
  总纲: 坐镇莲花天下，在浩然天下亦有寺院传承
  特点: 修佛证果，金身不坏，莲花天下一千八百零八座净土佛国

兵家:
  总纲: 诸子百家之一，以兵法战阵为修行根基
  特点: 将修行者的战争智慧融入天地法则

重要宗门:
  大骊王朝:
    位置: 宝瓶洲
    特色: 军事强国，由宋氏皇族统治，国师崔瀺辅政，统一宝瓶洲
  太平山:
    位置: 桐叶洲
    特色: 桐叶洲顶尖宗门之一，黄庭任山主，曾遭大难后重振
  青萍剑宗:
    位置: 宝瓶洲
    特色: 宝瓶洲的剑修宗门
  落魄山:
    位置: 宝瓶洲
    特色: 陈平安的家业所在，由一座不起眼的小山发展为宝瓶洲重要势力

蛮荒妖族:
  总纲: 盘踞蛮荒天下，大妖统率万妖，数万年来不断入侵浩然天下
  特点:
    - 妖族修行体系与人族不同，以吞噬灵物和修炼妖法为主
    - 拥有飞升境乃至十四境的大妖
    - 蛮荒天下元气稀薄，因此妖族一直觊觎浩然天下
  与浩然天下的冲突: 剑气长城是两界的分界线，大战持续万年
</factions_剑来>
