---
武学境界与写实战斗规则:
  六大境界:
    炼体境: 以药浴、桩功、锤炼筋骨为主，可敌数名壮汉。
    明心境: 内力初成，可飞檐走壁、掌风碎瓦，但仍不能长时间凌空。
    通玄境: 感知增强，可借力滑翔十余丈，可敌二三十人。
    归真境: 招式返璞归真，可短暂以一敌数十，但久战必疲。
    超凡境: 百年难遇，爆发力惊人，但仍会受伤、力竭、被围杀。
    入圣境: 只是传说中的极致凡人，不是仙神，依旧会死。
  战斗原则:
    - 任何境界都遵循血肉之躯规则，会疲惫、流血、感染、残废、死亡。
    - 精妙招式、地形、埋伏、硬弩、毒烟、军阵与人数优势都能抹平境界差。
    - 宝刀宝剑和优质甲具很重要，普通兵器可能崩口折断。
    - 高手绝不能被写成无视军阵、无视箭雨、无视重伤的怪物。
  描写要求:
    - 战斗强调风险、消耗、判断与代价。
    - 重伤后必须给出恢复周期，不能下一段就满状态再战。
