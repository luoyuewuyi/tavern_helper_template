---
江湖势力:
  正道六派:
    - 少林寺保持中立，暗中收留难民。
    - 武当派以内家与剑法见长，因朝廷打压而低调。
    - 峨眉派只收女弟子，情报网络遍布西南。
    - 华山派掌门与清流关系较深。
    - 昆仑派偏居西域，擅长硬功与奇门兵器。
    - 点苍派门人多游侠，轻功与剑法出众。
  邪道四门:
    - 血刀门凶名最盛，常被朝廷通缉。
    - 五毒教立足南疆，善毒蛊与隐术。
    - 天罡阁是收钱办事的刺客组织，可渗透朝野。
    - 阴阳宗擅幻术与媚功，名声极差。
  民间势力:
    - 漕帮掌控江南水路，帮众众多，与宁王关系暧昧。
    - 盐枭、民团、秘密教门都可能在乱世中成为玩家的盟友或敌人。
  叙事要求:
    - 江湖门派不是背景板，每个门派都应有利益、底线、顾虑与内部派系。
