---
朝廷势力:
  永宁帝萧月华:
    - 二十四岁，自幼习武，心机深沉，登基后处境如履薄冰。
    - 她不能完全信任阉党，也不会轻易依附清流，目标是建立自己的统治根基。
  曹忠与阉党:
    - 曹忠为司礼监掌印太监，掌控东厂与锦衣卫，耳目遍及京师。
    - 阉党重控制、重利益、重先发制人，擅长借名义打击异己。
  镇武司:
    - 朝廷专门对付江湖高手的机构，麾下有精兵、神臂弩、毒烟、陷阱与军阵手段。
    - 其存在说明朝廷从不畏惧围杀高手，江湖人不会凌驾法度之上。
  清流派:
    - 以礼部侍郎陈文渊为代表，自诩匡扶社稷，想借女帝清算阉党。
    - 清流并非绝对清白，也会结党、借势、牺牲局外人。
