---
变量更新规则:
  世界:
    年号:
      check:
        - 仅在跨年或改元等极重大事件后更新
    日期:
      check:
        - 每次旅行、等待、休息、战斗收尾或剧情明确推进后更新
        - 不得无缘无故跳过长时间，若跨度较大需在正文交代原因
    时段:
      check:
        - 随晨昏、夜宿、赶路、会面、潜行等行动自然推进
    天气:
      check:
        - 可随季节、地域与天气变化调整，但应与当前地点合理对应
    所在区域:
      check:
        - 跨区域旅行、押送、逃亡、调任后更新
    所在地点:
      check:
        - 场景切换时更新，应精确到可互动地点
    局势摘要:
      check:
        - 用一句话概括当前最重要的天下形势或眼前处境
        - 只在局势或所处危机发生可感知变化时更新
    朝局热度:
      type: number
      range: 0~100
      check:
        - 宫变、密诏、查抄、藩王异动、朝臣站队明显变化时调整
        - 常规波动以 ±3~8 为主，剧变才可更高
    战乱热度:
      type: number
      range: 0~100
      check:
        - 边患、民乱、兵马调动、屠村、攻城、征粮等事件后调整
    江湖风闻:
      type: |-
        {
          [风闻名: string]: string;
        }
      check:
        - 收录与当前阶段最相关的江湖传言、朝野消息、民间议论
        - 最多保留4~7条活跃风闻，过旧内容可移除
    通缉风险:
      type: number
      range: 0~100
      check:
        - 杀官、斗殴、露财、暴露身份、被盯梢、被悬赏时上升
        - 洗脱嫌疑、伪装成功、离开案发地、获得庇护后下降

  玩家:
    身份自述:
      check:
        - 玩家自然表明身份、伪装或改口时更新
    来历:
      check:
        - 玩家明确交代师承、出身、经历时补全
    当前阵营倾向:
      check:
        - 明确投效、背离、交易或立场表态后更新
    当前目标:
      check:
        - 玩家表明新的短期核心意图后更新
    境界:
      check:
        - 只有在长期修炼、顿悟、秘传、重创跌境等重大变化后才更新
        - 不得因一两场普通战斗轻率越境
    外伤:
      check:
        - 受伤、包扎、化脓、痊愈、留疤时更新
    内伤:
      check:
        - 真气紊乱、经脉受损、调息恢复、中毒解毒时更新
    体力:
      type: number
      range: 0~100
      check:
        - 奔袭、久战、负重、熬夜、饥寒时下降，休整后回升
    精神:
      type: number
      range: 0~100
      check:
        - 惊惧、谋划、负罪、受压、彻夜不眠时下降
        - 安全休息、情绪缓和、目标明确后回升
    银两:
      type: number
      check:
        - 住宿、饮食、贿赂、雇佣、购置、赏银、卖货时更新
        - 任何显著变化都应有来源与去向
    名望:
      type: number
      range: -100~100
      check:
        - 行侠、立功、扬名、救人、被传颂时上升
        - 若行事隐秘则不应平白增长
    恶名:
      type: number
      range: 0~100
      check:
        - 滥杀、勒索、勾结邪道、背信、通敌、犯禁后增长
    装备:
      type: |-
        {
          主武器: { 名称: string; 描述: string };
          副武器: { 名称: string; 描述: string };
          护具: { 名称: string; 描述: string };
          衣着: { 名称: string; 描述: string };
          随身器具: { 名称: string; 描述: string };
        }
      check:
        - 购置、缴获、损毁、修补、丢弃或伪装时更新
    携带物:
      type: |-
        {
          [物品名: string]: {
            描述: string;
            数量?: number;
          }
        }
      check:
        - 获取、消耗、交易、损坏、丢失后更新
        - 数量归零时移除
    关键标签:
      type: |-
        {
          [标签名: string]: string;
        }
      check:
        - 用于记录玩家当前最关键的身份状态、处境状态、生存策略与特殊印记
        - 保持精简，避免堆满冗余短语

  关系:
    关键人物:
      type: |-
        {
          [人物名: string]: {
            立场: string;
            信任: number;
            敌意: number;
            评价: string;
          }
        }
      check:
        - 只有发生直接接触、被调查、受邀、受赏、受惩、遭背刺等事件后才更新
        - 信任与敌意不必互斥，但都应有理由
        - 单次变化通常不超过 ±15，极端事件除外
    所在门派或组织:
      type: |-
        {
          名称: string;
          身份: string;
          评价: string;
        }
      check:
        - 玩家正式加入、挂名、被收留、被逐出、叛离时更新
    当前同行者:
      type: |-
        {
          [同行者名: string]: {
            身份: string;
            信任: number;
            状态: string;
            评价: string;
          }
        }
      check:
        - 临时同行、护送、结伴、分道扬镳、背叛或死亡时更新

  势力:
    type: |-
      {
        [势力名: string]: {
          活跃度: number;
          对玩家态度: string;
          动向: string;
        }
      }
    check:
      - 活跃度反映当前舞台上的动作强弱，不是简单好坏
      - 对玩家态度只在势力察觉玩家或与玩家产生利益关系后更新
      - 动向应概括该势力最近最重要的一个动作

  任务:
    主线:
      type: |-
        {
          [任务名: string]: {
            说明: string;
            目标: string;
            奖励: string;
            惩罚: string;
            状态: string;
          }
        }
      check:
        - 主线保持1~3条核心焦点，不要泛滥
    支线:
      type: |-
        {
          [任务名: string]: {
            说明: string;
            目标: string;
            奖励: string;
            惩罚: string;
            状态: string;
          }
        }
      check:
        - 只在接触具体人物、地点或势力后新增
    悬赏:
      type: |-
        {
          [悬赏名: string]: {
            说明: string;
            目标: string;
            奖励: string;
            惩罚: string;
            状态: string;
          }
        }
      check:
        - 适用于缉凶、护镖、寻物、剿匪等公开事务
    密令:
      type: |-
        {
          [密令名: string]: {
            说明: string;
            目标: string;
            奖励: string;
            惩罚: string;
            状态: string;
          }
        }
      check:
        - 适用于暗线委托、密探命令、见不得光的交易

  剧情记录:
    最近大事件:
      type: |-
        {
          [事件名: string]: string;
        }
      check:
        - 记录影响天下格局或当前篇章的重要事件
        - 保持2~5条近期关键事件
    近期遭遇:
      type: |-
        {
          [遭遇名: string]: string;
        }
      check:
        - 记录玩家最近亲历的场景、冲突、会面、损失与收获
    已触发旗标:
      type: |-
        {
          [旗标名: string]: boolean;
        }
      check:
        - 用于记录已发生且会影响后续分支的关键条件
    已知情报:
      type: |-
        {
          [情报名: string]: string;
        }
      check:
        - 只有在玩家通过目击、偷听、买情报、审问、调查等渠道获知后新增
        - 若情报被证伪，可更新内容或移除
