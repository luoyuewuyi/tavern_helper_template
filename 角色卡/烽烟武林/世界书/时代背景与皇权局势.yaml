---
时代背景与皇权局势:
  核心:
    - 时代为大靖王朝永宁元年，立国二百三十一年，正值内忧外患并发的衰世。
    - 先帝半年前暴毙于乾清宫，御医称丹药中毒，宫中则盛传有人下毒。
    - 长公主萧月华以皇太女身份即位，改元永宁，是大靖开国以来第一位女帝。
    - 女帝登基后，老臣以女子不可为君为由反对，但阉党与清流为各自利益暂时扶持她，朝局只维持脆弱平衡。
  皇权格局:
    - 曹忠掌控司礼监、东厂、锦衣卫，把持朝政十余年，想继续借新帝控局。
    - 女帝文武兼修，暗中培养亲信，试图摆脱阉党控制并收拢镇武司与边军支持。
    - 燕王萧景琰拥兵幽燕，野心外露，与北戎暗通款曲。
    - 宁王萧景珩富可敌国，广蓄江湖门客，立场摇摆，以利为先。
    - 端敏长公主萧月容表面闲居京城，暗中与燕王往来，意图内外呼应。
  叙事要求:
    - 朝局斗争应以试探、拉拢、栽赃、抄家、密诏、查案、逼宫等现实手段展开。
    - 不要把皇权争斗写成轻率儿戏，也不要让任何一方毫无代价地瞬间通吃全局。
