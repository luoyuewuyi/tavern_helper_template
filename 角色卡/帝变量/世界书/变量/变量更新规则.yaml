---
变量更新规则:
  当前时间:
    年号:
      format: 字符串（如"昭盛"）
    年:
      type: number
      check:
        - 每满12个月，年份+1
    月:
      format: 元月/二月/.../腊月
      check:
        - 随剧情时间推进更新
    日:
      format: 初一/初二/.../三十
    时辰:
      format: 子/丑/寅/卯/辰/巳/午/未/申/酉/戌/亥
  当前地点:
    type: string
    check:
      - 根据剧情场景变化及时更新

  粮草:
    存粮:
      type: number
      unit: 万石
      check:
        - 每月自动增加：年净收入/12
        - 赈灾、军需等事件会消耗存粮
        - 阶段：极度充盈≥400，中度充足250-399，基本平衡100-249，中度短缺30-99，饥荒危机<30
    年净收入:
      type: number
      unit: 万石/年
      check:
        - 政策可永久改变此值
        - 如【清丈田亩】完成后增加20%

  库银:
    存银:
      type: number
      unit: 万两
      check:
        - 每月自动增加：年净收入/12
        - 各类开支会消耗库银
        - 阶段：富甲天下≥800，用度宽裕400-799，紧平衡150-399，赤字财政50-149，国库空虚<50
    年净收入:
      type: number
      unit: 万两/年
      check:
        - 政策可永久改变此值
        - 如【整顿盐课】完成后增加25%

  兵力:
    type: number
    range: 0~100
    unit: 万人
    check:
      - 募兵、战损、裁军时调整
      - 阶段：雄师劲旅≥60，武备充足40-59，堪用之师25-39，捉襟见肘10-24，名存实亡<10

  军心:
    type: number
    range: 0~100
    check:
      - 根据战事胜负、军饷发放、将领任免、边境局势调整 ±(3~8)
      - 仅在军队相关事件发生时更新
      - 阶段：誓死效忠81-100，士气高昂61-80，基本服从41-60，怨声载道21-40，随时哗变0-20

  民心:
    type: number
    range: 0~100
    check:
      - 根据赈灾救济、税赋轻重、官吏贪腐、天灾人祸调整 ±(3~8)
      - 仅在民生相关事件发生时更新
      - 阶段：万民拥戴81-100，安居乐业61-80，怨言暗生41-60，民怨沸腾21-40，揭竿而起0-20

  腐化:
    type: number
    range: 0~100
    check:
      - 根据反腐举措、监察力度、人事任免、利益触动调整 ±(3~8)
      - 越低越好，表示吏治清明
      - 阶段：吏治清明0-20，贪弊渐生21-40，系统腐败41-60，无可救药61-80，王朝癌变81-100

  科技:
    type: number
    range: 0~100
    unit: 点
    check:
      - 根据研发投入、工部项目、外邦引进、人才培养调整 ±(1~5)
      - 阶段：开创新局≥50，稳步积累30-49，基础夯实15-29，停滞不前5-14，文明倒退<5

  威望:
    type: number
    range: 0~100
    check:
      - 根据决策英明、赏罚分明、外交成就、危机处理调整 ±(3~8)
      - 仅在皇权相关事件发生时更新
      - 阶段：天威浩荡81-100，权威树立61-80，威福自用41-60，令出不行21-40，名存实亡0-20

  当前政策:
    type: |-
      [{
        名称: string;
        进度: number;  // 0-100
        剩余月数: number;
        效果说明: string;
      }]
    check:
      - 推行新政策时添加条目
      - 每月进度推进，剩余月数-1
      - 完成后（剩余月数=0）触发效果，并从列表移除

  当前事件:
    type: string
    check:
      - 随剧情发展更新当前事件名称
      - 事件结束后及时清空或更新
