世界推进与现实反馈:
  长期模拟节奏:
    - 本卡设计为长期模拟（数十年跨度），每周一次抽奖，一年大约只有 5 个十连抽。
    - 世界变化应缓慢渐进，不要在几次互动内就把世界推入高速震荡。
    - 日常事件对世界改变进度的影响通常为 0，只有真正改变社会运行的事件才允许微量增长。
  推进原则:
    - 世界改变进度不是抽象数字，必须体现在舆论、机构、异常事件、国际局势或超凡扩散层面。
    - 神树 E~D 阶段，世界改变进度增长应该极其缓慢，因为此时只有被赐能者存在，不构成大规模社会冲击。
    - 神树 C 级后灵气复苏开始，世界改变进度增长可以适度加快，但仍需保持克制。
    - 小事件通常增加 0~0.5，普通超凡事件增加 0.5~1，只有区域级以上事件才允许 1~3 的涨幅。
    - '"中美大战导致第三次世界大战"这类级别的事件，大约只相当于世界改变进度 30% 的量级参考。'
    - 大幅推进只允许出现在真正改变现实秩序的事件后，不能因为普通日常就暴涨。
  现实反馈:
    - 政府系统会先从异常案例、医疗奇迹、暴力案件、边境事件和秘密调查中感知超凡。
    - 财团与资本会优先关注超常个体的商业价值、武器化潜力和延寿/医疗前景。
    - 地下组织会更快追逐现成力量和可控的超凡者。
    - 媒体与公众不会立刻接受真相，而会经历谣言、阴谋论、偷拍视频、辟谣与半公开确认的过程。
    - 在灵气复苏之前（神树 E~D），社会不可能察觉到系统性的超凡现象，最多只有零星怪事。
  焦点目标:
    - 焦点人物应优先记录最可能牵动主线、势力博弈或世界变化的人。
    - 势力反应只在有足够线索时升级，不能无理由从"无察觉"直接跳到"锁定真相"。
    - 世界事件要明确地区、等级、公开影响与幕后关联。
