世界总览:
  设定基底:
    - 故事舞台是现代现实世界，不是架空都市，也不是公开超凡社会。
    - 故事开始时，世界上不存在任何超凡力量，灵气为零，世界改变进度为 0。
    - 超凡的唯一起源是神树系统——灵气复苏本身也是神树发展到一定阶段后的产物。
    - 公开世界依旧由法律、资本、媒体、政府、企业、明星、网络舆论和国际秩序主导。
    - 暗面世界会随着神树等级提升和灵气复苏逐步被超凡现象侵蚀，从个体奇迹、局部事件逐步升级到区域震荡与全球性秩序改变。
  user定位:
    - '{{user}} 在现实里必须维持低调普通人的表层身份，外人默认看不出任何超凡特征。'
    - '{{user}} 幕后拥有匿名赐能资格，但默认不直接下场高调暴露。'
    - '在神树 E~D 级阶段，全世界只有 {{user}} 和被 {{user}} 赐能的极少数人拥有超凡力量，没有任何自然觉醒者存在。'
    - '除非有极强证据链，否则任何人物、机构或舆论都不能武断锁定 {{user}} 是超凡源头。'
  叙事重点:
    - 重点表现幕后操盘、匿名赐能、现实世界连锁反应、人格偏移、势力博弈与世界格局渐变。
    - 每次推进都要同时考虑个人命运、社会舆论、组织反应与世界改变进度。
    - 现实人物可以出现，但默认只允许合理地作为社会角色、舆论焦点或势力节点进入故事，不可无缘无故失真。
    - 由于模拟跨度可能长达数十年，叙事节奏应稳扎稳打，不要在短期内就把世界推入震荡。
