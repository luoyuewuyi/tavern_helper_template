神树与灵气复苏:
  核心法则:
    - 故事开始时，现实世界不存在任何超凡力量，世界改变进度为 0。
    - 灵气复苏的本质来源是神树的成长，没有神树就没有灵气，也不会有自然觉醒者。
    - '全世界唯一的超凡起源是 {{user}} 的系统与神树，在灵气复苏出现之前，只有 {{user}} 和 {{user}} 主动赐能的人拥有超凡能力。'
  灵气复苏阶梯（与神树等级严格绑定）:
    E级神树:
      - 世界完全无灵气，无自然觉醒者。
      - '超凡力量仅存在于 {{user}} 和 {{user}} 赐能的目标身上。'
    D级神树:
      - 灵气仍然极度稀薄，自然觉醒不会出现。
      - '超凡力量依然只限于 {{user}} 和被赐能者。'
    C级神树:
      - 灵气复苏正式开始，极少数天赋异禀者可能自然觉醒。
      - 自然觉醒者的能力上限不超过 E级。
      - 自然觉醒的出现频率极低，可能全球范围内只有个位数到两位数。
    B级神树:
      - 灵气扩散明显加速，自然觉醒者数量开始增长。
      - 自然觉醒者的能力上限不超过 D级。
    A级神树:
      - 灵气覆盖全球大部分地区，自然觉醒已成为无法完全隐藏的现象。
      - 自然觉醒者的能力上限不超过 C级。
    S级神树:
      - 灵气全面复苏，自然觉醒数量达到高峰。
      - 自然觉醒者的能力上限不超过 B级。
      - '自然觉醒者若要突破 B级上限，必须经由 {{user}} 解锁，否则永远无法再进一步。'
      - 自然觉醒者永远不可能达到 S级，无论任何手段。
  觉醒上限铁律:
    - '自然觉醒者的能力等级绝对不可超过当前神树等级对应的上限。'
    - '被 {{user}} 赐能的目标不受此上限约束——他们的等级由赐予的灵魂碎片/能力本身决定。'
    - '即使到了 S级神树，自然觉醒也不可能产生 S级能力者。S级只存在于 {{user}} 赐予和 {{user}} 自身保留的能力中。'
    - '自然觉醒者突破 B级的唯一途径是 {{user}} 主动解锁，这一规则不可被任何NPC、势力或事件绕过。'
  神树本质:
    - 神树存在于梦境世界，是诸天力量与现实世界之间的中枢接口。
    - 被赐予力量者、因灵气复苏而觉醒者，可能会在梦中看到神树。
    - 神树既是抽奖媒介，也是世界灵气扩散与最终升格的核心锚点。
  喂养规则:
    - '{{user}} 可将不想保留的抽奖结果献祭给神树。'
    - 同级能力喂给神树，默认提升当前生长状态 1%。
    - 每高一级，喂养收益翻倍。
    - 例如 E级神树吃 D级提升 2%，吃 C级 4%，吃 B级 8%，吃 A级 16%，吃 S级 32%。
    - 当神树升级到 D级后，再喂 S级时最高提升 16%；后续更高阶段继续遵循"越强越有用，但存在阶段衰减"的逻辑。
  自然成长:
    - 神树每周会自然成长 1%。
    - 若世界灵气复苏更快、被赐能者更多、世界改变进度更高，神树成长可被合理加速。
  终局规则:
    - 神树升到 S级后会结果。
    - '若 {{user}} 吃下果实，会走向"宇宙之主"级别的终局升格。'
    - 终局不是立刻完成的按钮，而是世界被改写到极深层后才有资格触发的结果。
