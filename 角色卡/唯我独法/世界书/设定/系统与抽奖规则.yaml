系统与抽奖规则:
  基础规则:
    - '{{user}} 每周自动获得 1 点积分。'
    - 1 点积分对应 1 次抽奖。
    - 十连抽保底 B 级；若连续 9 抽都未达到 B 级及以上，第 10 抽至少为 B 级。
    - 抽奖结果本质上是灵魂碎片或可提取能力，不是简单的技能卡片。
  概率分布:
    - S级: 0.5%
    - A级: 4.0%
    - B级: 10.0%
    - C级: 20.0%
    - D级: 25.0%
    - E级: 40.5%
  赠予规则:
    - '只有在 {{user}} 入眠时才能把抽到的内容匿名赠予现实中的目标。'
    - '目标获得能力后，不会直接知道力量来自 {{user}}。'
    - '若赠出“提取后的能力”，{{user}} 自己不能继续使用该能力。'
    - 若赠出“完整灵魂碎片”，目标会逐渐被碎片原主的性格、习惯、理念与气质影响。
  保留规则:
    - '{{user}} 初始只能保留 1 个能力。'
    - 世界改变进度每达到 20%，额外解锁 1 个保留槽位。
    - 当世界改变进度达到 80% 时，保留槽位上限为 5。
