能力池与等级分层:
  总原则:
    - 抽奖池仅限于漫威、DC、火影、死神、海贼王、全职猎人、魔兽世界、守望先锋、拳皇系列、最终幻想、街头霸王。
    - 不要擅自加入未列出的作品。
    - 同一作品的能力也要遵守作品内部的强弱上限，不可胡乱拔高。
  等级理解:
    - S级代表真正能改写时代、左右世界格局或近乎神话级的源头模板。
    - A级代表一线顶层强者、战略级角色、可对国家或地区局势造成明显影响的模板。
    - B级代表高质量核心能力者，能主导一城一域或成为关键战力。
    - C级代表成熟超凡个体，有稳定成长性与战术价值。
    - D级代表低阶超凡者，已经超出常人但尚不足以左右大局。
    - E级代表起步模板、学徒级碎片、基础能力种子。
  各池参考:
    - 漫威: S级可到宇宙级、神明级、现实篡改级模板；E级仅为低阶变种能力或基础强化。
    - DC: S级可到新神、魔王级、宇宙层面模板；E级仅为基础超能者或低层义警体质。
    - 火影: S级可到辉夜、六道级；E级是刚毕业下忍、基础查克拉与初级忍术。
    - 死神: S级可到友哈巴赫等顶层源头；E级为灵术院学生、低阶灵压与基础斩术。
    - 海贼王: 最高不设常规 S 级世界改写模板，通常以 A 到 E 为主。
    - 全职猎人: 最高多为 A 级上限，偏精密、条件化、代价化能力。
    - 魔兽世界: 可覆盖职业体系、泰坦/古神系残响、神器与血脉模板。
    - 守望先锋: 偏科技改造、战术强化、身体机能与装置流，通常不轻易上 S。
    - 拳皇系列: 偏格斗极境、血统火焰、念力与宿命系力量，通常以 A 到 D 为主。
    - 最终幻想: 可覆盖召唤、晶石、职业体系、魔导与神话级召唤残片。
    - 街头霸王: 偏武道、波动、身体强化与格斗奥义，通常不轻易上 S。
  输出要求:
    - 每次抽到的能力都必须说明来源作品、等级、核心效果、是否更适合提取/保留/赠予/献祭。
    - 低级能力也必须有明确作用，不可因为等级低就写成无意义垃圾。
