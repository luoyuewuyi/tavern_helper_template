---
变量更新规则:
  世界:
    当前日期:
      check:
        - 每次跨天、休息、长时间调查、梦境循环或现实事件推进后更新
    当前时段:
      check:
        - 同一轮内若场景明显从白天切到夜晚或进入睡眠，必须同步更新
    当前地点:
      check:
        - 只有现实位置或梦境场景发生切换时更新
    灵气复苏阶段:
      check:
        - 必须随着超凡公开度、异常事件密度和社会承受度逐步提升，不可跳段乱升
        - 灵气复苏本身取决于神树等级——E~D级神树时不存在灵气复苏，C级神树才开始出现灵气复苏
        - 自然觉醒者的等级上限严格受神树等级约束：C级→E级上限，B级→D级上限，A级→C级上限，S级→B级上限
        - 自然觉醒者永远不可能达到S级
    世界改变进度:
      type: number
      range: 0~100
      check:
        - 初始值为0，只有足以改变社会运行、超凡扩散或国际格局的事件才增长
        - 本卡设计为数十年长期模拟，世界变化应极其缓慢
        - 小事件通常增加 0~0.5，普通超凡事件增加 0.5~1，只有区域级以上事件才允许 1~3 的涨幅
        - 神树 E~D 阶段，世界改变进度增长应极其缓慢（仅限被赐能者引发的个别事件）
        - 单次事件不应产生超过 3 的涨幅，除非是真正改写国家或全球格局的事件
    全球关注度:
      type: number
      range: 0~100
      check:
        - 与舆论、媒体、官方调查和跨国异常事件同步变化
  主角:
    年龄:
      type: number
      check:
        - 默认长期稳定，除非跨年或用户明确修改基础设定
    健康状态:
      type: number
      range: 0~100
      check:
        - 失眠、受伤、压力、恢复与保养都会影响，但单次变化应合理
    隐蔽度:
      type: number
      range: 0~100
      check:
        - 幕后行动越谨慎越高，留下线索、被监控或被怀疑时下降
    梦境状态:
      check:
        - 入睡、半梦、进入神树梦境、醒来时更新
    当前目标:
      check:
        - '当 {{user}} 明确更换近期策略、试验对象或世界推进方向时更新'
  系统:
    当前积分:
      type: number
      check:
        - 每周自动 +1
        - 抽奖时扣除对应积分
    累计抽卡次数:
      type: number
      check:
        - 每次抽奖后递增
    距离保底还需次数:
      type: number
      range: 0~10
      check:
        - 十连周期内实时变化
        - 抽到 B 级及以上后重置为 10 或按下一轮重新计算
    最近抽卡结果:
      check:
        - 每次抽奖后必须更新为最新结果摘要
    抽奖池摘要:
      check:
        - 只有当抽奖策略、能力偏好或当前关注作品发生变化时才更新
  神树:
    当前等级:
      check:
        - 成长百分比达到阶段阈值并完成质变时升级
    成长百分比:
      type: number
      range: 0~100
      check:
        - 每周自然成长 1%
        - 献祭能力时按等级差获得额外成长
        - 不可超过 100，达到阈值后应结合等级变化处理
    每周自然成长:
      type: number
      range: 0~100
      check:
        - 默认维持 1，除非剧情明确改变神树成长环境
    最近喂养记录:
      check:
        - 每次献祭能力、灵魂碎片或特殊资源后更新
    结果状态:
      check:
        - 只有接近终局或神树结果时改变
  保留能力:
    槽位上限:
      type: number
      range: 1~5
      check:
        - 世界改变进度每到 20/40/60/80 时依次增加，80 后封顶 5
    当前保留数:
      type: number
      range: 0~5
      check:
        - 保留或移除能力时同步变化
    当前主保留能力:
      check:
        - 当前最重要、最常用或最新的主保留能力变化时更新
    已保留列表:
      type: |-
        Array<{
          名称: string;
          来源作品: string;
          评级: 'S' | 'A' | 'B' | 'C' | 'D' | 'E';
          效果摘要: string;
        }>
      check:
        - 新保留能力加入
        - 送出或替换保留能力时同步移除或改写
  能力库存:
    type: |-
      {
        [能力键: string]: {
          名称: string;
          来源作品: string;
          评级: 'S' | 'A' | 'B' | 'C' | 'D' | 'E';
          类型: '灵魂碎片' | '提取能力';
          形态: string;
          核心效果: string;
          适配对象: string;
          风险提示: string;
          当前状态: '未使用' | '已保留' | '已赐予' | '已献祭';
          备注: string;
        }
      }
    check:
      - 每次抽奖后新增对应条目
      - 赠予、保留、献祭后必须改状态
      - '赠出后若是提取能力，{{user}} 不能继续把它当作可用能力描述'
  焦点人物:
    type: |-
      {
        [人物键: string]: {
          名称: string;
          类型: '个人' | '团体' | '组织';
          身份: string;
          当前地区: string;
          获得内容: string;
          获得形式: string;
          评级: 'S' | 'A' | 'B' | 'C' | 'D' | 'E';
          变化趋势: string;
          认知距离: number;
          暴露风险: number;
          对世界影响: string;
          当前状态: string;
        }
      }
    check:
      - 只有真正影响主线、势力博弈或世界变化的人才进入焦点人物
      - 获得完整灵魂碎片后，应逐步表现人格趋同
      - '没有足够线索时，不要让目标直接怀疑 {{user}}'
  势力:
    type: |-
      {
        [势力键: string]: {
          名称: string;
          类型: string;
          态度: '无察觉' | '零散关注' | '谨慎调查' | '高度警惕' | '暗中争夺' | '公开介入';
          关注焦点: string;
          当前动作: string;
          风险评级: number;
          渗透程度: number;
        }
      }
    check:
      - 政府、资本、地下组织、民间超凡圈等只在合理感知链成立时推进
      - 态度升级应有事件依据，不可无故跳级
  世界事件:
    type: |-
      {
        [事件键: string]: {
          标题: string;
          等级: '地方级' | '城市级' | '区域级' | '国家级' | '全球级';
          地区: string;
          摘要: string;
          公开影响: string;
          幕后关联: string;
          状态: string;
        }
      }
    check:
      - 当超凡事件真正形成社会涟漪时记录
      - 需要体现公开影响与幕后因果，不可只写空标题
  编年史:
    type: |-
      {
        [记录键: string]: {
          时间标记: string;
          标题: string;
          摘要: string;
          影响层级: string;
        }
      }
    check:
      - 关键抽卡、关键赐能、神树跃升、世界格局变化后追加
      - 保持时间顺序清楚，摘要简洁但能追溯
