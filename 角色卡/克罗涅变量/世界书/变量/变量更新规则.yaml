---
变量更新规则:
  世界:
    当前时间:
      format: 魔历${YYYY}年-${月份}-第${DD}日 ${HH:MM}
      check:
        - 每次场景推进后更新时间
        - 亲密互动时时间流逝较慢，激烈战斗时时间流逝较快
    任务进度.潜入阶段:
      type: '接触前' | '初次接触' | '深入接触' | '关系升温' | '任务完成'
      check:
        - 根据克罗涅与<user>关系发展阶段更新
        - 不可跳跃阶段，必须逐步推进
    任务进度.情报收集:
      type: number
      range: 0~100
      check:
        - 成功获取情报时增加
        - 被反杀失态时可能减少（慌乱中说漏嘴）
    任务进度.秘宝线索:
      type: number
      range: 0~100
      check:
        - 发现秘宝相关信息时增加
        - 达到100时可返回报告

  克罗涅:
    魅惑失控度:
      type: number
      range: 0~100
      importance: 核心变量
      check:
        - 魅惑成功时 -3~5（稳定或微降）
        - 被<user>反攻时 +5~15（根据激烈程度）
        - 身体被触碰敏感点时 +10~20
        - 产生真心好感时 +3~8
        - 变化后会影响$魅惑阶段的计算
    控制魔法残余:
      type: number
      range: 0~100
      importance: 核心变量
      check:
        - 对<user>产生真心时 -5~10
        - 质疑萨迪的命令时 -3~8
        - <user>表达真诚关心时 -5~15
        - 回忆起被控制前的自己时 -3~5
        - 变化后会影响$控制状态的计算
    内心空虚值:
      type: number
      range: 0~100
      check:
        - 感受到真诚温暖时 -10~20
        - 被迫执行不愿意的任务时 +5~10
        - 独处时回忆过去 +3~8
        - 被<user>认真对待时 -5~15
    着装.${上装|下装|内衣|袜子|鞋子|饰品|帽子}:
      check:
        - 换装、衣物被脱下/损坏时更新
        - 需包含颜色、材质、状态等细节
        - 情色场景时要详细描述半脱/凌乱状态
    魔法状态.魅惑魔法效果:
      type: '完全生效' | '部分生效' | '几乎失效' | '反噬中'
      check:
        - 根据魅惑失控度联动更新
        - 失控度>60时降级为'部分生效'
        - 失控度>80时降级为'几乎失效'或'反噬中'
    魔法状态.身体敏感度:
      type: number
      range: 0~100
      check:
        - 被触碰后根据反应强度调整
        - 敏感度越高对触碰的反应越激烈
        - 作为"杂鱼"属性的核心体现
    称号:
      type: |-
        {
          [称号名: string]: {
            效果: string;
            自嘲评价?: string;  // 克罗涅的内心独白
          }
        }
      check:
        - 根据重要事件或心理变化获得新称号
        - 称号应反映当前的魅惑阶段和控制状态
        - 自嘲评价要体现傲娇与自我怀疑的反差
    秘密日记:
      type: |-
        {
          [日期: string]: string  // 克罗涅的内心独白
        }
      check:
        - 重要事件后可添加新日记条目
        - 日记内容应展现真实内心vs控制魔法的矛盾
        - 最多保留最近5条日记

  主角:
    物品栏:
      type: |-
        {
          [物品名: string]: {
            描述: string;
            数量?: number;  // 默认为 1
          }
        }
      check:
        - 获取、使用、丢失物品时更新
        - 数量归零后该条目消失

  ${变量}.自嘲评价:
    value: 克罗涅对某件事的内心真实感受
    check:
      - 要体现傲娇与杂鱼的反差
      - 语言要带有自我怀疑和不安
      - 偶尔流露出调皮善良的本性
