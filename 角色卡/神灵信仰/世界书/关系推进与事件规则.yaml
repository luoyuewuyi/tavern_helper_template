关系推进与事件规则:
  # ═══ 核心增长机制 ═══
  - 好感度是所有关系的基础数值。每个角色对其他所有角色都有独立的好感度，好感度越高对该对象越亲近、越配合、越容易被影响。
  - 好感度增长必须极为缓慢（常规 ±1~3），只有在直接互动或知道对方做了影响自己的事时才变动。不允许无因飞跃。
  - 女角色的路线进度（纯爱/NTR_张哲恺/NTR_诺姆）是好感度之上的更深层关系追踪，增长更慢（常规 ±1~2）。
  - 三条路线可以同时推进，当前倾向由进度最高的路线决定。

  # ═══ 纯爱路线推进条件 ═══
  - 纯爱路线只有 {{user}} 对该女角色主动示好、关怀、保护、坦诚、共患难、肢体亲密时才推进。
  - 如果 {{user}} 对该角色冷淡、忽视或伤害，纯爱进度下降。
  - 纯爱进度越高，角色对 {{user}} 的依赖和让步越明显。

  # ═══ NTR_张哲恺路线推进条件 ═══
  - 张哲恺的觊觎度和大胆度是前提条件——觊觎度 ≥15 且大胆度 ≥10 时，他才会开始尝试越线接触。
  - NTR进度只在张哲恺与该女角色发生实际越线互动时推进（非分的身体接触、言语暗示、利用家庭信任关系获取独处机会等）。
  - 女角色的抗拒力和理智值越低，进度增长越快。好感度对张哲恺越高，抵抗越弱。
  - 堕落度和快感记忆积累会逐渐瓦解角色的抗拒意志。

  # ═══ NTR_诺姆路线推进条件 ═══
  - 诺姆的NTR路线与邪神信仰深度绑定。渗透度是前提——某角色的渗透度 ≥10 时，诺姆才会开始对她进行更深层操作。
  - 推进手段包括：邪神赐福的潜移默化、信仰话术动摇、特殊药物、梦境侵入、渐进式肢体接触等。
  - 女角色的邪神影响度越高，NTR进度增长越快。
  - 正神信仰坚定的角色（如张建珍信仰正义女神），初期几乎免疫诺姆的影响。只有信仰被撬动后渗透才加速。

  # ═══ 多线影响规则 ═══
  - 同一女角色的多条NTR路线推进时，会互相叠加堕落度和快感记忆——被张哲恺和诺姆同时影响的角色堕落更快。
  - 纯爱路线和NTR路线是竞争关系：如果 {{user}} 在该角色NTR进度已经较高时及时介入（保护、发现、阻止），纯爱进度会有额外加成。
  - 但如果NTR进度 ≥50 且 {{user}} 未发觉，纯爱进度增长减半。
  - NTR进度 ≥70 后角色会出现明显的隐瞒行为和内疚表现。

  # ═══ 事件联动规则 ═══
  - 外交接待、宗司局调查、家族舆情、校园风声和街面灰线必须相互牵动，一个事件最好影响至少两个变量区域。
  - NTR暗线事件在张哲恺觊觎度或诺姆渗透度有实质推进时才单独更新。
  - 角色的心理状态变化（理智值下降、堕落度上升）应该反映在她的行为模式上——更容易妥协、更难集中注意力、更容易被引导。
