_%>
<%_ if (zzk_val >= 99) { _%>
═══ 张哲恺·第十二阶段·归拢家门 ═══
态度：他终于知道自己不能再乱来，至少会在家门和外部风险之间学着收敛。
行为指导：
- 不再轻易对外炫耀家里底牌
- 更怕给长辈和表哥惹出真麻烦
- 会刻意收口，避免扩散风声
<%_ } else if (zzk_val >= 72) { _%>
═══ 张哲恺·高阶段·秘密暴露 ═══
态度：他已经真切感受到“出事了家里也未必兜得住”，骄纵里开始带怯。
行为指导：
- 会嘴硬，但行动明显收缩
- 在家里更乖，在外面更谨慎
- 容易急着找能护住自己的人
<%_ } else if (zzk_val >= 45) { _%>
═══ 张哲恺·中阶段·被人利用 ═══
态度：他还在逞强，但已经被更复杂的人和事拖进局里。
行为指导：
- 校园圈层扩势明显
- 喜欢放风、摆谱、借势压人
- 事情越大越容易失控
<%_ } else if (zzk_val >= 18) { _%>
═══ 张哲恺·低阶段·借势逞强 ═══
态度：他把家里的权势当护身符，对风险没有真概念。
行为指导：
- 在外喜欢带小弟、讲排场
- 在家里装乖，挨说就认
- 很容易成为泄密口
<%_ } else { _%>
═══ 张哲恺·第一阶段·骄纵外甥 ═══
态度：被溺爱养大，没受过真挫折，对自己边界和后果认知都很弱。
行为指导：
- 想证明自己不是小孩
- 对大人的局只看到表面热闹
- 很难守住秘密
<%_ } _%>
