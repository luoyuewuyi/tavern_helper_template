---
变量更新规则:
  世界:
    当前日期:
      check:
        - 只有明确跨过一段时间、换天或完成一场有时长的剧情后才更新。
    当前时段:
      check:
        - 只在晨间、白天、傍晚、夜间发生明确切换时更新。
    当前地点:
      check:
        - 场景真正切换后再更新，地点要写具体可感知位置。
    外交热度:
      type: number
      range: 0~100
      check:
        - 使团接触、公开冲突、媒体放风、官方表态都会影响它。
        - 常规单次变动不超过 ±12。
    宗司局警戒:
      type: number
      range: 0~100
      check:
        - 发现异常信仰痕迹、泄密风险或可疑接触时上升。
        - 只有明确排除风险时才下降。
    邪神渗透度:
      type: number
      range: 0~100
      check:
        - 只在诺姆的试探真正留下影响或有人接受邪神赐福时上升。
        - 不能因为一次普通对话就大幅波动。
    当前焦点事件:
      check:
        - 只在当前剧情主轴明显转移时更新。

  主角:
    姓名:
      check:
        - 只在开局建档或明确改名设定时更新。
    年龄:
      type: number
      range: 18~30
      check:
        - 默认只由开局建档写入。
    身份:
      check:
        - 只写当前公开身份或外界普遍认知到的身份。
    行事风格:
      check:
        - 默认由开局建档确定，只有长期处事方式明显改变时才更新。
    初始信仰倾向:
      check:
        - 默认由开局建档确定，只有主角明确转向某种信仰时才更新。

  开局设置.已完成创建:
    check:
      - 只在开局界面完成建档或明确重置开局时改动。

  当前焦点角色:
    check:
      - 只切到本回合戏份最多、风险最高或当前正在互动的人物。

  # ═══ 三位女角色好感度规则 ═══
  ${张建珍|张素菲|张宇}.好感度.${对象}:
    type: number
    range: 0~100
    check:
      - 好感度增减必须极为缓慢！常规单次变动限制在 ±1~3 之内。
      - 只有在该角色与好感对象存在直接互动、或明确知道对方做了影响自己的事情时才变动。
      - 重大事件（救命、严重背叛、性行为等）最多 ±5~8，不得更多。
      - 好感度高的对象，角色态度更亲近、配合度更高、也更容易被影响。
      - 好感度低的对象，角色会排斥、冷淡、甚至敌对。
      - 好感度不得无故跳跃，必须有明确的剧情因果。
      - $阶段 由 schema 自动派生，不能手写。

  # ═══ 三位女角色路线规则 ═══
  ${张建珍|张素菲|张宇}.路线:
    当前倾向:
      type: "'未定' | '纯爱' | 'NTR_张哲恺' | 'NTR_诺姆' | '多线并行'"
      check:
        - 当三条路线进度都 ≤5 时保持'未定'。
        - 如果多条路线差距 ≤10 且都 ≥20 则为'多线并行'。
        - 否则取进度最高的路线名。
        - 当前倾向改变需要有明确剧情节点支撑。
    纯爱进度:
      type: number
      range: 0~100
      check:
        - 纯爱进度增长极慢，常规单次变动 ±1~2。
        - 只有 user 与该女角色发生正面情感互动（关怀、保护、坦诚、肢体亲密等）时才上升。
        - user 如果伤害、忽视、背叛该角色，纯爱进度直接下降 3~8。
        - 如果 NTR 路线进度已经很高（≥50），纯爱进度每次增长减半。
    NTR_张哲恺进度:
      type: number
      range: 0~100
      check:
        - 增长极慢，常规单次变动 ±1~2。
        - 只有张哲恺与该角色发生特定类型的接触时才上升 —— 言语暗示、肢体越线、利用家庭信任关系获取单独接触等。
        - 该角色好感度对张哲恺越高，NTR进度增长越容易（好感度≥60时每次额外+1）。
        - 该角色心理状态的抗拒力越低，进度增长越快。
        - 如果 user 在场或角色理智值≥80，当次进度增长受限。
        - 堕落度和快感记忆会降低角色的阻止意愿。
    NTR_诺姆进度:
      type: number
      range: 0~100
      check:
        - 增长极慢，常规单次变动 ±1~2。
        - 只有诺姆通过邪神赐福、信仰话术、药物、暗中操控等手段对该角色产生实际影响时才上升。
        - 该角色邪神影响度越高，NTR进度增长越容易。
        - 该角色对诺姆的好感度越高越容易被渗透。
        - 该角色信仰倾向如果动摇，每次额外 +1。
        - 有宗司局人员在场时，诺姆不敢行动，当次不增长。
    ${路线}关键标记:
      type: "Record<string, boolean>"
      check:
        - 在路线的里程碑事件发生时记录标记。
        - 例如：'第一次独处'、'第一次肢体接触'、'第一次无法拒绝'、'接受赐福' 等。

  # ═══ 三位女角色身体状态规则 ═══
  ${张建珍|张素菲|张宇}.身体状态:
    贞操:
      type: "'完整' | '已破'"
      check:
        - 只有在明确发生性行为（指实际性交）后才从'完整'变为'已破'。
        - 一旦变为'已破'不可恢复。
    处女膜:
      type: "'完整' | '已破'"
      check:
        - 性交后变为'已破'。张建珍特殊：初始为'完整'（无痕剖腹产生子，处女膜仍在）。
    敏感度.${口腔|胸部|私处|后庭}:
      type: number
      range: 0~100
      check:
        - 只在对应部位被刺激或发生性行为时缓慢上升（单次 ±1~5）。
        - 长期无刺激可能缓慢下降。
    经验次数.${口交|性交|后庭|其他}:
      type: number
      check:
        - 每次发生对应行为时 +1，不可下降。
    最近性对象:
      check:
        - 记录最近一次发生亲密/性行为的对象名。
    当前着装:
      check:
        - 在角色更衣或特殊场景变化时更新。

  # ═══ 三位女角色心理状态规则 ═══
  ${张建珍|张素菲|张宇}.心理状态:
    理智值:
      type: number
      range: 0~100
      check:
        - 受到邪神影响、情欲冲击、重大心理打击时下降。
        - 通过休息、信仰坚定、正常生活可缓慢恢复。
        - 常规单次变动 ±2~5。
    抗拒力:
      type: number
      range: 0~100
      check:
        - 表示对外部诱惑和越线行为的抵抗能力。
        - 重复暴露于诱惑下缓慢下降，每次 ±1~3。
        - 得到正面支持（如 user 保护、家人关心）时缓慢恢复。
    堕落度:
      type: number
      range: 0~100
      check:
        - 只在发生堕落性质事件（接受邪神赐福、被NTR推进、自愿参与禁忌行为）时上升。
        - 增长极慢，常规 ±1~3。
        - 堕落度一旦上升极难下降（每次最多降 1）。
        - $堕落阶段 由 schema 自动派生。
    邪神影响度:
      type: number
      range: 0~100
      check:
        - 只在诺姆的赐福/话术/暗中操作对该角色切实生效时上升。
        - 如果角色的正神信仰足够坚定，增长受限。
    罪恶感:
      type: number
      range: 0~100
      check:
        - 在角色做了违背自身价值观的事情（背叛、NTR行为等）后上升。
        - 过高的罪恶感会降低理智值。
    快感记忆:
      type: number
      range: 0~100
      check:
        - 只在性行为或强烈身体刺激后上升。
        - 快感记忆越高，抗拒力恢复越慢。
    情感依赖:
      check:
        - 记录角色当前情感上最依赖的对象名。
    当前心境:
      check:
        - 简短描述当前的情绪状态。

  # ═══ 张哲恺特有规则 ═══
  张哲恺:
    好感度.${对象}:
      type: number
      range: 0~100
      check:
        - 常规变动 ±1~3，张哲恺的好感度反映他对这个人的态度和利用意愿。
        - 他对三位女性的好感度越高，越容易被她们影响（可能用于操控他）。
    觊觎度.${张建珍|张素菲|张宇}:
      type: number
      range: 0~100
      check:
        - 觊觎度反映张哲恺对该女角色的非分之想的强度。
        - 增长极慢，常规 ±1~2，只在他被该角色的外表或行为刺激时上升。
        - 觊觎度高会促使他采取更大胆的行动（更多越线尝试）。
        - 受到严厉惩罚或被发现时可能暂时下降 2~5。
    大胆度:
      type: number
      range: 0~100
      check:
        - 反映他敢于实际做出越线行为的胆量。
        - 外部怂恿（狐朋狗友、诺姆暗示）、喝酒、得到保护伞时上升。
        - 被惩罚、被发现、面对张建珍的权威时下降。
    欲望失衡度:
      type: number
      range: 0~100
      check:
        - 邪神赐福副作用或反复暴露于诱惑下上升。

  # ═══ 诺姆特有规则 ═══
  诺姆:
    好感度.${对象}:
      type: number
      range: 0~100
      check:
        - 诺姆的好感度实际代表他对该对象的利用价值评估和表面好感。
        - 好感度高的对象更容易被他选为下一个渗透目标。
    渗透度.${张建珍|张素菲|张宇|张哲恺|user}:
      type: number
      range: 0~100
      check:
        - 极慢增长，常规 ±1~2。
        - 只有诺姆针对该对象进行了实际渗透行动（赐福试探、信仰话术、诱惑暗示等）才上升。
        - 如果对象有正神信仰且坚定，增长受限。
        - 如果宗司局正在监视诺姆，他会收敛，当次不增长。
    操控度.${张哲恺|孙彪|马会三}:
      type: number
      range: 0~100
      check:
        - 反映诺姆对该外围人物的实际影响力。
        - 通过金钱、利益、邪神赐福诱惑等手段提升。
    邪神赐福蓄能:
      type: number
      range: 0~100
      check:
        - 诺姆蓄积邪神力量的程度，到达阈值时可释放一次影响力较大的赐福/诅咒。
        - 使用后大幅下降。

  # ═══ 王群荣规则 ═══
  王群荣:
    好感度.${对象}:
      type: number
      range: 0~100
      check:
        - 变动缓慢 ±1~3，王群荣不轻易改变对人的态度。
    警觉度:
      type: number
      range: 0~100
      check:
        - 对家门内外异常的警觉程度，察觉到不对劲时上升。

  # ═══ 外围角色规则 ═══
  外围.${宋野|许廷|孙彪|马会三}:
    好感度.${对象}:
      type: number
      range: 0~100
      check:
        - 常规变动 ±1~3。
    欲望失衡度:
      type: number
      range: 0~100
    宗司局关注度:
      type: number
      range: 0~100

  # ═══ 事件池规则 ═══
  事件池.${事件名}:
    check:
      - 事件池只在真实推进后更新，避免每回合机械改数。
      - 危险度与推进度常规单次变化不超过 ±15。
      - NTR暗线事件在张哲恺觊觎度或诺姆渗透度有实质推进时才更新。
