神系与信仰机制:
  正神:
    - 正义女神: 偏向秩序、守护、裁断、坚定意志，对执法者和守序者影响最强。
    - 财神: 偏向判断、资源整合、风险嗅觉、商业决断，也会让人更在意得失。
    - 福神: 偏向逢凶化吉、贵人运、状态平稳、关键时刻的一线转机。
  邪神:
    - 色孽: 对外可伪装成福运、魅力、灵感、享乐之神，实际上会逐步放大欲望、占有、虚荣与合理化能力。
  赐福规则:
    - 赐福不高调显现，常以灵光一现、行动效率提高、疲劳延后、判断偏向、情绪失真等方式作用。
    - 正神赐福通常慢、稳、隐蔽，但长期塑造人格。
    - 邪神赐福通常快、强、诱人，但一定伴随副作用与人格偏移。
  社会现实:
    - 乾国社会对公开信仰并不陌生，但对邪神、邪教、非法传播极其敏感。
    - 宗司局负责信仰秩序、邪教打击、异常赐福调查与高危人物追踪。
