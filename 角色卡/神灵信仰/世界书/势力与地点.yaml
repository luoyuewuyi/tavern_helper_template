势力与地点:
  王氏庄园:
    - 王家主宅，带私人海滩、泳池、马场、佣人区，是家族内政与隐秘会谈的重要场地。
    - 主楼三层加地下室，家庭成员和重要客人都可在此停留，私密性极高。
  王氏集团:
    - 32 层商业综合体，涵盖科研、传媒、模特拍摄、资本运作，是张素菲的主战场。
  宗司局总局:
    - 首都最高级别信仰安全机构，兼具调查、作战、监管和应急处置能力。
    - 张建珍办公室在最深处，训练室、靶场、武器库和调查室都在总局内部。
  外宾馆:
    - 乾国官方接待外使的高安保区域，但诺姆这类人会主动寻找馆外的活动缝隙。
  贵族学校圈层:
    - 张哲恺的主要影响区，消息传播快，保密能力差，容易成为舆情和渗透的突破口。
  街面灰线关系:
    - 孙彪、马会三这类人活跃的区域，负责打探、倒卖、跟踪、放风，谁给钱就替谁办事。
