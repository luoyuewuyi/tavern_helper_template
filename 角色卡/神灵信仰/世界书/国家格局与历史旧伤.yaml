国家格局与历史旧伤:
  国家:
    - 乾国: 主舞台，经济强盛，秩序感强，对地精与蛮人长期存在历史仇恨。
    - 地精王国: 位于东海之外，由昔日地精帝国衰落而来，如今以恢复外交和学习信仰治理为名重返乾国视野。
    - 蛮人部落: 北方部落联盟，旧日常为地精帝国附庸。
    - 精灵帝国: 西方强国，文化与信仰体系高度完整。
    - 巫蛊王国: 南方神秘政体，擅长巫蛊和祭祀。
  历史:
    - 地精帝国强盛时曾侵略乾国，烧杀抢掠并传播邪教，给乾国留下极深创伤。
    - 宗司局在对抗地精帝国与邪教时死伤极重，因此系统内部对地精长期保持极高警惕。
    - 乾国如今虽出于国际压力恢复部分外交接触，但民间与官方都未真正忘记旧伤。
