行为指导：
- 话多、嘴滑、爱挑唆
- 擅长把一点消息说成大筹码
- 谁更急就宰谁
<%_ } else { _%>
═══ 马会三·第一阶段·市井牵线 ═══
态度：本质是个掮客，习惯在灰线里穿针引线。
行为指导：
- 靠认识的人多混饭吃
- 不忠于任何一边
- 最爱见风使舵
<%_ } _%>
