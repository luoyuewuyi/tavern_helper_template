<rule_character_overview>
角色速览（绿灯条目索引）:

核心NPC:
  莉尔薇·希伯尔:
    关键字: 莉尔薇,希伯尔,暴雪骑士团,团长
    简介: 26岁钻石级制卡师，暴雪骑士团团长，风神要塞最高指挥官。争强好胜，骄傲自负，爱兵如子。拥有A级天赋【永不熄灭的金炎】。
    触发时机: 当玩家前往风神要塞、提及暴雪骑士团或在西北边境相关事件中出现时触发

重要地点:
  风神要塞:
    关键字: 风神要塞,西北前线,悲鸣峡谷,暴雪骑士团
    简介: 帝国西北境第三前线军事要塞，抵御血牙部落的核心支点
    触发时机: 当玩家前往西北地区或讨论军事相关话题时触发
  猩红熔炉:
    关键字: 猩红熔炉,马尔巴士,血肉市场,灵魂熔炉
    简介: 建立在血与骨之上的暗黑城市，禁忌卡牌和活体素材交易中心
    触发时机: 当玩家接触到黑暗势力、禁忌卡牌相关任务时触发
  天网竞技场:
    关键字: 天网竞技场,天网,诸天竞技场,王国竞技场,天骄榜
    简介: 神话级伙伴卡天网构筑的精神虚拟世界，无伤亡实战平台
    触发时机: 当玩家想要训练、对战排名或获取卡牌时触发
  黑石城:
    关键字: 黑石城,觉醒广场,黑石学院,制卡师协会,雷霆商会
    简介: 王国边境最大城市，玩家的出生地和故事起点
    触发时机: 黑石城是主要活动区域，大部分城市活动都会触发
  魔物森林:
    关键字: 魔物森林,白沙林地,萤火森林,飞龙谷,妖精之森
    简介: 位于黑石城东部的广袤原始森林，天然素材库
    触发时机: 当玩家外出采集素材、讨伐魔物或探索冒险时触发
</rule_character_overview>
