<location_crimson_forge>
猩红熔炉:

概述: 一座建立在血与骨之上的暗黑城市，由邪恶的高阶制卡师马尔巴士统治。这里是禁忌卡牌、活体素材和灵魂交易的中心。

区域划分:

  秽物平原（原料供应与处理区）:
    活体牧场: 豢养、繁殖各类活体"素材"的巨大围栏
    血沼处理场: 对活体进行放血、剥皮、拆解的流水线工厂
    破烂港: 与外界进行奴隶和物资交易的唯一传送门

  贪欲横街（商业与娱乐中心）:
    血肉市场: 交易素材、奴隶、禁药与劣质卡牌的核心市场
    痛苦剧场: 提供怪物角斗、公开处刑等血腥表演的娱乐中心
    高等制卡师公馆: 仅次于马尔巴士的顶级制卡师们的私人实验室与居所
    荷米斯炼金工坊:
      - 几乎垄断了中高端炼金市场的巨型工坊
      - 建筑外围是商业区，有着炼金术士们自己开的店铺，也有挂着荷米斯徽记的官方店铺
      - 主营炼金药剂、素材处理、元素魔法和最昂贵的炼金造物
      - 核心区则是炼金术士们的私人工坊以及一个直属荷米斯品牌的巨大炼金工厂

  尖塔核心区（权力中枢）:
    猩红尖塔: 马尔巴士的居所与整座城市的绝对控制中枢
    贵宾会所"静滞之棺": 用于招待外界贵宾，进行秘密黑暗交易的场所
    灵魂熔炉: 抽取并熔炼灵魂，用于制作传说级卡牌的恐怖装置

  地下：遗忘之脉（排污系统与反抗萌芽之地）:
    废弃炼金实验室: 反抗组织"微光"的秘密总部
    菌人聚落: 保持中立的智慧蘑菇生物的地下家园
    地底血河: 城市的终极排污系统，也是一条能避开耳目的秘密地下通道
</location_crimson_forge>
