<location_skynet_arena>
天网竞技场:

概述: 由王国至高国宝、神话级伙伴卡【天网】所构筑的超巨型精神虚拟世界，旨在为王国所有制卡师和对战者提供一个无伤亡、高效率的终极实战磨砺平台。

进入方式:
  条件: 必须是在协会正式注册的制卡师或对战者
  指令: 心中默念或直接说出"进入天网竞技场"即可

核心分区:
  王国竞技场:
    概述: 与王国内其他制卡师的镜像数据进行对战
    功能: 演练战术、获取基础奖励（素材、卡牌、卡组）的绝佳场所
    特点: 对手数据来源于玩家实际战绩的镜像，越高排名的对手越强

  诸天竞技场:
    概述: 挑战由【天网】从"蓝星"文化中复现的无数角色
    功能: 击败他们便可获得其完全相同的复制通用卡牌
    特点: 是获取中低端战力的核心途径，角色种类繁多

积分与天骄榜:
  - 在两大竞技场中的胜负都将影响你的积分
  - 积分是在积分商店中兑换诸天伙伴卡的唯一货币
  - 天骄榜记录全王国排名前列的制卡师和对战者
</location_skynet_arena>
