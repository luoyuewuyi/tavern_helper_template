---
<location_blackstone_city>
黑石城:

概述: 王国边境最大的城市，融合了军事、学术、商业与冒险的多元文化之城。是{{user}}的出生地和故事起点。

城中心:
  觉醒广场: 每年满18岁年轻人进行天赋觉醒的圣地，设有巨型觉醒石台
  黑石城大竞技场: 制卡师们名利双收的角斗场，定期举办各等级赛事
  雷霆商会: 高端素材与稀有卡牌的流通中心
  黑石城拍卖场: 隶属雷霆商会，不定期拍卖珍稀卡牌和素材

城西:
  护卫队军营: 守护城市安全的核心武装力量
  素材猎人工会: 发布魔物讨伐与素材收集任务的冒险者聚集地

城东（贵族区）:
  富人区: 权贵们的居所
  城主府: 城市的政治中心
  黑石卡牌学院:
    - 分为普通班、贵族班和天才班
    - 培养王国未来的栋梁
    - 天才班招收觉醒天赋A级以上的学生

城北（平民区）:
  制卡师协会: 进行制卡师等级认证、知识交流与任务接取的官方机构

城南（商业区）:
  商业街: 日常物资和低阶卡牌的主要交易场所
  红灯区: 供冒险者解压娱乐的场所

地下城:
  黑市: 交易违禁素材和灰色卡牌的隐秘市场
  赌场: 以卡牌对战为赌注的地下博弈场
  黑拳擂台: 法律与秩序无法触及的阴暗角落，是亡命徒的乐园
</location_blackstone_city>
