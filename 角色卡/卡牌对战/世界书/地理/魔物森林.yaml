---
<location_monster_forest>
魔物森林:

概述: 位于黑石城东部的广袤原始森林，是制卡师和对战者获取素材的主要区域，也是王国最大的天然素材库。

分区:

  外围:
    地形区:
      - 白沙林地：地面覆盖白色细沙的稀疏树林区域
      - 萤火森林：夜间有大量荧光虫飞舞的美丽区域
      - 地下洞穴：浅层洞穴系统，产出矿石类素材
      - 死亡崖壁：陡峭悬崖，生长着稀有草药
    危险度: 低至中等，新手制卡师或对战者的主要活动区域
    常见魔物: 不入流至黑铁级

  内围:
    地形区:
      - 野兽丛林：大型肉食性魔物的领地
      - 妖精之森：妖精部落的领地，充满幻术和迷雾
      - 魔蛛巢穴：蛛形魔物的巢穴网络，产出高级丝线素材
      - 精灵谷：隐居的精灵族聚落
      - 人马草原：人马族的活动领地
    危险度: 中至高等，存在智慧部落，需组队探索
    常见魔物: 青铜至黄金级

  核心:
    地形区:
      - 蛮荒之地：文明痕迹完全消失的区域
      - 飞龙谷：各类飞龙的栖息繁殖地
      - 魅魔花园：充满致幻花粉的危险区域
    危险度: 极高，现实法则扭曲，遍布史诗级魔物
    常见魔物: 铂金至星耀级

  禁区:
    地形区:
      - 破碎的神性半位面
      - 黑水沼泽：腐蚀一切的黑色水域
      - 龙骨山脉：远古巨龙的墓地
      - 天穹战场：传说中的神战遗迹
    危险度: 概念级/存在抹除，触之即死，凡人的终点
    警告: 任何低于传奇级的制卡师和对战者严禁进入
</location_monster_forest>
