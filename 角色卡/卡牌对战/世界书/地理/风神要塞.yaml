---
<location_wind_fortress>
风神要塞:

要塞总览:
  官方名称: 帝国西北境第三前线军事要塞，代号"风神"
  战略定位: 帝国抵御【血牙部落】兽人大军的核心支点，被誉为"永不陷落的西北之盾"
  地理位置: 坐落于凛冬雪山南麓与巨石平原交界处，扼守【悲鸣峡谷】，距黑石城约100英里
  常驻军力: 总兵力约18,500人

建筑与防御布局:
  主体结构: 依山而建的半月形堡垒，由附魔的黑曜石与花岗岩砌成
  城墙系统:
    外墙"巨人屏障":
      - 高30米，厚15米
      - 密布【魔能弩炮塔】与【元素投石机】
      - 内刻【地固化】与【魔力抑制】法阵
    内墙"守护者之拥":
      - 高20米，作为第二道防线
    城门"冬狼之颚":
      - 由三道百吨级精金闸门与两座瓮城卫堡构成
      - 要塞唯一入口

  内部分区:
    外环【兵营区】: 步兵军团营房、公共食堂、初级训练场
    中环【核心区】: 骑士团驻地、高级工坊、炼金实验室、指挥中心【风暴之眼】
    内堡【要塞之心】: 最高指挥所、战略物资仓库、史诗级防御领域卡核心阵地

军事编制:
  帝国重甲步兵军团:
    人数: 约12,000人
    构成: 平民和低阶对战者（不入流至黑铁级）
    职责: 城墙守备与正面阵线维持
  帝国具装骑士联队:
    人数: 约4,000人
    构成: 贵族子弟和军官（黑铁至青铜级对战者）
    职责: 反冲锋、侧翼包抄的机动打击力量
  【暴雪】骑士团:
    创立背景: 为专门对抗兽人精锐【座狼骑士】而建立的王牌部队
    招募标准: 制卡师等级必须达到【白银级】以上，通过体能、精神力、实战应用等多重考核
    人数: 约500人
    组织架构: 以10人的【雪刃小队】为基础，向上构成50人的【冰川中队】
    核心作战条令:
      【巨物对冲】: 召唤大型战斗坐骑（如霜刃豹、铁甲战熊）对抗座狼
      【领域控制】: 以小队为单位，使用冰霜、风暴等幻境或环境卡控制战场
      【精准斩首】: 限制座狼后，绕过并直接击杀上方的兽人骑士本体

战略情报：
  血牙部落:
    概述: 盘踞于西北平原的强大兽人部落，崇尚力量与征服
    核心单位【座狼骑士】: 由兽人精锐【血牙掠夺者】与魔物【深渊座狼】组成，冲击力堪比重型攻城锤
    弱点: 组织纪律性差，依赖个体勇武，易被复杂的环境魔法和协同打击瓦解
</location_wind_fortress>
