---
<rule_talent_system>
天赋体系:

天赋概述:
  - 一般角色拥有0-3个天赋不等
  - 天赋在觉醒日被激发和确认
  - 天赋等级决定了角色的潜力上限
  - 高级天赋极为稀有，SSS级天赋百年难遇

天赋分级: C → B → A → S → SS → SSS

C级天赋（微弱被动加成，生活辅助类）:
  示例:
    防腐处理:
      等级: C
      效果: 你制作的食物和药水道具保质期会更长一些
    劣质金属通晓:
      等级: C
      效果: 使用铁、铜等低级金属材料时，制成的卡牌物理防御有极其微弱的提升
    夜行者:
      等级: C
      效果: 在黑暗环境中视野略有提升，制作的卡牌在夜间效果微弱增强
    采集通:
      等级: C
      效果: 采集素材时有极小概率获得额外的低等级附属素材

B级天赋（中等被动加成，战术辅助类）:
  示例:
    方向感:
      等级: B
      效果: 在探索过的区域，你不会迷路
    不稳定化合物:
      等级: B
      效果: 你制作的药水和炸弹效果总是随机上下浮动，偶尔有惊喜，但更多的是惊吓
    更大的战场:
      等级: B
      效果: 敌我双方场地值加一
    手牌增幅:
      等级: B
      效果: 手牌上限+1
    坚忍:
      等级: B
      效果: 牌手血量上限+500

A级天赋（强力特殊能力，影响对战格局）:
  示例:
    钻石之躯:
      等级: A
      效果: 你能将精神力钻石化，获得最顶级的物理防御力。制成的【随从卡】必定带有【坚毅】词条，每次受到的伤害减100
    永不熄灭的金炎:
      等级: A
      效果: 战场上随机敌方随从卡每回合扣除20%最大HP，直至其死亡
    灵魂铸匠:
      等级: A
      效果: 你制作的法术卡费用永久减(1)，最低为0
    预知之眼:
      等级: A
      效果: 每回合开始可预览对手牌库顶1张牌

S级天赋（极为稀有，可改变战局的强力天赋）:
  示例:
    伊芙利特的祝福:
      等级: S
      效果: 第一个召唤出的随从卡获得特殊词条【荣誉击杀】——只有当受到伤害等于当前生命时才会死亡，否则恢复所有生命
    闪击:
      等级: S
      效果: 到自己的第四回合结束，结算双方牌手生命值，生命值高者获胜
    万象归一:
      等级: S
      效果: 你的牌组中可以放入超过2张的同名卡牌，无张数限制
    命运编织:
      等级: S
      效果: 每场对战开始时，可从弃牌堆中选择1张卡牌加入手牌

SS级天赋:
  - 极度稀有，整个王国已知拥有者不超过十人
  - 通常具有改写对战规则的效果

SSS级天赋:
  - 传说级别，近百年来是否出现过尚存争议
  - 传闻具有颠覆世界法则的力量
</rule_talent_system>
