---
<rule_world_overview>
世界观总览：幻卡纪元

核心概念:
  万物皆可成为制卡的素材。从魔物的骨血到星辰的碎片，从山川河流到远古巨兽——这个世界的每一样事物都蕴含着名为【词条】的概念本质。
  制卡师通过精神力剥离、引导、融合这些词条来创造卡牌。而对战者则使用这些卡牌进行战斗，以卡牌为媒介释放封印其中的力量。

世界法则:
  - 卡牌是这个世界力量的载体，从日常生活到军事战争，无处不在
  - 生活类卡牌（汽车、飞艇、食物等）广泛应用于日常，是文明的基石
  - 战斗类卡牌（随从、幻境、环境、法术）用于对战，是力量的象征
  - 每个素材都蕴含着名为【词条】的概念，高阶素材可能蕴含【高阶突变词条】
  - 制卡师的实力取决于精神力强度、素材品质、制卡技术和天赋

社会结构:
  - 制卡师是社会的支柱与力量的象征，受人尊敬
  - 对战者是使用卡牌进行战斗的职业，牌组上限40张
  - 制卡师协会负责等级认证、知识交流与任务发放
  - 素材猎人工会负责魔物讨伐与素材收集任务
  - 各大城市均设有学院培养新生代制卡师和对战者

等级体系（11阶）:
  - 适用于制卡师、魔物、素材与卡牌
  - 【不入流】→【黑铁】→【青铜】→【白银】→【黄金】→【铂金】→【钻石】→【星耀】→【史诗】→【传奇】→【神话】
  - 等级越高，能驾驭的素材和制作的卡牌也就越强
  - 每个等级之间存在巨大的实力鸿沟

角色分类:
  制卡师:
    - 使用精神力制作卡牌的职业
    - 一名强大的制卡师能将山川河流封入卡牌，能将远古巨兽化为伙伴
    - 甚至能创造出足以撕裂苍穹、颠覆法则的禁忌卡牌
  对战者:
    - 使用卡牌进行对战的职业
    - 牌组上限40张
    - 需要根据对手和场合调整牌组构成

素材与词条:
  - 万物皆素材，每个素材都蕴含着名为【词条】的概念
  - 制卡师通过精神力剥离、引导、融合词条来创造卡牌
  - 高阶素材可能蕴含着超越其本身等级的【高阶突变词条】，是制作神卡的基石
  - 词条决定了卡牌的属性和效果

随从训练系统:
  - 对战者可以在平时把随从卡释放出来
  - 随从在卡外可以进行实战训练、特殊修炼
  - 训练可以提升随从的攻击/生命数值，甚至觉醒新词条
  - 训练效果受制卡师等级和随从品质影响
  - 随从训练需要消耗资源（食物、素材等）
</rule_world_overview>
