---
<rule_card_battle>
卡牌对战规则:

基础参数:
  牌手血量: 4000
  场地值: 7（每位牌手各有7点场地值）
  牌组上限: 40张
  每回合抽牌: 1张
  手牌上限: 10张

法力系统:
  初始法力: 1（第一回合拥有1点法力）
  法力增长: 每回合开始时获得1点法力，法力上限+1
  法力上限: 10（第10回合后法力上限不再增长）
  法力回满: 每回合开始时法力回满至上限值
  后手补偿: 后手牌手获得特殊法术卡【魔力水晶】加入手牌
  魔力水晶:
    费用: 0
    类型: 法术卡
    效果: 获得一点临时法力（仅本回合有效）

对战流程:
  - 双方各从牌库顶抽取指定数量的手牌（先手3张，后手4张+1张魔力水晶）
  - 先手方先行动，之后双方轮流行动
  - 每回合开始：法力回满→法力上限+1（上限10）→抽1张牌
  - 行动阶段：可进行召唤、施法、攻击等操作，无次数限制
  - 回合结束：主动宣布结束回合
  - 胜利条件：将对方牌手血量降至0

卡牌类别:

  随从卡:
    核心属性: 攻击力、生命值、费用
    场地占用: 占用场地值1
    行动规则:
      - 上场第一回合处于休眠状态（即召唤失调），不能攻击
      - 从第二回合起，每回合可发动一次攻击
      - 可攻击对方随从或直接攻击对方牌手
    死亡: 生命归零后进入弃牌堆
    白板数值参考（无特殊机制的纯数值随从）:
      1费: 攻击300 / 生命200
      2费: 攻击600 / 生命600
      3费: 攻击800 / 生命800
      4费: 攻击1100 / 生命1200
      5费: 攻击2000 / 生命1000
      6-9费: 攻击2300 / 生命1500
    触发机制:
      战吼: 随从被召唤到场上时立即触发的效果
      光环: 随从存活在场上时持续生效的效果
      亡语: 随从死亡时触发的效果
    随从训练:
      - 可在非对战时释放随从进行训练
      - 训练可提升攻击/生命数值
      - 特殊训练可觉醒新词条

  幻境卡:
    核心属性: 幻境值、费用
    场地占用: 不占用场地值
    运作规则:
      - 属于场地效果，必然触发（不可选择不触发）
      - 对战者受到伤害时，幻境值同步减少
      - 幻境值为零时，幻境效果消失，进入弃牌堆
      - 同时拥有多个幻境时，释放回合最前的幻境优先承受伤害
    示例:
      奇闻兆示:
        费用: 2
        幻境值: 400
        效果: 每回合你的抽牌改为检视牌库顶3张，选1张加入手牌，其余洗回牌库

  环境卡:
    核心属性: 存在回合数、费用
    场地占用: 占用场地值1
    运作规则:
      - 拥有存在回合数，每回合结束减少1
      - 存在回合数归零时环境消失，进入弃牌堆
      - 可选择不触发（与幻境的必然触发不同）
    示例:
      里卡多的选择困难:
        费用: 4
        存在回合数: 6
        效果: 每回合随机消灭一个场上角色

  法术卡:
    运作规则:
      - 使用后立即触发法术效果
      - 使用后进入弃牌堆
    示例:
      紧急会议:
        费用: 1
        效果: 抽2张牌；你使用的下一张带有【人类】前缀的牌费用加(2)
      天使光辉:
        费用: 3
        效果: 抽2张牌

卡牌前缀系统:
  - 卡牌可带有前缀如【人类】【斗者】【虚空】等
  - 不同卡牌具有不同词条
  - 某些随从、幻境、环境、法术效果必须对应卡牌具有相应词条才能使用
  - 前缀是构建牌组协同的核心要素

战斗词条:
  【风怒】: 一回合可以攻击两次
  【圣盾】: 该随从第一次受到的伤害归零
  【嘲讽】: 对方随从必须优先攻击具有嘲讽的随从
  【冲锋】: 上场当回合即可发动攻击（无需休眠）
  【潜行】: 不能被指向性效果选中，直到该随从发动攻击
  【剧毒】: 对随从造成的任何伤害都视为致命伤害
  【吸血】: 该随从造成伤害的同时为牌手恢复等量血量
  【坚毅】: 每次受到的伤害减少固定数值

弃牌堆规则:
  - 法术卡使用后立即进入弃牌堆
  - 随从死亡后进入弃牌堆
  - 幻境值归零后进入弃牌堆
  - 环境回合数归零后进入弃牌堆
  - 如果同时有多张卡牌进入弃牌堆，先释放的卡牌先进入弃牌堆
</rule_card_battle>
