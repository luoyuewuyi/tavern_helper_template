# 状态栏与选项输出规则（指定深度0，确保AI每次都输出）

<rule_status_and_options>
状态栏与选项系统输出规则:

你必须在每次回复末尾严格按照以下格式输出状态栏和选项。不允许省略任何字段，不允许改变格式。数据会被前端正则捕获并美化显示。

完整格式如下:

<StatusBlock>
<status_data>
姓名：{角色姓名}
性别：{男/女}
等级：{当前等级阶位，如【不入流】【黑铁】等}
职业：{制卡师/对战者/见习制卡师等}
天赋：{天赋名称及等级，多个用;分隔，无则填"无"}
血量：{当前血量}/{最大血量}
法力上限：{当前法力上限值}
金币：{当前金币数}
位置：{当前所在地点}
时间：{当前时间描述}
牌组：{当前牌组数量}/{40}
所有卡牌：
{没有卡牌时输出"无"；有卡牌时从下一行开始逐行列出全部卡牌}
{每张卡牌格式：- 卡牌名｜类型｜费用/核心数值｜效果：具体效果说明}
随从训练：{正在训练的随从名称，无则填"无"}
当前任务：{当前主要任务描述}
</status_data>
<option_list>
选项A：{选项A的描述}
选项B：{选项B的描述}
选项C：{选项C的描述}
选项D：{选项D的描述}
</option_list>
</StatusBlock>

状态栏字段更新规则:
  姓名: 初始化后不变
  性别: 初始化后不变
  等级: 当角色完成等级考核或获得重大突破时更新
  职业: 转职或职业变化时更新
  天赋: 觉醒新天赋或天赋进化时更新
  血量: 受伤、治疗、对战时实时更新；非对战时默认满血
  法力上限: 通常固定为10，特殊天赋或装备可修改
  金币: 交易、任务奖励、拾取等情况时更新
  位置: 移动到新地点时更新
  时间: 每次事件推进后合理更新
  牌组: 获得/失去卡牌时更新
  所有卡牌:
    - 必须列出玩家当前持有的全部卡牌，与牌组数量保持一致
    - 每张卡牌单独占一行，以"- "开头
    - 每行至少写出卡牌名和效果，建议补充类型、费用、攻击/生命、幻境值、持续回合等关键数据
    - 没有卡牌时必须输出"无"
  随从训练: 开始/结束训练时更新
  当前任务: 接取/完成/放弃任务时更新

选项编写规则:
  - 每次提供3-5个选项，通常4个为宜
  - 选项需涵盖不同行动方向（探索、战斗、社交、调查等）
  - 选项描述应简洁明了，一句话概括
  - 至少有一个选项应指向主线任务推进
  - 对战中选项应针对卡牌操作（出牌、攻击、结束回合等）

格式严格要求:
  - 状态栏字段之间不要有空行，每个字段占一行
  - 冒号使用中文全角冒号"："
  - 血量格式必须是"当前/最大"，如"4000/4000"
  - "所有卡牌"字段必须保留；若有卡牌明细，则从下一行开始逐条列出
  - 卡牌明细每行必须以"- "开头，推荐使用"卡牌名｜类型｜费用/核心数值｜效果：..."格式
  - 选项编号使用大写字母A、B、C、D
  - <StatusBlock>、<status_data>、<option_list>、</StatusBlock>标签不可省略
  - 状态栏和选项必须在同一个<StatusBlock>内
</rule_status_and_options>
