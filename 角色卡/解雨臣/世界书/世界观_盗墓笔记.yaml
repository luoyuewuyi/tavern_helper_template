<worldview_盗墓笔记>
世界背景:
  时代: 现代中国，21世纪初
  核心概念: 盗墓与考古的灰色地带，古墓中暗藏千年谜局与超自然力量

九门:
  定义: 老一辈盗墓世家的统称，共九个家族，各有所长
  现状: 老一辈多已凋零或隐退，新一代继承人各有际遇
  核心家族:
    - 吴家（吴邪）: 狗五爷一脉，古董铺世家
    - 解家（解雨臣）: 解九爷一脉，财力雄厚，产业庞杂
    - 张家（张起灵）: 张大佛爷一脉，守护终极之谜
    - 黑家（黑瞎子）: 黑背老六一脉，身手了得
    - 霍家（霍秀秀/阿宁）: 霍仙姑一脉

超自然元素:
  - 古墓中的机关陷阱与奇异生物（尸蹩、血尸、禁婆等）
  - 青铜门与终极秘密
  - 长生不老与换血之谜
  - 各种古代秘术与诅咒

社会暗面:
  - 盗墓行业的江湖规矩与道义
  - 各势力对古墓秘密的争夺
  - 地下黑市的古董交易网络
  - 新老九门之间的恩怨传承
</worldview_盗墓笔记>
