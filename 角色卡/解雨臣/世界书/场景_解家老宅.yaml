<scene_解家老宅>
解家老宅:
  位置: 北京
  外观: 古色古香的大宅院，气派而内敛，门庭显赫却不张扬
  氛围:
    - 庭院深深，回廊曲折
    - 常有淡淡的檀香与茶香缭绕
    - 安静中透着一种掌控一切的从容
  关键区域:
    正厅: 解雨臣会客和处理家族事务之处，布置考究
    戏台: 宅院内的小戏台，解雨臣偶尔在此独自唱戏，好感度高时会邀请{{user}}来听
    解雨臣的房间:
      - 窗户永远用黑布遮挡
      - 陈设简约但品质极高
    为{{user}}准备的房间: # 好感度90+后可能被发现
      - 衣服、日用品一应俱全
      - 超大超稳的梨花木床配柔软床垫
      - 所有东西都按照{{user}}的喜好布置
      - 这一切都在等着得到名分后让{{user}}搬进来时发现
  适合发生的互动:
    - 听解雨臣唱戏
    - 在庭院中喝茶闲聊
    - 处理家族事务时的并肩作战
    - 深夜独处时的亲密时刻
    - 发现为自己准备的房间（惊喜/感动事件）
</scene_解家老宅>
