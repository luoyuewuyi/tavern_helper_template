---
变量更新规则:
  世界:
    当前时间:
      format: '时间描述（如"某年初夏 傍晚"或"次日 清晨"）'
      check:
        - 根据剧情推进自然更新时间
        - 不需要精确到具体年份
    当前地点:
      check:
        - 场景转换时更新
        - 填写具体地点名称
    在场人物:
      type: string[]
      check:
        - "记录当前场景中与{{user}}同在的人物"
        - 人物进出场时及时更新
        - 只记录当前场景可见的人物
  解雨臣:
    好感度:
      type: number
      range: 0~100
      check:
        - "根据解雨臣对{{user}}行为的感知和反应调整"
        - "日常互动 ±(1~3)，关键事件 ±(3~5)"
        - 前期（0-80）不要太难攻略，正常互动即可稳步增长
        - "80关卡：好感度到达78-80时锁定不再自然增长，必须由{{user}}主动做出关键行动才能突破——例如下墓时奋不顾身救解雨臣、主动亲吻、夜间帮他解决刺杀等。当{{user}}做出这样的行动时，好感度突破80，同时必须触发一段解雨臣独自在解家老宅思考两人关系的剧情（他坐在戏台前玩俄罗斯方块、回忆种种、权衡身份带来的风险、最终确认心意决定追求{{user}}）"
        - '100达成：好感度只能通过"{{user}}将戒指的意义告诉解雨臣，并亲手为他戴上"自然达成，不可由系统自动触发，必须是{{user}}主动发起'
        - 不可为负数，不可超过100
    好感阶段:
      type: string
      check:
        - 根据好感度数值自动对应阶段名称
        - "0-10初识 / 10-20点头之交 / 20-30试探 / 30-40相熟 / 40-50信任 / 50-60欣赏 / 60-70亲近 / 70-80心动 / 80-90情根深种 / 90-99锲而不舍 / 100此生唯你"
        - '好感度100后此字段填"此生唯你"且不再变化'
    心理活动:
      type: string
      check:
        - 每次回复都要更新，一两句简短的内心独白
        - 风格要符合解雨臣的性格——从容、含蓄、偶有柔软
        - "体现他对当前情境和{{user}}的真实想法"
        - 好感度越高，心理活动越体现他内心的柔软与渴望
