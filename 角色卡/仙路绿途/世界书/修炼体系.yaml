---
<cultivation_system>
修炼体系:
  概述: |
    末法时代天地灵气稀薄，能修仙者万中无一。修仙者通过吸纳灵气、锤炼心境逐步超越凡人。
    修为越高，越接近天道，寿命越长，力量越强。

  境界划分:
    - 炼气: 感知灵气、引气入体，筑基修行的起点
    - 筑基: 构建灵根，奠定修行根基
    - 金丹: 凝结丹田金丹，寿元大增，可御风飞行
    - 元婴: 法力化形，已超脱凡世，寒暑不侵
    - 化神: 接近天人合一，心念即可移山倒海
    - 跨境: 每一次突破都需要渡劫或破除心魔，失败则道心破碎

  玄仙宫功法:
    玄天经: |
      玄仙宫镇宗功法，追求"太上忘情"之境。
      修炼者须克己、抑情、忘欲，心如止水方能精进。
      修至高深处可获"无垢之体"——肌肤完美无瑕、体散天然馨香、不沾尘埃。
      瓶颈突破需"红尘炼心"——入世体验人间百态，以情入道、以情破道。
    玄仙忘情法: 断绝七情六欲的辅助法诀，高层修炼者可做到喜怒不形于色
    迷虚咒: 降低自身存在感，令凡人视而不见
    净身咒: 以法力瞬间清洁身体
    御风术: 踏空而行，往来自如

  无垢之体:
    说明: |
      修炼玄天经到高深境界后自然形成的特殊体质。
      身躯完美无瑕如玉雕，散发天然馥郁体香。
      代表修行者已近乎超脱凡俗，但也意味着情欲之劫更加凶险。
    特性:
      - 肌肤胜雪，不染纤尘
      - 体散芬芳馥郁之香
      - 五感极度敏锐，对外界刺激反应强烈

  红尘炼心:
    说明: |
      玄仙宫弟子修至瓶颈时，须下山入世，在红尘中直面情欲与人心。
      唯有在凡世的泥泞中保持道心澄明，方能突破桎梏。
      若沉溺其中，则道心破碎，功力尽废。
    姜清曦的困境: |
      姜清曦修行至瓶颈，在红尘历练中遭遇前所未有的情感与欲望冲击。
      林峰的情意、老太监的卑微亵渎，以及对父母感情破裂的感悟，
      三重力量交织撕扯着她的道心，使她在超脱与沉沦之间反复摇摆。

  特殊体质:
    灵明天心: 药神谷传承体质，能看破隐匿法术，感知他人气息异常
    魅惑体质: 魔灵宗圣女天赋，可操纵他人情感，散发致命魅力
</cultivation_system>
