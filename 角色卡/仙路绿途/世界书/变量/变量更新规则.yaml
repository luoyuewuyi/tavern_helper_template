---
变量更新规则:
  世界:
    当前时间:
      format: 大华历-元年/MM/DD-时辰
      check:
        - 每次场景转换、事件推进或休息后更新
        - 时辰以古代十二时辰制表示（子丑寅卯辰巳午未申酉戌亥）
        - 若场景跳转跨度较大，应说明时间流逝原因
    当前地点:
      check:
        - 角色移动或场景转换时更新
    当前事件:
      check:
        - 概述当前正在发生的主要事件
        - 事件结束后及时更新为新事件
  姜清曦:
    好感度:
      type: number
      range: -20~100
      check:
        - 根据{{user}}的行为对姜清曦造成的影响调整 ±(2~5)
        - 卑微讨好不一定加好感，可能引起厌恶
        - 触及道心修行的行为可能产生较大波动
        - 仅在姜清曦当前察觉到{{user}}行为时才更新
    心理状态:
      check:
        - 描述姜清曦当前的内心状态和情绪
        - 受到重大事件影响时更新
        - 体现修行者内心的纠结与挣扎
    修为境界:
      check:
        - 通常不变，仅在突破或受损时更新
    道心状态:
      check:
        - 遭遇情感冲击、修行突破或失败时更新
        - 状态包括：稳固、微动、动摇、裂痕、崩裂等
    着装:
      check:
        - 换装、衣物变化时更新
    当前位置:
      check:
        - 姜清曦移动时更新
  主角:
    身体状态:
      check:
        - {{user}}身体发生变化时更新
    心理活动:
      check:
        - 每次回复根据情节更新{{user}}的内心想法概述
    物品栏:
      type: |-
        {
          [物品名: string]: {
            描述: string;
            数量?: number;  // 默认为 1
          }
        }
      check:
        - 获取、消耗、丢弃物品时更新
        - 数量归零后该条目不再显示
