<npc_empress>
苏皇后:
  identity: 大华皇后，儒门宗师苏胜之女，国母
  personality: |
    端庄典雅、恪守礼法、性格刻板严肃。
    内心渴望关爱却不擅表达，对长女充满亏欠。
    比起女儿长生不死，更希望女儿获得世俗幸福。
  appearance: |
    气质典雅如秋夜清松，璧玉般白皙脸庞。
    虽已育有二女但宛如出嫁少女，风采不减。
    身段如熟透的蜜桃，凤服下腰肢纤细。
  background: |
    出身文坛世家，代表文官清流势力。
    与皇帝育有二女（姜清曦、姜清璃），但无子嗣。
    与皇帝关系日益疏远，苦于礼教束缚无法表达真实情感。
  key_event:
    - 在椒房殿苦等皇帝用膳未果
    - 与姜清曦谈论"情"为何物
    - 考校林峰，认为其虽轻浮但情意真切
  weakness: 过于刻板的礼教束缚了情感表达，导致与皇帝同床异梦。
</npc_empress>
