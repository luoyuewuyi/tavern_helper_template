---
<location_palace>
皇宫:
  位置: 京城中心
  特征: |
    大华帝国的权力核心，巍峨壮阔，红墙黄瓦，殿宇层叠。
    前朝后宫分明，龙气缭绕，凡人不得随意出入。
    建于人皇斩断仙灵天柱之地，地下封印着远古力量。
  重要区域:
    - 正殿：皇帝朝议之所
    - 养心殿：皇帝日常起居与密谈之处
    - 椒房殿：苏皇后住所
    - 后山：连接怜月居的山路
</location_palace>

<location_lianyueju>
怜月居:
  位置: 皇宫后山最高峰
  特征: |
    长公主姜清曦的居所与修行之地。
    被强大法阵保护，内部温暖如春，云雾弥漫，宛如人间仙境。
    视野极佳，可俯瞰整个京城与皇宫。
    玉匾散发灵光，环境清幽冷清，人烟稀少。
    后山因某种原因花草茂盛，反季节生长，异常美丽。
    设有正殿（姜清曦修行正坐之处）、观景台、白石亭子。
    由老太监负责清扫与膳食。
  氛围: 幽广清新，朴素脱俗，隔绝风雪，清冷肃穆中透着仙意。
</location_lianyueju>

<location_yongxiang>
永巷:
  位置: 皇宫最偏僻阴暗之处
  特征: |
    皇宫底层太监宫女的聚居之所，是宫中地位最低下之人的栖身地。
    环境肮脏潮湿，阴暗逼仄，充满腐臭与霉味。
    老太监最初就在此处苟延残喘，破屋漏风，生活凄惨。
  氛围: 阴暗、肮脏、绝望，是皇宫光鲜外表下最不堪的角落。
</location_yongxiang>

<location_others>
养心殿:
  位置: 皇宫前朝
  特征: 皇帝日常批改奏章、接见重臣、密谈国事之处。气势恢弘，龙椅高悬。

椒房殿:
  位置: 皇宫后宫
  特征: |
    苏皇后住所，布置典雅庄严。
    皇后常在此独守空房，苦等皇帝驾临。
    是姜清曦探望母亲时的常去之处。

正殿:
  位置: 怜月居内
  特征: 姜清曦修行正坐的核心区域，设有蒲团、香炉，灵气充沛。

起居殿:
  位置: 皇宫后宫
  特征: 皇帝与嫔妃起居之处，装潢华丽。

京城:
  位置: 大华帝国首都
  特征: |
    繁华热闹之都，建于人皇斩仙灵天柱之地。
    设有青楼、赌场、商铺，各色人等往来不绝。
    分内城外城，内城为权贵聚居之所。
    正魔两道的势力在此暗中角力。

萧府:
  位置: 京城内城
  特征: 萧元帅府邸，萧素雅在此养伤。林峰常来此商议军国大事。

王胖子府邸:
  位置: 京城
  特征: 金元商会首领王旺财的豪宅，奢华铺张。

天剑门京城驻地:
  位置: 京城
  特征: 天剑门在京城的据点。

外城马戏团会场:
  位置: 京城外城
  特征: 西域马戏团表演场地，姜清璃曾在此遭遇王旺财的圈套。

老太监的房间:
  位置: 怜月居边角
  特征: 简陋至极的住处，初期是永巷破屋，后被允许搬入怜月居。
</location_others>
