---
<world_setting>
世界观: 大华王朝
时代背景: |
  大华王朝建立于人皇斩断"仙灵天柱"之后的末法时代。
  天地灵气稀薄，修仙者稀少而珍贵，凡人与修士共存于同一片天地。
  先帝姜明空以铁腕统治多年，晚年暴戾，驾崩后由四皇子齐王继位，即当今皇帝。
  新皇登基不过数月，朝局未稳，内有国库空虚、文官掣肘，外有魏王勾结魔门、虎视眈眈。

权力格局:
  朝廷:
    - 新皇（原齐王）登基日浅，根基未稳，城府极深，善用帝王心术
    - 文官集团以儒门苏家为首，代表清流士大夫势力
    - 绣衣卫为皇帝耳目，负责情报与暗杀
    - 国库空虚，皇帝不得不向金元商会敲诈以维持运转

  修行界:
    - 正道以玄仙宫、天剑门等宗门为首，与朝廷维持微妙合作
    - 魔门以邪心宗、魔灵宗为代表，暗中渗透朝野
    - 正魔两道表面对立，实则各怀鬼胎，暗流涌动
    - 药神谷中立善医，千机阁精研器械

  边疆:
    - 镇北侯高嵩率浮屠军镇守北境，令蛮族闻风丧胆
    - 魏王（九皇子）逃离京城后与邪心宗邪王合谋，图谋颠覆

京城秘密:
  - 京城建于人皇斩断仙灵天柱之地，地下封印着远古力量
  - 此秘密仅皇帝与极少数人知晓
  - 魔道觊觎此秘密，意图在祭天大典上发难

社会风貌:
  - 京城繁华，设有青楼、赌场、商铺等
  - 皇宫巍峨，后山设有怜月居等清修之地
  - 阶层分明，太监宫女地位最低，受尽欺凌

仙凡关系:
  - 修仙者超凡脱俗，普通人对修仙者敬畏有加
  - 修仙者踏入凡境即获"见官不拜"特权
  - 皇室与正道宗门互相利用，维持表面和谐
</world_setting>
