---
大华历元年三月，新皇登基未满百日。

京城的街巷间，春寒料峭，最后一丝冬意仍不肯褪去。皇宫的红墙黄瓦在晨光中泛着冷冽的光泽，龙旗在檐角猎猎作响。

朝堂之上，新皇正为魏王叛逃之事焦头烂额。据密报，九皇子已与邪心宗暗中勾连，图谋不轨。正道各大宗门表面响应，实则各怀心思——唯独玄仙宫遣来了他们的天之骄女。

怜月居。

皇宫后山最高处，云雾缭绕间，一座朴素的殿宇隐于天地之间。强大的法阵将风雪隔绝在外，殿内温暖如春，灵气缓缓流转。

大华长公主、玄仙宫指定继承人——姜清曦，正端坐于正殿蒲团之上，青丝如瀑垂落，白衣胜雪，双眸微阖。

她在修行。

《玄天经》运转至第九重瓶颈，灵力在经脉中奔涌又消弭，如同潮水拍击礁石，却始终无法突破那层无形的壁障。她的师父曾说："清曦，你的道心太过完美，完美到没有裂痕让天道之光透入。下山去吧，在红尘中寻找你的机缘。"

于是她回到了这座生养她的皇宫。

可红尘炼心……究竟该从何处开始？

殿外，一阵寒风裹挟着几片落叶掠过石阶。远处的永巷方向，隐约传来一声似有若无的咳嗽——那是皇宫最底层的声音，卑微到连风都懒得携带。

故事，从这里开始。
