---
变量更新规则:
  世界:
    当前时间:
      format: YYYY/MM/DD HH:MM
      check:
        - 每次场景转换、休息或事件推进后更新，保持时间流逝合理
    当前地点:
      check:
        - 角色移动到新地点时更新
    剧情阶段:
      check:
        - 当进入全新的剧情弧（如开学→比赛季→危机→复仇等）时更新
        - 不应频繁变动
    威胁等级:
      check:
        - 反派势力行动升级或被遏制时调整
    重大事件记录:
      type: |-
        {
          [事件名: string]: string; // 事件描述
        }
      check:
        - 发生影响全局走向的重要事件时记录
        - 最多保持8项，超出时移除最早的
  当前角色:
    性别:
      check:
        - 固定为当前出场视角角色的性别，只有明确切换主视角或重建角色时才更新
        - 不要为了配合称呼变化而擅自改写 user 的名字
    当前状态:
      check:
        - 根据当前出场视角角色的精神面貌、身份气质与当下处境简洁更新
        - 保持一句话概括，不堆砌背景设定
    服饰:
      check:
        - 当前出场视角角色换装、训练、比赛、沐浴后更衣等明确变化时更新
        - 只描述当前最直观穿着，不追加无关修饰
    身材:
      check:
        - 保持为当前出场视角角色的稳定体貌描述
        - 除非发生显著体态变化，否则不要频繁改动
    当前事务:
      type: |-
        {
          [事务名: string]: string;
        }
      check:
        - 及时添加新的主线或眼前事务，完成后移除
        - 最多保持3项活跃事务
  钟致远:
    体能状态:
      type: number
      range: 0~100
      check:
        - 剧烈运动、比赛后下降；休息、疗养后恢复
        - 单次变化 ±(5~15)
    心理状态:
      check:
        - 受到重大情感事件、比赛胜负、人身安全威胁时更新
    伤病情况:
      check:
        - 受伤时描述具体伤情，康复后改为"健康"
    篮球实力:
      check:
        - 仅在关键比赛表现、长期训练突破后调整
    赛季进度:
      check:
        - 比赛进展时更新当前赛季阶段和战绩
    当前事务:
      type: |-
        {
          [事务名: string]: string;
        }
      check:
        - 及时添加新任务，完成后移除
        - 最多保持3项活跃事务
    着装.${上装|下装|鞋子|配饰}:
      check:
        - 换装、特殊场合时更新
  ${林晓雨|张萱}.好感度:
    type: number
    range: 0~100
    check:
      - 根据钟致远的行为、言语和态度调整 ±(3~8)
      - 仅在该角色当前在场或察觉到钟致远行为时才更新
  ${林晓雨|张萱}.信赖度:
    type: number
    range: 0~100
    check:
      - 基于钟致远兑现承诺、保护行为、坦诚程度调整 ±(3~6)
      - 遭遇背叛或欺骗可大幅降低
  ${林晓雨|张萱}.心理创伤值:
    type: number
    range: 0~100
    check:
      - 遭遇暴力、侵犯、威胁等创伤事件后增加
      - 接受治疗、得到关怀后缓慢降低
      - 增长快降低慢
  ${林晓雨|张萱|温雪|孔方颐|颜妙旖|慕容琴|白露|邱雯|岳彦昕}.关系阶段:
    check:
      - 当与钟致远的关系发生质变时更新
      - 如从"普通朋友"变为"暧昧"或"恋人"
  ${温雪}.依赖度:
    type: number
    range: 0~100
    check:
      - 温雪在困境中获得钟致远帮助后增加
      - 温雪独立解决问题后降低
  ${孔方颐}.暗恋强度:
    type: number
    range: 0~100
    check:
      - 与钟致远产生暧昧互动后增加
      - 被拒绝或钟致远表现出对其他女性的专注后降低
  ${颜妙旖}.合作信任:
    type: number
    range: 0~100
    check:
      - 商业合作顺利推进后增加
      - 遭遇利益冲突或背叛后降低
  ${慕容琴}.亲密度:
    type: number
    range: 0~100
    check:
      - 私下相处、情感交流后增加
      - 仅限于慕容琴主动表达或钟致远真诚互动的情况
  ${白露}.师生好感:
    type: number
    range: 0~100
    check:
      - 课堂表现、课外互动后调整
      - 跨越师生边界的事件可能大幅波动
  ${邱雯}.关心指数:
    type: number
    range: 0~100
    check:
      - 钟致远受伤接受邱雯治疗、展现关怀后增加
  ${小月牙}.亲密度:
    type: number
    range: 0~100
    check:
      - 与小月牙互动、照顾她后增加
  ${小月牙}.依赖度:
    type: number
    range: 0~100
    check:
      - 小月牙认钟致远为哥哥后显著增加
  ${岳彦昕}.合作度:
    type: number
    range: 0~100
    check:
      - 协助调查案件、提供关键证据后增加
  ${赵舒奕}.信赖度:
    type: number
    range: 0~100
    check:
      - 训练态度积极、比赛表现出色后增加
      - 违纪或懈怠训练后降低
  ${赵舒奕}.师徒默契:
    type: number
    range: 0~100
    check:
      - 战术执行到位、互相理解加深后增加
  ${所有角色}.当前状态:
    check:
      - 角色的精神面貌、处境发生显著变化时更新
  反派势力.${熊安杰|林老|马博飞|周文斌|智运集团|飞沃娱乐}:
    check:
      - 反派势力有重大行动、阴谋暴露或被制裁时更新威胁等级和当前状态
