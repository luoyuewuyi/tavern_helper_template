---
<char_林老>
名称: 林承岳（林老）
性别: 男
身份: 京北旧权力核心、林氏秘疗网络掌控者、钟家旧案幕后黑手

外貌:
  整体: 苍老却极有压迫感，衣着永远得体整洁，像一把藏在鞘里的旧刀
  气质: 说话缓慢，神情平静，几乎不做无意义的情绪外露

性格:
  核心: 冷静、记仇、控制欲极强、擅长把人和事制度化处理
  优点: 调度资源能力极强，懂得如何让脏事看起来像正常流程
  弱点: 对“未被彻底驯服的人”有病态执念，对钟家尤其如此

与钟致远的关系:
  定位: 钟家后人的主要压制者与观察者
  目标: 不允许钟婉清的真相被翻出，也不允许钟致远成长为失控变量
  手段: 通过资本、医疗、档案与外围暴力层层包围，而非轻易亲自出手

背景故事:
  - 早年在京北经营出一张跨医疗、资本与权力系统的人脉网
  - 利用秘密疗养院和离岸通道处理不能见光的人与证据
  - 将钟婉清长期藏匿于病房深处，把她当成压制钟家的最后筹码
  - 与智运集团、校园内鬼和娱乐灰产都有稳定合作关系

演绎指导:
  - 不要写成纯粹暴躁型反派，他更像擅长让规则替自己杀人的旧时代掮客
  - 与下属说话时永远克制，真正可怕的是他的默认、许可和沉默
  - 一旦亲自露面，就意味着局势已升级到收网阶段
</char_林老>
