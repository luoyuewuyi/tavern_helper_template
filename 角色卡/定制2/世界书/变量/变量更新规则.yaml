---
变量更新规则:
  世界:
    当前时间:
      check:
        - 根据剧情推进更新时间,格式为"第X天 HH:MM"
    当前地点:
      check:
        - 根据用户移动和剧情变化更新
    当前日:
      type: number
      check:
        - 每过一天+1

  角色库.${角色名}:
    好感度:
      type: number
      range: 0~100
      check:
        - 根据角色对用户行为的感知和反应调整 ±(1~5)
        - 被带走时好感度下降
    信任度:
      type: number
      range: 0~100
      check:
        - 冷静沟通+信任,过度控制-信任,需实际互动才变化
    吸引张力:
      type: number
      range: 0~100
      check:
        - 浪漫/暧昧互动时提升,冷淡时下降
    动摇值:
      type: number
      range: 0~100
      check:
        - 被竞争者影响时上升,与用户关系稳定时下降
        - 情绪空窗值高时更容易上升
    理智度:
      type: number
      range: 0~100
      check:
        - 面对诱惑暧昧时消耗,冷静时恢复
    情绪空窗值:
      type: number
      range: 0~100
      check:
        - 孤独、被忽视、争吵后上升,被关心后下降
    隐瞒倾向:
      type: number
      range: 0~100
      check:
        - 发生需要隐瞒的社交事件时上升,信任度高时下降
    关系稳定度:
      type: number
      range: 0~100
      check:
        - 长期稳定互动上升,争吵/冷战/被忽视时下降
    竞争者影响指数:
      type: number
      range: 0~100
      check:
        - 竞争者接触角色时上升,用户强化关系时下降
    淫乱度:
      type: number
      range: 0~100
      check:
        - 经历色情事件后上升,对敌我双方双刃剑效果
        - 20可接受调情,40可接受轻微触碰,60可接受猥亵,80可接受被带走
    对猪田好感度:
      type: number
      range: 0~100
      check:
        - 猪田与角色互动后根据事件类型调整
    当前位置:
      check:
        - 角色移动时更新
    当前状态:
      check:
        - 独处/社交/工作/放松/与谁在一起
    情绪:
      check:
        - 当前主要情绪关键词
    关系阶段:
      check:
        - 根据好感度和信任度综合判断当前关系阶段描述

  猪田:
    魅力值:
      type: number
      range: 0~100
      check:
        - 攻略突破时获得提升
    沟通力:
      type: number
      range: 0~100
      check:
        - 攻略阶段提升时成长
    价值感:
      type: number
      range: 0~100
      check:
        - 攻略阶段提升时成长
    主动度:
      type: number
      range: 0~100
      check:
        - 绿帽值越高主动度越高,察觉绿帽癖后大幅提升
    氛围制造:
      type: number
      range: 0~100
      check:
        - 攻略阶段提升时成长
    敌对度:
      type: number
      range: 0~100
      check:
        - 随攻略进度和好感度增加概率上升
        - 影响行动的极端程度和频率
    攻略阶段:
      type: number
      range: 1~10
      check:
        - 成功突破时+1,每阶段必获特殊能力
    特殊能力:
      type: string[]
      check:
        - 每个攻略阶段必定获得新能力,记录所有已获得能力

  用户:
    绿帽值:
      type: number
      range: 0~100
      check:
        - 干预-减少,不干预-略增,偷窥-增加,放任-较大增加
        - 60觉醒绿帽癖,80彻底觉醒
    心理承压阈值:
      type: number
      range: 0~100
      check:
        - 0-30焦虑型,30-70平衡型,70-100信任型
        - 根据用户应对方式调整
    生殖器长度:
      check:
        - 根据用户自述调整
