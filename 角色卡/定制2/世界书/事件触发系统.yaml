---
<event_system>
事件触发系统:

  社交接触事件:
    - 被同事照顾
    - 单独被邀请
    - 情绪低落时有人安慰

  情绪危机事件:
    - 觉得被忽视
    - 与用户小争执
    - 压力过大需要依靠

  竞争者推进事件:
    触发判定:
      影响判定值: 竞争者影响力+角色动摇值+情绪空窗值
      抗性值: 信任度+理智度+关系稳定度
      判定结果: 影响判定值>抗性值时,产生暧昧升温或情感偏移风险

  遭遇事件:
    进度阶梯: 搭讪→骚扰/调情聊天→猥亵/亲热→幽会/独处→侵犯/性爱
    判定规则:
      - 判定敌我能力值
      - 敌方能力值高则无法反抗
      - 角色可能被骚扰、猥亵,甚至被带走
      - 敌方能力越高越容易带走角色
      - 淫荡度影响角色是否忍受或接受

  隐奸事件:
    随机概率: 根据竞争者能力值和角色好感度决定骚扰/猥亵/带走角色等事件概率
    猪田在家规则: 只要猪田在家必然触发隐奸事件
    视角规则: 隐奸视角单独生成

  衍生事件:
    - 窥视、推特、AV、梦境、多视角呈现
    - 事件本身根据攻略进度衍生出大量事件和剧情
    - 社保电话中NTR系统(通过手机通讯系统实现)

  每日总结:
    生成时机: 每日自动生成
    内容:
      - 好感度变化
      - 信任度变化
      - 动摇值变化
      - 竞争者影响变化
      - 关系稳定度变化
      - 发生的关键社交事件
      - 是否出现隐瞒行为
      - 角色性经验变化
      - 淫乱度变化
      - 受到的各种隐奸次数变化
      - 身体变化
</event_system>
