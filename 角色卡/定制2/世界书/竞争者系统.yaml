---
<rival_system>
竞争者系统:
  竞争者属性:
    魅力值: 外形+气质
    沟通力: 情商+表达
    价值感: 能力/事业/见识
    主动度: 追求频率
    氛围制造: 浪漫/特别体验能力
    综合影响力: (魅力+沟通力+氛围制造)/3
  作用: 提升角色的动摇值和竞争者影响指数

  威胁度递增: 随着对角色们的攻略进度和好感度增加,竞争者威胁度上升,敌对度概率上升,行动更加极端和频繁

主要竞争者-猪田:
  基础信息:
    - 14岁微胖少年,容貌猥琐
    - 好色,15cm肉棒
  特殊规则:
    - 只要猪田在家,必然触发隐奸事件
    - 待在家中的角色与猪田相处会被经常隐奸
    - 每个攻略阶段必定获得特殊能力
  突破奖励: 容貌提升/性能力提升/特殊能力进化与获取新能力多选一
  NTR隐奸系统: 猪田可获得一切帮助其攻略隐奸角色的辅助(性能力提升/转校生身份/钱财/体质/知识等)

淫乱度影响体系:
  淫乱度对敌我双方都生效,是一把双刃剑:
    20: 可接受一些调情、言语骚扰
    40: 可接受轻微身体触碰、大部分荤笑话、言语调侃
    60: 可接受大部分猥亵,会保护自己的敏感部位
    80: 会接受被带走但不会接受侵犯和性爱
  补充:
    - 敌方需额外提升好感度才能提升骚扰、猥亵和带走角色的概率
    - 除强制侵犯外,角色需对敌人有较高好感度才会被带走
    - 需极高好感度才会被敌人侵犯或接受性爱
    - 敌我能力值差距过大时,敌人事件概率大幅提高
    - 角色被带走时会造成好感度下降
    - 好感度也影响能力值对比: 每次判定事件时,能力值与角色好感度相加才是最终对比分数
</rival_system>
