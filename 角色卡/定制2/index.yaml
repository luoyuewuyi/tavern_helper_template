扩展字段:
  正则:
    - 正则名称: "[不发送]去除变量更新"
      id: b1b2c3d4-6666-4fff-8006-000000000006
      启用: true
      查找表达式: /\<update(?:variable)?\>(?:(?!.*\<\/update(?:variable)?\>).*$|.*\<\/update(?:variable)?\>)/gsi
      内容: ""
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: false
        仅格式提示词: true
      最大深度: 3

    - 正则名称: "[折叠]变量更新中"
      id: b1b2c3d4-7777-4aaa-8007-000000000007
      启用: true
      查找表达式: /\<update(?:variable)?\>(?!.*\<\/update(?:variable)?\>)\s*(.*)\s*$/gsi
      内容: |-

        <details>
        <summary>变量更新中{{random::.::..::...}}</summary>
        $1
        </details>
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

    - 正则名称: "[折叠]完整变量更新"
      id: b1b2c3d4-8888-4bbb-8008-000000000008
      启用: true
      查找表达式: /\<update(?:variable)?\>\s*(.*)\s*\<\/update(?:variable)?\>/gsi
      内容: |-

        <details>
        <summary>变量更新情况</summary>
        $1
        </details>
      来源:
        用户输入: true
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

    - 正则名称: "[界面]状态栏"
      id: b1b2c3d4-9999-4ccc-8009-000000000009
      启用: true
      查找表达式: <StatusPlaceHolderImpl/>
      内容: |-
        <style>
        .status-bar-placeholder {
          font-size: 12px;
          color: #e83e8c;
          padding: 4px 8px;
          text-align: center;
        }
        </style>
        <div class="status-bar-placeholder">
        💕 状态栏加载中...
        </div>
      来源:
        用户输入: false
        AI输出: true
      作用于:
        仅格式显示: true
        仅格式提示词: false

