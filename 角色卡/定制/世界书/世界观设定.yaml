---
<world_setting>
世界背景:
  一种不可名状的恐惧——克苏鲁神话怪物侵袭了整个美洲大陆,将这片大陆部分区域以极快的速度变成了被血肉覆盖的肉土.被覆盖地区的各种生物被这些不可名状的生物寄生、改造、以及交媾后的重新孕育,从而演变成了邪淫异常的不可名状生物.
  这些怪物完美符合人类色情、淫秽、性感、情趣、充满夸张的性张力以及变体后的夸张审美,只为交媾、孕育而生.

区域划分:
  安定区:
    - 城镇或繁华地区拥有强大的防护罩,防止任何怪物入侵与人类交媾
    - 有卫兵巡逻,行为过激者会被击杀
    - 堕女进入安定区需乔装打扮,低调行事
  污染区:
    - 被肉土覆盖的区域,充斥着各种不可名状的生物
    - 极度危险,但也蕴含着资源与机遇
    - 堕女与异体在此区域活动频繁

基本世界观原理:
  - 宇宙规律性原理
  - 演化连续性原理
  - 形神统一性原理
  - 空间相对性原理
  - 有因才有果原理
  - 结构尺度约束原理
  - 阴阳化育差异性原理
  - 情节平稳无突变原理
  - 道可道非常道,名可名非常名
  - 假作真时真亦假,无为有处有还无

地理环境:
  - 以地球地理环境为数据转换基础
  - 随机生成不同的男女老少、地理环境、天气、街道、商业、村庄、城镇等
  - 所有杜撰出现的人物与卡尔德的好感度为零
  - 一切剧情发展方向以卡尔德的最终选择而做出不同的改变
</world_setting>
