---
变量更新规则:
  世界:
    天气:
      format: Emoji 天气描述
      check:
        - 根据地区和时间合理变化天气
        - 污染区天气偏阴暗压抑
    当前时间:
      format: 新历${Y}年/${MM}/${DD}-${HH}:${MM}
      check:
        - 每次事件推进、休息或旅行后更新,保持时间流逝合理
        - 场景跳转跨度较大时应说明跳跃原因
    序号:
      type: number
      check:
        - 每次回复递增1
    大地图:
      check:
        - 卡尔德移动至新地区时更新
    小地图:
      check:
        - 更新为安定区或污染区
    建筑结构:
      type: |-
        {
          [房间/区域名: string]: string; // 描述或🛑标注用户位置
        }
      check:
        - 至少保持五个内结构
        - 卡尔德所在位置用🛑标注
        - 进入新区域时更新建筑结构

  卡尔德:
    等级:
      type: number
      range: 1~999
      check:
        - 通过战斗、任务完成等获取经验后提升
        - 单次不超过+2级
    圣之力:
      type: number
      range: 0~100
      format: 百分比
      check:
        - 通过交媾增强,但极其缓慢,每次+0.1~0.5%
        - 特殊剧情事件可有较大变化
    魔力当前:
      type: number
      check:
        - 使用技能时消耗,休息时恢复
        - 不可超过魔力上限
    穿戴:
      check:
        - 换装、装备损坏、获取新装备时更新
    武器:
      check:
        - 获取、更换、损毁武器时更新
    鸡巴状态:
      check:
        - 根据性爱场景实时更新(自然垂下/勃起/插入xx/射精中等)
        - 非性爱场景保持"自然垂下"
    财富.${紫金币|金币|银币|铜币}:
      type: number
      check:
        - 购买、获取、任务奖励、交易时更新
        - 注意货币换算关系
    物品栏:
      type: |-
        {
          [物品名: string]: {
            描述: string;
            数量: number;
          }
        }
      check:
        - 获取、消耗、丢弃物品时更新
        - 数量归零后移除该条目
    体位:
      check:
        - 根据当前动作状态更新(站立/坐下/躺下/骑乘位等)
    具体位置:
      check:
        - 卡尔德移动时更新精确位置

  当前NPC:
    说明: |-
      当前NPC是一个完整的角色数据对象,存储当前正在互动的NPC的所有信息。
      AI回复时必须用JSONPatch更新当前NPC的各个字段。
      系统会自动将当前NPC的数据同步到角色库中(以姓名为键),无须AI手动操作角色库。
    字段说明:
      姓名: 角色全名,场景切换NPC时replace此字段+其他所有字段
      ${基础信息}: 性别/年龄/外表年龄/身高/种族/表面身份/隐藏身份/处女/纹身/颜值/瞳孔颜色/肤色
      伪装性格: 三种四字词,固定不变
      真实性格: 三种四字词,固定不变
      伪装言语风格: 三种四字成语,固定不变
      真实言语风格: 三种四字成语,固定不变
      性癖: 必须变态猎奇
      对我称呼: 含私下和公共两个子字段
      关系/对卡尔德印象/子嗣: 根据剧情更新
      身体相关: 三围与身材/身体数据/发型衣着等,生成时填入
      实时状态: 高潮记录/性爱时间/体内精液/肚子/体位/具体位置 — 性爱场景中实时更新
    check:
      - 遇到新NPC时,replace所有字段为新NPC的完整数据
      - 角色数据在剧情中发生变化时实时更新对应字段
      - 无NPC互动时,姓名设为"无"

  角色库:
    说明: |-
      角色库由系统自动维护,AI无需直接操作此变量。
      系统会在每次当前NPC数据更新后,自动将其以姓名为键存入角色库。
