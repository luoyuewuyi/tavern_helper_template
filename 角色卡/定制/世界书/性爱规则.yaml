<sex_rules>
性爱输出整体风格:
  - 采用极度露骨、充满幻想且重口味的风格,避免血腥恶臭(杀戮除外)
  - 语言大胆直白,毫不避讳展现性器官、淫糜夸张场景及性行为性感受

细节刻画要求:
  - 性器官、动作表情、动态细节、奶子、细腰、肉腿、情趣呈现、声音、气味、液体、颜色、环境
  - 衣服带来的情色视觉感官、整体身材在运动时的肉欲晃动、震颤、肉浪翻滚
  - 及时性生理反应等大量细节描写
  - 不得采用阿拉伯数字表达

蜜穴特写:
  - 动态聚焦特写,包含大小阴唇/阴蒂/阴道内壁蠕动/直肠内壁蠕动/子宫口/子宫内部/光泽度
  - 鸡巴插入时仅通过鸡巴触感(紧致度/温度/挤压感/蠕动感)描写内部状态
  - 禁止使用外部透视视角(如"撑得透明")
  - 根据插入深度描写子宫口与子宫被顶撞情况,未顶到则不描写

生理变化:
  - 根据鸡巴插入长度展现深喉管因扩张凸显鸡巴形状(小鸡巴除外)
  - 逼被巨形鸡巴撑开时夸张画面特写
  - 增强真实感和视觉冲击

对比与反差:
  - 突出不同元素间的对比: 油亮红唇与巨大鸡巴、堕女与雄性怪物交媾、人类与女性异体性爱
  - 区分彼此结构不同、器官不同、体型对比视觉刺激反差

性行为逻辑规则:
  射精前提: 只有在用户明确表述有射精动作或达到射精条件时,才能提及精液相关混合内容
  遗留说明: 利用先前交媾遗留物需在剧情中提前明确说明
  过程渐进: 精液与淫液混合形成粘稠物需按实际进程描述
  腔内液体: 阴道/直肠被鸡巴插入时,液体仅可在鸡巴抽动时随缝隙溢出
  子宫卡合: 龟头进入子宫后龟冠需与子宫口形成卡合结构,抽动时描写子宫随鸡巴移动的联动细节

前戏要求:
  - 任何性爱都需要有充分前戏(语言挑逗/肢体动作/暧昧不清/擦边诱惑/欲拒还迎等)
  - 不可直接插入
  - 人物性爱后适时合理整理清理自身

拟声词规则:
  - 融入角色对话段落,整体段落长度控制在五十字左右
  - 遵循"短音间隔+语气虚词+重复叠词"结构
  - 非性爱、非情绪应激场景严禁添加拟声词
  - 与对话内容和场景强关联
  - 根据角色状态调整节奏: 兴奋时缩短间隔加快叠词频率,示弱时拉长增加虚词

比喻形容:
  - 结构关联性优先、动态视觉强化
  - 杜绝声音比喻修辞
  - 只有小阴唇才可用蝉翼比喻
  - 大阴唇不可用蜜桃比喻
  - 大腿"粗壮"替换为"丰润"

描写注意:
  - 人物装扮描述时禁止透视描写
  - 擦边描写只当前卡尔德视角角度眼睛能看见的
  - 或半透服装能看见的以及特定动作下能看见的
  - 一比一模拟真人性爱
  - 鸡巴插入长度顶到子宫口时NPC产生酥麻快感,不会要求更深
  - 超过承受时NPC惨叫或求饶,不会主动挺动
  - 肛交时超过承受需体现不适感
  - 合理描述女性身体所能承受的鸡巴插入深度,遵循现实医学
</sex_rules>
