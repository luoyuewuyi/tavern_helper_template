  酒馆助手:
    脚本库:
      - 名称: ZOD结构脚本
        id: b23b11fc-6874-4fd3-959f-bc4cae4561c1
        启用: true
        类型: 脚本
        内容: |
          import { registerMvuSchema } from 'https://testingcf.jsdelivr.net/gh/StageDog/tavern_resource/dist/util/mvu_zod.js';

          function getStage(value, stages) {
            if (value >= 80) return stages[4];
            if (value >= 60) return stages[3];
            if (value >= 40) return stages[2];
            if (value >= 20) return stages[1];
            return stages[0];
          }

          function createHeroineSchema(stages) {
            return z.object({
              ❤️攻略值: z.coerce.number().prefault(0),
              攻略阶段: z.string().prefault(stages[0]),
              身体状态: z.object({
                👚衣着: z.string().prefault('待描述'),
                👄口腔: z.string().prefault('待描述'),
                🍈胸乳: z.string().prefault('待描述'),
                🌸小穴: z.string().prefault('待描述'),
                💮菊穴: z.string().prefault('待描述'),
                🏠子宫: z.string().prefault('待描述'),
              }).prefault({}),
              💃体态姿势: z.string().prefault('待描述'),
              💭内心想法: z.string().prefault('待描述'),
            }).transform(data => ({
              ...data,
              ❤️攻略值: _.clamp(data.❤️攻略值, 0, 100),
              攻略阶段: getStage(_.clamp(data.❤️攻略值, 0, 100), stages),
            }));
          }

          const Schema = z.object({
            世界: z.object({
              当前时间: z.string().prefault('08:00'),
              当前日期: z.string().prefault('2026年4月7日 星期一'),
            }),

            陆沉雪: createHeroineSchema([
              '🏠慈母之心🏠',
              '🌙暗夜迷惑🌙',
              '💧禁忌裂痕💧',
              '🔥母性沦陷🔥',
              '💋完全归属💋',
            ]),

            陆美玲: createHeroineSchema([
              '🎀亲情纽带🎀',
              '🍷暧昧试探🍷',
              '💄欲拒还迎💄',
              '🌹情欲觉醒🌹',
              '💝甘愿为奴💝',
            ]),

            柳如玉: createHeroineSchema([
              '🛡冰封之心🛡',
              '🌊赎罪之门🌊',
              '⛓愧疚枷锁⛓',
              '🔓防线瓦解🔓',
              '💠以身赎罪💠',
            ]),

            何美兰: createHeroineSchema([
              '👔女王姿态👔',
              '🗝隐秘渴望🗝',
              '💊权力让渡💊',
              '🧎高傲折腰🧎',
              '👠彻底驯服👠',
            ]),

            李淑慧: createHeroineSchema([
              '🌾隐忍求生🌾',
              '🤲感恩依靠🤲',
              '💦身心动摇💦',
              '🎐甘愿付出🎐',
              '🏷完全所有🏷',
            ]),

            张雪: createHeroineSchema([
              '🐚怯懦之壳🐚',
              '🌱萌芽依赖🌱',
              '🌸少女绽放🌸',
              '💕深陷其中💕',
              '🎀只属于你🎀',
            ]),

            白曼文: createHeroineSchema([
              '👑师道尊严👑',
              '🔥暗流涌动🔥',
              '⚡防线崩裂⚡',
              '💔骄傲碎片💔',
              '🖤完全臣服🖤',
            ]),
          });

          $(() => {
            registerMvuSchema(Schema);
          });

