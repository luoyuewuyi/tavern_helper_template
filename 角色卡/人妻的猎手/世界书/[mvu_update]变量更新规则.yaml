变量更新规则:
  世界:
    当前时间:
      format: "HH:MM"
      check:
        - 每次场景推进后更新
        - 日常互动每次推进10~30分钟
        - 性爱场景每阶段推进5~15分钟
        - 课堂按真实课时推进（一节课45分钟）
    当前日期:
      format: "YYYY年MM月DD日 星期X"
      check:
        - 时间超过24:00时自动进入下一天
        - 星期必须与日期对应正确

  ${陆沉雪|陆美玲|柳如玉|何美兰|李淑慧|张雪|白曼文}:
    ❤️攻略值:
      type: number
      range: 0~100
      check:
        - 仅在{{user}}与该女主发生合理互动时更新
        - 每次上涨1~5点，必须为整数，不允许小数
        - 普通对话+1~2，帮助或关心+2~3，关键事件或突破心理防线+3~5
        - 不允许单次超过5点，不允许下降，到100后不再增长
    攻略阶段:
      check:
        - 禁止手动更新，由系统根据❤️攻略值自动推导
    身体状态:
      check:
        - 当该女主的衣物、身体部位发生状态变化时更新对应子字段
        - 描述当前实际状态，参考该女主基础档案中的身材和穿着设定
        - 无相关事件发生的子字段保持原值不变
    💃体态姿势:
      check:
        - 每次回复更新，描述该女主当前所在位置和身体姿势
    💭内心想法:
      check:
        - 每次回复更新，用该女主自己的语气写一到两句当前核心想法
        - 必须符合当前攻略阶段的心理状态
        - 不可泄露该女主尚不知道的信息
