---
变量更新规则:
  世界:
    当前时间:
      format: YYYY/MM/DD HH:MM
      check:
        - 每次事件推进、战斗或探索后更新，保持时间流逝合理
    当前副本:
      check:
        - 仅在主线任务完成、通过传送门或被强制传送时变更
    副本难度:
      type: G|F|E|D|C|B|A|S|SS|SSS
      check:
        - 随副本变更而更新，同一副本内不可修改
    副本规则:
      check:
        - 进入新副本时设定，描述该副本的独特规则和限制条件
        - 一个副本一套规则，副本内不可修改
    副本进度:
      check:
        - 根据主角行动和事件推进实时更新当前进展阶段
    存活参与者:
      type: number
      check:
        - 有参与者死亡或退出时减少，不可随意增加
    近期事件:
      type: |-
        {
          [事件名: string]: string; // 事件描述
        }
      check:
        - 记录最近发生的重大事件，保持5~8条
        - 过旧的事件及时移除，新事件及时添加
  主角:
    等级:
      type: number
      check:
        - 经验值达到经验上限时自动升级，等级+1
        - 升级时经验值清零，经验上限提升(前一次经验上限×1.5向上取整)
        - 每次升级获得3点可用属性点
    经验值:
      type: number
      check:
        - 击杀怪物、完成任务、特殊事件获取经验
        - 不可为负数
    可用属性点:
      type: number
      check:
        - 仅通过升级获得，每级+3点
        - 玩家通过UI分配后减少（由脚本处理，AI不主动修改此值）
    空间积分:
      type: number
      check:
        - 通关副本、完成任务、击杀怪物、出售物品获取
        - 购买商品、使用特殊服务扣除
        - 不可为负数
    HP:
      type: number
      check:
        - 受到伤害时减少，使用回复物品或休息时恢复
        - 不可超过HP上限，归零时主角濒死
    HP上限:
      type: number
      check:
        - 体质属性每增加1点，HP上限+5
        - 装备和天赋可提供额外加成
    精神值:
      type: number
      range: 0~100
      check:
        - 遭遇恐怖/诡异事件、精神攻击时降低
        - 休息、使用安定剂时恢复
        - 低于30时出现幻觉等负面效果，归零则精神崩溃
    法力值:
      type: number
      check:
        - 使用主动技能消耗法力值
        - 休息或使用法力药水恢复
        - 不可超过法力上限
    法力上限:
      type: number
      check:
        - 智力属性每增加1点，法力上限+3
    状态异常:
      type: |-
        {
          [异常名: string]: string; // 异常描述及持续效果
        }
      check:
        - 中毒、流血、恐惧等负面状态在触发时添加
        - 治疗、时间流逝或特殊手段解除后移除
    六维属性.${力量|敏捷|体质|智力|感知|魅力}:
      数值:
        type: number
        check:
          - 无上限，可无限成长
          - 通过属性点分配（由脚本处理）、训练、特殊事件、药剂等方式提升
          - AI可在重大训练/突破事件中调整 ±1~3
      加成:
        type: number
        check:
          - 来自装备、天赋、状态效果的临时/永久加成
          - 装备更换或效果消失时同步更新
    技能:
      type: |-
        {
          [技能名: string]: {
            类型: '主动' | '被动';
            等级: 'G'|'F'|'E'|'D'|'C'|'B'|'A'|'S'|'SS'|'SSS';
            描述: string;
            冷却: string;
          }
        }
      check:
        - 通过副本奖励、商店购买、特殊事件获得新技能
        - 反复使用或特殊材料可提升技能等级
        - 技能等级提升时更新描述和冷却
    天赋:
      type: |-
        {
          [天赋名: string]: {
            稀有度: 'G'|'F'|'E'|'D'|'C'|'B'|'A'|'S'|'SS'|'SSS';
            效果: string;
            来源: string;
          }
        }
      check:
        - 通过副本通关、特殊成就、隐藏事件获得
        - 天赋一旦获得不可失去，但效果可能随成长进化
    装备栏.${武器|头部|上身|下身|鞋子|饰品}:
      type: |-
        {
          名称: string;
          品质: 'G'|'F'|'E'|'D'|'C'|'B'|'A'|'S'|'SS'|'SSS';
          效果: string;
          主角评价: string;
        }
      check:
        - 穿戴、损坏、替换装备时更新
        - 未装备时名称为"空置"
        - 更换装备时同步更新对应属性加成
    背包:
      type: |-
        {
          [物品名: string]: {
            描述: string;
            数量: number;
            品质: 'G'|'F'|'E'|'D'|'C'|'B'|'A'|'S'|'SS'|'SSS';
          }
        }
      check:
        - 获取、消耗、丢弃、交易物品时更新
        - 数量归零后自动清除
  商店:
    商品列表:
      type: |-
        {
          [商品名: string]: {
            价格: number; // 空间积分
            描述: string;
            库存: number;
            品质: 'G'|'F'|'E'|'D'|'C'|'B'|'A'|'S'|'SS'|'SSS';
          }
        }
      check:
        - 进入新副本时刷新全部商品
        - 购买后库存-1，库存归零自动移除
        - 商品品质和价格应与当前副本难度匹配
  队友:
    type: |-
      {
        [队友名: string]: {
          好感度: number; // 0~100
          状态: string;
          职业: string;
          等级: number;
          HP: number;
          HP上限: number;
          六维属性: {
            力量: number;
            敏捷: number;
            体质: number;
            智力: number;
            感知: number;
            魅力: number;
          };
          技能: {
            [技能名: string]: {
              类型: '主动' | '被动';
              等级: 'G'|'F'|'E'|'D'|'C'|'B'|'A'|'S'|'SS'|'SSS';
              描述: string;
            }
          };
          装备: {
            [武器|头部|上身|下身|鞋子|饰品]: {
              名称: string;
              品质: 'G'|'F'|'E'|'D'|'C'|'B'|'A'|'S'|'SS'|'SSS';
              效果: string;
            }
          };
          主角评价: string;
        }
      }
    check:
      - 副本中遇到NPC队友时添加，需填充完整属性（等级、HP、六维属性、技能、装备）
      - 根据互动行为调整好感度 ±3~6
      - 队友死亡或离队时移除
      - 队友等级、HP根据战斗和剧情合理变化
      - 队友获得或更换装备/技能时同步更新
      - 队友属性值应与其等级和职业匹配，不可随意大幅改变
      - 新队友加入时六维属性总和大致在 60~120 之间（视等级而定）
  ${队友名}.主角评价:
    check:
      - 在对应队友发生重要互动后更新
      - 语言保持第一人称/贴近主角口吻
  任务列表:
    type: |-
      {
        [任务名: string]: {
          类型: '主线' | '支线' | '隐藏' | '紧急';
          说明: string;
          目标: string;
          奖励: string;
          状态: '进行中' | '已完成' | '失败';
        }
      }
    check:
      - 进入副本时自动生成主线任务
      - 主线任务必须完成才能离开当前副本
      - 支线任务可选完成，提供额外奖励但不强制
      - 完成任务后状态改为"已完成"，发放奖励
      - 副本结束后清除已完成的任务
  副本日志:
    type: |-
      {
        [副本名: string]: {
          难度: 'G'|'F'|'E'|'D'|'C'|'B'|'A'|'S'|'SS'|'SSS';
          结果: string;
          收获: string;
        }
      }
    check:
      - 每次副本结束后记录通关/失败结果和获得的奖励
      - 保持最近10个副本记录，超出时移除最早的
