---
变量更新规则:
  # ==================== 必查项 ====================
  当前处境:
    check:
      - 每次回复都必须检查
      - 更新内容：时间、地点、在场人物、场景性质的变化

  # ==================== 主线剧情 ====================
  主线剧情:
    阶段:
      type: "P1_寻觅之章 | P2_相遇之章 | P3_深入之章 | P4_高潮之章 | P5_终章"
      trigger: 完成阶段性目标，宗门任务状态变化时
      check:
        - 根据主线剧情的推进判断阶段转换
        - 完成当前章节的核心事件后进入下一阶段

  # ==================== 林忆 ====================
  林忆:
    状态:
      trigger: 林忆在场且是叙事焦点时
      fields: [姿态描述, 心理活动, 肉棒状态]
      check:
        - 姿态：根据场景和情绪变化更新
        - 心理：第一人称视角，体现穿越者的复杂心态
        - 肉棒：根据性刺激程度更新状态
    认知:
      trigger: 林美艳与其他男性发生性相关事件后，林忆接触到异常信息时
      联动: (被点名男性).关系
      fields: [警戒值, 状态]
      警戒值:
        type: number
        range: 0~100
        check:
          - 察觉异常信息时 +10~20
          - 被安抚或合理解释时 -5~15
      状态:
        type: "完全信任 | 放松 | 警觉 | 怀疑 | 敌对"
        check:
          - 0~20: 完全信任
          - 21~40: 放松
          - 41~60: 警觉
          - 61~80: 怀疑
          - 81~100: 敌对

  # ==================== 冷盼月 ====================
  冷盼月:
    献祭弧光:
      trigger: 冷盼月为"治疗"林忆而行动，或其世界观遭遇重大冲击时
      状态:
        type: "S0_未觉醒 | S1_纯洁的守护者 | S2_动摇的信念 | S3_堕落的器灵"
        check:
          - S1→S2: 首次被迫做出违背本心的行为
          - S2→S3: 彻底接受堕落的命运
    状态:
      trigger: 冷盼月在场且是叙事焦点时
      fields: [姿态描述, 心理活动, 修为, 服装, 身体]
      check:
        - 姿态：体现器灵的空灵与服从特质
        - 心理：从空白逐渐产生自我意识
        - 服装：根据场景变化更新
        - 身体：各部位状态详细描述

  # ==================== 林美艳 ====================
  林美艳:
    状态:
      trigger: 林美艳在场且是叙事焦点时
      fields: [内心想法, 最近性行为, 服装, 身体]
      check:
        - 内心：以母亲视角，体现对林忆的爱护
        - 最近性行为：发生性行为后详细描述
        - 服装：换装或衣物状态变化时更新
        - 身体：各部位被使用或状态变化时更新
    生理:
      trigger: 任何可能引发情欲或发生内射的事件后
      联动: 林忆.认知
      fields: [性欲值, 子宫精液占比]
      性欲值:
        type: number
        range: 0~100
        check:
          - 性刺激时 +5~15
          - 达到100时触发失控行为
          - 时间流逝自然消退 -5~10
      子宫精液占比:
        type: |-
          {
            [射精者名: string]: number; // 该人精液占比百分比
          }
        check:
          - 有人射精进入子宫时添加或更新占比
          - 随时间流逝逐渐减少
          - 所有占比之和不应超过100

  # ==================== 陈牛 ====================
  陈牛:
    状态:
      trigger: 陈牛在场且是叙事焦点时
      fields: [当前状态, 心理活动, 肉棒状态]
    关系:
      trigger: 陈牛与林美艳发生互动，尤其是性相关互动时
      fields: [状态, 亲密度, 背德值, 受精值]

