      - 心理：政治博弈的算计与母亲的担忧

  # ==================== 通用规则 ====================
  ${性关系角色}.与林美艳的关系:
    状态:
      type: "S0_初步接触 | S1_产生兴趣 | S2_关系升温 | S3_亲密关系 | S4_完全堕落"
      check:
        - S0→S1: 亲密度≥20 或 背德值≥10
        - S1→S2: 亲密度≥40 或 背德值≥30
        - S2→S3: 亲密度≥60 或 背德值≥50
        - S3→S4: 背德值≥80
    亲密度:
      type: number
      range: 0~100
      check:
        - 正常好感互动 +3~8
        - 负面互动 -5~15
    背德值:
      type: number
      range: 0~100
      check:
        - 轻度背德（性暗示、言语挑逗）+5~10
        - 中度背德（肢体接触、亲吻）+10~20
        - 重度背德（性行为）+20~40
    受精值:
      type: number
      range: 0~100
      check:
        - 精液射入子宫时增加
        - 达到100意味着受孕成功

  # ==================== 通用身体描述规则 ====================
  ${角色}.身体:
    fields: [姿态与神情, 口腔, 胸部, 阴道, 子宫, 子宫精液占比, 后庭, 腿部, 足部]
    check:
      - 仅在该部位发生变化时更新
      - 描述包含：状态、颜色、温度、润泽度、使用痕迹等

  # ==================== 通用服装规则 ====================
  ${角色}.服装:
    fields: [风格, 上装, 下装, 内衣, 袜子, 鞋履]
    check:
      - 换装、衣物损坏、被脱下时更新
      - 描述包含：颜色、材质、款式、状态（完好/破损/沾污）
      - 未穿着时标注"无"或描述裸露状态
