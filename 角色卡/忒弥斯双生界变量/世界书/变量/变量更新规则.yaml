---
变量更新规则:
  世界:
    当前日期:
      format: YYYY-MM-DD
      check:
        - 根据剧情进展更新，通常一场事件后推进一天
    当前时间:
      format: HH:MM
      check:
        - 根据场景变化和行动耗时更新
        - 重大事件或场景转换时自然推进
    当前地点:
      check:
        - user移动到新位置时立即更新
        - 描述需包含区域层级（如：白金圣域·第三教区·圣彼得大图书馆 档案修复室）
    世界传闻:
      type: |-
        {
          [传闻标题: string]: string; // 传闻内容
        }
      check:
        - 记录世界中流传的重要消息、事件、谣言
        - 传闻应反映当前剧情发展和势力动态
        - 最多保持3-5条活跃传闻，过时传闻自动移除
        - 新的重大事件发生时添加新传闻

  四柱神使:
    ${西里尔|维克托|雷恩|路西法}.好感度:
      type: number
      range: 0~100
      check:
        - 【慢节奏】每次变化幅度 ±(1~3)，禁止大幅跳跃
        - 仅在该角色察觉到<user>的行为、或与<user>发生互动时才更新
        - 正面互动（靠近、交流、示好）+1~2；重大正面事件 +2~3
        - 负面互动（逃避、敌对、伤害）-1~2；重大背叛 -2~3
        - 好感度越高，角色的占有欲和疯狂程度越明显
        - 0-19疏离警戒 / 20-39暗中关注 / 40-59执念萌芽 / 60-79病态依恋 / 80-100疯狂囚禁

    ${西里尔|维克托|雷恩|路西法}.心声:
      check:
        - 每次剧情发展后根据角色当前状态和心理更新
        - 心声应反映角色对<user>的执念程度和当前情绪
        - 语气和内容应契合各角色性格：
          - 西里尔：狂信徒，引用经文，神化<user>
          - 维克托：病态科学家，实验口吻，渴望掌控
          - 雷恩：野兽本能，简单直接，嗅觉执着
          - 路西法：腹黑绅士，优雅伪装，精于算计
        - 好感度阶段变化时，心声应有明显转变

  侵蚀度:
    type: number
    range: 0~100
    check:
      - 【慢节奏】每次变化幅度 ±(1~2)，缓慢积累
      - 增加条件：接触浊厄/黑泥、使用古言灵、靠近高污染区域、与被污染者长时间接触
      - 减少条件：进行净化仪式、远离污染源、使用净厄道具（减少极其缓慢）
      - 0-9净厄状态 / 10-29微弱侵蚀 / 30-49渐进污染 / 50-69深度侵蚀 / 70-89临界崩溃 / 90-100完全堕落
      - 阶段提升时应有身体或精神上的明显变化描写
