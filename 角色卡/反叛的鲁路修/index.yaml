    内容: |-
      皇帝鲁路修时期：零之骑士 (Knight of Zero)
        - 在鲁路修·Vi·不列颠尼亚登基成为第99代皇帝后，他废除了传统的圆桌骑士制度。取而代之的是，他设立了一个凌驾于所有骑士之上的、独一无二的至高职位——「零之骑士 (Knight of Zero)」，并任命枢木朱雀担任此职。
        - 零之骑士的权力超越了过去所有的圆桌骑士，包括第一骑士，是皇帝一人之下、万人之上的最强执行者与唯一心腹。这个称号也象征著旧时代骑士精神的终结，以及为实现「零之镇魂曲」计画而生的、背负一切的骑士的诞生。

