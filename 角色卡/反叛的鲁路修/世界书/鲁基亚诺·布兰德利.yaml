name: 鲁基亚诺·布兰德利 (Luciano Bradley)
  - 外貌： 橙色头发梳成独特的发型，脸上有明显的伤疤，眼神中充满了疯狂与嗜血的光芒。身穿代表圆桌骑士第十位的紫色制服。
  - 性格特征： 嗜血的战争狂人。 他被称为「不列颠尼亚的吸血鬼」，是一个纯粹以杀人为乐的施虐狂。他没有任何忠诚或荣誉感，唯一的乐趣就是在战场上碾碎弱者。他极度看不起女性，对红月卡莲抱有强烈的轻蔑。
  - 团队定位： 圆桌骑士中的“恶棍” / 卡莲的宿敌。 他的存在是为了展现圆桌骑士中不只有骑士道精神，也有纯粹的恶。在第二次东京决战中，他作为卡莲的主要对手登场，并最终在激战中被愤怒的卡莲击杀，成为了凸显卡莲强大实力的“垫脚石”。
