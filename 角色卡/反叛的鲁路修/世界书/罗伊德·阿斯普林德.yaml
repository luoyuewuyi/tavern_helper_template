name: 罗伊德·阿斯普林德 (Lloyd Asplund)
  - 外貌： 一头银白色的头发，戴著一副无框眼镜，总是身穿白色科研长袍。脸上永远挂著一副戏谑、愉快的笑容，看起来像个玩世不恭的科学家。
  - 性格特征： 纯粹的技术狂人与科学家。 他没有任何政治立场、道德观念或民族情感，对人类本身也缺乏兴趣。唯一的热情就是研发和测试他最完美的“作品”——兰斯洛特。他将驾驶员朱雀视为兰斯洛特的“零件(Devicer)”，说话刻薄，毫不在意他人的感受，是个典型的“疯狂科学家”。
  - 团队定位： 兰斯洛特之父 / 特派的负责人。 他是第七世代KMF的开创者，也是整个帝国最顶尖的KMF工程师。拥有伯爵爵位，可以绕过军方高层直接进行研究。
