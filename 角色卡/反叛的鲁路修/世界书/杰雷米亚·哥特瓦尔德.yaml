name: 杰雷米亚·哥特瓦尔德 (Jeremiah Gottwald)
  - 外貌： 金色短发，蓝色眼眸，相貌英俊但表情严肃。初期身穿蓝色军服，后期被改造为生化人，身体大部分机械化，左眼装有Geass消除器。
  - 性格特征： 极端的忠诚。 初期是狂热的「纯血派」，极度歧视日本人。在被Zero羞辱地称为「Orange」并失势后，他的人生目标就变成了洗刷污名和向Zero复仇。而在得知鲁路修的真相后，他将这份偏执转化为对鲁路修的绝对忠诚，成为了最可靠、最狂热的护主之盾。
  - 团队定位： 忠义的化身 / Orange君。 他是剧中人物弧光最完整的配角之一，从一个可恨的敌人，变成一个可笑的丑角，最终升华为一个可敬的忠臣。
