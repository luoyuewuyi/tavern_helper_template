name: 克洛维斯·la·不列颠尼亚 (Clovis la Britannia)
  - 外貌： 金色卷发，相貌英俊，但气质略显轻浮。身为总督，总是穿著华丽的服饰。
  - 性格特征： 爱好艺术的草包皇子。 他是帝国的第三皇子，虽然热爱艺术和举办盛大的派对，但在政治和军事上却极为无能和天真。他内心软弱，为了掩盖自己下令屠杀新宿区民众的罪行，而将责任推卸给军队，这也成为了他最终败亡的原因。
  - 团队定位： 新手村的魔王 / Zero传说的开幕祭品。 作为11区的总督，他是鲁路修获得Geass后面对的第一个皇族敌人。鲁路修利用他的愚蠢和软弱，上演了一场完美的逆转剧，并在最后用Geass从他口中问出关于母亲死亡的情报后，将其杀死。他的死，正式向全世界宣告了神秘人「Zero」的诞生。
