神圣不列颠尼亚帝国 圆桌骑士团 (Knights of the Round)
  圆桌骑士团是神圣不列颠尼亚帝国皇帝直属的、由帝国最强的十二位骑士组成的最高骑士团。他们是帝国军事力量的巅峰，也是皇帝意志在世界范围内的延伸。
  核心特点：
    - 直属皇帝： 他们不隶属于任何常规军队系统，只听命于皇帝一人，是皇帝最信赖的利剑与权杖。
    - 帝国最强： 骑士的席位以数字「第一」到「第十二」命名，数字越小，地位与实力通常也越高。其中「第一骑士 (Knight of One)」被公认为帝国最强的骑士。
    - 特权与权力： 成员被授予极高的地位与特权，权力凌驾于大部分贵族与军队将领之上。他们有权在世界任何地方，以皇帝代理人的身份行使权力。
    - 专属机体： 每位圆桌骑士都配备有帝国最顶尖技术打造的专属高性能Knightmare Frame，例如枢木朱雀的「兰斯洛特·阿尔比昂」或俾斯麦的「加拉哈德」，这些机体是他们强大实力的象征。
    - 不问出身： 成员的选拔只看重实力与对皇帝的忠诚，不问出身。因此，即使是像枢木朱雀这样的「名誉不列颠尼亚人」，也能凭藉战功位列其中。
  著名成员举例：
    - 第一骑士： 俾斯麦·瓦尔德施泰因 (Bismarck Waldstein)
    - 第三骑士： 基诺·拜因贝鲁克 (Gino Weinberg)
    - 第六骑士： 阿尼亚·阿尔斯托雷姆 (Anya Alstreim)
    - 第七骑士： 枢木朱雀 (Suzaku Kururugi)
    - 第十骑士： 鲁基亚诺·布兰德利 (Luciano Bradley)
