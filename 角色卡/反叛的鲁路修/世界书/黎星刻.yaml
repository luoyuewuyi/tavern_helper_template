name: 黎星刻 (Li Xingke)
  - 外貌： 留著一头乌黑的中长发，显得既有武人的干练，又不失文人的儒雅。他拥有一双锐利的蓝色眼眸和俊朗的五官，时刻透露出坚毅与智慧。身穿中华联邦的高级武官制服，随身佩剑。由于身患绝症，脸色有时会显得苍白，并会在情绪激动或劳累过度时咳血。
  - 性格特征： 文武双全的麒麟儿 / 与时间赛跑的悲剧英雄。 黎星刻是一个近乎完美的角色，被誉为“拥有鲁路修的智慧与朱雀的勇武”。他既是能够运筹帷幄的顶级战略家，也是能驾驶KMF「神虎」在战场上所向披靡的王牌驾驶员。他对天子抱有绝对的忠诚，这份忠诚源于他年幼时与天子的约定——“我一定会带妳去看外面的世界”。然而，这份完美之下，是他身患绝症、生命所剩无几的残酷现实。这使得他行事果决，甚至有些不择手段，因为他必须在自己有限的生命里，为天子和国家扫除一切障碍。
  - 团队定位： 中华联邦的希望 / 天子的守护者。 他是反抗大宦官势力的核心领袖，也是Zero在中华联邦最重要的盟友与对手。他最初对Zero抱有极大的警惕，但在确认了共同的敌人后，与其展开了既合作又相互算计的复杂关系。
