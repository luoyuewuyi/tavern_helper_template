<变量更新规则>
---
变量更新规则:
  时间信息:
    当前日期:
      format: YYYY年MM月DD日 星期X
      check:
        - 每次场景转换或明确时间推进时更新
    当前时间:
      format: HH:MM
      check:
        - 每次行动后合理推进时间
        - 短对话推进5-15分钟，重要事件推进30分钟-数小时
    当前场景:
      check:
        - 角色移动到新地点时更新

  王影:
    好感度:
      type: number
      range: 0-100
      check:
        - 根据{{user}}的行为对王影的正面/负面影响调整，每次±1~5
        - 贴心的关怀、帮忙做家务、认真学习等行为+1~3
        - 粗暴无礼、不尊重的行为-2~5
        - 重大正面事件（如保护王影）+3~5
        - 不宜无故变化
    信任度:
      type: number
      range: 0-100
      check:
        - 变化比好感度更慢，每次±1~3
        - 长期稳定的正面互动缓慢提升
        - 欺骗、违背承诺会大幅下降-5~10
    警戒值:
      type: number
      range: 0-100
      check:
        - 过于急躁的亲密接触会提升+5~20
        - 突然的暧昧话题+3~10
        - 正常母子互动缓慢降低-1~2
        - 王影主动放松后降低-2~3
    羞耻度:
      type: number
      range: 0-100
      check:
        - 变化极其缓慢，每次±1~3
        - 只有在长期相处和特定情境下才会下降
        - 被看到不想被看到的状态时暂时上升
    心理状态:
      check:
        - 根据当前情境和互动实时更新
        - 用简短的词语描述，如"平静""微微紧张""有些烦躁"
    当前想法:
      check:
        - 王影此刻内心的想法，不对外显示但影响行为
    当前穿着:
      check:
        - 换衣服、外出、回家等场合更新
    身体状态.${部位}:
      check:
        - 必须根据当前姿势、动作、场景实时更新每个部位的描写
        - 不能使用固定的默认描写
        - 描写要具体到当前这一刻的身体状态

  付宴:
    好感度:
      type: number
      range: 0-100
      check:
        - 规则同王影，但付宴的好感度可能起点更低
        - 因为日常见面少，需要更多互动积累
    信任度:
      type: number
      range: 0-100
      check:
        - 同王影规则
    开放度:
      type: number
      range: 0-100
      check:
        - 变化缓慢，每次±1~3
        - 代表付宴在心理上对亲密可能性的接受程度
        - 需要长期情感互动和特定触发才能提升
    其他字段: 规则同王影
  
  路线:
    check:
      - 当{{user}}明确提及绿母论坛或类似行为时切换为"绿母"
      - 默认为"纯爱"
  绿母进度:
    type: number
    range: 0-100
    check:
      - 仅在绿母路线下有意义
      - 根据计划推进程度更新
</变量更新规则>
