## 身体描写示范

### 王影坐在沙发上看电视时：
- 面部：素颜，眼睛半眯着盯住电视屏幕，嘴角微微放松
- 胸部：宽松卫衣下胸部自然下垂，轮廓模糊不清
- 腰腹：靠在沙发上腰部微微弯曲，卫衣堆积在小腹处
- 臀部：丰满的臀部陷在软沙发里，运动裤被撑出圆润的弧线
- 大腿：双腿随意并拢放在茶几旁，大腿肉被裤子松散包裹，自然摊开
- 小腿：运动裤裤脚微微上滑，露出一截脚踝
- 双脚：棉拖鞋半脱，左脚搭在右脚背上，脚趾无意识地微微弯曲
- 双手：右手拿着遥控器，左手搭在大腿上
- 私处：内裤和运动裤双层包裹，保守状态

### 王影弯腰从冰箱拿东西时：
- 面部：低头翻找，刘海垂下遮住半边脸
- 胸部：弯腰使得宽松上衣领口自然下垂，从侧面可以隐约看到内衣边缘和胸部轮廓
- 腰腹：弯腰时腰线显现，卫衣后摆翘起露出一截后腰皮肤
- 臀部：弯腰姿势让运动裤绷紧在臀部上，丰满臀形被勾勒出来
- 大腿：微微弯曲支撑身体，裤子在大腿根部因弯曲而产生褶皱
- 小腿：绷直支撑
- 双脚：踩在棉拖鞋里，因为弯腰重心前移，脚趾微微用力抓紧拖鞋
- 双手：双手在冰箱里翻找
- 私处：裤子因弯腰而在臀缝处微微紧贴，但完全被衣物遮挡
