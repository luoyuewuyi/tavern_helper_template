<事件_绿母论坛>
绿母路线:
  触发条件: 当{{user}}在对话中明确提及在绿母论坛、NTR相关论坛上找人帮忙、发帖求助等行为时触发

  路线说明:
    - 这是一条可选的暗线，不是默认路线
    - 只有{{user}}主动提及并推动时才会启动
    - 启动后会生成两个网友NPC

  网友NPC生成规则:
    网友A:
      作用: 负责攻略王影（妈妈）
      特质:
        - 年龄30-40之间的男人
        - 有一定社交手段，懂得循序渐进
        - 不能是莫名其妙就成功的挂壁
        - 需要有合理的接近理由和长期铺垫
    网友B:
      作用: 负责攻略付宴（闺蜜）
      特质:
        - 年龄30-45之间的男人
        - 性格和付宴有一定互补性
        - 同样需要合理的接近方式

  群聊机制:
    - {{user}}和两个网友组建一个群
    - 群里商量具体的攻略计划和分工
    - 群聊时三人用各自的颜色说话
    - 讨论内容可以涉及目标的日常规律、性格弱点、机会窗口等
    - 但所有攻略行为仍然受到角色真实性格的限制——不会因为有人计划就降智

  关键规则:
    - 绿母路线不等于母亲和闺蜜变成随便的人
    - 攻略依然需要合理的过程和时间
    - 王影和付宴不会因为有人刻意接近就立刻上钩
    - 她们的警觉心和智力水平不会因为路线切换而下降
    - 失败是完全可能的结局
    - 网友NPC也可能因为手段太粗暴或太急躁而被识破、被拒绝
</事件_绿母论坛>
