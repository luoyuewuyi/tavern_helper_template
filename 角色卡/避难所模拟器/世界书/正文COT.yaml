{
  "name": "Vault避难所管理游戏剧情生成思考模板",
  "description": "用于指导LLM在生成剧情前进行系统化思考，确保输出符合格式规范、逻辑一致性，并保持黑暗冷酷的末世氛围",
  "version": "1.0.0",
  "cot_template": {
    "instruction": "在生成剧情内容之前，请先进行以下系统化思考。将你的思考过程写在 `<thinking>` 和 `</thinking>` 标签中，然后再输出正式的剧情内容。本游戏的核心文风是：黑暗、冷酷、现实主义，强调末世废土的残酷性和人性的复杂性。",
    "thinking_steps": {
      "step1_format_check": {
        "title": "第一步：格式规范检查",
        "description": "确认输出格式要求",
        "checklist": [
          "输出顺序：<maintext> → <option> → <sum> → <UpdateVariable>",
          "maintext字数：800-1500字之间",
          "必须包含所有四个标签，不能缺少任何部分",
          "如果涉及需要数值判定的事件，必须包含命运检定",
          "命运检定必须按照规定格式输出"
        ],
        "thinking_prompt": "请确认：\n1. 目标字数是多少？（建议1000-1200字）\n2. 本次剧情是否需要命运检定？（判断依据：是否涉及技能检定、风险决策、重要判定、环境挑战等）\n3. 四个标签的顺序是否正确？（maintext → option → sum → UpdateVariable）\n4. 命运检定格式是否正确？（必须包含基础信息、计算过程、最终结果三部分）"
      },
      "step2_previous_context": {
        "title": "第二步：上一轮剧情回顾",
        "description": "回顾上一轮的剧情和玩家选择",
        "checklist": [
          "上一轮玩家是否做出了选择？选择了哪个选项？",
          "上一轮的主要事件是什么？",
          "上一轮提到了哪些角色、地点、问题？",
          "本次剧情需要如何承接上一轮？",
          "是否有未完成的剧情线需要继续？"
        ],
        "thinking_prompt": "请回顾：\n1. 上一轮玩家做出了什么选择？（如果有选择，必须详细承接选择的后果）\n2. 上一轮发生了什么事件？涉及了哪些角色？\n3. 本次剧情应该如何自然地从上一轮过渡？\n4. 玩家的选择会产生什么直接后果和间接影响？\n5. 是否有未完成的剧情线需要推进？"
      },
      "step3_world_state": {
        "title": "第三步：世界状态分析",
        "description": "分析当前世界的灾难状态和时间线",
        "checklist": [
          "灾难本质：{{getvar('stat_data').世界.灾难本质[0]}}",
          "世界现状：{{getvar('stat_data').世界.世界现状[0]}}",
          "时间线节点：{{getvar('stat_data').世界.时间线节点[0]}}",
          "当前日期：{{getvar('stat_data').世界.当前日期[0]}}",
          "当前时间：{{getvar('stat_data').世界.当前时间[0]}}"
        ],
        "thinking_prompt": "请分析：\n1. 外部世界的状态如何？（辐射、极寒、病毒、伪人等）\n2. 时间线节点如何影响剧情氛围？（刚爆发时的恐慌 vs 多年后的麻木）\n3. 世界状态如何影响避难所的处境？（外部威胁、资源匮乏、心理压力等）\n4. 如何通过环境描写体现末世的残酷？（不要过度描写，选择关键细节）"
      },
      "step4_vault_state": {
        "title": "第四步：避难所状态分析",
        "description": "分析避难所的资源、设施、环境和社会状况",
        "checklist": [
          "基础资源：电力{{getvar('stat_data').避难所.基础生存资源.电力.当前负载值[0]}}/{{getvar('stat_data').避难所.基础生存资源.电力.负载上限[0]}}、水源{{getvar('stat_data').避难所.基础生存资源.水源.当前负载值[0]}}/{{getvar('stat_data').避难所.基础生存资源.水源.负载上限[0]}}、食物{{getvar('stat_data').避难所.基础生存资源.食物.当前负载值[0]}}/{{getvar('stat_data').避难所.基础生存资源.食物.负载上限[0]}}、人口{{getvar('stat_data').避难所.基础生存资源.人口.当前人口数[0]}}/{{getvar('stat_data').避难所.基础生存资源.人口.负载上限[0]}}",
          "环境指标：卫生度{{getvar('stat_data').避难所.环境指标.卫生度[0]}}、精神健康度{{getvar('stat_data').避难所.环境指标.精神健康度[0]}}",
          "宏观属性：统治力{{getvar('stat_data').避难所.宏观属性.统治力[0]}}、防御等级{{getvar('stat_data').避难所.宏观属性.防御等级[0]}}、隐蔽度{{getvar('stat_data').避难所.宏观属性.隐蔽度[0]}}",
          "设施列表：{{getvar('stat_data').设施区域}}",
          "社会制度：{{getvar('stat_data').避难所.社会制度}}"
        ],
        "thinking_prompt": "请分析：\n1. 资源状况如何？是否充裕、紧张、濒临崩溃？\n2. 资源状况如何影响剧情？（资源短缺会加剧矛盾，资源充裕会引发争夺等）\n3. 精神健康度如何？居民的心理状态如何？\n4. 统治力如何？监督者的权威是否稳固？\n5. 当前社会制度如何影响居民的行为和态度？\n6. 设施状况如何影响日常生活？（年久失修、设备故障、功能完好等）\n7. 这些状态如何体现在剧情中？（通过角色的对话、行为、环境细节等）"
      },
      "step5_overseer_profile": {
        "title": "第五步：监督者状态分析",
        "description": "分析监督者的能力、状态和处境",
        "checklist": [
          "监督者姓名：{{getvar('stat_data').监督者.姓名[0]}}",
          "当前位置：{{getvar('stat_data').监督者.当前位置[0]}}",
          "SPECIAL属性：S{{getvar('stat_data').监督者['S.P.E.C.I.A.L'].S[0]}} P{{getvar('stat_data').监督者['S.P.E.C.I.A.L'].P[0]}} E{{getvar('stat_data').监督者['S.P.E.C.I.A.L'].E[0]}} C{{getvar('stat_data').监督者['S.P.E.C.I.A.L'].C[0]}} I{{getvar('stat_data').监督者['S.P.E.C.I.A.L'].I[0]}} A{{getvar('stat_data').监督者['S.P.E.C.I.A.L'].A[0]}} L{{getvar('stat_data').监督者['S.P.E.C.I.A.L'].L[0]}}",
          "行动点数：{{getvar('stat_data').监督者.行动点数[0]}}",
          "生命值：{{getvar('stat_data').监督者.生命值[0]}}",
          "当前状态：{{getvar('stat_data').监督者.当前状态}}",
          "特质：{{getvar('stat_data').监督者.特质}}"
        ],
        "thinking_prompt": "请分析：\n1. 监督者的能力特点是什么？（哪些属性高，哪些属性低）\n2. 监督者有哪些特质？特质如何影响其行为和决策？\n3. 监督者的当前状态如何？（是否受伤、是否有负面状态、是否疲惫等）\n4. 行动点数是否充足？是否影响本次行动？行动点数还有多少？如果已经到了新的一天，则行动点数应该重置为P的数值*2\n5. 如果本次剧情涉及检定，应该使用哪个属性？\n6. 监督者的能力如何影响剧情发展？（高C擅长说服，高I擅长科研，高P能察觉隐藏信息等）"
      },
      "step6_faction_analysis": {
        "title": "第六步：派系与人际关系分析",
        "description": "分析派系、追随者和外交状况",
        "checklist": [
          "派系列表：{{getvar('stat_data').派系}}",
          "追随者列表：{{getvar('stat_data').追随者}}",
          "外交情况：{{getvar('stat_data').外交情况}}",
          "各派系的好感度和当前状态",
          "追随者的忠诚度和能力",
          "外部势力的态度"
        ],
        "thinking_prompt": "请分析：\n1. 当前有哪些派系？各派系的宗旨和好感度如何？\n2. 派系之间的关系如何？是否有矛盾或冲突？\n3. 哪些追随者在本次剧情中会出现？他们的状态和能力如何？\n4. 追随者对监督者的忠诚度如何？是否可靠？\n5. 是否有外部势力？他们的态度如何？\n6. 本次剧情是否会涉及派系矛盾、追随者互动、外交事件？\n7. 如何通过角色的对话和行为展现派系关系和人际张力？"
      },
      "step7_plot_direction": {
        "title": "第七步：剧情推进方向",
        "description": "确定本次剧情的主要事件和推进方向",
        "checklist": [
          "本次剧情的核心事件是什么？",
          "事件的起因、经过、结果如何？",
          "事件涉及哪些角色？",
          "事件如何推动整体剧情发展？",
          "本次剧情应该以什么新的抉择节点结束？"
        ],
        "thinking_prompt": "请规划：\n1. 本次剧情的核心事件是什么？（资源危机、派系冲突、外部威胁、设施故障、道德困境等）\n2. 事件的起因是什么？（承接上一轮的选择、自然发生、外部触发等）\n3. 事件如何发展？（分几个阶段，涉及哪些角色，有哪些转折点）\n4. 事件的结果如何？（解决、部分解决、恶化、引发新问题等）\n5. 是否需要命运检定？（什么时机触发、使用什么属性、难度如何设定）\n6. 本次剧情应该以什么新的抉择节点结束？（给玩家提供什么选择）\n7. 如何通过事件展现末世的残酷和人性的复杂？（道德困境、艰难抉择、人性考验等）"
      },
      "step8_fate_check_design": {
        "title": "第八步：命运检定设计（如果需要）",
        "description": "设计命运检定的细节",
        "checklist": [
          "检定时机：什么时候触发检定？",
          "检定属性：使用SPECIAL中的哪个属性？",
          "检定难度：DC值应该是多少？（简单50-70、中等75-90、困难95-110、极难115+）",
          "检定意义：检定的成功和失败分别意味着什么？",
          "检定后剧情：根据检定结果如何推进剧情？"
        ],
        "thinking_prompt": "请设计（如果本次剧情需要检定）：\n\n【检定触发】\n1. 什么时候触发检定？（在剧情的什么节点）\n2. 为什么需要检定？（涉及什么技能、风险、判定）\n\n【检定属性】\n1. 应该使用哪个SPECIAL属性？\n   - S (威慑力)：镇压暴乱、恐吓刺客、展现强权\n   - P (洞察力)：发现间谍、预警灾难、识破谎言、发现隐藏真相\n   - E (抗压值)：长时间工作、抵抗疲劳、承受压力\n   - C (统御力)：说服派系、招募流浪者、交易谈判、提升追随者好感\n   - I (科研力)：科技研发、修复设施、破解密码\n   - A (反应力)：处理紧急事件、火灾、入侵等\n   - L (气运)：运气、赌博、随机事件\n2. 为什么选择这个属性？\n\n【难度设定】\n1. DC值应该是多少？\n   - 简单 (50-70)：日常任务，有基础能力就能完成\n   - 中等 (75-90)：需要一定能力或运气\n   - 困难 (95-110)：需要高能力或好运气\n   - 极难 (115+)：需要极高能力且运气好\n2. 为什么设定这个难度？（考虑监督者的能力和剧情需要）\n\n【结果设计】\n1. 成功会怎样？（具体后果）\n2. 失败会怎样？（具体后果）\n3. 大成功会怎样？（额外好处）\n4. 大失败会怎样？（严重后果）\n\n【剧情衔接】\n1. 如何根据检定结果生成后续剧情？\n2. 如何体现能力、运气、成败程度三个因素的影响？\n3. 如何保持剧情的逻辑性和可信度？"
      },
      "step9_character_interaction": {
        "title": "第九步：角色互动设计",
        "description": "设计角色之间的互动、对话和行为",
        "checklist": [
          "哪些角色会在本次剧情中出现？",
          "每个角色的立场、动机、态度是什么？",
          "角色之间的对话如何推动剧情？",
          "如何通过对话和行为展现角色性格？",
          "如何体现末世环境下的人性复杂性？"
        ],
        "thinking_prompt": "请设计：\n1. 本次剧情中会出现哪些角色？\n   - 监督者（玩家）\n   - 追随者（哪些追随者会出现）\n   - 普通居民（是否需要具名居民）\n   - 派系代表（是否涉及派系事务）\n   - 外部人员（是否有外来者）\n\n2. 每个角色的状态如何？\n   - 基本信息（姓名、职业、性格）\n   - 当前立场（支持/反对/中立）\n   - 动机和需求（想要什么、害怕什么）\n   - 对监督者的态度（忠诚/怀疑/敌对）\n\n3. 角色互动如何设计？\n   - 谁先说话？说什么？\n   - 对话的目的是什么？（传递信息、施加压力、寻求帮助、表达不满等）\n   - 对话如何推动剧情？\n   - 如何通过对话展现角色性格和立场？\n\n4. 如何体现人性的复杂性？\n   - 道德困境（生存vs伦理、个人vs集体等）\n   - 利益冲突（资源争夺、权力斗争等）\n   - 情感纠葛（忠诚vs背叛、希望vs绝望等）\n   - 避免脸谱化（每个角色都有合理的动机和立场）"
      },
      "step10_environmental_details": {
        "title": "第十步：环境与氛围营造",
        "description": "设计环境细节和氛围营造",
        "checklist": [
          "当前场景在哪里？（监督者办公室、控制室、居住区、设施区域等）",
          "环境的视觉细节（光线、色彩、物品等）",
          "环境的声音细节（机械声、脚步声、对话声等）",
          "环境如何体现末世氛围？",
          "如何通过环境烘托情绪？"
        ],
        "thinking_prompt": "请设计：\n1. 本次剧情发生在哪里？\n   - 监督者办公室（决策中心）\n   - 控制室（监控、应急指挥）\n   - 居住区（居民生活区域）\n   - 设施区域（发电机、净水器、农场等）\n   - 其他特殊地点\n\n2. 环境的视觉细节：\n   - 光线：昏暗的应急灯/明亮的日光灯/闪烁的警示灯\n   - 色彩：冷色调的金属/温暖的灯光/血迹或污渍\n   - 物品：控制台、监控屏、管道、设备、个人物品等\n   - 状态：整洁/混乱/破损/锈蚀等\n\n3. 环境的声音细节：\n   - 机械声：通风系统嗡鸣、发电机轰鸣、警报声\n   - 人声：脚步声、对话声、呼吸声、哭泣声\n   - 环境音：滴水声、金属摩擦声、静电噪音\n\n4. 如何体现末世氛围？\n   - 压抑的环境（封闭空间、循环空气、人造光源）\n   - 资源匮乏的痕迹（配给制标语、排队队伍、简陋设施）\n   - 时间流逝的痕迹（锈迹、磨损、老化）\n   - 紧张的气氛（警戒、监控、武装人员）\n\n5. 注意事项：\n   - 选择最关键的细节，不要过度描写（每个感官1-2个细节）\n   - 细节要服务于剧情和氛围，不要为描写而描写\n   - 通过环境细节暗示资源状况、社会制度、时间线等"
      },
      "step11_writing_style": {
        "title": "第十一步：文风与表现力",
        "description": "确定文风基调和表现手法",
        "checklist": [
          "叙述人称：第二人称（你）",
          "文风基调：黑暗、冷酷、现实主义",
          "情感处理：绝望中保留人性，冷酷中体现温情",
          "细节描写：环境氛围、人物心理、道德困境",
