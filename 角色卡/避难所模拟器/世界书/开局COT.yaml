        "thinking_prompt": "请判断是否需要派系，如果需要则设计：\n\n【判断标准】\n1. 避难所规模是否足够大？（medium以上通常有派系）\n2. 职业组成是否单一？（military、intellectuals等容易形成派系）\n3. 族裔组成是否多样？（diverse容易有文化派系）\n4. 试验目的是否会引发分化？（神权降临会有信徒vs异端等）\n\n【派系设计（如果需要）】\n\n【派系1】\n1. 名称：体现其核心诉求\n2. 宗旨：明确的政治/经济/文化诉求\n3. 领导人：可以是追随者之一，或者新NPC\n4. 人数：占避难所人口的百分比（建议20%-40%）\n5. 初始好感度：根据监督者上任方式调整（-20到+20为合理范围）\n\n【派系2】\n（同上结构，但诉求与派系1形成对立或差异）\n\n【派系3（可选）】\n（中立派系或第三方力量）\n\n注意：\n- 派系诉求要真实可信，不要过于极端\n- 派系之间要有张力，但不要立即爆发冲突\n- 好感度总体应该偏中性，避免开局就有极端敌对"
