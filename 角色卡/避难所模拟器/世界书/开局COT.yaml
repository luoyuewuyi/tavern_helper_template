        "thinking_prompt": "请设计追随者角色：\n\n【追随者1（核心支持者）】\n1. 基本信息：姓名（符合族裔组成）、年龄（建议30-45岁，经验丰富）、性别\n2. 外貌：简洁描述（2-3句话），体现其职业特征\n3. 性格：主要性格特点（2-3个关键词+简要说明）\n4. 爱好：符合其背景的爱好\n5. 弱点：真实可信的弱点（不要太夸张）\n6. 反差：性格中的矛盾点或意外特质\n7. 能力值：武力/管理/探索应该符合其职业（总和建议10-15）\n8. 装备：根据职业分配合适的装备\n9. 特质：1-2个符合其背景的特质\n10. 忠诚度：根据上任方式调整（60-80为合理范围）\n\n【追随者2（专业人才）】\n（同上结构，但能力侧重点不同）\n\n【追随者3（可选，如果有特殊需要）】\n（同上结构）\n\n注意：\n- 追随者应该有真实的人生经历和动机\n- 性格要有深度，不要脸谱化\n- 反差要自然，不要刻意\n- 能力值要平衡，避免全能型\n- 装备要从仓库系统中选择，注意数量"
