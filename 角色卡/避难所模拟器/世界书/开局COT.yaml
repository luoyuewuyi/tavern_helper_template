        "thinking_prompt": "请规划开局剧情的叙事结构：\n\n【第一部分：世界状况（200-300字）】\n1. 从外部世界的毁灭开始描写\n2. 展现灾难的严酷性（辐射、废墟、死寂等）\n3. 说明时间线节点，营造紧迫感或绝望感\n4. 过渡到避难所的封闭环境\n\n【第二部分：避难所环境（300-400字）】\n1. 描写避难所的物理环境（规模、设施、氛围）\n2. 展现避难所的生存状况（资源、设施状况）\n3. 描写居民的状态和组成（职业、族裔、精神状态）\n4. 暗示社会制度和试验目的（如果有）\n5. 引出监督者的存在\n\n【第三部分：监督者身份（400-600字）】\n1. 详细描写监督者的上任过程（根据开局情况）\n2. 展现监督者的能力特点（通过SPECIAL属性体现）\n3. 描写监督者的心理状态和处境\n4. 介绍监督者与居民的关系（是否有追随者、是否有反对派）\n5. 展现监督者面临的初始挑战\n\n【第四部分：当前处境（200-300字）】\n1. 总结当前的整体局势\n2. 提出监督者需要面对的问题\n3. 营造紧迫感和选择的必要性\n4. 自然过渡到第一个选项"
