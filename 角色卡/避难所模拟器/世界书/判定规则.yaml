  "coreFormula": {
    "description": "所有不确定结果的事件判定公式",
    "formula": "Result = 1d100 + AttributeBonus + LuckBonus",
    "judgmentRules": {
      "success": {
        "condition": "Result >= DC",
        "description": "成功 (Success)"
      },
      "failure": {
        "condition": "Result < DC",
        "description": "失败 (Failure)"
      },
      "criticalSuccess": {
        "conditions": [
          {
            "type": "naturalRoll",
            "range": [96, 100],
            "description": "自然投掷为 96-100"
          },
          {
            "type": "exceedThreshold",
            "threshold": 50,
            "description": "总结果超过 DC 50点以上"
          }
        ],
        "description": "大成功 (Critical Success)"
      },
      "criticalFailure": {
        "condition": {
          "type": "naturalRoll",
          "range": [1, 5],
          "description": "自然投掷为 1-5"
        },
        "exemption": {
          "condition": "属性值 >= 11",
          "effect": "豁免大失败，视为普通失败或根据数值强制成功"
        },
        "description": "大失败 (Critical Failure)"
      }
    }
  },
