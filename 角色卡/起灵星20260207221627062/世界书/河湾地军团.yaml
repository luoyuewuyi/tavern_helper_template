河湾地军团：1.迅猛龙骑士军团：人数不详，编制由不知数量的迅猛龙骑士营构成，是河湾地王国主力骑士军团，最基础的成员也是黑铁级骑士，营级指挥官多为子爵-铂金骑士，军团领袖至少修为为钻石骑士。
迅猛龙只是一种大型蜥蜴类生物并非龙类生物：头部较长，占身体比重较大，嘴部狭长扁平，牙齿锋利且边缘呈锯齿状，适合撕裂猎物。‌眼睛竖瞳而锐利，具有出色的立体视觉。‌前肢较大且灵活，手部有三根弯曲的指爪，腕部结构允许向内抓握，便于固定猎物。‌后肢结实，主要依靠第三和第四脚趾着地行走，第二脚趾上有一根粗大弯曲的镰刀状利爪，长度可达6-9厘米，是捕猎的核心武器。‌尾巴长且僵硬，长度超过体长的一半，尾骨呈S形水平弯曲，有助于高速奔跑时保持平衡和灵活转向。整体身形矫健，行动敏捷，
迅猛龙身披重型鳞甲，速度较快耐力较强，但是纪律性不强，骑士多使用制式长弯刀，身披灵活的附魔链甲。
2.恐蜥骑士军团：大约由五个恐蜥骑士营构成，总数在5000人左右，灵兽坐骑为巨型恐蜥。恐蜥是一种超大型巨大蜥蜴，披挂附魔的坚固鳞甲，个体战斗力最为强大，近战肉搏能力极度强大，耐力和速度都极度慢。骑士身披附魔坚固鳞铠甲，武器为制式长柄刀，最基础成员至少为银骑士，营级指挥官多为荣誉伯爵-钻石骑士，历届军团领袖修为多为圣骑士初阶。
