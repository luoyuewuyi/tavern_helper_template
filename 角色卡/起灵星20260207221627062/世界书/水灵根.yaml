水灵根，水灵气：
本源特性：溶解、映射。
风格气质：玄奥、包容、沉静。喜静坐水边，看水面倒影。声音像深潭回音，能抚平躁怒。
实际应用功能
· 远程通讯：水镜术投射万里实时影像，情报中枢
· 辨伪读心：水灵气凝聚出的特殊水面可以映出特殊氛围的“涟漪”。
· 降雨防洪：使用水灵气控制水的流向或产生。
单兵战斗作用
· 镜像分身：使用水灵气凝聚实体，可承受真实伤害。
· 雾隐：化水为无形，匿迹于空气。
· 控水：直接控制水灵气凝聚出各种水灵气技能杀敌。
团队战斗风格：
· 视野：水镜实时投射战场地形与敌方位，与队友共享。
· 静心咒：覆盖全队，免疫恐惧、混乱、夺舍等负面影响。
· 涟漪预警：制造静水阵，有强烈敌意靠近即自动示警。
· 镜像替身：强大者可为濒死队友造灵水替身，代受致命一击。
