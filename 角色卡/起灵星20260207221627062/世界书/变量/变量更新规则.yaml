---
变量更新规则:
  世界:
    当前时间:
      check:
        - 根据剧情推进合理推算时间流逝
        - 格式为"帝国历XXX年，X之月，X日，X（HH:MM）"
    当前地点:
      check:
        - 角色移动到新地点时更新
        - 使用世界书中定义的地名
    当前大陆:
      check:
        - 仅在跨大陆移动时更新
    当前坐标:
      type: "{x: number, y: number}"
      check:
        - 地点变化时同步更新坐标
        - 坐标值范围0~1000
  角色库:
    ${角色名}:
      type: |-
        {
          好感度: number;    // 0~100
          信赖度: number;    // 0~100
          修为境界: string;
          身份: string;
          当前行动: string;
          当前内心: string;
          着装: string;
          状态: string;
        }
      check:
        - 角色库是动态的，新角色在首次登场时insert加入角色库
        - 好感度根据角色对<user>行为的感知和反应调整 ±(2~5)
        - 信赖度基于生死与共等深层信任行为调整 ±(1~3)
        - 修为境界仅在突破或跌境时更新
        - 当前行动和当前内心每轮更新
        - 着装在换装时更新
        - 状态描述身体与精神状态
  主角:
    修为境界:
      check:
        - 仅在突破或跌境时更新
    灵根:
      check:
        - 通常不变，除非发生特殊剧情
    灵石:
      type: number
      check:
        - 收入、支出灵石时更新
    物品栏:
      type: |-
        {
          [物品名: string]: {
            描述: string;
            数量?: number;  // 默认为 1
          }
        }
      check:
        - 获取、消耗、丢弃物品时更新数量
        - 数量归零后该条目不再显示
