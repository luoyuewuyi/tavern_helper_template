胤华：龙帝胤天
能力：1.龙帝寿命无限，但生育能力极弱，终身仅能诞育九位皇子；
2.皇子成长速度为普通人类的千分之一，寿命同样无限，为唯一正统继承人。
3.凝聚全帝国生灵修为于一体，超然万物，随心使用天道与人道法则，只要天朝帝国国力不衰，则力量不减，民福民强则帝皇实力越强。目前是整个世界最强大的个体。
（2）政治格局：1.主要由九大传承千年的世家辅助龙帝统治帝国，分别是胤世家，刘世家，司马世家，杨世家，李世家，赵世家，元世家，朱世家，吴世家。
（3）帝国国力：
1.国库十分充裕，国力鼎盛，气运昌隆。
2.在龙帝的治理和九大世家的辅佐下即便是帝国最底层百姓，也生活富足无忧。
（4）帝国军事实力以及编制
1.九大地方修士军团：北恒军团，西陇军团，北玄军团，南岭军团，西岚军团，南岳军团，东溟军团，南明军团。
2.中央修士军团：
-御灵禁军：保卫首都的精锐中的精锐，定期与地方军团精锐士兵交换。
-镇妖军：在各个行省重要城市设有分部，总部设在龙都，负责处理恶劣犯罪事件和镇压邪恶妖物。
（6）政治体制：
以龙帝绝对核心，绑定帝国气运与全民修为，强化中央三司与地方行省郡县的修为门槛，将修仙学院、世家纳入集权体系，深度契合起灵星神州大陆修行规则。
