灰狼酒馆，深渊局，情报总据点：我和萱赫在西境王国的兰尼斯港取得的第一个情报基地，也是总据点。基地情况如下：
一、位置
· 位于贫民区与商业区交界的兰尼斯港深处，周围是皮革作坊、蜡烛铺和廉价旅馆
· 夹在两栋三层木筋墙房屋之间，正面宽度仅三扇窗，招牌是块褪色木板，画着一只拖着后腿的狐狸
· 隔壁是铁匠铺，日夜叮当声掩盖了许多动静

二、建筑外观

风格：晚期哥特式市民住宅，木筋墙结构，二层突出于街道

关键视觉特征：

· 底层临街是酒馆门面，厚重的橡木门被烟熏成深褐色，门把手是只生锈的铜环
· 窗户是劣质小圆玻片拼接，模糊不清，从内看外清晰，从外看内一片模糊（施加“单向窥视”魔法）
· 二层窗台摆着几盆枯死的天竺葵，从无人浇水
· 墙角有被马车撞坏的痕迹，露出里面斑驳的砖石，从未修补
· 门楣上挂着一盏昏暗的油灯，彻夜不灭——附近唯一通宵亮灯的地方，反而让人不想靠近

隐秘细节：

· 那扇“劣质玻璃窗”内侧透明，外侧永远积着洗不掉的灰
· 枯死的天竺葵是活体警报器——任何人触碰窗台，草叶瞬间变黑
· 墙角破损处露出的是耐火砖，内层是魔法强化的玄武岩
· 彻夜不灭的油灯内藏窥镜，可观察街道两端

三、地上部分：灰狼酒馆

空间布局：

· 吧台区：进门正对长条形吧台，老旧橡木，台面被酒杯磨出光滑凹痕。吧台后是酒架，摆满廉价麦酒和几瓶落灰的“烈酒”（实际是普通货色）
· 散座区：五六张粗糙木桌，长条凳，桌面有刀痕和烛泪
· 壁炉：墙角石砌壁炉，常年燃着小火，上面挂着一口黑锅，咕嘟着不知名的炖菜
· 后厨：狭小杂乱，仅能容一人转身，通往后院

表面经营：

· 菜单只有黑面包、豆子汤、咸鱼和麦酒，味道平庸但能吃
· 价格比隔壁贵1便士，所以客人不多，刚好维持“勉强糊口”的形象

伪装魔法：

· 壁炉火焰是“幻象火”，实际燃料是火晶石，无烟无味，永不熄灭
· 炖菜锅永远不空，但舀出来的永远是同一锅的量——低级幻术，防止有人借口“帮厨”进入后厨
· 吧台后的酒架暗格，可以藏应急武器和逃生斗篷

四、地下部分：核心安全屋“深渊居”

入口系统：

· 第一入口：后厨地板下一块看似普通的地窖门，掀开是真正的地窖——储存土豆和咸鱼。地窖墙角有个大酒桶，桶底有隐藏锁可旋转，露出向下的阶梯
· 第二入口：壁炉内侧的炉砖，拉动特定一块（看似松动但从未掉落）即可开启暗门，直通地下二层
· 验证方式：需用特制银币插入特定缝隙，配合每日变化的口令手势

深度与结构：

· 地下共四层，最深距地表八十英尺
· 建于古罗马下水道遗迹之上，利用旧拱券扩建，四壁浇筑“化石为泥”反转的强化岩层
· 每一层之间均有十英尺实心岩层隔离，仅通过魔法升降梯连接
· 整座地下城笼罩在“虚无斗篷”下，预言系法术无法定位

五、照明系统：永昼水晶

核心照明：整座地下城采用“永昼水晶”阵列，模拟自然日光

工作原理：

· 主光源是一块巨型永昼水晶，镶嵌在地下四层穹顶正中，直径六英尺，悬浮于半空
· 通过精密符文阵列调节色温和亮度——清晨微蓝，正午洁白，黄昏泛金，深夜转为柔和的月光白
· 辅助水晶遍布各层走廊和房间，主水晶熄灯时自动补光

魔法原理：

· 永昼水晶吸收地脉灵气，转化为稳定光源
· 可模拟阴天、晴天、雨天的光线变化，甚至能投影出云朵飘过的阴影
· 长期居住者不会出现“地下病”，植物正常生长，人体生物钟保持正常

额外功能：

· 主水晶可切换“警戒模式”——瞬间变为刺目的战斗白光，让入侵者致盲
· 辅助水晶可单独调暗，创造私密氛围

六、地下空间布局

地下负一层 · 过渡层（深度20英尺）

· 功能：缓冲层，存放物资、武器、伪造文书
· 设施：
· 武器库：刀剑、弓弩、魔法卷轴、炼金药剂
· 档案室：伪造身份文件、地图、情报归档
· 紧急医疗室：药品、手术台、疗伤魔法阵
· 警报蜘蛛巢：七只魔法蜘蛛散布各处，感知恶意即尖啸

地下负二层 · 生活层（深度40英尺）

· 功能：核心居住区，舒适奢华
· 设施：
客厅：
· 面积四百平方英尺，层高十五英尺
· 墙面覆精灵手织挂毯，描绘森林狩猎场景
· 家具为矮人黑橡木，镶嵌金丝花纹
· 壁炉燃烧火晶石，炉台摆着看似普通的陶罐，罐内是银质餐具
· 沙发填充狮鹫绒毛，坐感如陷云朵
· 魔法地图悬挂墙面，实时显示全城动态
餐厅：
· 长桌可坐十二人，桌面是整块胡桃木，年轮处嵌金线
· 餐具为水晶雕花，烛台是精灵工艺，永不滴蜡
· 酒柜恒温，藏有精灵陈酿、矮人烈火酒、东方清露
厨房：
· 真正给活人吃的厨房，食材来自地下花园
· 灶台用火晶石加热，烤箱可烤面包、烤肉
· 储物柜常年满仓，魔法保鲜
卧室（共六间）：
· 每间约二百平方英尺，床垫填充狮鹫绒毛、安神草药
· 衣橱自动修补清洗折叠衣物
· 每间独立浴室，热水来自“造水术+火晶石”恒温系统
· 浴盐来自海妖泪结晶，毛巾比丝绸更软
浴室（公用大浴池）：
· 罗马风格浴池，可容八人同时浸泡
· 池水循环净化，永远清澈温热
· 四壁马赛克拼出海洋神话，嵌夜明珠，浴时如沉星空

地下负三层 · 功能层（深度60英尺）

· 功能：工作、训练、通讯、休闲
· 设施：
图书馆/档案室：
· 藏书三千册，包括禁书区复制本
· 书架后隐藏魔法通讯阵，可加密联系外界
· 阅读区有永昼水晶小灯，扶手椅可躺平睡
训练场：
· 面积八百平方英尺，层高二十英尺
· 四壁施“反弹咒”，可安全练习战斗魔法
· 武器架挂满训练用兵器，角落有沙袋和靶子
会议室：
· 圆桌可围坐十人，桌面嵌入全息沙盘（魔法投影）
· 墙壁挂满实时情报板，更新全城动态
· 静音结界，隔壁听不见任何声音
娱乐室：
· 棋牌桌、骰子、飞镖靶
· 精灵竖琴（自动弹奏，可选曲目）
· 酒柜补充装，可随时取用
炼金室∶
拥有各种当前时代最先进的炼金器材和炼金材料，稍加改造可能就可以成为东方的炼丹室。
武器库∶
· 大约100平方米，拥有禁火魔法结界，防止武器走火爆炸，储存有各种炼金炸药和炼金武器，以及其他重弩重弓和各类箭矢。
· 拥有一个高级武器制作台和高级武器附魔台，只要原料充足就可以让铁匠打造各种各样自己想象中的金属冷兵器。

地下负四层 · 花园层（深度80英尺）

· 功能：地下花园，种植、休憩、冥想
· 设施：
核心花园：
· 面积一千二百平方英尺，穹顶高三十英尺
· 穹顶镶嵌巨型永昼水晶，模拟真实日照
· 种植五十余种植物：草药、蔬菜、水果、观赏花卉
· 溪流潺潺（魔法造水循环），鱼塘养着可食用的鱼
· 蜜蜂授粉，蝴蝶飞舞，完全自循环生态系统
休憩区：
· 草坪可躺卧，树荫下摆石凳
· 凉亭一座，可喝茶读书
· 空气湿润清新，混着泥土和花香
冥想室：
· 透明水晶小屋，位于花园一角
· 隔绝一切声音，只留视觉的花园美景
· 用于深度休息、修炼、疗伤
功能价值：
· 新鲜蔬菜水果全年自给
· 草药供医疗和炼金
· 居住者不觉得身处地下，缓解心理压力
· 紧急时可作为额外藏身处

七、魔法防御体系

分层防御：

地表层：

· 酒馆窗户单向透明，内可观察外
· 枯死植物为警报器
· 门楣油灯内置窥镜

过渡层（负一层）：

· 警报蜘蛛遍布
· 入口需银币+手势验证
· 错误尝试触发“化石为泥”——楼梯变流沙

生活层（负二层及以下）：

· 整层笼罩“虚无斗篷”，预言系法术失效
· 墙壁刻“秘法锁”和“沉默术”符文
· 电梯井施“反重力陷阱”——入侵者坠落前会悬浮示警

逃生通道（共四条）：

古下水道支线，通往三个街区外的公共喷泉
垂直通风井（伪装成邻屋烟囱），攀爬至屋顶跨越逃离
紧急传送阵（单次），连通城外十英里废弃教堂
花园层暗河，皮划艇通道通往城外河流
