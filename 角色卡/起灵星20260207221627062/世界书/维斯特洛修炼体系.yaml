维斯特洛修炼体系：A. 骑士体系（主流）
核心：通过与灵兽签订共生契约，建立灵魂与力量链接。骑士从契约灵兽处获得一部分灵力（或特殊能力）加持己身，并共享成长；灵兽则获得近乎人类的智慧（初始约相当于10岁孩童，高阶灵兽智慧更高），能与骑士心灵相通，共同修行。
等级划分（骑士与契约灵兽共同晋升）：
铁骑士：与低阶灵兽签订契约，获得基础属性加成，能初步运用灵兽的某种特质（如敏捷、力量、元素抗性）。
银骑士：契约稳固，灵兽智慧明显提升，骑士可更自如地调用灵兽之力，甚至短时间部分“兽化”。
黄金骑士：与灵兽的力量融合更深，可激发“契约共鸣”，大幅提升双方战力，并能施展一些组合技。
铂金骑士：灵兽可能发生良性变异或觉醒新能力，骑士开始能引导灵兽的力量进行中远距离干涉或形成防护领域。
钻石骑士：人与兽的默契达到巅峰，几乎心念一体，可长时间维持高强度共生状态，战力质变。
圣骑士：契约升华，力量中带有神圣或秩序属性，对邪恶、混沌存在克制极强。
王者骑士：传说中的境界，契约灵兽亦成为霸主级存在，骑士的力量可影响一方天地气运。
特殊类别——龙骑士：
· 与智慧极高、实力强大的西方龙类签订契约的骑士，是骑士中最珍贵、最强大的存在之一。
· 龙族本身实力强悍，智慧与人类无异甚至更高，契约条件极其苛刻，通常需要龙族的主动认可或完成古老试炼。
· 龙骑士成长潜力巨大，其力量等级往往远超同阶普通骑士，具备战略威慑力。
修炼方法：
· 寻觅与缔约：寻找合适的灵兽（或获得灵兽认可），通过古老仪式签订灵魂共生契约。这是骑士之路的起点与核心。
· 共同成长：骑士进行常规的肉体与武技训练，同时通过契约反馈获得灵兽的灵力滋养与特质。灵兽则通过与骑士的链接，加速智慧成长，并学习更高效的能量运用方式。
· 默契培养：通过共同生活、战斗、修行，不断加深理解与信任，提升契约层次。
· 资源投入：为灵兽提供合适的食物、环境以及有助于其进化的天材地宝，这也间接促进骑士自身成长。
· 战斗磨合：实战是检验和提升契约融合度的最佳途径。
B. 誓言骑士（稀有流派）
· 核心：通过践行极度严苛、特定的古老誓言（如守护某地、秉持某种信念、效忠某位君主），以誓言为力量源泉，淬炼出独特的“誓约之力”。不依赖灵兽。
· 特点：力量纯粹且与誓言绑定，誓言越难，信念越坚，力量越强。一旦违背誓言，力量会严重衰退甚至反噬。数量极为稀少。
· 修炼方法：寻找并立下古老誓言，通过苦修、冥想、践行誓言内容来增长“誓约之力”。
C. 术士体系（依赖血脉） 
核心：力量源于祖先与神秘存在（如精灵、恶魔、龙等）缔结契约或混血遗传的魔力血脉。血脉纯度决定上限。
等级划分（名称常带阶级色彩）：
小术师 → 术师 → 大术师 → 环术师 → 魔能术师 → 塔术师 → 高塔术师 → 尊贵术师 → 奢靡术师 → 天堂术师。
修炼方法：
· 血脉唤醒与提纯：通过仪式、药剂或极端情绪刺激挖掘血脉力量。
· 学习与模仿：学习先祖流传的固定法术模型与仪式。
· 代价支付：施法常需支付代价（自身血液、寿命、情感记忆等）。
· 知识与禁忌研究：钻研古老典籍与禁忌知识以解锁更深层血脉秘密。
D. 魔法师体系（通过学习）
核心：通过系统学习魔法知识、理解世界规则、进行严谨的施法训练来掌控魔力。更接近学者，但上限受天赋与知识储备限制。
等级划分：
魔术学徒 → 魔法学徒 → 小魔法师 → 白银魔法师 → 大魔法师 → 魔导师 → 高级魔导师 → 环魔导师 → 皇家魔导师。
修炼方法：
· 系统教育：通常在学城或法师塔接受长期教育。
· 知识积累：学习魔法文字、符文、药剂学、炼金术、星象学等。
· 法术构建与练习：通过复杂计算和精神力引导构建法术模型并反复练习。
· 实验与研究：进行魔法实验以创造新法术或理解魔法本质。
· 资源依赖：需要魔法材料、法器、魔法节点（地脉点）支持。
