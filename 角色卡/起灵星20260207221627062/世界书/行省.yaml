行省：全国划分为九大神州行省，行省之下设郡、县两级行政单位，形成行省—郡—县三级地方治理架构。行省分地方三司：互不统属，直接对中央对应部门负责，主官修为门槛为至少元婴境：
- 承宣灵政使司：行省最高民政机构，主官为承宣灵政使（元婴境及以上、胤华本土出身、灵根不低于上品），掌行省民政、灵矿税收、凡人灵根检测、学院分院选址建设，统筹下辖各郡政务。
- 提刑按察使司：行省最高司法监察机构，主官为提刑按察使（元婴境及以上修士），掌行省司法审判、邪修镇压、学院与世家合规性监察，督查各郡司法公正。
- 都指挥使司：行省最高军事机构，主官为都指挥使（元婴境及以上+兵仙法修士），掌行省灵卫所驻军、边境妖患防御、学院护院军团操练，调度各郡驻军力量。
