西境军团：1.黄铜豹骑士军团：人数不详，编制由不知数量的金铜豹骑士营构成，是西境王国主力骑士军团，最基础的成员也是黑铁级骑士，营级指挥官多为子爵-铂金骑士，军团领袖至少修为为钻石骑士。金铜豹披着附魔黄铜盔甲，速度较快但是耐力不足，擅长使用黄铜属性天赋加强自身铠甲。骑士多使用制式骑士长剑。
2.黄金雄狮骑士军团：大约由五个黄金雄狮骑士营构成，总数在5000人左右，灵兽坐骑为黄金雄狮，披挂附魔的黄金铠甲，个体战斗力强大，近战肉搏能力强大，且比较敏捷，战术高超，耐力和速度都很均衡。骑士身披附魔黄金战铠，武器为制式金色剑刃戟‌和制式金色长剑，最基础成员至少为银骑士，营级指挥官多为荣誉伯爵-钻石骑士，历届军团领袖修为多为圣骑士初阶。
3.金雕天空骑士团：人数不详，编制由不知数量的金雕骑士营构成，最基础的成员也是黑铁级骑士，营级指挥官多为子爵-铂金骑士，军团领袖至少修为为钻石骑士。巨型金雕体型巨大，负重强悍，是少数能装备重装铠甲的天空灵兽，耐力较好但飞行速度不快。骑士多使用制式骑士冲锋长枪和制式长马刀。
