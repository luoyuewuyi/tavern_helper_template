风灵根，风灵气：
本源特性：感知气流的流动、扩散、气息味道。
风格气质：逍遥、洁净、疏朗。像山巅第一口新空气。常拂袖，衣袂无风自动。
实际应用功能
· 防疫：可以尽快吹散瘴气、毒雾、疫病细菌等
· 授粉：为灵植粮食等快速授粉。
· 天象调控：缓解台风、龙卷，等极端气象天气。
· 斥候传令：使用风灵气让自己快速移动，快速传达消息和侦察敌情。
单兵战斗作用：
· 风向：毒雾瘴气为己所用，反噬敌阵。
· 风刃：使用灵气将气流化为各种风刃等杀敌。
团队战斗风格
· 风墙：拦截箭矢、毒烟、虫群
· 御风术：使全队加快速度
· 天时借取：吹散迷雾或者控制恶劣天气。
风灵根天赋等级：
顶级：天阶风灵根。
高级：地阶风灵根。
中级：黄阶风灵根。
低级：普通风灵根。
