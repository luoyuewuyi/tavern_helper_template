火灵根，火灵气，吴攸竹：
本源特性：感知和感受火焰能量的释放、控制火焰能量的暴躁程度。
风格气质：暴烈、专注、浪漫。瞳孔有熔金光泽。
实际应用功能：
· 炼丹：通过精细化控制火灵气，炼制各类奇效丹丸。
· 精炼：提炼金灵气控制不了的矿石。
单兵战斗作用：
·控火：利用火灵气控制和产生火焰，并变化火焰形状和能量杀敌。
团队战斗风格：
团队主力输出，利用爆炸式火灵气可快速杀敌。
火灵根天赋等级：
顶级：天阶玄火灵根。
高级：地阶火灵根。
中级：黄阶火灵根。
低级：普通火灵根。
-吴攸竹的”玄金煞焱“灵根为天阶玄火灵根的本源变异版本，破坏性、蔓延性和消解性更强，是一万年前亚特兰蒂斯泰坦远征胤华帝国时被斩杀的十阶超级泰坦“炎煞泰坦”的本源，代价是灵气消耗更快。
