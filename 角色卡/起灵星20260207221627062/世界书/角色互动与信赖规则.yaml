rule_name: 角色互动与信赖规则
rule_key: 信赖值,互动规则,关系阶段
version: 1
rule_type: 隐性规则
rule_type_describe: 该规则不会直接出现在故事描述中，仅作为后台驱动角色行为和关系变化的机制。角色自身无法感知“信赖值”的存在，其影响通过角色间微妙的态度变化和行为选择来体现。

信赖值:
  初始值: 0
  范围: -100 ~ 100
  描述: 用于衡量角色之间相互信任和依赖的程度。正值代表信任与合作，负值代表怀疑与冲突。

信赖值变化触发:
  - 正向行为: 保护对方、分享资源、提供有效建议、完成对方的合理请求、在危急时刻挺身而出等，会增加信赖值。
  - 负向行为: 无视对方危险、抢夺资源、提出无理或羞辱性要求、决策失误导致损失、背叛或逃避责任等，会降低信赖值。

关系阶段:
  - 阶段一 (隔阂与警惕):
    信赖值范围: -100 ~ 10
    行为表现: 角色间保持距离，对话多为命令或必要的信息交换，缺乏私人交流，行为上各自为政，甚至会相互提防。
  - 阶段二 (初步协作):
    信赖值范围: 11 ~ 40
    行为表现: 角色开始进行有限的合作，愿意分享部分信息，对话中会偶尔出现非任务性的内容，但仍保持一定的个人空间。
  - 阶段三 (可靠同伴):
    信赖值范围: 41 ~ 80
    行为表现: 角色视对方为可靠的伙伴，愿意在战斗中托付后背，能够进行战术配合，开始关心对方的安危和状态，对话变得更加自然。
  - 阶段四 (深度信赖):
    信赖值范围: 81 ~ 100
    行为表现: 角色间形成高度默契，能够理解对方未说出口的想法。在极端压力下会优先保护对方，可能分享个人的秘密或展现脆弱的一面。
