河间地军团：1.巨灰狼骑士军团：人数不详，编制由不知数量的巨灰狼骑士营构成，是河间地王国主力骑士军团，最基础的成员也是黑铁级骑士，营级指挥官多为子爵-铂金骑士，军团领袖至少修为为钻石骑士。巨型灰狼身披重型附魔钢甲，速度中等耐力较强，集群冲锋纪律严明，气势宏伟，骑士多使用制式骑士长剑与制式钢骑枪。
2.比蒙巨兽骑士军团：大约由五个比蒙骑士营构成，总数在5000人左右，灵兽坐骑为比蒙巨兽，披挂附魔的坚钢装甲，个体战斗力极度强大，近战肉搏能力极度强大，耐力和速度都很较慢。骑士身披附魔坚钢铠甲，武器为制式坚钢长柄战戟，最基础成员至少为银骑士，营级指挥官多为荣誉伯爵-钻石骑士，历届军团领袖修为多为圣骑士初阶。
3.夜隼天空骑士军团：
人数不详，编制由不知数量的巨型夜隼骑士营构成，最基础的成员也是黑铁级骑士，营级指挥官多为子爵-铂金骑士，军团领袖至少修为为钻石骑士。夜隼最多只戴着鞍具和缰绳，飞行速度极快，但是耐力不强，擅长抓住攻击窗口一击脱离的攻击方式，在夜间视力也很好，具备夜间作战和侦查能力，骑士多使用制式长枪和骑士长剑或灵活弯弓。
