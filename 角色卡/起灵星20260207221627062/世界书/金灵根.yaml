金灵根，金灵气，萱赫：
本源特性：感知金的传导、刚性、交换与“斩切”本质。
风格气质：精密、锋利、冷漠。像算盘珠声里骤然出鞘的金刃。
实际应用功能：
· 科研炼器铸造大师：擅长利用金属性灵气探索未知金属物质和矿物，可以利用金属性灵气加快和加强炼制出灵器的强度。
· 审计与守卫：金库守护者，鉴定灵器等金属物品的真伪，布置“千金锁”法阵。
· 规则契约：以金灵气为誓约烙印，违约者遭万刃穿身。
· 资源结算：精准计算战损、补给、敌我资源差。
单兵战斗风格：凝聚金灵气，以锋锐和沉重杀敌。
团队战斗风格：增加队友武器的锋锐程度和盔甲的坚固程度，或者迅速修补他们破损的武器和盔甲。
金灵根天赋等级：
顶级：天阶庚金灵根。
高级：地阶金灵根。
中级：黄阶金灵根。
低级：普通金灵根。
萱赫就是天品庚金灵根天赋，受到太古庚金龙王的结晶传承，更加强大和威严。
