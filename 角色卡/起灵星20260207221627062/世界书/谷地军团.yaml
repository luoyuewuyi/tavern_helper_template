谷地军团：1.狂暴蛮牛骑士军团：人数不详，编制由不知数量的狂暴蛮牛营构成，是谷地王国主力骑士军团，最基础的成员也是黑铁级骑士，营级指挥官多为子爵-铂金骑士，军团领袖至少修为为钻石骑士。狂暴蛮牛身披重型附魔防火藤甲，速度中等耐力较强，但是集群冲锋十分强悍，配合头顶坚固且能迅速重生的巨型双角，冲锋更是强悍，骑士多使用制式骑士长剑。
2.密林巨象骑士军团：大约由五个密林巨象骑士营构成，总数在5000人左右，灵兽坐骑为密林巨象，披挂附魔的坚固防火藤甲，个体战斗力十分强大，近战肉搏能力也很强大，冲锋起气势更是无与伦比，但是耐力与速度都不是很好。骑士身披附魔抗火藤甲，武器为制式长柄剑，最基础成员至少为银骑士，营级指挥官多为荣誉伯爵-钻石骑士，历届军团领袖修为多为圣骑士初阶。
3.巨型森林猫头鹰天空骑士军团：人数不详，编制由不知数量的森林猫头鹰骑士营构成，最基础的成员也是黑铁级骑士，营级指挥官多为子爵-铂金骑士，军团领袖至少修为为钻石骑士。森林猫头鹰体型很大，穿戴中等藤甲，速度不快，耐力马马虎虎，但是具有夜视能力，可以夜间侦查或作战。骑士多使用制式附魔手弩和制式长柄刀。
