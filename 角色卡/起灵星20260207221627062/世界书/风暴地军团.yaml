风暴地军团：1.风暴马鹫军团：人数不详，编制由不知数量的风暴马鹫骑士营构成，是风暴地王国主力骑士军团，最基础的成员也是黑铁级骑士，营级指挥官多为子爵-铂金骑士，军团领袖至少修为为钻石骑士。风暴马鹫披着附魔银色风系盔甲，速度快耐力足，擅长使用风暴系天赋强化自身或扰乱对手。骑士多使用制式骑士长剑或制式长柄战镰。是少见的天空与地面作战都比较强悍的骑士军团。
2.飓风鹰天空骑士军团：大约由五个飓风鹰骑士营构成，总数在5000人左右，灵兽坐骑为极飓风鹰，披挂附魔的暴风重甲，个体战斗力在天空十分强大，近战肉搏能力和远程风术能力也很强大，且十分敏捷，战术高超，耐力和速度都很强。骑士身披附魔暴风战铠，武器为制式风暴弓和制式风暴长柄刀，几乎是名副其实的天空霸主。最基础成员至少为银骑士，营级指挥官多为荣誉伯爵-钻石骑士，历届军团领袖修为多为圣骑士初阶。
