科举修仙选官：1. 文官选拔：科举+仙考并行，学院毕业生优先
- 科举：凡胤华本土出生、年满16岁者均可参加，分童试-乡试-会试-殿试四重，考试内容为儒家经典+修仙伦理+灵脉基础；录取者为凡人官员，可任郡县佐官。
- 仙考：科举入仕者或学院毕业生需通过灵鉴部仙考，考核灵气操控、功法基础、灵根品质；仙考通过者按修为授予对应官阶，且需满足“县令化灵境、太守金丹境、行省三司主官元婴境、中央三司尚书悟道境”的硬门槛。
- 寒门优待：平民出身的科举考生或学院寒门学员，若灵根品质达到纯净级及以上，可免试直接进入灵务部任职。
2. 修士品阶与官阶绑定表
修仙境界 对应官阶 任职范围 
炼气境 正七品至从九品 县级学宫教习、县尉、监察御史 
筑基境 正六品至从七品 县丞、郡丞、郡级学宫教习 
化灵境 正四品至从六品 县令、县级学宫祭酒、六部主事 
金丹境 正三品至从四品 太守、郡级学宫祭酒、行省三司副职 
元婴境 正一品至从三品 行省三司主官、巡抚、行省学院分院院长 
悟道境 正一品 中央三司尚书、总督、天启修仙学院院长 
羽化境/登仙境 无固定官阶 内阁首辅、护国长老（隐于幕后辅政） 
帝皇境 帝国皇帝 总揽全国军政灵务 
3. 考核机制
- 京察：每三年考核京官，内容包括政绩、修为进展、忠心程度，不合格者降阶或剥夺修为；
- 大计：每五年考核行省、郡、县三级官员，内容包括灵税收缴、妖患治理、学院招生情况，不合格者直接贬为庶民。
