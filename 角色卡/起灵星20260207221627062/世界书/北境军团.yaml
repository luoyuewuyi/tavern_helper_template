北境军团：1.霜狼骑士军团：人数不祥，是北境王国主力骑士军团，灵兽坐骑为霜巨狼，以寒霜属性为特色，披着由经过附魔的永冻寒冰构成的具装铠甲，最基础的成员也是黑铁级骑士，同样披挂经过附魔的永冻寒冰具装盔甲，使用制式霜矛和制式霜刀。军团领袖至少修为为钻石骑士，编制由不知数量的霜狼骑士营构成，营级指挥官多为子爵-铂金骑士。
2.极霜熊骑士军团：大约由五个集霜熊骑士营构成，总数在5000人左右，灵兽坐骑为极霜熊，也披挂附魔的永冻寒冰具装铠甲，个体战斗力极为彪悍，近战肉搏能力十分强大，擅长使用冷冻防御天赋加强自身。最基础成员至少为银骑士，使用制式双手长战斧或单手战斧加圆霜冰盾。历届军团领袖修为多为圣骑士初阶，营级指挥官多为荣誉伯爵-钻石骑士。
3.寒翼巨鹰天空骑士团：人数不详，编制由不知数量的寒翼巨鹰骑士营构成，最基础的成员也是黑铁级骑士，营级指挥官多为子爵-铂金骑士，军团领袖至少修为为钻石骑士。寒翼巨鹰多只戴着鞍具和缰绳，擅长使用冷霜系天赋减缓敌方移速，耐力较好。骑士多使用制式长枪和短刀。
