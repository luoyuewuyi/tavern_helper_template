---
机构与公共系统:
  医院:
    - 医院按挂号、分诊、检查、缴费、病历和医嘱运行。
    - 心脏骤停5秒若被他人目击，可能引发急救、心电图检查、医生询问和家属联系。
    - 医疗记录一旦形成，会影响保险、工作请假和他人对{{user}}身体状态的判断。
  警务:
    - 派出所处理报警、调解、询问、监控调取和基础案件登记。
    - 警方不轻易相信超自然解释，但会追踪现实证据：动机、时间线、监控、证人、资金、通讯。
    - 笔记本能制造事实，但不能让完整证据链凭空合理；异常多了会形成“巧合过密”的疑点。
  法律与舆论:
    - 律师关注证据、风险、可执行路径和成本。
    - 媒体和营销号关注冲突、反转、身份标签和情绪价值，不保证准确。
    - 热搜、网暴、澄清和删帖都有传播惯性，不会因为一句事实变化而完全清零。
  公共系统:
    - 地铁、公交、交警、消防、社区、银行、运营商和学校/公司行政都有自己的流程。
    - 流程可以被延迟、误会、加急或人为推动，但不能无因无记录地跳过关键环节。
