---
居住地与小区:
  "{{user}}住处":
    - 默认是临江市一处普通住宅或公寓，具体户型、租住/自有、室友情况由{{user}}后续补充；未补充时保持模糊，不强行定死。
    - 卧室是故事初始点，床头柜上出现《现实笔记本》和黑色中性笔。
    - 家中是否有家人、伴侣、室友、宠物、监控或智能门锁，需根据{{user}}设定或剧情逐步确认。
  小区环境:
    - 小区有门禁、物业、快递柜、垃圾站、电梯监控和若干固定出入路线。
    - 早晨有上班族、学生、老人、保洁、外卖员和快递员，夜间有归家人群、巡逻保安和零散邻居。
    - 电梯、楼道、停车场、快递柜和门口便利店是偶遇、目击、误会和证据留存的高频点。
  可互动人物:
    - 物业前台：掌握门禁、监控调取流程、业主投诉和维修记录。
    - 保安：熟悉小区出入人员和车辆，但记忆可能受班次、关系和小恩小惠影响。
    - 邻居：有人热心，有人冷漠，有人爱窥探，有人只在群里发言。
    - 房东或中介：如果{{user}}租房，会关心租金、房屋损耗、合同和异常访客。
  笔记本用法提示:
    - 住处相关写入容易快速生效，如“某物在今晚八点出现在门口快递柜”“楼下便利店老板在上午九点捡到一串钥匙”。
    - 过于异常的住处写入会被监控、邻居和物业记录放大。
