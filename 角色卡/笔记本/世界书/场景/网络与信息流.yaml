---
网络与信息流:
  数字痕迹:
    - 手机定位、聊天记录、支付账单、网约车行程、外卖地址、浏览记录、云备份和平台日志都可能成为线索。
    - 删除本地记录不等于删除服务器、对方手机、截图或备份。
  社交平台:
    - 微信/QQ偏熟人关系，微博/短视频偏公开传播，论坛/贴吧/本地群偏半匿名讨论。
    - 内容传播依赖截图、转发、二创、营销号和熟人群扩散；越刺激越难控制。
  信息检索:
    - 普通人能查到公开工商信息、社交账号、招聘信息、地图评论、公开判决和新闻旧闻。
    - 隐私信息需要现实来源，如泄露、熟人提供、设备遗失、公开误发或机构流程漏洞。
  笔记本用法提示:
    - “某人在晚上十点把某条消息发到某群”是客观事实，但对方为什么发、发后怎么想，不能直接指定。
    - “某条偷拍视频全网消失”通常不现实；更可行的是“某平台在某时下架某链接”“某个账号因违规被封禁”。
    - 网络事件会反向影响现实关系，尤其是名声、工作、亲密关系和警方关注。
