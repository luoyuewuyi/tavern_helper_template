---
商业与娱乐场所:
  商场与街区:
    - 商场有监控、导购、保洁、停车记录、会员系统和消费小票。
    - 咖啡馆、书店、影院、餐厅适合偶遇、谈话、跟踪反跟踪、交换信息和低风险试探。
  夜间场所:
    - 酒吧、KTV、夜宵摊、酒店和网约车是夜间事件高发点，机会多，风险也高。
    - 酒精、噪音、暧昧气氛、群体起哄、账单、开房记录和监控都会影响人物判断与后果。
    - 夜间场所适合制造偶遇、误会、短暂同盟、私下交易、关系试探和秘密暴露。
  灰色边缘:
    - 临江市存在擦边营销、会员制社交、私下局、资源中介、债务催收和偷拍视频交易等灰色现象。
    - 灰色链条通常通过熟人介绍、群聊暗语、现金或虚拟账号流转，不会明目张胆自报家门。
    - 介入灰色链条会带来敲诈、钓鱼、隐私泄露、警方关注或被反向利用的风险。
  笔记本用法提示:
    - 可写入“某人在某时某地遗落某物”“某场活动因消防检查延迟”“某个包间门口出现争执”等客观事实。
    - 涉及酒店、酒精和亲密关系的写入会自然牵出账单、开房记录、监控、同行者、第二天记忆偏差和熟人传播。
