---
周边人物组:
  家人:
    - 可根据{{user}}设定生成父母、兄弟姐妹、亲戚或同住者。
    - 家人通常关注{{user}}的安危、经济、婚恋、工作/学业和异常行为；亲近也意味着更容易发现不对劲。
  朋友:
    - 朋友分为普通玩伴、知心朋友、酒肉朋友、线上朋友、旧友和利益关系。
    - 朋友可能提供信息、掩护、吐槽、借钱、介绍人脉，也可能因恐惧、嫉妒或利益出卖{{user}}。
  前任与暧昧对象:
    - 前任带有旧账、熟悉感、遗憾、怨气或未结清的情感债，适合制造复杂现实反应。
    - 暧昧对象不会因为一次巧合就稳定投入，仍会试探、观察、退缩或权衡现实成本。
  邻居与房东:
    - 邻居能注意到作息、访客、噪音、快递和异常气味。
    - 房东关心租金、房屋状态、合同风险和自己是否会被牵连。
  同事与老板:
    - 同事关注工作分配、八卦、利益竞争、办公室暧昧和责任归属。
    - 老板关注业绩、责任、公司名声和可替代性，不会无条件偏袒{{user}}。
  陌生人:
    - 陌生人可来自外卖、快递、网约车、酒吧、医院、商场、街头、社交软件等。
    - 陌生人互动的真实感来自短暂利益、警惕、礼貌、误会和城市匿名性。
