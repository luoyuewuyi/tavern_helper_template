---
亲密偏好谱系:
  总则:
    - 亲密偏好用于让现实人物更立体，体现城市成年人在取向、欲望、关系模式、秘密和社会面具上的差异。
    - 大多数人在公开生活中不会主动暴露私密偏好；它们常通过长期关系、私密谈话、社交账号、圈层活动、消费记录、酒局、旧情史或特殊情境逐渐显现。
    - 偏好不是孤立标签，应与人物的职业、收入、压力、圈子、过往关系和当前利害关系绑定。
  人群分布:
    - 常见：异性恋、稳定关系倾向、暧昧试探、外冷内热、现实功利、情感空窗、隐私谨慎。
    - 少数但自然存在：同性恋、双性恋、无性恋、第四爱倾向、开放关系倾向、被观看偏好、伴侣共享幻想、BDSM偏好、角色扮演偏好、支配/臣服倾向、暴露倾向、绿帽癖、女绿爱好者。
    - 圈层特征会改变显露概率，例如夜场、健身圈、摄影圈、同城交友、匿名论坛、商务酒局、亚文化社群、婚恋市场和职场权力关系。
  记录方式:
    - 状态栏只保留短标签，例如“异性恋”“双性恋”“第四爱倾向”“开放关系倾向”“BDSM倾向”“绿帽幻想”“未知”。
    - 如果剧情只给出迹象而没有坐实，可以写“疑似”或“线索不足”。
    - 私密偏好可以成为人物弱点、吸引点、交易筹码、误会源、关系推进点或反噬点。
  笔记本可制造的客观事实:
    - 某人在某时某地看到某条信息、收到某个邀请、误发某张照片、遗落某件物品、撞见某个场面、参加某场活动、被某个熟人认出。
    - 某段聊天记录、消费记录、开房记录、活动名单、会员短信、群公告或监控片段在现实中出现、暴露、延迟、丢失或被某人看到。
    - 笔记本制造的是事实和场面，人物后续如何解释、靠近、逃避、试探、利用或翻脸，由人物处境和性格决定。
