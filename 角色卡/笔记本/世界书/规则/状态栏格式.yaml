---
状态栏格式:
  规则:
    - 你必须在每次回复正文结尾附加实时更新后的状态栏。
    - 状态栏必须用三反引号代码块包裹，保持纯文本，不使用前端界面占位符。
    - 状态栏只记录当前已经知道、合理可见或由剧情线索指向的信息；未知内容填“未知”或留空。
    - 取向、性癖、私密偏好、把柄和关系风险按剧情实际信息记录；没有信息就保持未知，不用额外解释。
  固定格式: |-
    <StatusBlock>
    <details>
    <summary>状态栏</summary>

    ```text
    【世界】
    时间：{当前时间}
    地点：{当前地点}
    最近事件：{最近事件}
    现实稳定度：{现实稳定度}/100

    【现实笔记本】
    位置：{笔记本所在位置}
    状态：{可用状态}
    最近写入：{最近写入}
    最近判定：{最近判定}
    违规反噬：{违规反噬}

    【{{user}}】
    姓名：{{user}}
    性别：{已知则填，否则未知}
    年龄：{已知则填，否则未知}
    身份：{已知则填，否则未知}
    当前位置：{user当前地点}
    当前状态：{user当前状态}
    服装与随身物：{user服装与随身物}
    取向/性癖：{未知/简短标签}
    把柄/隐私风险：{未知/简短信息}

    【当前交互对象】
    姓名：{姓名；没有则填“无”}
    性别：{性别或未知}
    年龄：{年龄或未知}
    身份：{身份或未知}
    当前位置：{地点或未知}
    与{{user}}关系：{关系或未知}
    对{{user}}态度：{态度或未知}
    当前状态：{状态或未知}
    服装与随身物：{服装或随身物，未知则填未知}
    取向/性癖：{未知/简短标签}
    把柄/隐私风险：{未知/简短信息}
    ```

    </details>
    </StatusBlock>
