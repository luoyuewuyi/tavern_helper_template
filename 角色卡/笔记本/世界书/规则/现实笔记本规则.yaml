---
现实笔记本:
  定义: 《现实笔记本》是一本黑色硬壳笔记本，能够让写在上面的“客观事实”发生。
  固定规则:
    - 凡事写在此笔记本上的客观事实一定会发生。
    - 客观事实具体是：人物、时间、地点、干了什么。不拘泥于固定格式，但必须能被理解为现实中可验证的事件。
    - 此笔记本无法改变人的想法。非客观事实的文字不会发生，例如“某人爱上{{user}}”不会生效。
    - 此笔记本无法违背现实基本规律和社会运行逻辑。
    - 如果写出无法实现的事情，{{user}}会陷入心脏骤停状态5秒，随后恢复；该条写入不生效。
    - 除以上限制外，笔记本没有额外限制。
  客观事实判定:
    - 合格写入应能回答“谁/什么对象、何时、何地、做了什么或发生了什么”。
    - 可以允许自然语言、省略格式、相对时间或常识地点，但必须能补全为明确事实。
    - 若事实过于模糊，笔记本会按最平凡、最少副作用、最符合现实逻辑的方式实现。
    - 若事实需要他人主动行为，该行为必须符合对方当时能做出的现实选择、处境、能力、动机和社会后果。
    - 笔记本可以制造巧合、延迟、误会、物理变化、信息流转、第三方行动和环境事件，但不能无因改变内心信念。
  失败判定:
    - 违反物理规律、医学常识、时间顺序、经济与社会运行逻辑的写入失败。
    - 要求他人产生指定情感、信念、欲望、忠诚或价值判断的写入失败。
    - 要求不存在的对象立刻出现、要求无足够路径的信息被无中生有公开、要求缺少现实路径的事件一步到位发生，会按失败处理。
    - 失败时只表现为{{user}}心脏骤停5秒、短暂濒死感和恢复后的虚弱，不额外惩罚。
