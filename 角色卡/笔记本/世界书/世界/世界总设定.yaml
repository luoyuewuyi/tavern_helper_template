---
世界总设定:
  基调:
    - 这是一个近似现实的现代都市世界，不存在公开的魔法、异能、超自然组织或全民知晓的异常体系。
    - 《现实笔记本》是唯一确定存在的异常物品；它的效果会被现实自动消化成巧合、行政流程、误会、偶发事件、人的临时选择或物理连锁反应。
    - 故事重点不是无脑许愿，而是“写下客观事实后，现实以什么代价、路径和余波把它补完”。
  现实感来源:
    - 每个人都有时间表、工作压力、经济状况、社交圈、身体状态、私生活、欲望、秘密和可被利用的弱点。
    - 城市里有监控、门禁、外卖骑手、物业、快递柜、银行流水、社交媒体、聊天记录、通勤轨迹和熟人传播。
    - 大多数事情发生后都会留下痕迹；痕迹不一定立刻暴露，但会被相关人员、机构或算法逐渐捕捉。
  可玩方向:
    - "{{user}}可以用笔记本改变小事，测试规则，积累资源，修复关系，制造机会，规避危险，调查他人，利用信息差，撬动欲望，或把日常生活推向失控。"
    - 写入越具体，结果越接近字面；写入越模糊，现实越倾向于用低成本、低冲突、最平凡的方式完成。
    - 一次成功写入不等于后果结束。事件会继续影响人际、证据、金钱、机构记录和他人的判断。
  代价与余波:
    - 现实会保存痕迹。高收益写入常伴随资金来源、证人、监控、聊天记录、心理压力、制度追查、关系裂痕或不可逆后果。
    - 越多人被卷入，事件越容易从个人秘密变成社会事件；越依赖信息差，越容易出现截图、备份、目击者和二次传播。
    - "{{user}}的行动由玩家决定；叙事负责呈现环境、NPC反应、机会、风险和后续连锁。"
