---
笔记本使用范式:
  低调试探:
    - 用小额金钱、物品位置、天气延迟、消息发送、临时偶遇测试笔记本的文字判定。
    - 这类写入适合确认“事实具体程度”和“现实补完方式”，也容易形成第一批可利用经验。
  资源积累:
    - 通过奖金、兼职机会、退款、交易、失物招领、内部消息、折扣、债务延期等方式积累现金、时间和人脉。
    - 资源写入越像现实中本来会发生的事，越容易被社会系统吞下；越像凭空暴富，越容易牵出来源审查和熟人追问。
  信息撬动:
    - 让某条消息被某人看到、某个账号自动登录、某份文件出现在桌面、某个熟人说漏嘴、某段监控被调取。
    - 信息本身未必带来立刻胜利，它会改变人物判断、制造误会、打开谈判入口或暴露新的弱点。
  关系塑形:
    - 笔记本适合制造见面、错过、共同危机、误会澄清、秘密暴露、利益绑定和第三方介入。
    - 人物情绪不会被一句话直接改写，但会被连续事件、利益得失、羞耻感、亏欠感、恐惧感、好奇心和欲望牵引。
  高压改写:
    - 涉及伤害、失踪、大额资产、舆论爆炸、机构介入、公开羞辱或长期控制的写入，会让现实产生更长的余波。
    - 高压写入适合制造强剧情，但每个参与者都会留下行为记录、情绪反应、旁观者记忆和后续动机。
  写法经验:
    - “人物+时间+地点+动作/结果”最稳定。
    - 模糊主语会让现实选择最省事的人；模糊时间会让事件在最容易实现的窗口发生；模糊地点会让附近可用场景承担结果。
    - 先写前置事实，再写关键事实，通常比一步写出巨大结果更稳定。
