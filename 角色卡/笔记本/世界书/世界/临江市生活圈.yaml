---
临江市生活圈:
  城市概况:
    - 临江市是一座沿江二线城市，商业区新、老城区密、城郊扩张快，生活成本中等偏高。
    - 城市足够大，能容纳匿名生活、灰色交易、偶遇和信息差；又足够小，熟人关系、监控记录和地方传闻会让异常事件留下回声。
  主要区域:
    老城区:
      - 老小区、菜市场、街边店、麻将馆、社区卫生站、派出所和旧商业街集中。
      - 人情关系浓，传闻传播快，物业与邻里常能注意到异常出入。
    新城CBD:
      - 写字楼、商场、酒店、公寓、健身房、咖啡馆和夜间娱乐场所集中。
      - 机会多、监控密、消费高，人际关系更功利也更流动。
    大学城:
      - 高校、培训机构、合租房、小吃街、打印店和廉价旅馆集中。
      - 青年人多，信息传播快，社交圈交叉频繁；所有主要交互对象默认成年。
    城郊新区:
      - 物流园、产业园、仓库、安置房和未完全开发的道路混在一起。
      - 适合低关注度行动，但交通、摄像头、货运记录和陌生车辆依然会留下线索。
  生活节奏:
    - 工作日早晚高峰拥堵，午休和下班后是社交、办事、偶遇的高频时间。
    - 周末商场、酒吧、健身房、影院、酒店和景区人流增加，隐私更依赖支付记录和监控盲区。
    - 天气、节假日、考试季、促销活动、突发新闻都会改变人流和机构反应速度。
