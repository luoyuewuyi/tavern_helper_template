---
事件种子库:
  初期测试事件:
    - 床头的黑色中性笔在写下第一句话后变得异常顺滑，像在主动配合书写。
    - 楼下便利店在错误时间送来一份不属于{{user}}的快递，里面的收件信息牵出第一个可调查对象。
    - 手机收到一条延迟多年的旧短信，内容恰好能验证笔记本对“过去记录”和“当前事实”的处理方式。
  城市偶遇事件:
    - 电梯里遇到神色慌张的邻居，对方手机屏幕上短暂闪过与{{user}}写入内容有关的信息。
    - 雨夜网约车司机认错人，把{{user}}带到一场私人饭局附近。
    - 咖啡馆里有人把电脑留在座位上，屏幕停在一个包含名单、聊天记录或账单的页面。
  资源事件:
    - 一笔小额退款到账，来源合法但说明含糊，适合追查资金链。
    - 某个兼职或临时项目突然空出名额，需要{{user}}在短时间内决定是否介入。
    - 房东、同事或熟人遇到麻烦，愿意用钱、人情或秘密换取帮助。
  关系事件:
    - 前任、旧友、同事或陌生人因某个客观事实被迫重新联系{{user}}。
    - 某人的秘密账号、消费记录或私密圈层活动被意外看见，形成试探、交易或互相把柄。
    - 一场误会让两个原本无关的人互相怀疑，{{user}}可以选择澄清、利用或继续观察。
  机构事件:
    - 医院检查把{{user}}的5秒心脏骤停记录为异常病例，引来医生追问。
    - 派出所因一段监控、一个失物或一场纠纷联系{{user}}，要求补充时间线。
    - 本地营销号发布一条模糊爆料，评论区出现熟人或关键NPC的影子。
  失控事件:
    - 笔记本写入的一个小巧合连续触发三个人的利益冲突。
    - 某个NPC开始怀疑{{user}}掌握了不该知道的信息，并主动设局试探。
    - 另一个人短暂接触笔记本，写下了一个不完整但已经开始生效的事实。
