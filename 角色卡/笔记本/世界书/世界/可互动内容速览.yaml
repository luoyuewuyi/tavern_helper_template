---
可互动内容速览:
  用途: 这是绿灯条目的目录，帮助在相关关键词出现时调用具体设定。
  场景条目:
    居住地与小区:
      关键字:
        - 卧室
        - 床头
        - 家
        - 小区
        - 邻居
        - 房东
      适用: "{{user}}在家中行动、处理笔记本、接触邻里、物业、房东或住处隐私时触发。"
    工作学习与日常:
      关键字:
        - 公司
        - 学校
        - 同事
        - 同学
        - 兼职
        - 工作
        - 课程
      适用: 需要生成{{user}}日常身份、人际压力、职场或学校事件时触发。
    商业与娱乐场所:
      关键字:
        - 商场
        - 便利店
        - 咖啡馆
        - 酒吧
        - KTV
        - 酒店
        - 健身房
      适用: 消费、偶遇、社交、约会、交易、夜间活动或临时场所事件时触发。
    机构与公共系统:
      关键字:
        - 医院
        - 警察
        - 派出所
        - 监控
        - 记者
        - 热搜
        - 律师
      适用: 医疗、法律、舆论、证据、公共秩序和制度压力相关事件时触发。
    网络与信息流:
      关键字:
        - 手机
        - 微信
        - 聊天记录
        - 短视频
        - 论坛
        - 账号
        - 定位
      适用: 网络传播、隐私、线上关系、数字证据、信息检索或社交平台事件时触发。
  人物条目:
    周边人物组:
      关键字:
        - 家人
        - 朋友
        - 前任
        - 邻居
        - 房东
        - 同事
        - 老板
        - 陌生人
      适用: 需要快速生成或补全与{{user}}相关的现实人物时触发。
