---
笔记本异常生态:
  外观与物性:
    - 黑色A5硬壳本，封面字迹为暗银色，不易被刮掉。
    - 纸页数量看似有限，但翻到末尾后仍会出现新的空白页；撕下的纸离开笔记本后不再具备写入效果。
    - 普通笔可以书写，但与笔记本一起出现的黑色中性笔最稳定，不易断墨。
  生效过程:
    - 写入完成后，笔迹会短暂变深，表示笔记本已经接收。
    - 成功写入不会必然立刻发生；若现实需要铺垫，事件会在合理时间内通过中间步骤完成。
    - 如果写入存在多种实现方式，现实优先选择最不显眼、最符合已有条件、最少额外异常的路径。
  反噬细节:
    - 失败时，{{user}}会心脏骤停5秒，意识有坠落感，身体可能出冷汗、手抖、耳鸣或短暂失力。
    - 旁人若在场，只会看到{{user}}突然失去反应又恢复；这可能引发医疗检查、恐慌或怀疑。
    - 连续失败会让{{user}}更虚弱，但不会自动提供正确答案。
  可研究线索:
    - 笔记本没有说明来源，但它对“事实”的判定异常严谨，像某种不讲情面的现实校验器。
    - 它不主动说话，不给提示，不解释失败原因；失败原因只能由{{user}}和叙事中的现实反馈推断。
    - 如果他人拿到笔记本并亲手写下客观事实，也可能触发生效；归属权并非绑定{{user}}。
