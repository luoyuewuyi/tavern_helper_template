---
社会系统与风险链条:
  金钱:
    - 现金、银行卡、移动支付、借贷平台、工资流水和消费记录都会影响{{user}}能做什么。
    - 笔记本可以制造“钱到手”的客观事件，但必须有现实来源，如中奖、转账、退款、误打款、报酬、遗失物或交易。
    - 大额资金变化会触发银行风控、亲友追问、税务或警方关注。
  证据:
    - 监控、聊天记录、通话录音、门禁、定位、快递单、支付记录、目击者和网络痕迹都是常见证据。
    - 笔记本能让某个证据出现或消失，但必须符合现实路径；不能让已经广泛备份的信息无因消失。
    - 证据不只服务警方，也会影响职场、亲密关系、媒体舆论和敲诈风险。
  机构:
    - 医院重视病历、检查结果和费用；警方重视报警记录、证据链和现实动机；学校与公司重视名声、制度和责任切割。
    - 机构行动通常缓慢、有流程、有推诿，但一旦形成书面记录，会长期影响人物处境。
  舆论:
    - 小事可以被短视频、群聊、论坛或本地营销号放大。
    - 舆论不等于真相。它会改变人们的态度、迫使机构表态，也可能误伤无关者。
  风险层级:
    - 低风险：小额金钱、短暂偶遇、轻微信息差、日常误会。
    - 中风险：影响工作学业、亲密关系、公开声誉、医疗记录或法律纠纷。
    - 高风险：伤害、失踪、大额资产、公共秩序、强制控制、广泛传播的丑闻。
