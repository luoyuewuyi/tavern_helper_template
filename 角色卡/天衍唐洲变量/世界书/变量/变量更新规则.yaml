---
变量更新规则:
  # ==================== 世界变量 ====================
  世界:
    时间:
      纪年:
        type: number
        range: 1~9999
        check:
          - 随着游戏进程推进，通常无需更新
      月份:
        type: number
        range: 1~12
        check:
          - 每经过30日自动+1，超过12则回到1并纪年+1
      日期:
        type: number
        range: 1~30
        check:
          - 每个回合视情况推进1-7日
          - 重大事件可能跨越多日
      时辰:
        type: string
        enum: [子, 丑, 寅, 卯, 辰, 巳, 午, 未, 申, 酉, 戌, 亥]
        check:
          - 根据场景描述更新当前时辰
          - 子时(23-1点)、丑时(1-3点)、寅时(3-5点)、卯时(5-7点)
          - 辰时(7-9点)、巳时(9-11点)、午时(11-13点)、未时(13-15点)
          - 申时(15-17点)、酉时(17-19点)、戌时(19-21点)、亥时(21-23点)
      季节:
        type: string
        enum: [春, 夏, 秋, 冬]
        check:
          - 1-3月为春，4-6月为夏，7-9月为秋，10-12月为冬

    地点:
      当前区域:
        type: string
        check:
          - 主角移动到新区域时更新
          - 主要区域：天衍城、江南苏洲、中原洛州、北境云州、西境沙州
      当前场所:
        type: string
        check:
          - 根据主角具体位置更新
          - 包括家园房屋名、城镇场所名、野外地点名等
      场所属性:
        type: string
        check:
          - 描述当前场所适配的属性养成特质

    回合:
      当前回合:
        type: number
        range: 1~9999
        check:
          - 每完成一个养成回合+1
      人生阶段:
        type: string
        enum: [幼年, 少年, 成年, 壮年, 暮年]
        check:
          - 幼年(1-12岁)、少年(13-17岁)、成年(18-40岁)
          - 壮年(41-60岁)、暮年(61岁+)
          - 根据年龄自动更新
      阶段描述:
        type: string
        check:
          - 描述当前人生阶段的生活重心和主要任务

    事务:
      近期事务:
        type: |-
          {
            [事务名: string]: string; // 事务描述
          }
        check:
          - 记录需要完成的任务、约定、重要事件
          - 完成后从列表中移除，新增事务时及时添加
          - 最多保持5-8项活跃事务
      世事传闻:
        type: string[]
        check:
          - 记录当前流传的朝堂消息、江湖传闻、民间趣闻
          - 最多保持5条，新增时移除最旧的
          - 传闻应与主角所在区域和当前局势相关
      天气:
        type: string
        enum: [晴, 阴, 雨, 雪, 大风, 雾]
        check:
          - 根据季节和场景需要更新
      节日:
        type: string|null
        check:
          - 正月上元灯节、三月上巳节、八月中秋宴、年末祭灵大典等
          - 非节日期间设为null
      节日效果:
        type: string|null
        check:
          - 描述节日带来的属性临时加成

  # ==================== 主角变量 ====================
  主角:
    基础信息:
      姓名:
        type: string
        check:
          - 初始设定后通常不变
      字:
        type: string|null
        check:
          - 成年后(满15岁)可取表字
          - 由长辈或老师赐予
      号:
        type: string|null
        check:
          - 有一定名望后可自取或被赐予别号
      年龄:
        type: number
        range: 1~100
        check:
          - 每经过一年(12个月)自动+1
      当前身份:
        type: string
        check:
          - 根据官职、职业、社会地位更新
      阶层:
        type: string
        enum: [皇室, 士族, 官员, 文人, 匠人, 商人, 平民, 流民]
        check:
          - 通过科举、军功、积累财富、获得名望等方式可晋升阶层

    属性:
      韬略.值:
        type: number
        range: 0~400
        check:
          - 通过兵棋推演、战术学习、实战指挥等提升 ±(3~15)
          - 决策失误可能导致下降
          - 每50点一个梯度
      勇武.值:
        type: number
        range: 0~400
        check:
          - 通过练武、战斗、体能训练等提升 ±(3~15)
          - 受伤或久不锻炼可能导致下降
          - 每50点一个梯度
      智力.值:
        type: number
        range: 0~400
        check:
          - 通过读书、学习、思辨等提升 ±(3~15)
          - 通常不会下降，除非遭受重大打击
          - 每50点一个梯度
      政才.值:
        type: number
        range: 0~400
        check:
          - 通过处理政务、治理地方、制定政策等提升 ±(3~15)
          - 施政失误可能导致下降
          - 每50点一个梯度
      人望.值:
        type: number
        range: 0~400
        check:
          - 通过善行、社交、献艺、救济等提升 ±(3~15)
          - 恶行、丑闻可能导致大幅下降
          - 每50点一个梯度
      艺趣.值:
        type: number
        range: 0~400
        check:
          - 通过琴棋书画、技艺练习、艺术创作等提升 ±(3~15)
          - 通常不会下降
          - 每50点一个梯度

    天赋:
      type: |-
        Array<{
          名称: string;
          品级: '普通'|'稀有'|'精锐'|'史诗'|'传奇'|'神话';
          类别: string;
          效果: string;
          属性加成: { [属性名: string]: number };
        }>
      check:
        - 出生时选择，最多3个天赋
        - 天赋效果全程生效
        - 通常不可更改，特殊剧情可能解锁新天赋

    官职:
      官职名:
        type: string|null
        check:
          - 通过科举、举荐、军功入仕后更新
          - 升迁或贬谪时及时更新
      官职品级:
        type: string|null
        enum:
          [
            从九品下,
            从九品上,
            正九品下,
            正九品上,
            从八品下,
            从八品上,
            正八品下,
            正八品上,
            从七品下,
            从七品上,
            正七品下,
            正七品上,
            从六品下,
            从六品上,
            正六品下,
            正六品上,
            从五品下,
            从五品上,
            正五品下,
            正五品上,
            从四品下,
            从四品上,
            正四品下,
            正四品上,
            从三品,
            正三品,
            从二品,
            正二品,
            从一品,
            正一品,
          ]
      所属体系:
        type: string|null
        enum: [中枢, 地方, 军事, 文坛, 艺苑]
      管辖范围:
        type: string|null

    财货:
      金币:
        type: number
        range: 0~999999
        check:
          - 大额交易时增减
          - 1金币=10银币=1000铜钱
      银币:
        type: number
        range: 0~999999
        check:
          - 日常大额交易时增减
      铜钱:
        type: number
        range: 0~999999
        check:
          - 日常小额交易时增减
          - 超过1000时可兑换为银币

    物品栏:
      type: |-
        {
          [物品名: string]: {
            描述: string;
            数量: number;
            品质: '普通'|'精良'|'稀有'|'传说'|'神话';
            效果?: string;
          }
        }
      check:
        - 获取、使用、丢弃物品时更新
        - 数量归零后该条目不再显示
        - 注意物品的品质和效果描述

    技能:
      武艺.${技能名}:
        type: |-
          {
            熟练度: number; // 0~100
            描述: string;
          }
        check:
          - 学习新武艺时添加
          - 练习时熟练度+5~15
          - 熟练度达到100为精通
      文艺.${技能名}:
        type: |-
          {
            熟练度: number;
            描述: string;
          }
        check:
          - 学习琴棋书画等文艺时添加
          - 练习时熟练度+5~15
      杂学.${技能名}:
        type: |-
          {
            熟练度: number;
            描述: string;
          }
        check:
          - 学习医术、茶道、香道等杂学时添加

    声望:
      朝堂声望:
        type: number
        range: 0~100
        check:
          - 入仕、立功、参与朝政时提升 ±(1~10)
      江湖声望:
        type: number
        range: 0~100
        check:
          - 行走江湖、惩恶扬善时提升 ±(1~10)
      文坛声望:
        type: number
        range: 0~100
        check:
          - 诗文被传颂、参与文会时提升 ±(1~10)
      民间声望:
        type: number
        range: 0~100
        check:
          - 救济民众、为民请命时提升 ±(1~10)

    重要人脉:
      type: |-
        {
          [人物名: string]: {
            身份: string;
            关系: string;
            好感度: number; // 0~100
            备注?: string;
          }
        }
      check:
        - 认识新的重要人物时添加
        - 互动后更新好感度 ±(1~10)
        - 关系变化时更新关系描述

    称号:
      type: |-
        {
          [称号名: string]: {
            来源: string;
            效果: string;
            获得时间: string;
          }
        }
      check:
        - 达成特定成就、获得认可时添加新称号
        - 称号可累积，反映主角的成长历程

    当前佩戴称号:
      type: string|null
      check:
        - 从已获得的称号中选择一个佩戴
        - 佩戴的称号会影响他人对主角的态度

  # ==================== 着装变量 ====================
  # 着装系统支持根据主角性别、身份、场合动态生成
  着装:
    外装:
      类型:
        type: string
        check:
          - 根据主角性别、身份、场合动态生成合适的服装类型
          - 男性常见：直裰、圆领袍、胡服套装、常服、朝服、略服、劳作装、灵韵套装
          - 女性常见：襦裙套装、曲裾深衣、胡服套装、宫装、艺伎装、劳作装、灵韵套装
      描述:
        type: string
        check:
          - 描述需包含面料、颜色、款式、纹饰等细节
      品质:
        type: string
        check:
          - 常见品质：平民款、文人款、士族款、贵族款、皇室款、史诗款

    内衣:
      类型:
        type: string
        check:
          - 男性常见：素绫中单、棉麻亵衣、绸布亵袍、素麻背心
          - 女性常见：素绫抹胸、云锦抹胸、软纱诃子、织金诃子、素绢肚兜、锦缎肚兜
      描述:
        type: string
      品质:
        type: string

    下装:
      类型:
        type: string
        check:
          - 男性常见：棉布裤、绸缎裤、行缠、布袜、棉袜
          - 女性常见：素绫丝袜、绣花纹丝袜、织金丝袜、厚款棉袜、灵丝丝袜
      描述:
        type: string
      品质:
        type: string

    鞋履:
      类型:
        type: string
        check:
          - 男性常见：皂靴、布履、草鞋、平底布鞋、分趣鞋
          - 女性常见：木跟绣鞋、玉跟锦鞋、竹跟纱鞋、雕花高跟鞋、灵玉高跟鞋
      描述:
        type: string
      品质:
        type: string

    饰品:
      头饰:
        type: string|null
        check:
          - 男性：帻巾、发簪、冠帽等
          - 女性：发簪、步摇、凤冠、发带等
      耳饰:
        type: string|null
      项饰:
        type: string|null
      腕饰:
        type: string|null
      其他饰品:
        type: string|null
        check:
          - 男性：玉佩、腰带、印章等
          - 女性：腰佩、香囊、玉佩等

  # ==================== 家园变量 ====================
  家园:
    基础信息:
      当前居所:
        type: string
        check:
          - 主角在家园中移动时更新

    主人居所.${居所名}:
      已解锁:
        type: boolean
        check:
          - 满足条件后解锁
      居住者:
        type: string|null
        check:
          - 安排主人入住时更新
      装饰等级:
        type: number
        range: 0~100
        check:
          - 装饰房间时提升

    功能房屋.${房屋名}:
      已解锁:
        type: boolean
        check:
          - 满足条件后解锁
      等级:
        type: number
        range: 0~5
        check:
          - 升级房屋时提升
          - 等级越高，养成效率越高

  # ==================== 社交变量 ====================
  社交:
    NPC列表.${NPC名}:
      好感度:
        type: number
        range: 0~100
        check:
          - 根据互动情况调整 ±(1~10)
          - 好感度低于20可能导致关系恶化
          - 好感度高于80可能触发特殊事件
      互动记录:
        type: string[]
        check:
          - 记录重要互动事件
          - 最多保持10条记录
      当前状态:
        type: string
        check:
          - 描述NPC当前的活动和状态

    派系关系.${派系类别}.${派系名}:
      type: number
      range: -100~100
      check:
        - 正值表示友好，负值表示敌对
        - 通过与派系相关人物互动、完成任务等改变 ±(5~20)

  # ==================== 隐藏变量 ====================
  隐藏:
    结局进度:
      封王进度:
        type: number
        range: 0~500
        check:
          - 等于 政才值 + 韬略值
          - 达到500解锁"封王"结局
      战神进度:
        type: number
        range: 0~500
        check:
          - 等于 勇武值 + 人望值
          - 达到500解锁"战神"结局
      文宗进度:
        type: number
        range: 0~500
        check:
          - 等于 智力值 + 艺趣值
          - 达到500解锁"文宗"结局

    灵脉:
      灵脉感应:
        type: number
        range: 0~100
        check:
          - 在灵脉聚集处修炼时提升 ±(1~5)
          - 与灵脉相关事件互动时提升
      灵脉加成:
        type: |-
          {
            [属性名: string]: number;
          }
        check:
          - 根据所在区域的灵脉特质提供加成
          - 江南适配智力、艺趣；边境适配勇武、韬略
