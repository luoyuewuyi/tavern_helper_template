# yaml-language-server: $schema=../../schema.json
# 在编写 initvar 之前, 请先保证终端有在运行 `pnpm watch`, 这会生成 schema.json 用于检验 initvar 是否有效

# ==================== 世界变量 ====================
世界:
  # 时间系统
  时间:
    纪年: 713
    月份: 3
    日期: 15
    时辰: 卯
    季节: 春
  # 地点系统
  地点:
    当前区域: 江南苏洲
    当前场所: 静尘苑·正堂
    场所属性: 艺趣、智力养成适配
  # 回合与阶段
  回合:
    当前回合: 1
    人生阶段: 幼年
    阶段描述: 启蒙开智之时，万般皆可塑造
  # 世界动态
  事务:
    近期事务:
      启蒙入学: 需选择入读私塾或由家中延师教导
      家园熟悉: 可探索静尘苑各处房屋，解锁养成场景
    世事传闻:
      - 天衍城传来消息，今岁科举将增设策论一科
      - 北境苍狼部近日似有异动，边军已加强戒备
      - 江南新茶上市，苏洲城外茶坊熙熙攘攘
    天气: 晴
    节日: null
    节日效果: null

# ==================== 主角变量 ====================
主角:
  # 基础信息
  基础信息:
    姓名: 待定
    字: null
    号: null
    性别: 女
    年龄: 6
    出身: 士族子弟
    出身加成:
      智力: 20
      艺趣: 20
    当前身份: 士族幼女
    阶层: 士族

  # 六大属性系统（核心）
  属性:
    韬略:
      值: 10
    勇武:
      值: 5
    智力:
      值: 30
    政才:
      值: 5
    人望:
      值: 15
    艺趣:
      值: 30

  # 天赋系统
  天赋:
    - 名称: 过目成诵
      品级: 精锐
      类别: 过目不忘类
      效果: 听过、看过的文字能完整背诵，智力+8点，学习速度+5%
      属性加成:
        智力: 8
    - 名称: 清韵
      品级: 稀有
      类别: 魅力类
      效果: 气质清雅，初次接触他人时人望+3点
      属性加成:
        人望: 3
    - 名称: 敏学
      品级: 普通
      类别: 学习能力类
      效果: 学习基础技艺时，属性提升速度+5%
      属性加成: {}

  # 官职系统
  官职:
    官职名: null
    官职品级: null
    所属体系: null
    管辖范围: null

  # 财货系统
  财货:
    金币: 5
    银币: 30
    铜钱: 500

  # 物品栏
  物品栏:
    素绢手帕:
      描述: 母亲缝制的素白手帕，角落绣着一枝兰草
      数量: 1
      品质: 普通
      效果: null
    桃花糕:
      描述: 膳房新制的点心，甜糯可口
      数量: 3
      品质: 普通
      效果: 食用后心情愉悦

  # 技能系统
  技能:
    武艺: {}
    文艺:
      识字:
        熟练度: 20
        描述: 已识得常用字数百
    杂学: {}

  # 人脉与声望
  声望:
    朝堂声望: 0
    江湖声望: 0
    文坛声望: 0
    民间声望: 5
  重要人脉: {}

  # 称号系统
  称号: {}
  当前佩戴称号: null

# ==================== 着装变量 ====================
着装:
  外装:
    类型: 襦裙套装
    描述: 浅粉色素绢短襦，领口绣着淡雅桃花，搭配鹅黄色齐腰百褶裙，裙摆轻盈
    品质: 士族款
  内衣:
    类型: 素绢肚兜
    描述: 浅粉色素绢肚兜，绣着可爱的小兔子图案，柔软舒适
    品质: 普通款
  下装:
    类型: 撞色丝袜
    描述: 浅粉与月白撞色的蚕丝丝袜，边缘绣着小花纹，及膝长度
    品质: 少女款
  鞋履:
    类型: 雕花高跟鞋
    描述: 桃木鞋跟雕刻着小蝴蝶，鞋面浅粉素绫，绣着小花纹
    品质: 少女款
  饰品:
    头饰: 粉色绢花发带，点缀几颗小珍珠
    耳饰: null
    项饰: null
    腕饰: 红绳编织的手链，系着一枚小银铃
    其他饰品: 淡粉色绣花香囊，内装安神香料

