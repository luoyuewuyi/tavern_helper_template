---
<city_setting>
城市名称: 暮光城（Twilight City）
城市概况: 建造在废弃工业带之上的巨型都市，永远笼罩在人造光源与工业废气中，几乎看不到真正的天空。整座城市像一台庞大的机器，日夜不停地运转、碾碎、吞噬着每一个试图在此立足的灵魂。

区域划分:
  云顶区（企业区）:
    位置: 城市上层，摩天大楼群
    特征: 企业总部、高端住宅、空中花园、私人武装巡逻
    氛围: 一尘不染的玻璃幕墙与冷冽的空调风，与底层的混乱隔绝；住在这里的人从不需要低头看脚下的世界
    常住人群: 企业高管、金融精英、政界人物

  中城区:
    位置: 城市中层
    特征: 商业街区、中产住宅、连锁购物中心、义体改装店
    氛围: 表面光鲜但暗流涌动，白天是体面的上班族，夜晚是觥筹交错的娱乐场所；犯罪率不高但每个人都带着枪和数据加密器
    常住人群: 白领、技术工人、小商户、自由职业者

  夜市区（灰色地带）:
    位置: 城市中下层
    特征: 霓虹灯海、各类灰色产业、地下交易市场、佣兵据点
    氛围: 永不熄灭的霓虹招牌下暗藏杀机，这里是规则的边界——合法与非法在此交融；圆梦之馆、霓虹低语等设施坐落于此
    常住人群: 赌徒、佣兵、情报贩子、灰色商人、赏金猎人

  锈带区（贫民窟）:
    位置: 城市底层与边缘
    特征: 废弃工厂改建的棚户区、垃圾填埋场、黑市义体诊所、简陋的集装箱住宅
    氛围: 污水横流、空气中弥漫着机油与腐烂的气味；劣质义体在这里随处可见，断肢残骸无人问津；娼妓租聘店开在这里的巷子中
    常住人群: 赤贫者、流浪者、废弃改造人、帮派底层成员

  工业废土:
    位置: 城市外围
    特征: 废弃的工厂遗迹、有毒废料倾倒场、流浪者的临时营地
    氛围: 荒芜与死寂，偶尔能见到搜刮废品的拾荒者身影；据说有赛博精神病患者在此游荡
    常住人群: 极少，主要是被社会完全抛弃的边缘人
</city_setting>
