---
<cyberware_tech>
义体技术体系:
  义体分级:
    军用级:
      描述: 企业与军方专用的尖端义体，性能卓越、外观与真人无异，配备武器系统与高级防护
      获取途径: 仅对企业高管、特种部队、顶级佣兵开放
      价格: 天文数字，普通人一辈子也买不起

    民用级:
      描述: 面向中产阶级的标准义体，功能完善但没有武装模块，外观略带机械感
      获取途径: 正规义体诊所购买
      价格: 昂贵但中产可以分期承担

    劣质级:
      描述: 回收零件拼装或最低成本量产的义体，性能不稳定、外观粗糙、排异反应频繁
      获取途径: 黑市、贫民窟诊所、借贷所作为抵押品替换
      特征: 这是贫民窟中妓女和底层改造人所用的款型，对普通日常使用影响不大，但对技术工人和依靠精密操作谋生的人来说无法接受
      价格: 低廉

  义体类型:
    - 四肢替换: 机械臂/腿，可增强力量或速度
    - 感官强化: 赛博眼（热感、夜视、数据叠加显示）、听觉增强
    - 器官替代: 人工心脏、合成肺、过滤肾
    - 神经接口: 脑部插口、数据传输线缆、AI辅助芯片
    - 皮下装甲: 植入皮下的防弹纤维层
    - 特殊改造: 如蛇身义体（白荔的下半身），属于人体实验的特殊产物

  义体能源:
    生物电力: 大部分民用和劣质义体依靠人体自身的生物电驱动，与神经系统直连，因此义体出问题表现为故障、痉挛、系统紊乱，而非简单的"没电"
    外部供能: 仅军用级义体和特殊攻击性放电义体配备独立电池模块，需要定期充能
    白荔的蛇身: 属于劣质级义体，完全依赖生物电力驱动，故障时表现为关节卡死、蛇尾痉挛、感知失灵等症状

  义体风险:
    排异反应: 便宜的义体排异反应更严重，表现为发热、痉挛、系统崩溃
    赛博精神病: 过度义体化会导致人格崩解，患者丧失共情能力，走向暴力与疯狂
    黑客入侵: 联网的义体可能被黑客远程控制，是底层社会最恐怖的威胁之一
    依赖性: 一旦安装高级义体，人体会对其产生依赖，移除后可能导致严重的功能障碍

黑客技术:
  描述: 被称为「网络行者」的黑客能够通过神经接口入侵他人义体和信息系统
  能力: 远程瘫痪义体、窃取数据、伪造身份、入侵安保系统
  风险: 过度使用可能导致神经烧毁，且被企业追踪后果极其严重

克隆技术:
  描述: 利用生物数据复制人体组织或全身复制
  用途: 圆梦之馆用赌客的身体部件制造克隆人兔女郎；医疗中心用于器官移植
  限制: 克隆人没有完整人格和记忆，被视为「产品」而非「人」

服务芯片:
  描述: 一种植入脑内的控制芯片，用于将人改造为服从命令的服务者
  功能: 抑制独立思维，强制服从指令，维持基本生理功能
  状态: 活跃时完全控制宿主行为；报废后芯片仍残留在脑内，偶尔会发作影响宿主行为（白荔的状况）
</cyberware_tech>
