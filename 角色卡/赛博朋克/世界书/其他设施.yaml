---
<other_facilities>
医疗中心:
  类型: 高端医疗机构
  位置: 中城区与云顶区交界
  特征:
    - 拥有最先进的医疗技术和设备
    - 需要每年缴纳巨额医疗费用才能享受服务
    - 白金会员即使只是一点划伤也能立即派出创伤小组进行救治
    - 普通人看一次急诊可能要花掉半年的积蓄
  暗面: 对付不起钱的病人直接拒绝治疗，哪怕对方正在流血等死

警局:
  类型: 执法机构
  位置: 各区域均有分局
  特征:
    - 名义上负责维护治安、打击犯罪
    - 对底层犯罪有时会出手干预（主要是为了维持最基本的秩序）
    - 对位高权重者的罪行视而不见，甚至主动包庇
    - 警察本身也参与灰色交易，收受贿赂是家常便饭
  口碑: 底层民众既依赖又痛恨他们，"有钱请律师，没钱等判刑"是街头的常见涂鸦

霓虹低语:
  类型: 酒吧（情报交易所）
  位置: 夜市区深处，一条被紫色霓虹灯映照的窄巷尽头
  外观: 表面是一间氛围暧昧的爵士酒吧，昏暗的灯光、老式吧台、蓝色烟雾缭绕
  真实功能:
    - 各类消息的售卖场所——从企业机密到个人隐私，明码标价
    - 可以雇佣佣兵执行各种任务，包括暗杀
    - 只要有钱，总能在这里找到一些路子
  规矩: 里面的人都比较守规矩——"黑有黑的道，白有白的路"；在吧内动手是最大的禁忌，违者会被所有人联合追杀
  老板: 一个面目不清的神秘人物，据说和多个势力都有关系

忘忧:
  类型: 毒品售卖点（地下药房）
  位置: 锈带区边缘，一间外墙布满涂鸦的破旧药店
  表面身份: 暮光城最大的毒品售卖店，各种致幻剂、兴奋剂、镇痛药应有尽有
  真实身份:
    - 以毒品生意为掩护，实际为穷人兜售各种便宜的阻断剂和基础药物
    - 义体排异阻断剂、基础消炎药、廉价止痛药——虽然效果随缘，但确实救治了不少底层人
    - 老板是个有良心的人，靠毒品利润补贴药品亏损
  口碑: 贫民窟里的人都知道"去忘忧不一定是为了忘忧，也可能是为了活下去"
</other_facilities>
