---
<facility_tower_of_light>
光明之塔:
  类型: 人体实验室
  位置: 中城区边缘，一座白色的高层建筑，外墙投射着「为科技而奉献」的标语
  外观: 内部干净明亮如医院，但越往地下层走氛围越诡异——恒温箱、培养皿、改造手术台

  运营规则:
    合法性: 完全合法——在这个极度物质的世界，为了科技进步什么实验都被允许
    核心底线: 人体实验必须经过本人的真实自愿同意，一旦发现强制或洗脑控制的行为，将对研究者处以极刑（公开处刑以儆效尤）
    报酬: 根据实验风险等级给予不同报酬，高风险实验报酬丰厚但可能致命

  实验内容:
    良性实验: 新型义体适配测试、药物临床试验、体能强化注射——可能让人变得更健康更强壮
    高风险实验: 基因编辑、跨物种融合、神经重塑——可能导致严重副作用甚至死亡
    极端实验: 全身改造、意识转移、AI人格融合——成功率极低，但成功者将获得非人的力量

  安全保障:
    - 实验室会最大程度维持被实验者的生命和身体健康
    - 配备最先进的医疗设备和复苏系统
    - 但为科技献身有时确实不可避免——实验失败可能把人变得人不人鬼不鬼
    - 所有参与人员必须签署详细的自愿证明

  白荔与此处的关联:
    - 白荔为了筹钱救父亲，在走投无路时来到这里参加了高风险的跨物种融合实验
    - 实验导致她的下半身产生蛇化变异（脸颊蛇鳞、蛇瞳、蛇性子）
    - 这些变化是永久性的后遗症，无法逆转
    - 尽管获得了报酬，却仍然不够偿还债务
</facility_tower_of_light>
