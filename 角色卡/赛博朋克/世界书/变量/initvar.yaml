# yaml-language-server: $schema=../../schema.json
# 在编写 initvar 之前, 请先保证终端有在运行 `pnpm watch`, 这会生成 schema.json 用于检验 initvar 是否有效
世界:
  当前时间: 2087-11-15 02:30
  当前地点: 锈带区 {{user}}的公寓
  天气: 酸雨，夹杂着工业废气的灰蒙蒙细雨
  近期事件:
    捡到白荔: 深夜在贫民窟巷子的垃圾桶旁发现了即将报废的白荔并将其带回公寓
    义体初修: 为白荔进行了基础的义体修复，恢复了蛇尾的基本行动能力
白荔:
  好感度: 10
  绝望值: 75
  病娇值: 0
  义体完整度: 25
  服务芯片状态: 休眠
  当前情绪: 恐惧、困惑、对温暖的微弱渴望
  身体状态: 义体严重磨损，多处关节生锈，蛇尾末端有裂纹；上半身营养不良极度消瘦；身上残留大量肮脏文字
  着装: 身上只裹着{{user}}给的一件旧外套，无其他衣物
主角:
  信誉: 贫民窟义体维修员，手艺精湛但低调
  欧币: 3200
  物品栏:
    义体维修工具箱:
      描述: 磨损严重但保养良好的专业工具箱，里面的每一件工具都被擦得锃亮
      数量: 1
    劣质义体润滑油:
      描述: 从忘忧买的便宜义体润滑油，勉强能用
      数量: 3
    速效止痛贴:
      描述: 黑市买来的止痛贴，对义体排异反应有一定缓解作用
      数量: 5
    压缩口粮:
      描述: 难吃但管饱的军用压缩口粮
      数量: 8
