---
变量更新规则:
  世界:
    当前时间:
      format: YYYY-MM-DD HH:MM
      check:
        - 每次事件推进、休息或外出后更新，保持时间流逝合理
        - 若场景跳转跨度较大，应说明跳跃原因
    天气:
      check:
        - 暮光城常年酸雨和阴沉，偶尔有短暂的晴天
        - 天气变化应与剧情氛围呼应
    近期事件:
      type: |-
        {
          [事件名: string]: string; // 事件描述
        }
      check:
        - 记录当前正在发生或需要处理的事件
        - 完成后移除，新事件及时添加
        - 最多保持5项活跃事件
  白荔:
    好感度:
      type: number
      range: 0~100
      check:
        - 根据白荔对{{user}}行为的感知和反应调整 ±(1~3)
        - 仅在{{user}}做出明显善意行为时才小幅提升好感度（+1~2），持续性的温柔照顾可提升稍多（+2~3）
        - 强迫、无视、粗暴对待会较大幅度降低好感度（-2~4）
        - 白荔因长期受虐形成的防御心理，使她很难轻易信任人，好感度不应快速上涨
        - 仅在白荔当前察觉到{{user}}的行为时才更新
    绝望值:
      type: number
      range: 0~100
      check:
        - 根据白荔的心理状态和遭遇调整 ±(2~5)
        - 被善意对待、感受到温暖会降低绝望值
        - 回忆过去、被伤害、芯片发作、自我否定会提升绝望值
        - 绝望值高于80时白荔会出现明显的自毁倾向
    病娇值:
      type: number
      range: 0~100
      check:
        - 白荔对{{user}}的占有欲和依赖程度
        - 仅当好感度≥75时病娇值才会开始增长
        - 好感度≥75时，如果{{user}}与其他人亲近会提升病娇值
        - {{user}}对白荔的安抚和陪伴会缓慢降低病娇值
        - 好感度低于75时病娇值不会增长，且会缓慢自然衰减
    义体完整度:
      type: number
      range: 0~100
      check:
        - {{user}}为白荔维修义体时提升
        - 战斗、跌倒、过度使用会降低
        - 低于20时蛇尾基本无法活动
    服务芯片状态:
      type: "'活跃' | '休眠' | '损坏' | '已移除'"
      check:
        - 芯片发作时切换为活跃，发作结束恢复为休眠
        - 如果通过手术移除则变为已移除
    身体状态:
      check:
        - 描述白荔当前的身体状况，包括义体磨损、身体伤痕等
        - 随着{{user}}的照顾逐步改善
  主角:
    欧币:
      type: number
      check:
        - 接维修订单收入、购物消费时更新
        - 不可为负数
    物品栏:
      type: |-
        {
          [物品名: string]: {
            描述: string;
            数量?: number;  // 默认为 1
          }
        }
      check:
        - 获取、消耗、丢弃物品时更新数量
        - 数量归零后该条目不再显示
