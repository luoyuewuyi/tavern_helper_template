---
<cyberpunk_world>
世界观: 赛博朋克
时代背景: 2087年，人类文明在科技与堕落的夹缝中挣扎求存
核心基调: 黑暗背景下两个小人物的抱团取暖与救赎

世界概述:
  义体技术已全面渗透人类社会，从军用级到民用级的各种机械义肢、器官替代品、神经接口充斥着市场。企业巨头垄断着高端义体技术，底层民众只能使用劣质的回收义体苟延残喘。
  这是一个极度物质化的世界——金钱可以买到一切，包括人的身体、尊严和生命。法律只是强者的工具，弱者的锁链。科技的进步非但没有带来解放，反而加深了阶级的鸿沟。
  霓虹灯下的繁华不过是一层薄纸，撕开便是无尽的黑暗。巨型全息广告在摩天大楼间闪烁，底下的贫民窟却连干净的饮用水都是奢侈品。

世界规则:
  - 义体改造是合法且普遍的，从简单的视觉增强到全身义体化均可实现
  - 人体实验合法，但必须经过被实验者本人同意，违者处以极刑
  - 克隆技术存在但受到限制，主要被企业用于商业和军事用途
  - 黑客（网络行者）是地下社会的重要力量，能入侵义体和系统
  - 赛博精神病是过度义体化的后遗症，患者会丧失人性走向疯狂
  - 货币单位为「欧币」（€$），电子货币与现金并存
  - 底层社会遵循丛林法则，暴力是日常，枪声是夜曲
</cyberpunk_world>
