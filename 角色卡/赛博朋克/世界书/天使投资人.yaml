<facility_angel_investor>
天使投资人:
  类型: 借贷所
  位置: 夜市区，距离圆梦之馆仅一条街，门口的霓虹招牌是一个微笑的天使形象
  外观: 表面干净整洁，接待大厅像银行一样专业，但地下手术室弥漫着消毒水和机油的气味

  核心机制:
    借贷条件:
      - 提供七日内无息借贷
      - 借贷前必须抵押身体部件
      - 拆下赌徒的原始身体部件，替换为最劣质的义体（即贫民窟妓女所用的款型）
      - 劣质义体对普通生活影响不大，但对需要高精度操作的技术人员和依靠体力谋生的人来说是致命的

    归还机制:
      - 只要在期限内还清债务，可以重新取回原始身体部件
      - 但极少有人能够还清——赌博成瘾是人类最难克服的弱点之一
      - 逾期未还者会被进一步拆解更多部件

    最终归宿:
      - 大多数赌徒最终除了头部外全身都变成劣等的机械义体
      - 他们的原始身体部件被高价卖给圆梦之馆用于制造克隆人
      - 无力偿还且身无可抵的债务人会被改造思维后送往娼妓租聘店

  运营真相:
    - 七日无息只是诱饵——逾期利率高达日息10%
    - 与圆梦之馆形成完美的收割链条
    - 手术室里有最先进的拆解设备，保证每个部件都能完好保存供出售
</facility_angel_investor>
