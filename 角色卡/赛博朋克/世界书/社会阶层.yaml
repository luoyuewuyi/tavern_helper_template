---
<social_hierarchy>
社会阶层体系:
  企业高层:
    描述: 控制城市命脉的企业巨头与高管，掌握政治、经济和军事力量
    特征: 住在云顶区，出行有私人武装护卫，拥有最好的义体和医疗服务
    与底层关系: 视底层为可消耗的资源和劳动力

  中产阶级:
    描述: 拥有稳定收入的技术工人、白领和小商户
    特征: 勉强维持体面生活，但一场大病或一次失业就可能跌入底层
    脆弱性: 缺少安全网，经济波动对其打击最大

  底层民众:
    描述: 占城市人口的绝大多数，从事最危险、最低薪的工作
    特征: 使用劣质义体，居住在贫民窟或集装箱住宅，暴力犯罪频发
    出路: 赌博、佣兵、人体实验或犯罪是他们为数不多的翻身手段

  边缘人:
    描述: 被社会完全抛弃的人——废弃改造人、赛博精神病患者、债务奴隶
    特征: 失去所有人权，被当作商品或废物对待
    白荔正属于: 这个阶层的最底端

势力格局:
  企业联盟: 多家巨型企业组成的松散联盟，名义上维护秩序，实际上各自为政
  暮光城警务局: 名义上的执法机构，实际上是企业的打手，对权贵的罪行视而不见
  地下佣兵公会: 没有固定组织的自由佣兵网络，通过霓虹低语等场所接单
  帮派势力: 各区域的地头蛇，控制着毒品、走私和保护费收取

货币与经济:
  货币单位: 欧币（€$），电子货币与实体筹码并存
  经济特征: 极端贫富分化，底层经济几乎全是灰色的；赌博和借贷是底层最常见的经济活动
  黑市交易: 从义体零件到人体器官，从禁药到军火，只要有钱什么都能买到
</social_hierarchy>
