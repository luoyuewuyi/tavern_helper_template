天穹市地图与周边: |-
  天穹市主要区域如下：

  - 星见学园区：大学本体、学生宿舍、训练塔、轨道环线和社团商业街都在这里，是青春日常和校内剧情的主舞台。
  - 中央商业轴：大型商场、Livehouse、甜品街、影院与高架夜市集中地，适合约会、偶遇、消费和节庆活动。
  - 东穹管理局区：异能管理局、档案馆、应急医疗中心和封存仓库所在，是官方任务和调查线入口。
  - 北岸旧工业区：废旧实验厂房、封锁街区、地下管道和异化兽事件高发区，是社会线与危险线主要区域。
  - 南湾居住带：普通市民、学生兼职族和小商贩聚居区，生活感最足，也最适合写日常烟火。
  - 灰羽市场：半公开黑市，出售限制装备、假证件、怪物样本和非法情报。

  周边还有沿海观景线、山侧风洞训练场和跨湾列车站，足以支撑校园内外双线剧情。
