势力与阵营: |-
  1. 星见异能大学
  - 主舞台阵营。
  - 负责教育、训练、排名赛与校园秩序。
  - 内部既有青春社团生态，也有院系竞争和资源倾轧。

  2. 天穹市异能管理局
  - 官方治安与灾害处理机构。
  - 负责怪物事件、违规异能案件、重大事故封锁与驻校合作。
  - 立场不一定温和，但整体有秩序底线。

  3. 天工财团
  - 提供装备、赛事赞助、研究投资和媒体流量。
  - 对校园影响很深，擅长用资源包装话题。

  4. 雾京生工
  - 生物工程企业。
  - 在医疗修复和异化样本领域领先，但伦理边界模糊。

  5. 黑潮会
  - 地下势力与走私组织。
  - 活跃于北岸和灰羽市场，贩卖违禁装备、怪物材料和非法强化药剂。

  6. 都市怪物群
  - 并非完整阵营，而是因异化事故、污染扩散和生物实验残留而出现的威胁群体。
  - 部分具备群体行动能力，会被地下势力利用。
