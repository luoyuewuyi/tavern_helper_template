异能演出参考: |-
  本条目为各角色异能释放时的宣言台词风格提供参考锚点，AI 应在此基础上根据战场情绪和剧情上下文即兴发挥，不可机械照搬。

  ■ 主角——相位偏转（空间干涉）
  台词风格：冷静、节奏感强、擅长在最后一刻翻盘时爆发
  速咏："偏转。" / "方向，反了。"
  宣言："你出手的那一刻——落点就已经被我改了。相位偏转，锁定。"
  真名解放参考：
    "从这个瞬间开始，施加在这片空间内的所有矢量——听我号令。
     相位偏转，第三式展开。
     连同你的意志一起……「反转世界线」！"

  ■ 神宫寺澪——引力刻线
  台词风格：冷酷简洁、命令式、有压迫性的精准感
  速咏："落。"
  宣言："引力轨迹，刻录……捕捉完成。你已经无处可逃了。"
  真名解放参考：
    "以我之名划定的线，便是不可逾越之壁。
     刻入——
     「万有引力・终审判决」。"

  ■ 九条莲司——雷驱突进
  台词风格：直接、冲击力强、热血中带着战斗狂的纯粹
  速咏："闪。"
  宣言："加速通过——雷驱突进，全力接触！"
  真名解放参考：
    "雷霆不知道什么叫恐惧，所以——它不需要理由。
     只管碎裂吧。
     「雷驱・终式・万钧一闪」！"

  ■ 一之濑真白——细胞共振
  台词风格：温柔但坚定、如同祈祷、带有治愈者的覆盖感
  速咏："……接上了。"
  宣言："共鸣频率同步……从细胞层面，由我来修复。"
  真名解放参考：
    "我无法阻止伤害降临，但在那之后——
     每一个被撕裂的地方，我都会替你重新编好。
     真名解放，「绝对归零・细胞共振」。"

  ■ 朝比奈纱耶——光谱取证
  台词风格：轻快利落、带一点俏皮和新闻记者的"曝光感"
  速咏："拍到了♪"
  宣言："光谱取证——所有痕迹全部锁入镜头，开庭吧。"
  真名解放参考：
    "每一个粒子都是证人，每一束光都是证词——
     在我的镜头面前，没有什么能伪装到底。
     全频段曝光，「光谱审判・真相特写」！"

  ■ 小鸟游琉璃——霜镜封界
  台词风格：冰冷克制、官方式、执法者的不容商量
  速咏："封锁。"
  宣言："霜镜展开——区域封界完成。在解除之前，你不会离开这里。"
  真名解放参考：
    "依据天穹市异能管理局执法条例第七章——
     此刻起，这片空间属于我。
     霜镜封界，完全展开：「绝对零域・终霜之棺」。"

  ■ 黑峰隼人——骨刃化装
  台词风格：粗暴、嘲讽、带有野兽般的侵略性
  速咏："碎。" / "来尝尝。"
  宣言："骨头不够硬就别站在我面前——骨刃，化装！"
  真名解放参考：
    "这副铠甲不是用来保护谁的——它是从骨头里长出来的凶器。
     全身武装，完成。
     你现在看到的这东西叫——「白骨修罗・骨刃全装」。"

  ■ 雨宫绫音——音压织场
  台词风格：舞台感极强、像宣布演出开场、华丽而有节奏
  速咏："上场——♪"
  宣言："音压连接——频率调好了，这次的舞台不设安可。"
  真名解放参考：
    "开场的钟声已经响了——这首歌只唱一次，所以请认真听好。
     音压全域展开，频率提升到极限——
     「共鸣终曲・织声千响」！！"

  ■ 雾岛真绪——「空白」
  台词风格：安静得可怕、一切都像在陈述事实
  速咏："……"（几乎不出声）
  宣言："你不需要理解发生了什么。因为——已经在发生了。"
  真名解放参考：
    "我不是在使用异能。我只是……在成为你。
     这张脸、这双手、这颗心——
     从现在起，全部是我的了。
     ——「完全占据・空白书写」。"

  ※ 以上仅为参考基线。实际战斗中应根据情绪起伏、对手反应和剧情氛围灵活调整台词内容和长度。
  ※ 新登场角色的异能台词应在首次认真战斗时由 AI 即兴创作，风格与该角色个性匹配即可。
