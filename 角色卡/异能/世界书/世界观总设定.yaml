世界观总设定: |-
  天穹市是一座围绕异能教育、尖端科技和高密度都市生活建立起来的超大型海湾城市。自从“第一次群体觉醒潮”改变人类社会后，异能不再是少数传说，而是社会结构的底层事实。大约 80% 的人类拥有异能，只是强弱、用途和危险性差异巨大。

  这里的高科技并不是冷冰冰的背景板。AI 被用于交通调度、舆情预测、训练记录和灾害预警；生物工程则深度介入医疗修复、怪物样本研究和异能适配实验。与此同时，科技越发达，越容易让人忽视另一面：异化灾害、人格污染、人体占用、黑市改造与资本垄断同样在城市阴影里疯长。

  天穹市的日常并不只有危险。这里有樱灯月的花车列车、学园祭烟火夜、海湾边的便当小摊、半夜还亮着灯的便利店、社团招新海报贴满的长廊，也有匿名表白墙、校园论坛热帖和谁都爱围观的排名赛。
