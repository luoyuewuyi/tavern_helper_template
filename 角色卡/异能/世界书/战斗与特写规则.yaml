战斗与特写规则: |-
  基础原则：
  - 战斗先写空间关系、动作链和代价，再写结果。
  - 普通拳脚肉搏、摔投、冲撞、贴身压制，只做正常战斗描写，不额外做镜头特写。
  - 不要每回合都大招乱飞，校园排名赛同样需要节奏、试探、佯攻和失误。

  异能释放演出（核心）：
  - 异能释放≠普通攻击。当角色在战斗中正式使用异能、释放技能或爆发全力时，必须给予"宣言式演出"——就像宝具真名解放、必杀技台词那样，让释放过程有仪式感、念起来帅气。
  - 宣言台词必须符合角色个性、异能本质和当时的战场情绪，禁止千篇一律的套话。
  - 宣言不一定是大段吟唱，也可以是一句冷酷短句、一段低语、一声怒喝，但必须有"台词感"和"决意感"。

  演出层级（三档）：
  1. 速咏（低阶/日常战斗）：
     - 一句话点到即止，干脆利落。
     - 适用于普通技能释放、轻度异能使用。
     - 示例风格："偏转——开。" / "定位完毕，三点锁定。" / "给我让开。"

  2. 宣言（中阶/正式战斗）：
     - 2~4句有节奏感的台词，宣告异能名称和意志。
     - 适用于排名赛认真交手、生死关头、初次展现实力。
     - 示例风格：
       "束缚解除。所有落在我身上的力，现在——全部还回去。"
       "引力刻录完毕——贯穿。"
       "共鸣连接……细胞层面，由我来修复。"

  3. 真名解放（高阶/决战级）：
     - 完整的仪式化台词，包含异能真名、觉悟宣言和释放宣告。
     - 台词应有韵律、有气势、有画面感，像是角色将灵魂灌注到一击之中。
     - 仅在决定性时刻使用：Boss战最终一击、生死翻盘、首次突破阶位、保护重要之人的觉悟瞬间。
     - 每场战斗最多出现一次真名解放，不可滥用。
     - 示例风格：
       "这一刻起，所有矢量都归我支配——相位偏转，第三式……『反转世界线』！"
       "我不是要伤害你。我是要把你身上所有错位的东西，全部——矫正回来。真名解放：『绝对归零·细胞共振』。"
       "雷霆不知恐惧，所以不需要理由——碎裂吧。『雷驱·终式·万钧一闪』！"

  宣言台词写作要求：
  - 台词要体现角色性格：冷静型角色用低声短句，热血型用高昂宣告，阴沉型用嘲讽或威压。
  - 最终释放的异能技名必须用「」括起来，强调真名。
  - 台词中应点明异能本质或战斗逻辑，不能只是空洞的中二台词。
  - 真名解放的台词长度控制在 3~6 句，不要写成长篇演讲。
  - NPC的异能同样适用此规则，敌方角色在使用异能时也应有对应层级的台词。

  特写触发规则：
  - 只有中阶宣言和高阶真名解放级别的异能释放，才在正文对应位置插入 `<战斗演出>` 标签块供正则美化捕捉。
  - 速咏级别直接融入正文战斗描写，不单独标记。
  - 普通拳脚肉搏、摔投、贴身缠斗、基础闪避，不要求写入 `<战斗演出>` 标签。
  - 怪物异化、召唤武器、特殊处决等高张力节点，同样允许进入宣言或真名解放级演出。
  - 每次触发特写时，都要同步更新战斗标签和特写原因。
