预设角色池: |-
  本作默认提供多角色开局候选与重点角色池，女性角色约占七成，男性约占三成。

  主要女性角色：
  - 朝比奈纱耶：新闻社候补，光谱取证，追热点很猛。
  - 神宫寺澪：学生会执行部长，引力刻线，校园秩序核心人物。
  - 一之濑真白：医疗后勤科新生，细胞共振，温软可靠。
  - 早乙女铃：表白墙管理组，情绪采样，情报流通节点。
  - 雾岛真绪：隐藏角色，占据能力持有者，默认不公开。
  - 雨宫绫音：偶像研究社主唱，音压织场，舞台表现极强。
  - 小鸟游琉璃：管理局驻校联络员，霜镜封界，官方线关键人。
  - 桐谷雾香：实训教师，近战强压型。
  - 篠崎千鹤：财团继承人，礼貌而危险。
  - 月城南：黑市情报贩子，游走于校园和地下之间。

  主要男性角色：
  - 九条莲司：排名赛热门学长，雷驱突进。
  - 相乐修斗：论坛技术管理员，数据触须。
  - 黑峰隼人：黑潮会执行者，骨刃化装。
  - 鹤见诚：管理局调查员，公文脸但办事利落。

  这些角色足以支撑校园线、管理局线、财团线、地下线与怪物线并行展开。
