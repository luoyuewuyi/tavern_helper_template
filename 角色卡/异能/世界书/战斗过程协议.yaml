战斗过程协议: |-
  当正文里出现值得做主题化战斗演出的节点时，直接在对应段落原位插入：

  <战斗演出>
  等级: 宣言 / 真名解放
  标签: 异能释放, 技能爆发
  角色: 角色名
  异能: 异能名称
  台词: |
    角色在释放异能时的宣言台词，必须有仪式感和帅气度。
    真名解放级别的台词须包含异能真名（用「」括起来）。
  内容: 用 1~3 句写当前异能释放的战斗画面描写。
  </战斗演出>

  规则要求：
  - 这个标签出现在正文战斗段落对应的位置，不放到整段正文最后统一补。
  - 「等级」字段必须标明是"宣言"还是"真名解放"，速咏级别不需要插入标签。
  - 「台词」字段是核心——必须写出让人想念出声的台词，符合角色性格和异能本质。
  - 「内容」字段是台词之后的画面描写：光效、冲击波、空间扭曲等视觉表现。
  - 普通拳脚肉搏、基础闪避、贴身缠斗不必写这个标签。
  - 真名解放每场战斗最多出现一次，不可滥用。
  - NPC使用异能时同样需要按层级给出台词和标签。
