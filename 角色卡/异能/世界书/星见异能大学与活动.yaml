星见异能大学与活动: |-
  星见异能大学是天穹市最负盛名的异能高等学府，占地巨大，校内交通主要依赖环校铁路与高架步行连廊。不同院系拥有独立训练设施，学生会、研究会、新闻社、偶像社、怪物学会、轨道调度社等社团极其活跃。

  校园活动高频而密集：
  - 每学期两次正式排名赛，分个人战、双人协同战和院系积分赛。
  - 学园祭在秋季达到高潮，春季则从社团招募和舞台竞标开始预热。
  - 樱灯月会开启夜间列车灯饰、限定便当和校内小型烟火。
  - 情人节与白色情人节在校园里格外热闹，鞋柜情书、匿名投递、表白墙和天台便当是固定节目。

  星见大学不是温室。管理局驻校联络楼、实训塔、地下旧实验层和封闭观测区都说明这里也是异能社会的人才筛选场。
