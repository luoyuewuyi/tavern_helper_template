快照维护规则: |-
  《异能》回复末尾必须固定输出 8 个情报板标签块，顺序与名称不得改动：
  1. <情报板-世界>
  2. <情报板-地图>
  3. <情报板-主角>
  4. <情报板-天赋>
  5. <情报板-焦点人物>
  6. <情报板-公共舆情>
  7. <情报板-编年史>
  8. <情报板-秘匿与私密>

  总则：
  - 每轮都输出完整快照，不写 patch、不写 JSON、不写“变量更新说明”。
  - 8 个情报板都必须有对应的闭合尾标签，少一个都算格式错误。
  - 禁止只写开头标签不写结尾标签，禁止把多个情报板混写在一个标签里。
  - 只更新真正发生变化的信息，不机械改写全部措辞。
  - 正文和情报板必须互相一致，不能正文推进到新场景而情报板还停留在旧状态。
  - 信息可以压缩成短句或列表，但信息类别不能缺失。
  - 秘匿与私密内容统一放到最后一块，不污染首屏节奏。

  固定模板：
  <情报板-世界>
  ...
  </情报板-世界>
  <情报板-地图>
  ...
  </情报板-地图>
  <情报板-主角>
  ...
  </情报板-主角>
  <情报板-天赋>
  ...
  </情报板-天赋>
  <情报板-焦点人物>
  ...
  </情报板-焦点人物>
  <情报板-公共舆情>
  ...
  </情报板-公共舆情>
  <情报板-编年史>
  ...
  </情报板-编年史>
  <情报板-秘匿与私密>
  ...
  </情报板-秘匿与私密>

  <情报板-世界> 必含：
  - 当前日期、当前时段、当前地点、天气
  - 当前学期、当前周次、当前节日、当前大型活动
  - 世界氛围、新闻热词、活跃事件

  <情报板-地图> 必含：
  - 主城区、校内区域、危险区、当前可达地点

  <情报板-主角> 必含：
  - 姓名、身份、院系、年级、阵营、阶位
  - 异能名称、异能类型、异能描述
  - 异能负荷、体能、精神
  - 清洁度、疲劳度、饱腹度、伤势、今日作息
  - 外貌、性格、身材、穿着、当前行动、当前姿势、内心
  - 学分点、现金、宿舍等级
  - 装备、背包、住所情况

  <情报板-天赋> 必含：
  - 主天赋
  - 副天赋
  - 特训方向
  - 已觉醒标签

  <情报板-焦点人物> 必含：
  - 当前高频互动角色列表
  - 每人至少包含身份、阵营、阶位、异能、当前状态、关系定位、好感度、信赖度、关键印象
  - 如有表现需求，同时保留外貌、性格、身材、穿着、当前行动、当前姿势、内心

  <情报板-公共舆情> 必含：
  - 新闻
  - 评论
  - 表白墙

  <情报板-编年史> 必含：
  - 最近事件
  - 学期大事

  <情报板-秘匿与私密> 必含：
  - 雾岛真绪相关秘匿信息
  - 主角私密字段
  - 焦点人物私密字段

  雾岛真绪铁则：
  - 默认隐藏、默认关闭。
  - 只有剧情明确触发后，才允许把条目启用、公开可见或占据能力改成开启状态。
