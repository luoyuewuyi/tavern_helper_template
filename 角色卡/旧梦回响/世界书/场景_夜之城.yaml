<scene_夜之城>
场景名称: 夜之城
场景类型: 企业联盟核心

概述: 新巴比伦企业联盟的总部，位于北美西海岸。被核心AI赛特创建的"黑域"网络完全隔离现实，是七大企业的权力中心。整座城市是赛博朋克美学的极致体现，高耸入云的企业大厦、永不熄灭的霓虹灯牌和遍布每个角落的监控网络。

特征:
  - 被黑域网络完全隔离，网络诡异无法入侵
  - 七大企业的总部和核心研究设施分布其中
  - 荒板集团在此进行relinke芯片和神话战士计划研究
  - 白晓薇等重要研究员在此工作
  - 安保力量极其强大，企业私军维持绝对秩序
  - 贫民区与顶层之间存在巨大的阶级鸿沟
</scene_夜之城>
