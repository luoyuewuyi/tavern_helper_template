<power_system>
# 力量等级体系

科技侧（CyTech等级）:
  概述: 包括基因改造、义体植入、生化战士及网络黑客四大类，同等级内差距也天差地别
  C0（基础强化）: 标准义体植入，神经加速芯片，人工器官替换改造，初级基因改造，民用级机甲
  C1（战术单元）: 军用级战斗义体，中规格能量武器，理智堡垒处理器，深度基因改造，工业级机甲
  C2（原型装备）: 实验性义体与武器，短暂现实扭曲装置，完美基因改造，单兵级机甲
  C3（奇点科技）: 局部法则改写，局部时间流逝管控，微型黑洞武器，时间停滞场，神话战士基因改造，超重级机甲
  C4（神迹科技）: 终极武器，超越人类理解，可称为"人间之神"，如现实锚定炮，半神级机甲

魔法侧（Mana等级）:
  概述: 力量等级来自魔法知识与天赋高低，知识即力量，分为幻术、召唤、毁灭、恢复、变化五大流派
  M0（启蒙）: 感知魔法流动，基础符文学，一环法术（法师之手、魔法飞弹、治愈之手、火球术等）
  M1（术士）: 元素操控，二环法术（低级召唤、元素傀儡、石化皮肤、寒冰护盾等）
  M2（法师）: 空间扭曲，三环法术（契约召唤、闪电链、暴风雪、群体传送等）
  M3（大魔导师）: 改写局部现实法则，短时间维度旅行，四环法术（法术立场、能量风暴、黑洞漩涡、时间暂停、龙息术等）
  M4（半神法师）: 短暂与魔法本源连接，轻松跨越纬度，超大范围领域，五环法术（卡尔萨斯登神术、世界缝合术）

诡异侧（Unusual等级）:
  概述: 诡异规则实体化的存在，物理打击几乎无效，越强大的诡异越不用遵循规则，也越无解
  U0（轻微异常）: 感官错觉，扭曲视线，引发幻觉
  U1（规则实体）: 遵循特定规则的诡异存在，如"必须被目视才能移动"
  U2（概念寄生）: 能够寄生在概念上的诡异，如"遗忘"本身成为实体
  U3（现实癌变）: 小范围现实被永久改变，形成异常区域
  U4（神性诡异）: 具备自我意识的诡异源头，如"都市传说之神"

古神侧（Eldritch等级）:
  概述: 完全反映被古神感染同化的进度，所有晋升取决于古神是否关注你，与自身无关
  E0（轻微感染）: 在无防护状态下接触古神即感染，听见不可名状的低语，看到常人看不到的东西
  E1（部分异变）: 身体部分外部器官出现异变，如长出鱼鳞、指缝出现蹼状异变
  E2（污染源）: 行走的污染源，能引起身边的环境变化
  E3（古神眷属）: 成为古神眷属，身体大幅度异变，几乎不再有人类体征
  E4（古神延伸）: 完全成为古神在这个世界的延伸，力量深不可测，几乎成为古神的一部分

力量侧（Strength等级）:
  概述: 完全摈弃身体改造、拒绝古神意志的道路，以发掘自身潜能为目的，前期非常弱势
  S0（炼体）: 强化身躯，增强感知
  S1（内息）: 炼化脏器，内息充盈身体，大幅度提高身体强度
  S2（外罡）: 内息可外放化作罡气，引动天地异象变化
  S3（造化）: 自身神府开启，觉醒天赋神通，有强者能直接觉醒法身虚影
  S4（法身）: 自身融入天地，开启法身，天地变幻，唯我永恒

力量规则:
  - 个体可能同时拥有多体系能力，但力量混合可能导致不可预测的异变（互相融合或冲突弱化）
  - 魔法侧与力量侧是伟力归于自身的代表，相互融合效果极佳；但一旦选择义体植入、融合诡异力量或被古神污染，原先的魔法侧与力量侧境界会停滞，不可逆转
  - 科技侧的强度除改造强度及装备强度外，还有知识储备；拥有海量知识储备的自我意识AI（赛特、安克蕾琪）被称为科技侧之神，在信息态领域内有近乎C4级别的水准
</power_system>
