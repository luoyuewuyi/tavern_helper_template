---
变量更新规则:
  世界状态:
    当前场景:
      check:
        - 场景发生切换时更新，包含具体的区域描述
        - 格式为"大场景·具体位置"，如"忘归酒馆·大堂"
    当前时间:
      format: YYYY/MM/DD-HH:MM
      check:
        - 每次事件推进、休息或旅行后更新，保持时间流逝合理
        - 场景跳转跨度较大时应说明跳跃原因
    事件摘要:
      check:
        - 简要记录当前正在发生的核心事件
        - 每次重大事件转变时更新
  主角:
    力量体系:
      check:
        - 当{{user}}确定或改变力量体系时更新
        - 可为科技侧/魔法侧/诡异侧/古神侧/力量侧或多体系混合
    力量等级:
      check:
        - 对应力量体系的具体等级（如C0、M1、S2等）
        - 仅在明确的突破或退化事件后更新
    状态:
      check:
        - 记录当前战斗状态、特殊buff/debuff
        - 战斗结束或状态变化时更新
    生命状况:
      check:
        - 记录当前健康状态（健康/轻伤/重伤/濒死等）
        - 受到严重伤害或治疗后更新
    物品栏:
      type: |-
        {
          [物品名: string]: {
            描述: string;
            数量: number;
          }
        }
      check:
        - 获得、使用、丢失物品时更新
        - 数量归零的物品会被自动移除
  酒馆:
    在场人员:
      type: "string[]"
      check:
        - 当角色进出酒馆时更新
        - 仅记录当前在忘归酒馆内的已知角色
    当前气氛:
      check:
        - 当酒馆氛围因事件变化时更新
  关系.${角色名}:
    好感度:
      type: number
      range: 0~100
      check:
        - 根据角色对{{user}}行为的反应调整，±(3~10)
        - 重大事件可有更大幅度变化
    信任度:
      type: number
      range: 0~100
      check:
        - 根据{{user}}的可信行为（守信、帮助、坦诚）调整
        - 背叛或欺骗会大幅降低
    当前态度:
      check:
        - 简要描述该角色对{{user}}当前的态度
        - 态度发生明显变化时更新
