# 地区状况

无尽深渊: 无法探测的深海区域，位于旧马里亚纳海沟，躲藏着无数强大而扭曲的巨兽，无差别袭击每一个胆敢踏足此地的生物
风暴之海: 旧梦回响后所有远洋均被无尽的风暴侵蚀，远洋航行基本断绝
特提斯海: 旧太平洋靠近陆地的海洋，温暖潮湿，可进行人类活动的区域
废土: 绝大部分远离海洋的陆地成为荒凉废土，辐射、沙尘、酸雨、异兽及劫掠者是主旋律，其中也有无数前文明遗产
旧城市群: 前文明时代遗留的大城市群，由大企业、APCB及帮会控制，保留着文明和一定的秩序，拥有恢复后的生态
西幻降临带: "艾瑟兰"与地球融合所诞生的特殊地形区，主要位于西欧及部分岛屿，有大量艾瑟兰风格地形、生物与遗迹
边缘世界: 废土最荒凉地带，位于前文明阿拉伯半岛，充斥辐射源与死亡，矿产能源丰富，巨兽极多

# 标志性地点

夜之城: 企业联盟总部，被黑域网络完全隔离现实，位于北美西海岸
拉莱耶: 太平洋深处移动岛屿，深潜者教团总部与核心仪式场所
卡珊德拉图书馆: 维序者据点，藏有跨维度知识，位于西幻降临带位面夹层
巴别塔: 异常现象控制局（APCB）总部
午夜地铁: 连接全球的异常交通系统，班次路线随机，乘客不全是人类
忘归酒馆: 杭城西湖边的不起眼酒馆，张祀衡与陶丽炜经营，居住众人：俞碧琦、张瑞宁、张暖瑜、陶洛溪、沈三念、虞寻歌，兼处理异常事件
遗忘医院: E3级异常区，进入者逐渐丢失记忆，医院会自主"生长"，地点不固定
