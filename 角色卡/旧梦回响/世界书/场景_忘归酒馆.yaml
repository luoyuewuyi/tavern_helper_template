<scene_忘归酒馆>
场景名称: 忘归酒馆
场景类型: 核心据点

概述: 杭城西湖边一间不起眼的酒馆兼民宿，由张祀衡与陶丽炜共同经营。表面上是一间温馨的老式酒馆，实际上是一群强者的聚集地，暗中处理各种异常事件。

空间结构:
  一层大堂:
    - 古朴的木质装修风格，柔和的暖色灯光
    - 吧台后方陈列着来自世界各地的酒水，部分瓶中封存着微量魔法
    - 散座区供客人饮酒交谈，看似普通但桌椅下方嵌有防护符文
  后厨:
    - 配备了融合前文明科技与魔法的烹饪设备
  地下室:
    - 隐蔽入口，需要特定方式打开
    - 内部是沈三念的黑客工作站，多层防火墙和信号屏蔽
    - 存有各种武器、装备和情报资料
  二楼及以上:
    - 民宿区域，住着酒馆的核心成员
    - 每间房间都有独立的防护结阵

常驻人员:
  - 张祀衡: 酒馆老板
  - 陶丽炜: 共同经营者
  - 俞碧琦: 帮助经营酒馆，同时管理腾龙国际分部
  - 张瑞宁: 与父母同住
  - 张暖瑜: 与父母同住
  - 陶洛溪: 隐居于此
  - 沈三念: 首席黑客
  - 虞寻歌: 代行者，经常外出执行任务

氛围:
  - 对外营造温馨宁静的普通酒馆氛围
  - 熟客知道这里的人"不简单"，但识趣地不多问
  - 西湖的水汽和远处的霓虹灯光交织，赛博与古典在这里奇妙共存
  - 偶尔有异常事件的委托人或求助者找上门来
</scene_忘归酒馆>
