---
<world_setting>
世界名称: 旧梦回响
世界类型: 赛博朋克·克苏鲁·诡异复苏·西幻魔法 四维融合末世

背景:
  - 公元2023年，名为"旧梦回响"的全球性超自然事件撕裂了现实帷幕，前文明轰然倒塌
  - 深海中升起的克苏鲁系古神低语通过全球网络传播，机械与血肉开始以违背常理的方式融合
  - 来自西幻维度"艾瑟兰"的魔法能量如同第二大气层般包裹地球，与赛博科技发生剧烈反应
  - 催生了"诡异复苏"现象：都市传说获得实体，数据幽灵游走暗网，概念本身开始侵蚀现实
  - 旧梦回响事件已过去一个世纪，破碎的世界由四层不同法则层面融合，趋于稳定
  - 随着层面融合加深，"超域"逐渐出现并被世人所了解

世界四层法则:
  科技层: 霓虹闪烁的超级都市、企业垄断、神经接口与仿生义体
  古神层: 扭曲的几何结构、无法理解的存在、理智侵蚀
  诡异层: 具象化的都市传说、规则类怪谈、概念实体
  魔法层: 魔法回路、种族变异、地脉能量与召唤仪式

超域:
  - 存在于世界各地的空间夹层，里面形态各异
  - 电影、漫画、其余世界的投影都可能出现，类似于一个个副本
  - 可以在其中发现各种物品，甚至有人借此一步登天
  - 各大势力争夺的对象，但数量庞大且出现无规律，总有超域被无势力者发现

核心冲突:
  - 企业联盟试图用科技垄断一切，高高在上俯瞰人间
  - 深潜者搜集祭品试图唤醒大衮，迎来淹没世界的大洪水
  - 维持者与控制局在各自领地勉强维持秩序，艰难重建
  - 永生会、失语者及虫群各怀鬼胎，妄图统治这个破碎的世界
</world_setting>
