# 永生会

概述: 以永生为名蛊惑世人，拥抱一切力量，自身被扭曲，目标掌控永生概念成神。

双首领:
  墨翟生:
    等级: E3M3级
    身份: 永生会双首领之一，咒具匠人
    能力: 利用尸体、怨念及诡异打造器具，掌握"逆生咒术"，能扭转仪式扭曲法则逆转生死。其自身就是最扭曲、最恶意的诡异
    性格: 癫狂痴迷仪式，语言错乱，极强灵性和超感直觉，随意涂鸦的仪式都能成功。毫无道德概念，为实验可随意牺牲无辜
    法身: 白骨菩萨，由无数森森白骨堆砌而成，可开启领域"阿鼻地狱"
  沈清秋:
    等级: M3U3级
    身份: 永生会双首领之一，蛹化仙
    能力: 通过杀死其他女子夺取美貌、天赋、力量乃至一切，不知存活多少岁月。拥有扭曲时间、改变外貌、生命吮吸、频率共振、梦境穿梭、记忆篡改、常识扭曲的特殊能力
    法身: 极乐天女，能开启"极乐天堂"领域
    地位: 永生会的核心，也是永生本身

三巨头:
  周鑫磊（画家）:
    等级: U3C1M2级
    描述: 精神问题严重，表面律师人缘极好。喜欢捕捉美丽女性在其身上作画，蹂躏后残忍杀害成为尸体大军一员。法身"伪善者·尼尔森"
  黄鸿翔（园丁）:
    等级: U2C1M3级
    描述: 身材魁梧外表粗犷，人前无害热心大叔。热爱给女性种下鬼植种子，看对方痛苦后将受害者作为鬼植姬一员。法身"鬼植姬·哭泣女神"
  丁益阳（厨师）:
    等级: U3C2M2级
    描述: 能将战斗变为盛大的宴会，最爱玩弄美丽女性食材后享用。法身"食人者·汉尼拔"

四干部:
  - 孟凡（林鬼），U2级，能力概念转换，负责暗中接触概念实体
  - 莫牙（博士），E2级，能力精神锚定，在接触古神中被不可逆污染，半鱼人化长出触手。在玷污张瑞宁和张暖瑜后攫取力量实力飞涨
  - 程度（疯狗），C3U3级，能力病毒传播，窃取灭世病毒血十字在无人监管区传播。身高四米浑身覆盖超高浓度病毒结晶
  - 石宝（创伤），M2级，能力创口破坏，偷窃基础法术改为大范围低杀伤性法术后用能力将创口破坏

十杰: 篡改者、双生子、凋零夫人、无言者、百貌、灾厄师、收藏家、破城者、归亡教主、织梦者，全员M2/E2/U2级，各自拥有规则级能力
