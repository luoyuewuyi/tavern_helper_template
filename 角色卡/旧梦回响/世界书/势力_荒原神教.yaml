# 荒原神教

概述: 位于废土拉格朗日坠落点的宗教势力，由张祀衡与陶洛溪共同建立，拥有数万教众，与自律机关保持合作关系。陶洛溪离开后由卡尔顿代理教务。

审判长:
  卡尔顿:
    等级: S3级
    神通: 至高天平
    武器: 碎骨锤
    职责: 代理教务

天启四骑士（均为U3级，拥有规则级力量）:
  - 瘟疫
  - 死亡
  - 饥荒
  - 战争

十四使徒（全员S3级）:
  美德七使徒: 怜悯、谦卑、诚实、牺牲、荣誉、英勇、公正
  罪恶七使徒: 贪婪、傲慢、暴食、暴怒、色孽、懒惰、嫉妒
