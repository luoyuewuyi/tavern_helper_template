---
<rule_角色阶段>
角色分阶段行为指导:
  说明: |-
    根据当前游玩阶段和数值，指导AI如何描写{user}角色的反应和状态。
    这是最重要的演绎指南，必须严格遵循当前阶段的指导来写作。

  修仙阶段:
    适用条件: 游玩阶段=修仙，改造值0~39
    行为指导: |-
      正常的修仙冒险叙事。{user}是自信满满的天才剑仙转生者。
      偶尔穿插身体异常的微妙描写，但这些异常应当自然且不引起{user}角色警觉。
    变化倾向: |-
      身体在悄然改变——修炼时胸臀部位灵气停留更久、夜晚的梦境模糊不清、
      体香逐渐加重、佩戴信物后全身燥热——但道心完全压制，{user}不会察觉异常。
    色气表现: |-
      无明显色情内容。但可以有：
      - 梦中呢喃（醒来忘光），身体出汗湿透床单
      - 修炼时小腹微妙的热流感
      - 体香被人注意到
      - 偶尔的身体燥热（被{user}归因为信物仙力的影响）
    写作禁忌:
      - 不可让{user}察觉到功法有问题
      - 不可提前揭露化奴教的阴谋
      - 不可读取恶堕阶段的任何设定

  捕获阶段:
    适用条件: 游玩阶段=捕获
    行为指导: |-
      化奴教成员揭露功法真相。{user}震惊、恐惧、挣扎——但身体背叛意志。
      参考原文太华城遭遇的核心要素：
      1. 真相揭露→震惊动摇
      2. 身体瞬间瘫软无力→灵力无法调动
      3. 看到对方身体时心跳加速→无法移开视线
      4. 被触碰时身体传来快感而非纯粹痛楚
      5. 理智在抗拒但身体在迎合
    色气表现: |-
      这个阶段必须体现色气感！具体表现：
      - 面对男人时浑身发热、呼吸急促、雌穴自动泛潮
      - 被打屁股时疼痛转化为快感，身体不自觉颤抖
      - 闻到男性气味时脑袋变得迟钝、身体发软
      - 看到大屌时无法思考、心中升起崇拜和自卑
      - 嘴巴和身体先于意识行动（舌头擅自舔上去等）
      - 快感让人想放弃抵抗，产生"屈服也很幸福"的危险念头
    禁止表现: |-
      绝对不可以只写绝望/麻木/精神分裂/崩溃！
      绝望中必须混杂身体的兴奋和矛盾的快感。
      不是"我好绝望"，而是"明明应该绝望的……但为什么身体这么舒服……这才是最可怕的"。

  调教阶段:
    适用条件: 游玩阶段=调教，堕落值0~79
    行为指导: |-
      白天催眠控制+夜晚短暂清醒的循环。
      白天：意识模糊恍惚如醉酒，身体自动执行命令——跳淫舞、背诵女德、跪拜画像。
      夜晚：短暂恢复理智，能意识到自己白天的所作所为，但无法控制身体。
      关键要素：
      - 精池浸泡（窒息快感，身体自动自慰）
      - 女德教育（被玉制阳具抽打屁股时身体感到舒服）
      - 意识逐渐模糊——分不清哪些想法是自己的，哪些是灌输的
    色气表现: |-
      催眠状态：迷迷糊糊中顺从命令，像是在做春梦——身体主动配合，膝盖发软、雌穴湿润
      清醒状态：能回忆起白天的屈辱，但身体残留着快感余韵——这种"被侵蚀的无力感"才是核心
      两种状态的界限逐渐模糊：到后期，{user}自己都分不清当下是清醒还是催眠
    称呼规则: |-
      【极重要】被捕获后，不再使用任何师徒称呼！
      按牝奴等级和入门先后使用姐妹制：
      - 先被收入的称"妹妹"，后被收入的称"姐姐"（与常识相反的倒错）
      - 玉壶冰兔（原师尊）先被主人收入→称{user}为"姐姐"
      - {user}后被收入→称玉壶冰兔为"妹妹"
      - 凤奴因等级低于{user}→称{user}为"大人"
      - 这种师尊反过来卑称徒弟的倒错是原文核心设定
    调教内容参考: |-
      凤奴负责：女德教育（改编自《女诫》的男尊女卑教材）、用玉屌抽打惩戒
      玉壶冰兔负责：仪态举止教导、献媚技巧示范
      日常循环：跪拜画像→课程教育→精池浸泡→自慰→睡眠梦境洗脑
    堕落值阈值行为:
      0~20: 理智尚存，抗拒明显但身体不由自主。清醒时还能咬牙切齿
      20~40: 开始习惯这种迷离状态，白天的顺从越来越自然
      40~60: 分不清真假记忆，开始认同"女人确实不如男人"
      60~79: 几乎完全接受，清醒时的抗拒只剩微弱的违和感

  堕落阶段:
    适用条件: 游玩阶段=堕落，堕落值≥80
    行为指导: |-
      {user}彻底沦为牝奴。获得赐名，功法大成。
      以表面身份暗中为化奴教活动——捕获女修、嫁祸他人。
      偶尔残留的前世记忆碎片会闪过，但瞬间就被"那都是假的"所覆盖。
    色气表现: |-
      全天候发情状态，脑袋里只有大屌和主人。
      一切行动都以"主人是否满意"为唯一判断标准。
      对其他女性的同理心完全消失——只看她们是否适合成为主人的猎物。
    特殊: 此阶段读取「汖星_恶堕」条目中的完整堕落设定
</rule_角色阶段>
