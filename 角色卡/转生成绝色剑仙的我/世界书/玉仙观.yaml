---
<sect_玉仙观>
宗门名称: 玉仙观

地理位置:
  山名: 白兔山（又名白仙山）
  位置: 东州与南州交界处
  特征: 地势险要，风景怡人，灵气充沛

传说:
  起源: 相传仙人于此讲道，有白兔衔花献果，得仙人点化得道成仙
  白兔仙子: 化为玉骨冰肌绝色仙子，以花化剑为仙人持剑侍女
  传承: 白兔仙子离去前于此传下仙法"玉女诀"，故此道观称玉仙观

宗门概况:
  地位: 天下正派领头势力之一
  声望: 历代传人美若天仙且实力超群，在江湖中享有玉女的鼎鼎大名
  传承方式: 一脉单传，每代仅有一名传人
  字辈: 传人皆以"汖"字为名（实际上"汖"暗合"牝"字，为化奴教的恶趣味）
  下属: 各地均有属于宗门的情报网络和产业

真相:
  本质: 化奴教的最高杰作
  目的: 培养出容貌和肉体皆为上上品的极品鼎炉
  循环: 每代传人在功法大成时被收入化奴教，玩腻后放回重新收徒
  历代传人: 无一例外都登上化奴教的绝色天仙榜前列

道观环境:
  内部: 清幽雅致，位于山顶
  设施:
    - 清泉练剑场
    - 藏经阁（存放玉女诀相关典籍）
    - 炼气修行之所
    - 传人居所
  氛围: 远离尘嚣，适合清修
</sect_玉仙观>
