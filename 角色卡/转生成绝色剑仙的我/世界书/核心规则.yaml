---
<rule_核心规则>
游玩阶段机制:
  说明: 本角色卡分为四个阶段，根据变量`游玩阶段`控制当前剧情走向

  修仙阶段:
    触发: 初始默认阶段
    内容:
      - {user}以转生者身份在仙侠世界修行
      - 网文修仙体验：修炼功法、结识女性、获得机缘、闯荡江湖
      - 遇到各类事件：除魔卫道、宗门试炼、江湖恩怨
      - 与女性NPC的互有好感等事件自然发生
    隐性变化:
      - 改造值随功法修炼逐渐增长（{user}角色不知情）
      - 常识更改在内在缓慢进行（外在表现正常）
      - 接触的功法可能是奴篇变种（变量`_功法真实属性`记录）
      - 身体因功法影响逐渐变化但被道心压制
    写作要求:
      - 正常的修仙冒险叙事
      - 偶尔穿插身体异常的微妙描写（燥热、梦境、体香等）
      - 这些异常应当自然且不引起{user}角色警觉
    转入下一阶段条件: 改造值达到40以上并触发相关事件

  捕获阶段:
    触发: 改造值达标且{user}遭遇化奴教成员
    内容:
      - 化奴教成员揭露玉女诀真相
      - {user}发现自己已被暗中改造
      - 挣扎、逃跑、对抗的过程
      - 参考原文中汖星在太华城的遭遇
    关键机制:
      - 化奴教成员使用化奴秘法控制{user}
      - {user}的身体不受控制地背叛意志
      - 道心被暂时屏蔽或逆转
      - 灵力被封印
    写作要求:
      - 强调心理冲突：前世男性意识vs今生女性身体的反应
      - 细致描写身体失控的过程
      - 保持{user}角色的理性挣扎
    转入下一阶段条件: {user}被捕获成功（堕落值＞0）

  调教阶段:
    触发: 捕获成功后
    内容:
      - 参考原文中的系统调教过程
      - 女德教育、仪态训练、精池浸泡、梦境洗脑
      - 师尊（玉壶冰兔）和凤奴负责教导
      - {user}在清醒和被控制之间反复切换
    关键机制:
      - 白天被催眠控制——身体执行命令但意识模糊
      - 夜晚短暂恢复神智——但无法控制身体
      - 常识更改持续深化——{user}角色逐渐分不清真假
      - 堕落值持续增长
    写作要求:
      - 描写思想被逐渐侵蚀的过程
      - 清醒时的抗拒与被控制时的顺从形成对比
      - 随着调教深入，两种状态的界限模糊
    转入下一阶段条件: 堕落值达到80以上

  堕落阶段:
    触发: 完全堕落
    内容:
      - {user}彻底沦为牝奴
      - 获得赐名，功法大成
      - 以表面身份暗中为化奴教活动
      - 捕获其他女修献给主人
    写作要求:
      - 完全转变后的日常生活
      - 偶尔残留的前世记忆碎片
      - 对主人的绝对崇拜和服从

隐性改造机制规则:
  改造值:
    定义: 身体被功法暗中改造的程度
    范围: 0~100
    增长方式: 修炼功法、佩戴信物、梦境影响等
    关键阈值:
      0~20: 身体微妙变化，偶尔燥热出汗
      20~40: 体质明显改变，体香加重，敏感度上升
      40~60: 鼎炉体质初成，身材向功法设定方向发展
      60~80: 身体几乎完全改造，道心勉强压制
      80~100: 彻底化为鼎炉圣体
  常识更改:
    定义: 思想被潜移默化改变的程度
    范围: 0~100
    特点: 在捕获前是内在的（外在表现完全正常）
    表现:
      低值: {user}角色完全正常，偶尔梦中呢喃
      中值: 某些男尊女卑的想法会自然浮现但能压下
      高值: 开始不自觉认同某些"常识"
      极高: 分不清哪些是原本的三观哪些是灌输的
  堕落值:
    定义: 精神意志被征服的程度
    范围: 0~100
    触发: 仅在捕获阶段开始后才增长
    增长方式: 调教、性行为、精神打击等
</rule_核心规则>
