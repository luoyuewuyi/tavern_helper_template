---
变量更新规则:
  世界:
    当前时间:
      format: ${纪年}-${YYYY/MM/DD}-${时辰}
      check:
        - 每次事件推进、休息或旅行后更新，保持时间流逝合理
        - 仙侠世界使用时辰制（子丑寅卯辰巳午未申酉戌亥）
    当前地点:
      check:
        - 场景切换时更新为具体地名和区域
    游玩阶段:
      check:
        - 仅在满足阶段转换条件时才更改
        - 修仙→捕获：改造值≥40且遭遇化奴教
        - 捕获→调教：被成功捕获
        - 调教→堕落：堕落值≥80
    近期事务:
      type: |-
        {
          [事务名: string]: string; // 事务描述
        }
      check:
        - 记录当前需要完成的任务、约定、待办事项
        - 完成后移除，新增时及时添加
        - 最多保持5~8项活跃事务
  主角:
    姓名:
      check:
        - 仅在{user}首次设定或明确要求改名时更新
        - 一旦设定后不可擅自更改
    年龄:
      type: number
      check:
        - 随时间推进自然增长（仙侠世界通常以年为单位）
        - 重大时间跳跃时按实际经过年数增长
        - 修行者寿命较长，增长速度正常
    宗门:
      check:
        - 仅在{user}首次设定或剧情中转投其他门派时更新
        - 一旦设定后不可擅自更改
    体质:
      check:
        - 仅在{user}首次设定时确定，之后不可擅自更改为其他体质
        - 功法对体质的改造效果记录在"身体状态.体质变化"中，不修改此字段
    功法:
      check:
        - 仅在{user}首次设定或学习新功法时更新
        - 不可擅自替换为玉女诀（除非{user}本身选择了玉女诀）
    命格:
      check:
        - 初始由{user}设定，游玩中不可擅自更改
        - 命格不是牝名！不可将命格误写为化奴教赐名
        - 仅在完全堕落（堕落阶段）后才可能被淫心化奴法扭曲
    前世.姓名:
      check:
        - 仅在{user}首次设定时确定
    前世.经历:
      check:
        - 仅在{user}首次设定或回忆前世时补充
        - 可以随剧情需要补充细节
    功法境界:
      check:
        - 仅在重大修行突破时更新
        - 入门→小成→大成→成仙，每次突破需要充分的剧情铺垫
    修炼境界:
      check:
        - 修炼突破时更新
    道心状态:
      check:
        - 遭受重大冲击（真相揭露、精神打击等）时可能从完好变为动摇
        - 化奴秘法可使道心沉寂或逆转
        - 不可轻易改变，需要充分的剧情理由
    能力面板.武技.${武技名}:
      type: number
      range: 0~100
      check:
        - 训练、战斗、重大事件后按±(2~5)调整
        - 武技名称由{user}设定（如剑法/刀法/枪法/扇法等）
        - 自定义开局中{user}设定的武器类型决定初始武技名称
        - 新遇到的关系人物可以有不同的武技类型（如某NPC擅长枪法则记录为枪法）
    能力面板.${步法/灵力/智慧/体魄/意志/肉欲}:
      type: number
      range: 0~100
      check:
        - 训练、战斗、重大事件后按±(2~5)调整
        - 肉欲值在修仙阶段应维持被道心压制的状态（显示为0但实际在增长）
        - 进入捕获阶段后肉欲值开始显现真实值
    着装.${部位}:
      check:
        - 换装、衣物损坏、被改装时更新
        - 描述需包含颜色、材质、款式
    物品栏:
      type: |-
        {
          [物品名: string]: {
            描述: string;
            数量: number;
          }
        }
      check:
        - 获取、使用、丢失物品时更新
        - 数量归零后自动移除
  身体状态:
    体质变化:
      check:
        - 随改造值变化而更新
        - 低改造值时描述微妙变化，高改造值时描述明显改造
    灵力属性:
      check:
        - 灵气颜色随改造值变化（白→粉白→粉→深粉）
    体香:
      check:
        - 随改造值增长体香从淡雅变为浓郁媚香
    敏感度:
      check:
        - 随改造值增长敏感度从正常变为全身敏感
    观想形象:
      check:
        - 灵台识海中观想的仙子形象随改造值和常识更改而变化
        - 从清冷仙女逐渐变为面色潮红、衣着暴露的发情形象
    道心内景:
      check:
        - 道心状态改变时更新
        - 从无瑕玉剑逐渐变色（白→粉白→粉→变形为其他形状）
  改造数值:
    改造值:
      type: number
      range: 0~100
      check:
        - 修炼功法时按±(1~3)增长
        - 佩戴信物期间额外增长
        - 接触奴篇功法变种时增长
        - 仅增不减（除非剧情特殊事件）
    常识更改:
      type: number
      range: 0~100
      check:
        - 修仙阶段通过梦境和信物缓慢增长±(0~2)
        - 调教阶段通过女德教育、精池等手段快速增长±(3~8)
        - 关键点：修仙阶段的常识更改是内在的，外在表现正常
    堕落值:
      type: number
      range: 0~100
      check:
        - 仅在捕获阶段后才开始增长
        - 性行为、精神打击、调教等使其增长
        - 达到80后进入堕落阶段
  关系.${角色名}:
    好感度:
      type: number
      range: -100~100
      check:
        - 根据互动情况调整±(3~10)
    关系:
      check:
        - 关系性质变化时更新（如从陌生到同伴、从师徒到牝奴姊妹等）
  牝奴状态:
    已激活:
      type: boolean
      check:
        - 仅在正式被赐名成为牝奴后设为true
    赐名:
      check:
        - 被主人赐名后更新
    等级:
      check:
        - 被分配或晋升等级后更新
