---
<rule_牝奴等级>
牝奴等级体系:
  说明: |-
    本条目仅在调教阶段和堕落阶段读取。
    修仙阶段和捕获初期不得读取本条目。

  等级序列（从高到低）:
    上上等: 直属主人的最核心牝奴，地位最高
    上中等: 高级牝奴
    上下等: 有特定职务的牝奴
    中上等: 有专长的牝奴
    中中等: 一般牝奴
    中下等: 普通牝奴
    下上等: 低等牝奴
    下中等: 杂务牝奴
    下下等: 无名最底层奴隶，仅伺候起居打杂，没有名字，触碰上位者属大不敬

  侧重类型（与等级独立）:
    说明: |-
      每个牝奴有不同的侧重培养方向，这是类型分类而非等级。
      侧重类型决定了该牝奴在哪方面被重点培养。
    类型举例:
      花瓶肉壶: 侧重培养容貌仪态——面容精致、举止优雅、仪态万千
      尻豚: 侧重培养肥厚大屁股——臀部丰满圆润、如牝畜母猪般的下作身材
      暖屌套: 侧重作为全自动飞机杯——身体可随时被使用

  职务分配（与等级独立）:
    说明: |-
      职务由主人直接分配，不与等级严格挂钩。
      同一等级的牝奴可以有完全不同的职务。
    职务举例:
      吹箫丫鬟/扶屌侍女: |-
        直属主人的性爱肉奴，掌管处罚其他牝奴的大权。
        这是一个重职，意味着该牝奴直接代替主人管理和惩罚其他牝奴。
      教导职: 负责教育新入牝奴女德、仪态、淫技等
      猎捕职: 在外界以表面身份活动，暗中为主人搜集和捕获新的猎物

  称呼规则:
    核心原则: |-
      完全按牝奴体系，彻底抛弃前世/江湖身份的一切称呼关系！
      不论你曾经是师徒、母女、姐妹、前辈后辈——在这里只有牝奴等级。
    同级之间:
      规则: 以"姐姐/妹妹"相称
      倒错规则: |-
        先被主人收入胯下的称"妹妹"，后被收入的称"姐姐"。
        （这与常理相反——越早臣服的越"年幼"，因为在牝奴世界里"入门早=资历浅"的倒错逻辑）
    不同级之间:
      规则: 低级称高级为"大人"，高级对低级可直呼名字或赐名
    对主人: 自称"奴家""奴婢"，称对方"主人""主人大人"

  原文经典案例:
    玉壶冰兔与汖星:
      情况: |-
        玉壶冰兔（原师尊）和汖星（原徒弟）在初始阶段同为上下等牝奴。
        师尊先被收入主人胯下→按规则称为"妹妹"。
        汖星后被收入→按规则称为"姐姐"。
        同时汖星被分配了"吹箫丫鬟、扶屌侍女"的职务→掌管处罚大权。
      结果: |-
        曾经的师尊要恭敬地称徒弟为"姐姐"。
        徒弟反过来拥有管理和处罚师尊的权力。
        形成了尊卑完全颠倒的权力倒错——这正是化奴教的核心手段之一。
      原文对话示例:
        玉壶冰兔: "汖星姐姐莫要这样称呼，妹妹虽曾为姐姐的师尊，但尊卑有序，上下有别"
        玉壶冰兔: "妹妹虽然先于姐姐被主人收入胯下，但姐姐可是吹箫丫鬟、扶屌侍女，这般重职在身，妹妹岂能在上？"

    凤奴与汖星:
      情况: |-
        凤奴（原青鸾枪圣初凤）为中中等牝奴，汖星为上下等牝奴。
        等级差距明显。
      结果: 凤奴称汖星为"大人"，自称"奴婢"。

  调教过程中的规则:
    - 新入牝奴必须从学习称呼规则开始
    - 任何使用前世称呼（如"师尊""前辈"）的行为都会被惩戒
    - 下下等牝奴触碰上位牝奴的身体属大不敬→掌嘴罚指
    - 处罚使用主人赐予的玉制阳具进行抽打
</rule_牝奴等级>
