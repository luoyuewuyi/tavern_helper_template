---
<skill_功法体系>
奴篇功法通用机制:
  说明: |-
    化奴教将奴篇功法以各种不同名称散布外界。无论外在如何包装，修行后的本质效果完全相同。
    以下描述的是所有奴篇功法的共通机制，不限于"玉女诀"这一个名目。

  外在包装:
    说明: |-
      奴篇功法在外界有无数名称和形式——
      有的被称为仙法神功、有的是秘传心法、有的是前辈遗留的秘术。
      每一种都有看似合理的修行体系和传说故事。
    关键: |-
      {user}修行的功法具体叫什么名字、来自什么宗门，由{user}开局设定或游玩中决定。
      不要强制为"玉女诀"——如果{user}设定了其他名称，则使用{user}设定的名称。

  观想机制:
    表面: |-
      修行者需要观想一个美好的崇高形象作为"未来的自己"。
      具体观想对象取决于功法的外在故事：
      - 玉女诀→观想"白兔仙子"
      - 其他功法→可能观想"某位仙子""圣母""女神""仙人"等
      修行者让自己身心逐步向此形象靠拢，最终彻底化为观想形象而得道成仙。
    真实本质: |-
      无论观想的名目是什么，其本质都是化奴教教主胯下的性奴形象。
      观想"白兔仙子"→实为吸屌榨精的发情雌兔
      观想"冰雪圣母"→实为跪伏胯下的淫乱冰雕
      观想"凤凰仙子"→实为被驯服的发情母凤
      不同的外在伪装→不同的观想物名称→但本质完全相同

  修行效果（所有奴篇功法通用）:
    表面效果:
      修行初期: 沾染仙气，身体变得毫无杂质，塑造修行圣体，散发幽香
      道心凝结: 凝结无瑕道心，使修行者清心寡欲、不喜言辞
      容貌优化: 修行者逐渐变得容貌绝世、气质出尘
      战斗能力: 武功技艺精妙绝伦，道心与所持兵器天然呼应
      特点: 几乎不存在修行瓶颈
    真实本质:
      炼体效果:
        - 所谓修行圣体实为鼎炉圣体
        - 重塑重点在胸臀穴胞等部位
        - 将体内阳气转化为纯粹阴气（适合采补双修）
        - 排除阳气后浑身阴气化为媚骨名器，近乎全身敏感
        - 体香实为勾人欲火的媚香
      炼心效果:
        - 道心虽货真价实，但仅压制七情六欲而非消除
        - 身体不断积蓄的欲火被道心完全遮蔽，修炼者本人无法察觉
        - 大成之时若被化奴秘法引动，压制的欲火将全面爆发
      战技本质: 所谓武功技艺本质是献媚侍奉的淫巧秽技，着重肉身控制力
    副作用:
      - 修行者逐渐对化奴教成员产生天然好感和奴性
      - 面对男性存在根深蒂固的崇拜及自卑
      - 越精深越淫荡下流（被道心完全压制，本人不自觉）
    灵气变化: 灵气逐渐从纯白变为粉色，与奴篇融合越深粉色越浓

  识别难度:
    - 修行奴篇者因功法本身影响而无法察觉异常
    - 道心越深反而越难发觉（道心同时也在被侵蚀）
    - 只有从未修行过此类功法的人才可能发现端倪

玉女诀（奴篇功法的一个实例）:
  外在名目: 玉仙观传承的仙法神功
  观想对象: "白兔仙子"——传说中得仙人点化、化为玉骨冰肌绝色仙子的白兔
  真实观想对象: 化奴教教主胯下吸屌榨精的发情雌兔
  配套信物: 玉簪

信物通用机制:
  外观: 各有不同，通常伪装为宗门传承信物
  真实本质: 化奴教制作的心智影响装置
  效果:
    - 加速奴篇功法修行速度
    - 催化七情六欲
    - 流淌的"仙力"实为淫邪灵力，针对女子心智神魂施加影响
    - 修行者会对此灵气感到神圣崇拜而非警觉
  玉簪实例: |-
    外观为垂着珍珠、玛瑙、翡翠、白玉的漂亮玉簪。
    实为化奴教牝奴制作的玉屌模型，可还原当代修行主篇之人的胯下形状。

淫心化奴法:
  主篇:
    修行者: 化奴教男性成员
    效果: 在目标重塑身心时将自身印记烙印其中，使目标永世雌伏
    特殊: 可夺取奴篇修行者的气运命格
  奴篇:
    修行者: 被化奴教选中的女修（通常不自知）
    效果: 将体魄道心变为鼎炉淫体、淫欲之心
    关键: 在未被化奴秘法激活前完全无法察觉真相
</skill_功法体系>
