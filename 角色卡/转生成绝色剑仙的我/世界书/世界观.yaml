---
<world_setting>
世界名称: 九州仙界

地理格局:
  五州分布:
    东州:
      特征: 灵气充沛，宗门林立，正道势力最为集中
      代表势力: 玉仙观、天剑宗、青云门
      地貌: 山川秀丽，灵峰叠嶂，有诸多洞天福地
    南州:
      特征: 水系纵横，物产丰饶，炼丹炼器之术昌盛
      代表势力: 丹霞阁、碧水宫
      地貌: 烟雨朦胧，湖泽密布，灵草遍野
    西州:
      特征: 大漠戈壁与险峻山脉交错，体修与武修盛行
      代表势力: 金刚寺、铁血门
      地貌: 荒漠冰原，天地灵气粗犷凝实
    北州:
      特征: 苦寒之地，散修与隐世宗门居多，邪道暗流涌动
      代表势力: 冥渊宫（已覆灭）、霜月谷
      地貌: 冰封万里，灵气内敛，适合闭关炼心
    中州:
      特征: 天下枢纽，凡人王朝与修仙界交汇之地，最为繁华
      代表势力: 天机阁（情报组织）、各大商会
      地貌: 平原广袤，城郭林立，灵俗交融

修仙体系:
  灵气: 天地间蕴含的神秘能量，修士通过功法引导灵气入体炼化为己用
  修炼境界:
    - 炼气：初窥修行门径，引灵入体
    - 筑基：灵气洗髓伐毛，重塑根基
    - 金丹：凝结金丹，实力跃升
    - 元婴：神魂蜕变，元婴出窍
    - 化神：法天象地，接近仙道
    - 大乘：仙道门槛，半步飞升
    - 飞升：白日飞升，成就仙道
  功法境界:
    - 入门：初步掌握功法皮毛
    - 小成：功法精纯，运用自如
    - 大成：功法圆满，身心蜕变，可以重塑体魄道心
    - 成仙：功法臻至极致，超凡入圣
  道心:
    定义: 修士修行之本，影响功法发挥与突破瓶颈
    类型: 因修行功法不同而各异，如剑心、佛心、玉女道心等
    重要性: 道心破碎则修为尽废，道心圆满则突破无碍

社会结构:
  修仙界:
    - 以宗门为核心，实力决定地位
    - 正道与邪道对立，但界限并非绝对
    - 化奴教等隐秘组织暗中活跃
  凡人界:
    - 王朝治理，与修仙界若即若离
    - 部分贵族与修仙势力暗中勾结
    - 绝大多数凡人对修仙界知之甚少

特殊规则:
  - 功法大成可重塑身体，是修仙者的重大蜕变
  - 双修采补之术客观存在，部分正道宗门也有涉及
  - 灵气品质因地域和修行方式不同而有差异（纯阳/纯阴/混元等）
  - 至阴之体等特殊体质天生适合特定功法修行
</world_setting>
