---
<user_setting>
{user}角色设定:
  说明: |-
    {user}是本角色卡的主角。以下是{user}角色的基本框架。
    【重要】如果{user}选择自定义开局：
    - 即使{user}设定的角色名叫"汖星"，也是一个全新的独立角色
    - 不继承原作汖星的师尊、法宝、关系、宗门等设定
    - 师尊、宗门、功法名称、武器类型等全部由{user}自行设定
    - 只有{user}明确选择"扮演原作汖星"时，才读取汖星的具体设定

  基本框架:
    前世: 男性，来自现代世界，拥有现代知识与三观
    今生: 转生为仙侠世界的女性，在某宗门中修行
    身份: 转生者，拥有前世记忆和超凡领悟力

  角色特点:
    转生者优势:
      - 前世知识赋予远超同辈的理解力与想象力
      - 观想能力因前世经验而完美无瑕
      - 天赋卓越，被视为千年难得的天才
    性格基调:
      - 因前世经验而自信（甚至傲慢）
      - 争强好胜、自尊心强
      - 内心闷骚，表面清冷
      - 对色情事物抗拒（但身体因功法影响已不受控制）
    统一人格: |-
      {user}是一个完整统一的人格。前世男性记忆是性格底色，不是分裂的第二人格。
      内心矛盾体现为"一个人的纠结"——"明明知道不对但身体在背叛"
      而非"男性意识说A，女性意识说B"的分裂式描写。

  自定义开局规则:
    体质: |-
      由{user}设定。可以是至阴之体、冰魄玉骨、天雷之体等任何体质。
      一旦设定不可擅自更改。未设定时默认至阴之体。
    功法: |-
      由{user}设定功法名称。可以是玉女诀、冰心诀、天凤功等。
      无论叫什么名字，内核都是奴篇功法变种（{user}角色不知情）。
      不同的功法名→不同的观想对象→但本质效果完全相同。
    武器: |-
      由{user}设定擅长的武器类型。可以是剑、枪、矛、刀、扇等。
      能力面板中的"武技"字段名称随武器类型变化（如枪法、刀法）。
    宗门: |-
      由{user}设定所属宗门。可以是玉仙观或其他自创宗门。
      选择非玉仙观时，不读取玉仙观相关的具体设定（白兔山、清泉练剑场等）。
    师尊: |-
      由{user}设定或游玩中生成。
      选择非玉仙观时，师尊不是原作中的师尊角色。
    信物: |-
      由{user}设定或默认为宗门传承信物。
      无论外在形态如何，信物内核都与奴篇功法配套。
    观想对象: |-
      取决于功法的外在包装故事。
      玉女诀→观想"白兔仙子"
      其他功法→观想对应的美好崇高形象（仙子/圣母/女神等）

  初始状态:
    功法境界: 小成（或同类奴篇功法小成）
    实力: 金丹期左右，在同辈中出类拔萃
    道心: 对应功法的道心小成，表面清心寡欲
    外貌: 容貌绝世，气质出尘（功法副效果）
    身体: 已被功法暗中改造，全身敏感但被道心压制
    信物: 持有宗门信物（暗含化奴教后门）
</user_setting>
