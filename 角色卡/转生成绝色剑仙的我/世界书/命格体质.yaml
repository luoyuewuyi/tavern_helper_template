---
<rule_命格体质>
命格与体质定义:
  说明: |-
    命格和体质是两个完全不同的概念，不可混淆。
    AI在生成内容时必须严格区分，不可将命格误读为牝名或称号，
    也不可擅自将体质替换为"至阴之体"（除非{user}本身设定如此）。

  命格:
    定义: 天道赋予的命运轨迹，决定角色的天命走向和气运
    本质: 是一种先天注定的命运格局，不是名号也不是称呼
    举例:
      天命剑仙: 秉持天地气运所生，得天地宠爱，命中注定成就剑仙的天命之女
    重要规则:
      - 命格不是牝名！"天命剑仙"不是"牝剑仙"！
      - 初始状态下命格与化奴教完全无关
      - 命格仅在完全恶堕（堕落阶段）后才会被淫心化奴法扭曲
      - 恶堕后的命格扭曲示例：天命剑仙→淫骚牝兔
      - 在恶堕之前，任何情况下都不可改变或扭曲命格
    自定义开局: {user}可自行设定命格，如"天命枪仙""星辰命格""凤凰天命"等

  体质:
    定义: 身体的先天特质，影响修炼方式、功法适配度和身体属性
    本质: 是角色的肉体天赋
    举例:
      至阴之体: 天生阴气纯净充沛，适合修行阴属性功法，修行速度远超常人
    重要规则:
      - 体质由{user}在开局时设定，一旦设定不可擅自更改
      - 如果{user}开局设定了"寒冰灵体"，就不能在游玩中变成"至阴之体"
      - 仅在未设定体质时才默认使用"至阴之体"
      - 功法对体质的改造是渐进的附加效果，不是替换原有体质
      - 改造后的体质变化应在"身体状态.体质变化"变量中记录
    自定义开局: {user}可自行设定体质，如"冰魄玉骨""天雷之体""灵狐体质"等
</rule_命格体质>
