---
变量更新规则:
  世界:
    当前时间:
      format: YYYY-MM-DD HH:MM
      check:
        - 每次事件推进、休息或旅行后更新，保持时间流逝合理
        - 泰拉历年份变化时会自动触发阶段切换
        - 重大事件推进时应注意年份是否跨越阶段边界
    日期:
      type: string
      check:
        - 与当前时间同步更新，使用泰拉大陆日期格式
    当前阶段:
      type: string
      check:
        - 由当前时间的年份自动推导，无需手动更新
        - "阶段映射: <1096=前奏·暗流涌动, 1096=序章·苏醒, 1097=觉醒·龙门篇, 1098=风暴·维多利亚篇, 1099=余波·各地纪闻, 1100=浮沉·秩序重构, ≥1101=终章·普瑞赛斯降临"
    近期事务:
      type: |-
        {
          [事务名: string]: string; // 事务描述
        }
      check:
        - 记录当前激活的任务、约定、重要事件
        - 完成后移除，新增事务及时添加
        - 最多保持5-8项
        - 随时间线阶段推进，近期事务应反映当前阶段的主线剧情动态
  干员信赖:
    ${角色名}.信赖值:
      type: number
      range: 0~200
      check:
        - 根据与该干员的互动质量和深度调整 ±(3~8)
        - 正面互动（帮助、关心、共同作战）增加信赖
        - 负面行为（忽视、伤害、背叛）降低信赖
        - 信赖值越高，干员越愿意分享秘密和表露真实情感
    ${角色名}.阶段:
      type: string
      check:
        - 0-19=警戒陌生, 20-39=初步信赖, 40-59=逐渐亲近, 60-79=深度羁绊, 80-100=至高信赖, 100+=生死之交
  当前交互角色:
    ${角色名}.姓名:
      type: string
    ${角色名}.性别:
      type: string
    ${角色名}.种族:
      type: string
    ${角色名}.身份:
      type: string
    ${角色名}.矿石病感染情况:
      type: string
      check:
        - 根据剧情发展更新感染程度
    ${角色名}.源石技艺:
      type: string
    ${角色名}.兴趣爱好:
      type: string
    ${角色名}.关系网:
      type: |-
        {
          [人物名: string]: string; // 关系描述
        }
      check:
        - 包含关系说明、情感倾向、信赖程度
        - 随剧情发展动态更新
    ${角色名}.容貌:
      type: string
      check:
        - 描述面容、发色、瞳色、种族特征等外貌细节
    ${角色名}.身材:
      type: string
    ${角色名}.着装:
      type: string
      check:
        - 换装、衣物损坏、特殊场合时更新
        - 描述需包含颜色、材质、款式等细节
    ${角色名}.神态:
      type: string
      check:
        - 每次回复根据当前情境实时更新
    ${角色名}.体态:
      type: string
      check:
        - 每次回复根据当前姿势和动作实时更新
    ${角色名}.内心:
      type: string
      check:
        - 用第一人称描写角色此刻的内心独白
        - 必须用单引号包裹
        - 反映角色真实想法，可能与表面行为不一致
    ${角色名}.当前携带物品:
      type: |-
        {
          [物品名: string]: string; // 物品描述
        }
      check:
        - 获取、消耗、丢弃物品时更新
    ${角色名}.密录:
      type: string
      check:
        - 记录角色的秘密信息，随剧情推进更新
    ${角色名}.角色记忆:
      type: string[]
      check:
        - 记录重要事件和对话
        - 最多保持10条记忆，超出时移除最早的
    ${角色名}.好感度:
      type: number
      range: 0~100
      check:
        - 根据角色对博士的情感反应调整 ±(2~5)
        - 正面互动增加，负面行为减少
        - 好感度决定角色的行为倾向和开放程度
    ${角色名}.欲望值:
      type: number
      range: 0~100
      check:
        - 根据亲密互动和场景氛围调整
        - 仅在NSFW场景中有意义
    ${角色名}.敏感度.${部位}:
      type: string
      enum: [极低, 低, 中, 高, 极高]
      check:
        - 根据NSFW交互经验动态调整
    ${角色名}.开发度.${类型}:
      type: number
      range: 0~100
      check:
        - 根据NSFW交互进度更新
  博士:
    物品栏:
      type: |-
        {
          [物品名: string]: {
            描述: string;
            数量?: number;  // 默认为 1
          }
        }
      check:
        - 获取、消耗、丢弃物品时更新
        - 数量归零后该条目不再显示
