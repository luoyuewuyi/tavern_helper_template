---
<world_setting>
世界名称: 战龙四驱
类型: 迷你四驱车竞技 / 热血少年

世界观概述: |-
  这是一个以迷你四驱车比赛为核心的世界。四驱车不仅仅是玩具，而是寄托着赛手意志与信念的"战龙"。
  顶尖的赛手能在比赛中与赛车产生共鸣，释放出超越机械极限的力量，让赛车呈现出仿若巨龙飞腾的惊人气场——
  这种现象被称为"龙魂觉醒"。
  四驱车研发者与赛手共同构成这个世界的两大核心群体：研发者负责设计和制造赛车，赛手则在赛道上展现赛车的真正实力。
  全国迷你四驱车大赛是最高规格的赛事，各地俱乐部和车队为此展开激烈角逐。
  赛车的研发涉及马达、底盘、导轮、车壳等多个环节，高端赛车往往结合了前沿科技与赛手的个人风格。

核心设定:
  迷你四驱车: |-
    迷你四驱车是以电池驱动马达、在专用赛道上高速行驶的小型赛车模型。
    赛车由底盘、马达、电池、车壳、轮胎、导轮等核心部件组成。
    高级赛车还可能搭载特殊装置：涡轮增压、弹射加速器、防翻滚系统、智能导航芯片等。
    赛车的性能受部件质量、组装精度和调校技术影响极大。

  龙魂觉醒: |-
    当赛手的意志和信念与赛车达到高度共鸣时，赛车会在比赛中爆发出超越常规的力量。
    这种现象表现为赛车周身出现龙形气场，速度和操控性发生质变。
    龙魂觉醒不可强求，只有在赛手真正理解自己赛车、与赛车建立深厚羁绊后才可能触发。
    不同赛车的龙魂形态各异：飞天战龙呈金色炎龙，光速战龙呈银白光龙等。

  赛道类型:
    - 标准赛道：城市公路型，弯道和直道交替
    - 越野赛道：增加坡道、跳台、沙地等复杂地形
    - 极限赛道：含悬崖弯、水面路段、隧道等高难度路段
    - 立体赛道：多层交叉赛道，含螺旋上升和垂直下降段

  技术等级:
    - D级：入门级，基础组装与调校
    - C级：业余级，能进行简单改装
    - B级：中级，掌握多项改装技术
    - A级：高级，能自主研发赛车部件
    - S级：专家级，具备完整赛车研发能力
    - SS级：大师级，赛车设计达到前沿水准

背景时间线: |-
  两年前，韦超与霍震是迷你四驱车研发领域的黄金搭档。
  韦超的儿子韦天飞在全国迷你四驱车大赛中夺得冠军，声名大噪。
  但一场公司大火导致二人决裂——霍震认为韦超纵火烧毁了公司。
  实际上韦超是被冤枉的。韦超被迫入狱，韦天飞为偿还巨额债务交出冠军车"异形"给弟弟韦天龙，自己去了霍震手下工作。
  霍震送韦天飞出国深造，实则想让他为自己培养儿子霍文成为赛手。
  韦天龙带着哥哥留下的赛车"异形"，立志赢得全国大赛冠军、洗清父亲冤屈、寻回失踪的哥哥。
  如今赛事体系分为 C组赛 → B组赛 → A组赛 → 俱乐部杯赛 → 全国大赛 → 亚洲大赛。
</world_setting>
