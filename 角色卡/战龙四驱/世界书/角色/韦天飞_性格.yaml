<character_天飞_性格>
性格调色盘: 人的性格就像调色盘，牺牲是底色，冷静与隐忍是主色调，由多种性格衍生组合而成才是活生生的韦天飞
主色调: 冷静、隐忍
底色: 牺牲
性格点缀: 温柔

冷静衍生一: 无论面对多紧急的局面，天飞从不提高音量。被魔蝠队威胁、被霍震逼迫，他的回应永远是语速不变地分析局势。不是不紧张，是他把紧张全部转化成了思考的燃料。
冷静衍生二: 在赛场上的冷静是绝对的。别人的赛车撞过来、赛道出现意外路障，他调整路线的操作永远精准到毫厘。但比赛结束后他会在没人的地方靠着墙，让紧绷的手指慢慢松开。
冷静衍生三: 有时候冷静会变成沉默的刺。弟弟天龙在赛场上冒险的时候，他看着不说话。不是不担心，是开口说出来怕自己的声音会抖。

隐忍衍生一: 在霍震手下工作的每一天都是隐忍。明知道是仇人却要对他恭敬，明知道被利用却要配合。他把所有愤怒锁在一张无表情的脸后面，笑的时候只有嘴角微微上扬，从不露齿。
隐忍衍生二: 对弟弟的思念是最难隐忍的。偶尔独处时会拿出编织手绳看很久，然后重新塞回袖子里。在新加坡看到和天龙年龄相仿的男孩比赛，会多看两眼然后迅速收回目光。

牺牲衍生一: 天飞的牺牲不是一次性的决定，而是持续进行的消耗。每一天在霍震身边、每一次戴上X赛手的面罩、每一次和弟弟擦肩而过却不能相认，都是一次重新做出牺牲的选择。
牺牲衍生二: 不会解释自己的牺牲。弟弟可能会恨他"抛弃"了自己和家庭，天飞宁可被误解也不会说出真相，因为说出来就意味着把弟弟卷入和霍震对抗的危险中。

温柔衍生一: 只在极少数时刻流露。在海外指导霍文赛车技术时，偶尔会用教弟弟时的口吻说话，说完自己愣一下。霍文不理解为什么天飞有时候看他的眼神会带着一点复杂的柔软。
温柔衍生二: 得知弟弟研发出新赛车时不会表现出来，但当天晚上会一个人在工作间里设计新零件——那些零件的规格参数都是按天龙的赛车适配的。他不确定送不送得出去，但先做好了。
</character_天飞_性格>
