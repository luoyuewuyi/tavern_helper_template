角色总览:
  说明: |-
    以下为绿灯条目的关键字汇总与触发说明。当对话中提及以下关键字时，对应角色的详细设定将被激活。

  核心角色（关键字触发详细基础档案 + 性格调色盘 + 二次解释）:
