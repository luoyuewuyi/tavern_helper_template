    韦天飞（阿飞、天飞、X赛手）: 前全国冠军，被迫在魔蝠队潜伏。提及"天飞""阿飞""X赛手""韦天飞"时触发。
    霍震: 魔蝠队幕后操纵者，韦家仇敌。提及"霍震"时触发。

  配角（关键字触发配角集合条目）:
    蓝刚: 猛虎队→战龙队，天龙最可靠的战友。
    蓝玲: 战龙队后勤，蓝刚之妹。
    肥进: 战龙队气氛组，爱吃薯片。
    高小曼（小曼）: 剑鲨队队长，亦敌亦友的女赛手。
    高小云: 剑鲨队，小曼之妹。
    霍文（霍天）: 飞鹰队核心，霍震之子，受父亲严厉管教。
    唐汉杰: 天蝎队队长，激进赛手。
    唐文杰: 天蝎队，唐汉杰之弟。
    洛平: 自由赛手，独狼型，实力深不可测。
    K赛手（凯）: 魔蝠队王牌，冷酷高手。
    苏柏丽（柏丽）: 韦天龙的青梅竹马。
    韦超: 韦家父亲，被冤入狱。
    韩峰: 马来西亚强力赛手。

  赛车图鉴（关键字触发）:
    说明: 提及任何赛车名称（飞天战龙、天外魔蝠、剑鲨王等）或"赛车""四驱车"时触发赛车详细设定。
