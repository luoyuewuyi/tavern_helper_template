---
<race_system>
赛事体系总览:
  赛事分级:
    C组赛:
      说明: 入门级赛事，面向初学者和新组建的车队
      参赛门槛: 拥有合格赛车即可报名
      赛制: 单轮淘汰赛，每场3~5辆车同赛
      奖励: 获得B组赛参赛资格

    B组赛:
      说明: 中级赛事，竞争开始加剧
      参赛门槛: C组赛前三名或获得推荐
      赛制: 小组循环赛 + 淘汰赛
      奖励: 获得A组赛参赛资格，奖金和赞助机会

    A组赛:
      说明: 高级赛事，赛手实力差距显著缩小
      参赛门槛: B组赛冠军或特邀
      赛制: 积分制联赛
      特点: 赛道开始出现越野和立体路段
      奖励: 俱乐部杯赛参赛资格

    俱乐部杯赛:
      说明: 以车队为单位的团体赛事
      参赛门槛: A组赛积分排名前列的车队
      赛制: 车队对抗赛，每队出3名赛手
      特点: 考验车队整体实力和战术配合
      奖励: 全国大赛参赛资格

    全国大赛:
      说明: 全国最高规格迷你四驱车赛事
      参赛门槛: 俱乐部杯赛优胜者及各赛区推荐选手
      赛制: 预选赛 + 32强淘汰赛 + 决赛
      特点: 极限赛道，龙魂觉醒频繁出现
      奖励: 全国冠军头衔，亚洲大赛参赛资格

    亚洲大赛:
      说明: 亚洲范围最高水平迷你四驱车赛事
      参赛门槛: 各国全国大赛冠亚军
      参赛国家: 中国、日本、新加坡、马来西亚、韩国等
      赛制: 团体赛 + 个人赛
      特点: 汇聚各国顶尖赛手，赛道设计极其考验

  比赛规则:
    - 赛车必须使用合规底盘和马达，禁止使用违规改装
    - 比赛中赛手不得接触赛车，赛车一旦离开赛道即淘汰
    - 可通过呐喊和意志与赛车共鸣（龙魂觉醒不算违规）
    - 故意撞击对手赛车属于犯规，但赛道内的正常碰撞不计
    - 特殊赛道可能附带额外规则（如限速区、必经点等）
</race_system>
