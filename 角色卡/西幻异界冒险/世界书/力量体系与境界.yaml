力量体系与境界:
  - 统一等级划分11级（初级→半神）+ 神级（初级神→神帝），适用于武道/魔法/神术/古武/修仙/妖修/鬼修所有体系。
  - 战士/物理职业通用武道斗气体系。魔法以源力构建模型施法。神术依赖信仰获得神赐。
  - 华夏古武11级对应（铜皮→天人）。修仙炼气九层对应1~9级，筑基=10级，金丹=11级，元婴=初级神，后续一一对应。
  - 妖族/鬼族有独立修炼体系，等级对应统一划分。
  - 属性天生不可后天改变。常见属性（火水风土光暗）、稀有属性（雷冰空间精神毒金属）、极稀有属性（混沌虚空生命死亡）。
  - 天赋决定修炼速度和上限，分7档。不允许年纪轻轻无理由达到极高实力。
  - 魔兽按品种决定实力上限，拥有1~3种本命魔法。巨龙成年后自动传奇（9级），掌握龙语魔法。
