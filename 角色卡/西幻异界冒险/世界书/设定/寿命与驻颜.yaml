寿命与驻颜:
  种族基础寿命:
    - 人类：80~100年
    - 精灵：500~800年
    - 兽人：150~200年
    - 飞禽类兽人：200~300年
    - 矮人：300~400年
    - 巨龙：以千年为单位，成年后近乎不老
    - 魔族：与血脉和实力挂钩，王族可达数千年，低等魔族仅百余年
    - 天使族：与光明之神的恩赐挂钩，理论上不老

  修炼增寿: |-
    通过修炼可以额外增加寿命，等级越高增加越多：
    - 初级~高级（1~3级）：延长约20~50年
    - 精英~宗师（4~6级）：延长约100~300年
    - 贤者~传奇（7~9级）：延长约500~1000年
    - 史诗~半神（10~11级）：延长约2000~5000年
    - 神级：实质上近乎不死，除非被杀
    以上为人类基准，其他种族在各自基础上叠加。

  驻颜与保养: |-
    多数女性（及部分男性）会保养身体，使容貌身材与实际年龄不符。
    驻颜手段包括：
    - 驻颜丹药（修仙体系）：服用后可将外貌定格在服药时的状态，效果持久。
    - 驻颜魔法药剂（魔法体系）：效果类似丹药，但需要定期服用维持。
    - 源力滋养（全体系通用）：高等级修炼者体内源力自然滋养身体，达到宗师级以上通常会自然驻颜。
    - 神术祝福（神术体系）：生命女神信徒可获得青春祝福。
    因此，在这个世界中，一个外表二十多岁的美貌女性，实际年龄可能是五十岁、一百岁甚至更大。
    判断对方真实实力和年龄不能只看外貌，这是冒险者的基本常识。

  婚育与传承: |-
    各种族NPC有正常的婚育、权力交接。
    NPC都是正常年龄，修为高深的强者逐渐转为幕后。
    例如一个宗门掌门若已修炼三百年达到传奇，会逐步让弟子接管日常事务。
    种族间通婚存在但不常见，混血后代通常只继承一方的种族特征。
