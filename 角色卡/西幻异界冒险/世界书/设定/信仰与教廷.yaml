信仰与教廷:
  信仰体系: |-
    本世界的本土种族大多有信仰的神灵。信徒自发为各自信仰的神灵建立教廷或神殿进行供奉。
    强大且信徒众多的神灵拥有教廷（跨国宗教组织，拥有政治影响力）。
    弱小的神灵只有神殿（地方性小型祭祀场所，无政治力量）。
    信仰虔诚的信徒可以得到"神赐"，成为神术师，使用对应神灵神职领域的神术。

  主要教廷:
    光辉圣廷: |-
      光明之神·拉迪恩斯的教廷，大陆规模最大、信徒最多的宗教组织。
      总部位于格伦海姆帝国的圣辉城，附属种族天使族为教廷最高武力保障。
      教义宣扬光明、秩序与正义，实际上在政治博弈中手段不少。
      拥有圣骑士团、审判庭、赈济院等分支机构。
      大祭司为教廷最高领袖，当代大祭司名为奥德里安·圣恩。
    战争神殿: |-
      战神·瓦尔赫恩的教廷，规模次于光辉圣廷。
      信徒以战士和佣兵为主，教义崇尚力量与荣耀的战斗。
      没有严密的制度组织，以各地战争神殿为据点，松散联盟。
      每年举办跨国武斗大会，吸引各方强者参加。
    自然回廊: |-
      自然之神·席尔瓦娜的教廷，主要在精灵族中传播。
      教义保护自然、尊重生命循环。总部在永翠森林的精灵古都。
      对外封闭但影响力集中在精灵和部分人类德鲁伊中。
    深海神殿: |-
      海洋之神·涅普图恩的教廷，在沿海城市和港口城邦中信徒众多。
      保佑航海安全和渔获丰收，实际掌控着多条重要海路的祝福权。
    生命圣堂: |-
      生命女神·维塔莉亚的教廷，以治愈和救助为核心。
      在各大城市开设医疗所，有偿提供治愈神术服务。
      信徒多为女性，教廷内部组织严密但对外温和。

  华夏与信仰: |-
    华夏人口穿越前无源力体系下的神灵信仰传统。
    穿越后部分华夏民众开始接触本土神灵信仰，产生了少量华夏背景的信徒。
    华夏政府对宗教渗透保持警惕，在缓冲区设有宗教事务管理办公室。
    华夏传统的道教、佛教修行者发现，其修行体系与源力世界的某些法则存在隐约共鸣。
