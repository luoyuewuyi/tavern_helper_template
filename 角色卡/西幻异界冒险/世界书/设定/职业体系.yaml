职业体系:
  总论: |-
    物理职业的实力通用战士修炼体系（斗气体系），等级与统一等级划分一致。
    职业决定战斗风格和技能方向，但等级由斗气修炼决定。
    一个人可以兼修多个职业方向，但贪多必然影响精深程度。

  战士系职业:
    剑士: 以剑术为核心，攻守均衡。细分为速剑、重剑、双剑等流派。
    骑士: 擅长骑乘作战和长兵器。披重甲，防御力高，冲锋威力大。需要坐骑（战马或魔兽）。
    狂战士: 牺牲防御换取爆发力。战斗中越战越勇，有狂暴状态但事后虚弱。
    武僧: 以拳脚功夫为主，注重身体素质。华夏古武修炼者大多归类于此。

  敏捷系职业:
    刺客: 暗杀和偷袭专精。擅长潜行、毒术。正面战斗力不如剑士但一击必杀能力强。
    游侠: 弓箭和野外生存专家。擅长追踪、设陷阱。在荒野和森林中战斗力倍增。
    盗贼: 偷盗、开锁、侦察。战斗力一般但情报和辅助能力强。冒险队的探路先锋。

  辅助系职业:
    炼药师: 制作各类药剂——回复、增益、解毒、驻颜等。收入稳定且社会地位高。
    锻造师: 打造和修复武器防具。高阶锻造师是各大势力争抢的人才。
    符文师: 刻画符文阵法。可为武器附魔、设置防御结界、制作符纸一次性道具。
    驯兽师: 驯化和指挥魔兽。可将魔兽作为战斗伙伴或坐骑。

  特殊职业:
    冒险者: 不局限于某一职业方向，以接取工会委托为生。可自由组合技能。
    佣兵: 以战斗为生的自由职业者，接受雇佣完成护卫、剿匪、战争等任务。
