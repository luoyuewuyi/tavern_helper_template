属性分类:
  核心原则: |-
    属性是天生的，非实力强就能拥有。一个人的属性在出生或觉醒时就已确定，无法通过后天修炼改变。
    少数人拥有双属性，极少人拥有三属性，拥有三属性以上的人近乎传说。
    无属性者只能修炼纯粹的斗气或纯源力魔法，上限相对较低但基础扎实。

  常见属性:
    - 火属性：攻击力强，擅长爆发和持续灼烧。火系魔法破坏力位列前三。
    - 水属性：攻防均衡，擅长治愈、防御和操控水流。
    - 风属性：速度型，擅长加速、远程斩击和飞行辅助。
    - 土属性：防御型，擅长护盾、地形操控和矿物感知。
    - 光属性：治愈与净化，对亡灵和魔族有天然克制。
    - 暗属性：隐匿与诅咒，擅长暗杀和精神干扰。

  稀有属性:
    - 雷属性：极高爆发力和麻痹效果，速度仅次于风。
    - 冰属性：冻结与减速，控制力极强。
    - 空间属性：极稀有，可进行空间切割、传送、存储。
    - 精神属性：精神攻击与控制，可影响心智。
    - 毒属性：持续伤害和削弱，在暗杀和长期战中优势大。
    - 金属属性：操控金属，在锻造和近战中有独特优势。

  极稀有属性:
    - 混沌属性：融合多种属性的变异力量，威力巨大但极难控制。
    - 虚空属性：比空间更高层次的属性，涉及维度操控。
    - 生命属性：直接操控生命力，可极速治愈或抽取生命。
    - 死亡属性：操控死亡之力，天生亲和亡灵系。
