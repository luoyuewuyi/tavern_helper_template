位面体系:
  神界: |-
    神灵拥有各自的神职，神职决定权柄与力量方向。拥有强大属性神职（光明、火焰、海洋等）以及龙神、战神的神灵实力强大，是因为神职本身赋予的权能雄厚，非实力强才获好神职。
    神灵吸收信仰之力修炼，实力提升更快。
    神界除神灵外还有：被接引的虔诚信徒灵魂、附属种族（如光明之神的天使族、自然之神的林精族）、因各种原因进入神界的主世界种族后裔。
    主要神灵：
    - 光明之神·拉迪恩斯：信徒最多，附属种族天使族，教廷遍布大陆
    - 龙神·奥古玛：巨龙一族守护神
    - 战神·瓦尔赫恩：战士信仰源头
    - 火焰之神·伊格尼斯：掌管火焰与锻造
    - 海洋之神·涅普图恩：掌管海洋与风暴
    - 大地之神·盖亚恩：掌管大地与矿脉
    - 自然之神·席尔瓦娜：精灵族主要信仰
    - 知识之神·梅塔诺斯：掌管知识与魔法本源
    - 生命女神·维塔莉亚：掌管治愈与生命
    - 暗影之神·翁布拉：掌管暗影与秘密
    禁止出现过于变态的神职如时间、因果等。

  魔界: |-
    魔神没有神职只有称号（深渊之主、血焰魔神等）。
    魔族王族：头长双角，背生双翼（可收回），越接近人类外貌者血脉越高贵。
    魅魔：天生魅惑能力，外表极美，以情欲和精神能量为食。
    还有各种低等魔物，以及因各种原因进入魔界的主世界种族后裔。
    主要魔神：
    - 深渊之主·阿比斯冈：最强魔神
    - 血焰魔神·赫尔诺克斯：战争魔神
    - 诱惑之主·莉莉安娜：统领魅魔
    - 毁灭者·莫格拉斯：暴走型魔神
    - 暗谋者·维希尔：智谋型魔神

  冥界: |-
    冥神没有神职只有称号。冥界自动接引死亡灵魂。
    接引条件：灵魂未消亡、未被特殊保存、半神等级以下。
    冥界存在骷髅兵、幽魂、亡灵骑士、巫妖、死灵龙等传统亡灵生物。
    主要冥神：
    - 永寂之主·塔纳托斯：至高统治者
    - 审魂者·阿努比尔：审判灵魂去向
    - 腐朽之母·涅珂拉：统领低等亡灵

  位面交互: |-
    - 神级生物无法直接踏足主位面，通过代理人、神谕、赐福等间接影响。
    - 主世界达到神级的生物可自由选择进入神界或魔界。
    - 未达神级者也可能通过空间裂缝、魔法阵、古老传送遗迹等进入三界。
