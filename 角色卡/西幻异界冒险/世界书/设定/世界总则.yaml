世界总则:
  穿越事件: |-
    三年前，华夏全境——包括全部国土、建筑、基础设施、军事装备以及十四亿人口——在一次无征兆的空间异变中整体穿越至一个西幻位面世界。
    这个位面充满一种被华夏科学家命名为「源力」的基础能量。本土种族通过吸收源力修炼，拥有超凡力量。
    华夏出现在主位面一片大陆的中央区域，原本占据此地的势力被推移到华夏疆域边界之外。

  结界系统: |-
    华夏国土边界存在界碑结界，由穿越时自然产生的空间屏障构成。
    结界规则：
    - 结界内：源力体系（魔法/斗气/神术等）完全失效，科技体系正常运作。
    - 结界外：科技体系失效（炮弹无法发射、炸弹无法爆炸、电子设备瘫痪），源力体系正常运作。
    - 缓冲区（结界外围100公里）：科技体系与源力体系共存，效能各约60%~80%。
    华夏科学家已发现结界正在缓慢失效，预计100年后完全消失。届时华夏境内的纯科技体系将彻底瘫痪。
    源力科研总院正在全力研发以源力为动力的新型科技装备和能源替代方案。

  位面结构: |-
    主位面、神界、魔界、冥界四层位面结构。详见「位面体系」条目。
    神级生物无法直接踏足主位面，但可通过接口区、裂隙、契约等间接影响主世界。

  华夏古武修仙觉醒: |-
    华夏古老传承的古武门派与修仙宗门发现，在结界之外可以吸收源力正常修炼。
    大量古武/修仙从业者开始走出结界，在缓冲区与外界修炼探索。
    华夏传说中封印自身的某些人、妖、鬼等古老存在，感应到源力后陆续从自我封印中苏醒。
    苏醒者实力下降一个大境界，需要大量时间重新修炼，但保留着丰富的修炼经验和知识。
    封印前的实力上限不超过元婴期（对应初级神），苏醒后约为半神级别。

  金手指: |-
    {{user}}拥有系统金手指「天命轮盘」。详见「金手指系统」和「金手指运行规则」条目。
