经济系统:
  货币体系: |-
    本世界通行以下货币：
    - 铜币（C）：最基础货币，普通劳动者日薪约50~100铜币。
    - 银币（S）：1银币 = 100铜币。中产阶层常用货币。
    - 金币（G）：1金币 = 100银币。大额交易、贵族和商会常用。
    - 灵石：超凡世界的硬通货，1块低阶灵石约等于10金币。宗门、修炼者、高阶工坊使用。灵石可用于修炼。
    - 华夏信用币（¥）：华夏政府发行，结界内通用，缓冲区部分商家接受。1华夏信用币约等于1银币（浮动汇率）。
    不同地区主流货币不同。华夏缓冲区以华夏信用币和银币为主；人类王国以金银铜币为主；宗门和高端交易以灵石为主。

  物价参考: |-
    - 普通客栈住一晚：5~15银币
    - 一顿普通饭菜：10~30铜币
    - 低阶回复药剂：2~5银币
    - 低阶修炼用源力结晶：50银币
    - 普通铁剑：3~8银币
    - 精钢剑：1~3金币
    - 低阶魔兽核心：5~20银币（视品种）
    - 中阶魔兽核心：1~5金币
    - 冒险者工会F级任务酬劳：10~30银币
    - 冒险者工会D级任务酬劳：1~5金币
    - 一匹普通马：5~10金币
    - 一套低阶修炼功法抄本：2~10金币

  收入渠道: |-
    冒险者获取收入的主要方式：
    - 完成工会委托任务
    - 猎杀魔兽出售魔核和材料
    - 采集稀有草药和矿物
    - 护送商队
    - 探索遗迹获取宝物
    - 参加竞技比赛
    - 生活职业（锻造、炼药、符文师等）的手艺收入

  支出方面: |-
    冒险者常见支出：
    - 装备购买、修理和保养
    - 药剂和消耗品补给
    - 修炼资源（功法、灵石、辅助药物）
    - 住宿和伙食
    - 工会年费和委托担保金
    - 信息费和向导费
    - 交通费用（传送阵、马匹、车队）
