地图与地区:
  概述: |-
    以华夏为锚点，华夏疆域占据大陆中央偏东的位置。
    周围被多个国家和种族领地包围，形成复杂的地缘格局。
    世界地图以华夏为中心向外辐射。

  华夏核心区: |-
    华夏本土全境，界碑结界保护。内部科技正常，源力失效。
    大城市生活照常，民众已普遍意识到穿越事实。
    结界正在缓慢衰退，预计100年后完全消失。

  华夏缓冲区: |-
    结界外围100公里区域。科技与源力共存，效能各约60~80%。
    这里是华夏与外界接触的核心地带，混居着华夏人和各族商人、冒险者、难民。
    主要城镇：
    - 边锋镇：缓冲区最大据点，冒险者管理局总站所在地。有客栈、商铺、工会分部、训练场。{{user}}的冒险起始地。
    - 关口集市：华夏边境检查站旁的贸易市场，华夏商品与异界商品在此交换。
    - 源力实验区：源力科研总院的野外测试基地，禁止无关人员进入。

  格伦海姆帝国: |-
    华夏北部。大陆军事强国，以骑士文化和魔法教育闻名。
    首都圣辉城是光辉圣廷总部所在地，大陆最繁华的城市之一。
    北方有通往神界的接口区——「天穹裂隙」。
    主要城市：圣辉城、阿卡尼亚（魔法学院城）、北境要塞。

  瓦尔登王国: |-
    华夏东南方向。滨海贸易王国，翡翠海岸上分布多个富裕港口。
    与华夏贸易往来最密切。
    主要城市：翡翠港（首都）、珊瑚湾、风帆城。
    海上有通往未知大陆的航路和海底遗迹群。

  赤角荒原: |-
    华夏南部。干燥的草原和丘陵地带，兽人部落联盟领地。
    靠近华夏边境的部落已开始贸易。深处有古老的兽人圣地——「先祖之骨」。
    危险区域多高阶魔兽出没。

  铁脊山脉: |-
    华夏西部。高耸入云的山脉链，矮人联邦的七座城市隐于其中。
    山脉深处蕴含丰富的源力矿脉和稀有金属矿藏。
    最深处据传有远古巨龙的巢穴。
    主要城市：铁炉城（联邦首都）、矿脉深渊城、锻火堡。

  永翠森林: |-
    华夏西南方向。覆盖面积极广的原始森林。
    精灵族世居之地，外人未经许可不得进入深处。
    森林中源力浓度极高，奇珍异兽和稀有药材资源丰富。
    最深处有精灵古都——「月歌之城」，以及自然之神的大型神殿遗迹。

  暗渊裂谷: |-
    大陆西北边缘。一条巨大的空间裂缝，连接魔界。
    裂谷周围源力扭曲，魔族生物经常从裂缝中涌出。
    高危高回报区域，含有珍稀矿物和魔族遗物。

  风暴海域: |-
    大陆东方辽阔的海洋。常年风暴不断，隐藏着海底文明遗迹和海洋种族。
    传说中有龙神的沉睡之地。

  其他区域: |-
    北方冰原：极寒之地，有冰霜巨人和寒域精灵的传说。
    南方沙漠：炎热荒漠，隐藏着古老的蛇人遗迹。
    东方群岛：海盗据点和海族领地。
    这些区域等待探索。
