魔兽与巨龙:
  魔兽总论: |-
    魔兽遍布大陆，是通过吸收源力自然进化的超凡野兽。
    魔兽根据品种决定实力上限——低等魔兽上限约高级（3级），中等魔兽上限约贤者（7级），高等魔兽上限可达传奇（9级），极稀有上古血脉魔兽可达半神。
    魔兽肉体天生强悍，且拥有符合自身属性的本命魔法：
    - 1~3级：掌握1种本命魔法
    - 4~6级：掌握2种本命魔法
    - 7级以上：掌握3种本命魔法（最多三种）
    本命魔法是魔兽天生的能力，无需学习，随等级提升自然觉醒。
    高阶魔兽拥有智慧，部分可化形为人。
    魔兽核心（魔核）是极重要的修炼资源和炼金材料，经济价值高。

  魔兽品种举例:
    低等魔兽:
      - 灰鬃狼：火属性，群居，1~2级。本命魔法——火焰吐息。
      - 岩甲龟：土属性，防御型，1~3级。本命魔法——岩壳强化。
      - 毒牙蛇：毒属性，潜伏型，1~2级。本命魔法——剧毒喷射。
      - 风刃鹰：风属性，侦察型，2~3级。本命魔法——风刃切割。
    中等魔兽:
      - 炎狮：火属性，独居或小群，4~6级。本命魔法——烈焰冲击、火焰护甲。
      - 霜角鹿：冰属性，温和但领地意识强，3~5级。本命魔法——冰霜领域。
      - 雷翼蝠：雷属性，群居，4~6级。本命魔法——雷电链、超声波干扰。
      - 暗影豹：暗属性，独居，5~7级。本命魔法——暗影隐遁、暗影撕裂。
    高等魔兽:
      - 九尾炎狐：火属性，极具智慧，7~9级。本命魔法——天火焚烧、幻术迷境、涅槃重生。
      - 吞天蟒：毒/土属性，体型巨大，7~9级。本命魔法——地震冲击、剧毒领域、蛇瞳蛊惑。
      - 金翅大鹏：风/雷属性，飞行系最强魔兽，8~9级。本命魔法——雷暴风翼、音速俯冲、天雷呼唤。
    上古血脉魔兽:
      - 麒麟、朱雀、玄武、白虎等华夏神话中的圣兽，实力上限可达半神。极其稀有，百年难遇。

  巨龙详述: |-
    巨龙是大陆最强种族之一，智慧不亚于人类，寿命以千年计。
    巨龙根据成长阶段划分实力等级：
    - 幼龙期（0~50岁）：约初级~高级（1~3级）
    - 少年龙期（50~100岁）：约精英~大师（4~5级）
    - 青年龙期（100~300岁）：约宗师~领域（6~8级）
    - 成年龙期（300岁以上）：自动达到传奇（9级），之后通过修炼继续突破
    巨龙可通过修炼、进食含源力的食物（如高阶魔兽肉、灵果）加速成长。

  巨龙特性: |-
    巨龙不光肉体极其强大（同级近战碾压），还掌握龙语魔法——以龙语施放的特殊魔法体系，威力远超普通魔法。
    巨龙分多种类型，以鳞片颜色区分：火龙（红/橙鳞）、冰龙（白/蓝鳞）、雷龙（紫/金鳞）、暗龙（黑鳞）、光龙（金/白鳞）、混沌龙（多色鳞，极稀有）。
    高阶巨龙可化为人形，在人类社会中行动。化形后实力不减。
    巨龙信仰龙神·奥古玛。

  巨龙社会: |-
    巨龙大多独居，在偏僻山脉或荒岛筑巢。
    巨龙之间有松散的长老议会，由最年长的几头古龙主持，处理与其他种族的重大纠纷。
    巨龙极度看重自己的宝库，侵犯其巢穴等同于宣战。
    部分巨龙与人类或精灵有友好关系，偶尔接受骑士契约。
