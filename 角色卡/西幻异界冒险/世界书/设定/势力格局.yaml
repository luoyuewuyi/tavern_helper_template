势力格局:
  华夏势力:
    华夏联合政府: |-
      穿越后迅速重组的国家管理机构。维持结界内的社会秩序、经济运转和军事防御。
    边境事务管理局: |-
      管理华夏与外界的一切接触。负责出入境管理、缓冲区治安、外交谈判、贸易管控。
      在缓冲区设有多个边防站、交易关口和难民收容点。
    源力科研总院: |-
      华夏最高源力研究机构。全力研发以源力为动力的新型科技装备。已有部分原型设备在缓冲区测试。
    特殊作战司令部: |-
      整合华夏军方与古武/修仙力量的军事机构。
      旗下有「天盾营」（防御型）、「锋矢队」（进攻型）、「幽影组」（侦察暗杀型）等编制。
    武林盟: |-
      华夏古武门派穿越后组建的联盟。协调古武从业者的修炼、对外交流和资源分配。
      盟主由各大门派推选，目前是太乙门掌门——沈长风（古武天人级，65岁，须发花白但面如中年）。
    修仙议会: |-
      华夏修仙宗门组建的松散联合组织。各宗门保持独立性，涉及外界事务时共同协商。
      三大核心宗门：昆虚派、天璇宗、紫霄观。
    华夏冒险者管理局: |-
      华夏政府为管理出境冒险活动设立。负责登记冒险者、发布政府任务、收集情报。
      与大陆冒险者工会有初步合作关系。

  周边主要国家:
    格伦海姆帝国: |-
      华夏北部的人类帝国，大陆军事强国。由皇帝维克多·格伦海姆三世统治。
      拥有精锐骑士团和完善的魔法部队。与华夏最早建立正式外交关系。
      态度：警惕与合作并存。忌惮华夏人口和工业能力，但渴望获取科技知识。
      光辉圣廷总部设在其首都圣辉城，宗教影响力极大。
    瓦尔登王国: |-
      华夏东南方向的人类王国，以贸易和海运著称。
      依托翡翠海岸的多个港口城邦繁荣。商人阶层在王国中话语权极大。
      态度：友好偏商业导向，率先与华夏开展大规模贸易。
    赤角部落联盟: |-
      华夏南部的兽人部落联盟，由数十个兽人部落组成。
      名义领袖为狮人族大酋长巴尔格·碎岩（兽人宗师级，狮头人身，8尺高）。
      兽人崇尚武力，对华夏既好奇又警惕。部分部落有贸易往来，部分保持敌意。
    铁脊矮人联邦: |-
      华夏西部铁脊山脉中的矮人联邦，由七座矮人城市组成。
      联邦议长——杜林·熔核（矮人宗师级，锻造大师，年逾三百）。
      矮人对华夏工业技术极感兴趣，双方在冶金和工程领域有深入交流。
    永翠精灵领地: |-
      华夏西南方向的广袤古老森林，精灵族世居之地。
      由精灵长老议会治理，大议长——艾拉尼丝·星叶（千年精灵，传奇级，外貌如二十余岁少女）。
      精灵对华夏穿越导致的生态破坏极不满，但已勉强接受现实开始对话。
    暗渊领域: |-
      大陆西北边缘，暗渊裂谷周围的危险区域。不是正式国家，而是魔族残留据点和亡灵污染区的统称。
      格伦海姆帝国在此驻扎重兵，联合冒险者工会常年防御。

  世界级势力:
    大陆冒险者工会: |-
      跨国冒险者组织，在大陆主要城市设有分部。
      负责发布冒险委托、审定冒险者等级、调解纠纷。
      冒险者等级从F到S共七级，对应实力从初级到传奇。
      工会会长——「铁壁」季云隆（人类，传奇巅峰，60岁，外貌四十出头）。
    泛大陆魔法师工会: |-
      跨国魔法师组织，管理魔法研究、魔法师认证和魔法物品交易。
      总部设在格伦海姆帝国的魔法学院城——阿卡尼亚。
      工会大法师——「万象」赫伦·维克曼（人类，史诗级魔法师，外貌五十余岁）。
    商人联盟: |-
      跨国商业组织，维护贸易秩序和货币汇兑体系。
      在各国主要贸易城市设有商会分部和金库。
    佣兵工会: |-
      跨国佣兵管理组织，管理佣兵团注册、信誉评估和合同纠纷。

  华夏缓冲区冒险者据点: |-
    华夏冒险者管理局在缓冲区边境城镇「边锋镇」设有最大的冒险者登记和任务发布中心。
    边锋镇是华夏冒险者走向外界的第一站，也是{{user}}冒险故事的起始之地。
    镇上混居着华夏人、外界人类商人、少量精灵和兽人商贩。
    大陆冒险者工会在此设有小型分部，承认华夏冒险者管理局发放的等级证明。

  教廷势力: |-
    光辉圣廷在格伦海姆帝国影响力最大，实质上是国教。
    战争神殿遍布各国，在佣兵和战士群体中影响力极大。
    各教廷势力已在华夏缓冲区设立传教据点，试图向华夏人口传播信仰。
    华夏政府对此保持警惕，在缓冲区设有宗教事务管理办公室。
