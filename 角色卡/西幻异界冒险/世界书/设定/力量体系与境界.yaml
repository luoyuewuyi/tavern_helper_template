力量体系与境界:
  统一等级划分: |-
    本世界所有超凡体系共用以下11个基础等级（后接神级）：
    1. 初级：刚踏入修炼门槛，身体素质略超常人。
    2. 中级：战斗力稳定，可对抗普通野兽和低阶魔兽。
    3. 高级：已是小有实力的修炼者，可独自完成低难度冒险任务。
    4. 精英：战斗经验丰富，在城镇中可担任护卫队长级别。
    5. 大师：实力出众，可担任佣兵团副团长或小型门派长老。
    6. 宗师：一方强者，国家级战力，可镇守要塞或城市。
    7. 贤者：罕见强者，拥有独特领悟，影响一域格局。
    8. 领域：觉醒领域之力，战力质变，可以碾压同级以下。
    9. 传奇：大陆知名的顶尖强者，一人可抵一军。
    10. 史诗：大陆屈指可数的存在，已触摸到超凡极限。
    11. 半神：凡世巅峰，再进一步即可踏入神域。
    神级（非神灵，是实力等级称号）：初级神、中级神、高级神、神王、神皇、神帝。
    成为神灵需要拥有神职，神职是独立于实力的存在。

  战士体系: |-
    以斗气为核心，强化身体、武器和战技。物理职业（剑士、骑士、弓手、刺客等）通用战士修炼体系。
    斗气颜色随等级变化（白→黄→橙→红→紫→蓝→银→金），可外放形成护体斗气罩或附着武器上。

  魔法体系: |-
    以源力构建魔法模型施放术式。分为元素系（火水风土雷冰）、变化系、召唤系、空间系、精神系等。
    魔法师需要消耗精神力控制源力，精神力与源力储量共同决定魔法上限。禁咒级魔法需要7级以上实力。

  神术体系: |-
    虔诚信徒通过信仰获得神赐，成为神术师。神术师的能力受所信仰神灵的神职影响。
    光明之神信徒擅长治愈与净化，战神信徒擅长战斗增幅，自然之神信徒擅长生命操控。
    信仰越虔诚、与神灵联系越紧密，可使用的神术越强。高阶神术师可直接借用神灵的一部分力量。

  古武体系: |-
    华夏传承的古武术，在结界外可吸收源力修炼。11个等级对应：
    1.铜皮 2.铁骨 3.易筋 4.洗髓 5.化劲 6.暗劲 7.罡气 8.先天 9.通神 10.归元 11.天人
    分别对应统一等级的初级到半神。
    古武以锤炼肉身、内力运转和武技为核心，在近身战斗中有独到优势。

  修仙体系: |-
    华夏传承的修仙术，在结界外可吸收源力修炼。
    炼气期分九层，对应统一等级的1~9级（初级~传奇）。
    筑基期对应第10级（史诗），金丹期对应第11级（半神）。
    之后境界与神级一一对应：元婴期→初级神，化神期→中级神，合体期→高级神，大乘期→神王，渡劫期→神皇。
    修仙以丹田内的灵力凝聚为根基，辅以功法、丹药、法宝。修仙者寿命增长最为显著。

  妖族修炼体系: |-
    华夏传说中苏醒的妖族，通过吸收源力修炼妖力。
    妖族修炼以化形为标志性门槛：低阶妖兽保持兽形，中阶可半人半兽，高阶可完全化为人形。
    等级对应修仙体系，但妖族肉体天生强于同级人类修仙者，法术方面略逊。
    妖族天生拥有种族天赋术（如狐妖的幻术、蛇妖的毒术等），修炼到高阶可觉醒血脉天赋。

  鬼族修炼体系: |-
    华夏传说中苏醒的鬼族，以吞噬阴气和灵魂之力修炼。
    鬼族无实体，以魂魄为本，修炼方式特殊：凝魂→铸魄→聚阴→化煞→鬼仙。
    前九级对应统一等级，鬼仙对应第10级。之后需渡阴劫才能继续突破。
    鬼族擅长精神攻击、附身、阴魂术，肉体防御为零但精神防御极强。

  天赋与资源: |-
    - 人类及所有类人种族根据天赋决定修炼速度及实力上限。
    - 天赋是先天决定的，分为：废材、普通、良好、优秀、卓越、天纵之才、绝世天才。
    - 实力成长受天赋、功法品质、修炼资源（丹药、灵石、源力浓度等）、名师指导、机缘奇遇等综合影响。
    - 不允许年纪轻轻就无合理理由达到极高实力。顶级天才在充足资源下，30岁能达到大师级已属罕见。
