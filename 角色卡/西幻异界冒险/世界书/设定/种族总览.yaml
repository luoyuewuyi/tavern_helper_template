种族总览:
  人类: |-
    大陆占比最高的种族，分布最广。天赋差异巨大，资质从废材到天才都有。
    寿命约80~100年（不修炼），修炼后可延长。
    人类以数量和适应力取胜，建立了最多的帝国和王国。

  精灵: |-
    长寿种族，自然寿命500~800年。尖耳、体态修长、容貌俊美。
    天生亲和自然系和光明系源力，魔法天赋高于人类。
    性格偏保守排外，主要信仰自然之神·席尔瓦娜。
    居住在古老森林中，以议会制管理。不善近战但远程魔法和弓术极强。

  兽人: |-
    男性兽人：兽头人身兽尾，体型高大魁梧，身高通常在两米以上。
    肌肉发达、肉体强悍，天生战斗力高但魔法天赋较低。
    常见种类有狮人、虎人、狼人、熊人等，按种族特征各有不同。
    女性兽人：传统猫娘、犬娘、兔娘、狐娘等动物娘特征。
    保留人类女性基本外貌，但拥有对应动物的耳朵和尾巴，部分有轻微的兽化特征（竖瞳、犬齿等）。
    女性兽人外貌接近人类，但身体素质远超人类女性。
    兽人寿命约150~200年。以部落制生活，重视武力和血脉。

  飞禽类兽人: |-
    飞禽兽人男女外貌差异不大，男女都极为俊美/美丽。
    背生羽翼，可展翼飞行。羽翼颜色因种族而异（鹰翼灰白、凤系赤金、夜枭系暗紫等）。
    天生亲和风属性源力，擅长空战和侦察。
    寿命约200~300年。社会结构介于部落与城邦之间，居所多建于高山或悬崖。

  矮人: |-
    身材矮壮，男性普遍蓄长须。寿命约300~400年。
    天生亲和大地与火焰属性源力，锻造和工艺天赋冠绝各族。
    性格固执守信，重视契约和工艺传承。居于山脉内部的地下城市。
    矮人锻造的武器防具品质远超其他种族同级产品。

  巨龙: |-
    大陆最强种族之一。成年巨龙自动达到传奇（9级），掌握龙语魔法，可化人形。
    寿命以千年计，信仰龙神·奥古玛。详见「魔兽与巨龙」条目。

  魔兽: |-
    遍布大陆的超凡野兽，品种决定实力上限，拥有1~3种本命魔法。
    魔核是重要修炼资源。详见「魔兽与巨龙」条目。

  魔族: |-
    主要居于魔界，但主位面也有魔族活动的据点。
    王族特征：头长双角（角的大小和形态各异），背生双翼（翅膀可以收回体内）。
    越接近人类外貌者，血脉越纯正、地位越高贵。低等魔族则有更多非人特征。
    魅魔为魔族分支，外貌极为美丽，天生掌握魅惑术。
    魔族寿命与实力等级挂钩，高阶魔族可活数千年。

  天使族: |-
    光明之神的附属种族，诞生于神界。
    背生光翼（通常为白色或金色），面容圣洁，光系源力天赋极高。
    偶尔受光明之神派遣降临主位面执行神谕，日常不会在主位面活动。
    天使族严格遵循光明之神的教义，性格偏正直但有些刻板。

  亡灵种族: |-
    冥界的主要种族，由死亡后的灵魂和尸体演化而来。
    包括：骷髅兵、幽灵、亡灵骑士、食尸鬼、巫妖、死灵龙等。
    主位面的亡灵通常由死灵法师制造或裂隙泄漏产生，是大多数文明的公敌。
