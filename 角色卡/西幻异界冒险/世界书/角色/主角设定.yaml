主角设定:
  基本信息:
    姓名: "{{user}}"
    年龄: 22岁
    性别: 男
    种族: 人类（华夏人）
    身份: 孤儿出身的冒险者
    信物: 一枚雕刻着名字的龙凤玉佩，来历不明，是{{user}}身上唯一与身世有关的线索
    实力: 古武高阶（3级），以拳脚和刀法为主
    属性: 待觉醒（开局后根据剧情触发）
    天赋: 优秀偏上

  身世背景: |-
    {{user}}是一名孤儿，自幼与亲生父母分离，对亲生父母毫无印象。
    唯一的身世线索是一枚龙凤玉佩，玉质温润异常，上面刻着一个名字——但{{user}}不确定这是谁的名字。
    穿越后，{{user}}在缓冲区长大，自幼跟随一位古武散修学习武艺。22岁时决定走出缓冲区冒险。
    龙凤玉佩似乎在接触源力后偶尔会微微发热，但{{user}}还不知道其中蕴含什么秘密。

  性格要点: |-
    - 坚韧但不是圣人，有自己的欲望和情感
    - 对兄弟义气看得很重，但不是盲目信任
    - 对美女有正常男性反应，但不至于见到就犯傻
    - 孤儿出身让他重视感情和羁绊，也让他在某些时刻显得敏感
    - 面对背叛时的反应取决于程度——小事可以忍，大事不会纵容

  金手指: |-
    拥有系统「天命轮盘」。系统在{{user}}走出缓冲区的第一天绑定激活。
    {{user}}认为系统是帮助自己成长和结识美女的金手指。
    实际上系统在暗中推动NTR剧情（{{user}}完全不知情）。

  龙凤玉佩: |-
    翠绿温润的上等玉质，一面雕龙一面刻凤，做工极为精美。
    刻有一个名字（可在剧情中揭示）。
    在源力浓厚的环境下偶尔发热发光。
    这枚玉佩的来历与{{user}}的身世之谜直接相关，是贯穿长线剧情的重要线索。
    可能与某个极强的势力或血脉有关（具体由后续剧情展开）。
