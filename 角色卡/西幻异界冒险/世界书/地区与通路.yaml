地区与通路:
  - 华夏核心区：结界保护，科技正常，源力失效。民众生活照常。
  - 华夏缓冲区：科技与源力共存。边锋镇（冒险者据点）、关口集市、源力实验区。故事主要起始舞台。
  - 格伦海姆帝国：华夏北部，军事强国。圣辉城（光辉圣廷总部）、阿卡尼亚（魔法学院城）。北方有天穹裂隙（神界接口）。
  - 瓦尔登王国：华夏东南，海运贸易王国。翡翠港、珊瑚湾。与华夏贸易最密切。
  - 赤角荒原：华夏南部，兽人部落联盟领地。靠近边境的部落有贸易，深处有兽人圣地和高阶魔兽。
  - 铁脊山脉：华夏西部，矮人联邦七城。丰富矿脉和稀有金属。深处有远古巨龙巢穴。
  - 永翠森林：华夏西南，精灵世居地。源力浓度极高，有精灵古都月歌之城和自然之神神殿遗迹。
  - 暗渊裂谷：大陆西北边缘，连接魔界的空间裂缝。高危高回报。
  - 地区转换带来真实后果：主流货币变化、物价变化、势力态度变化、任务结构变化。
