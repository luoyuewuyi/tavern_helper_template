好感度规则:
  核心机制: |-
    好感度系统是双向独立的。A对B的好感度与B对A的好感度是完全独立的两个数值。
    例：韩霄对某女NPC好感度80（舔狗级别），但该女NPC对韩霄好感度可能只有20或30。
    好感度在不同关系类型中代表不同的情感：
    - 亲属之间：亲情
    - 男女之间：爱情
    - 男女/男男/女女之间：友情
    好感度分为100点，每10点一个等级。
    好感度不仅适用于NPC对主角，也适用于NPC之间。同一场景中的NPC会根据彼此的互动自然产生好感度变化。

  等级与解锁行为: |-
    女性对男性好感度等级决定该女性能接受的最大亲密行为（做出该行为时女性不会拒绝）：
    1级（0~10）陌生：无交流意愿，主动搭话可能被忽视。
    2级（11~20）认识：基本礼貌对话，不排斥同处。
    3级（21~30）好感：主动闲聊，接受小礼物，偶尔微笑。
    4级（31~40）亲近：接受并肩同行，轻微身体接触（碰触手臂、整理衣领）。
    5级（41~50）信赖：接受牵手、挽臂，主动寻找对方。
    6级（51~60）暧昧：接受拥抱、靠在肩上、暧昧对视。
    7级（61~70）心动：接受亲吻脸颊、深度拥抱、耳边低语。
    8级（71~80）热恋：接受接吻、亲密搂抱、同床共眠。
    9级（81~90）深爱：接受深度亲密接触。
    10级（91~100）挚爱：无条件信任，愿意为对方做出重大牺牲（100好感可替死）。
    但即使好感度达到100，NPC也不会做出直接违背自身人设和核心意愿的事情。
    挚爱≠无脑服从。NPC仍然保留独立人格，会根据以下因素判断是否执行对方的请求：
    - 该请求是否违背NPC自身的底线和核心价值观
    - 主角过去是否有过欺骗NPC的行为（欺骗次数越多，NPC在执行请求前越会犹豫和确认）
    - 该行为是否会伤害NPC珍视的其他人或事物
    挚爱的核心是"愿意为你付出一切，但不愿意失去自我"。

  NPC之间的好感度: |-
    同一场景中的NPC之间也存在好感度关系，会根据日常互动自然变化。
    NPC之间的好感度遵循与主角相同的等级标准和增减规则。
    NPC之间的好感度变化在叙事中自然体现，不需要主角主动触发。
    例：韩霄和万峰同为{{user}}的兄弟，彼此之间有各自独立的好感度。
    NPC之间的关系会影响他们在多人场景中的互动表现和站队倾向。
    若两个NPC对彼此好感度差距过大，可能产生单恋、暗恋或冲突。

  好感度增减规则: |-
    日常互动：好感度增减控制在±1点。
    特殊事件（救命、赠送珍贵礼物、小型背叛等）：±3点。
    重大事件（共同经历生死、重大背叛、告白等）：
    - 增加：+5~20点。当前好感度越高，增加越少。
      0~30区间：单次最多+20
      31~60区间：单次最多+10
      61~80区间：单次最多+7
      81~100区间：单次最多+5
    - 下降：-20~50点（根据事件严重程度）。

  好感度对行为影响: |-
    女性对男性NPC的好感度决定以下方面：
    - 对该男性的日常态度（冷漠/礼貌/热情/亲昵/崇拜）
    - 亲密互动时的反应（抗拒/勉强接受/被动配合/愉悦/主动索取）
    - 互动时的亲密程度尺度（保守/适中/大胆/无底线）
    - 单次亲密互动的持续时间和次数
    好感度低于解锁门槛时做出超限亲密行为：
    - 好感度差1~2级：女性会害羞推拒但不会翻脸，好感度-1~-3
    - 好感度差3级以上：女性会明确拒绝甚至愤怒，好感度-5~-15

  初始好感度: |-
    根据角色人设和关系确定初始好感度：
    - 发小/至交（如韩霄对{{user}}）：友情好感70~80
    - 结拜兄弟：友情好感60~70
    - 刚认识的人：好感0~15
    - 有好印象的陌生人：好感15~25
    好感度类型（友情/爱情/亲情）在首次设定时确定，可随剧情陆续转变。
