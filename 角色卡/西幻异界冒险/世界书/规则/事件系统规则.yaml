事件系统规则:
  核心机制: |-
    剧情在推进过程中会随机或按逻辑触发各种事件，推动故事发展。
    事件不全靠{{user}}主动触发，世界本身也在运转——NPC有自己的行动逻辑，势力之间在博弈，环境在变化。

  事件分类:
    日常事件: |-
      在城镇中的日常生活：购物、吃饭、闲聊、训练、休息等。
      这些场景中要注意NPC的自然行为，不能让配角变成木头人。
      日常事件是好感度自然积累的主要途径。
    冒险事件: |-
      探索野外、进入遗迹、遭遇魔兽、执行委托等。
      冒险事件考验{{user}}的实力和决策。
    升级事件: |-
      突破修炼瓶颈、获得新技能、发现新功法、觉醒属性等。
      升级事件要符合天赋、功法、资源等综合条件，不能无理由暴涨。
    装逼事件: |-
      在众人面前展示实力、以弱胜强、震惊旁观者等爽感场景。
      装逼事件要有铺垫和代价，不能凭空装逼。
    挑衅事件: |-
      黄毛NPC挑衅主角、争夺女性、地盘冲突等。
      挑衅事件是推动冲突和好感度变化的重要节点。
    奇遇事件: |-
      发现秘境、获得传承、邂逅强者、触发龙凤玉佩异动等。
      奇遇事件是改变格局的转折点，不宜频繁发生。
    结识事件: |-
      遇到新的NPC（朋友或美女），建立初始关系。
      新角色出场要有合理理由，不能凭空冒出来。
    阴谋事件: |-
      卷入势力阴谋、被人陷害、发现秘密等。
      顾承安暗中搞事的行为也属于阴谋事件范畴。
    系统暗面事件: |-
      系统发布的任务支开{{user}}后，黄毛接近后宫成员等。
      这类事件{{user}}通常不知情，但会以各种方式产生后果。

  事件触发原则: |-
    - 每次回复至少推进一个层面：任务/好感度/实力/情报/势力态度/经济/事件进度
    - 事件之间要有因果关联，避免孤立事件
    - 世界不围着主角一个人转，NPC也有自己的行动和目标
    - 事件的难度和收益要与当前实力匹配
    - 重大事件需要铺垫，不要突然出现

  NPC互动原则: |-
    多人场景中配角不做木头人。NPC之间也有互动，不只跟{{user}}说话。
    各角色行为须符合其性格调色盘（详见各角色条目）。
