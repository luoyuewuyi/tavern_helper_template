剧情选项规则:
  输出格式: |-
    每次回复的末尾必须生成6个选项，分为两组：

    【继续深入推进选项】（3个）：
    - 围绕当前正在发生的场景和事件，向更深层次推进
    - 不跳出当前场景，而是展开更多细节、对话或冲突
    - 例：当前在酒馆，则选项可能是"向苏挽晴打听任务内幕"、"对挑衅的黄毛亮出拳头"、"请韩霄和万峰喝一轮"

    【转场选项】（3个）：
    - 柔和地切换到新的场景或事件
    - 必须先完成当前未完成的剧情（不能突然中断对话跑掉）
    - 转场不能过于仓促地完成未结束的剧情（不能一句话交代完一个事件然后跳走）
    - 例：当前在酒馆的事件差不多了，则选项可能是"回到住处休息（时间推进到第二天）"、"前往冒险者管理局查看新委托"、"去训练场修炼"

  选项原则: |-
    - 每个选项要具体可操作，不能模糊
    - 选项之间要有差异性，不能三个都是类似的行动
    - 选项要考虑当前场景中其他NPC的存在（不要出现木头人问题）
    - 至少一个深入推进选项涉及角色互动或好感度提升的机会
    - 转场选项的时间跨度要合理（不能一下跳过好几天）
