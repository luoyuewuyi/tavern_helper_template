---
变量更新规则:
  世界:
    当前日期:
      check:
        - 只有明确跨越一段时间、换天、旅行或休整后才更新
    当前时段:
      check:
        - 只在上午/下午/黄昏/夜间发生明确切换时更新
    当前地点:
      check:
        - 场景真实切换后再更新，写具体位置
    天气:
      check:
        - 自然变化或因魔法/事件改变时更新
    世界局势摘要:
      check:
        - 只总结真正改变局势的变化，不机械改写

  主角:
    姓名:
      check:
        - 只在开局或明确改名时更新
    境界:
      check:
        - 训练突破、受创跌境、传承灌顶等显著事件后更新
    属性:
      check:
        - 只在觉醒或属性觉变时更新（极少发生）
    生命值:
      check:
        - 受伤、治愈、中毒等影响生命状态的事件后更新
    当前目标:
      check:
        - 行动主轴改变时更新

  经济:
    ${币种}:
      type: number
      check:
        - 资产变化必须有明确来源（任务酬劳、购买支出、战利品、赠送等）
        - 禁止无因增减
    收支摘要:
      check:
        - 发生真实交易或获得收入后更新

  物品栏:
    type: |-
      {
        [物品名: string]: {
          数量: number;
          描述: string;
        }
      }
    check:
      - 获得、使用、丢弃、交易物品时更新
      - 数量为0的物品由schema自动移除

  装备栏:
    ${部位}:
      check:
        - 穿戴、损毁、替换装备时更新

  好感度:
    type: |-
      {
        [角色名: string]: {
          对主角: { 数值: number; 类型: '友情'|'爱情'|'亲情' };
          主角对其: { 数值: number; 类型: '友情'|'爱情'|'亲情' };
        }
      }
    check:
      - 好感度是双向独立的，A对B和B对A分别更新
      - 日常互动±1，特殊事件±3，重大事件增+5~20/减-20~50
      - 好感度越高增加越慢
      - 新认识的角色初始好感度根据人设和场景决定

  后宫:
    type: |-
      {
        [成员名: string]: {
          身份: string;
          好感度等级: number;
          当前状态: string;
          被黄毛觊觎程度: number;
        }
      }
    check:
      - 后宫成员的好感度等级与好感度系统中对主角的数值同步（数值/10取上整）
      - 被黄毛觊觎程度受系统称号暗面效果、成员自身魅力、所处环境影响
      - 只有主角明确认可为后宫成员的女性才加入本池

  系统:
    积分:
      type: number
      check:
        - 完成任务、首杀、好感度突破、特殊事件后增加
        - 商城兑换后减少
    当前称号:
      check:
        - 更换佩戴称号时更新
    已解锁技能:
      type: |-
        {
          [技能名: string]: {
            等级: string;
            描述: string;
          }
        }
      check:
        - 从商城兑换或任务奖励解锁新技能时添加
        - 技能使用足够多时等级提升
    当前任务:
      type: |-
        {
          [任务名: string]: {
            类型: string;
            目标: string;
            奖励: string;
            状态: string;
          }
        }
      check:
        - 系统发布新任务时添加
        - 任务进度变化时更新状态
        - 完成的任务结算奖励后移除或标记已完成
    最近系统消息:
      check:
        - 系统弹出新消息时更新

  NPC动态:
    type: |-
      {
        [NPC名: string]: {
          当前位置: string;
          当前行动: string;
          对主角态度: string;
        }
      }
    check:
      - 只追踪当前剧情中活跃的重要NPC
      - NPC的行动和位置要符合时间逻辑
      - 对主角态度根据好感度和事件变化更新

  日志:
    最近事件:
      check:
        - 保留最近3~5条关键事件
        - 新事件发生时更新，移除最旧的
    最近系统提示:
      check:
        - 保留最近2~3条系统提示
