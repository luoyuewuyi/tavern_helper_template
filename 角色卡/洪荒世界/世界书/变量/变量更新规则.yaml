---
变量更新规则:
  世界:
    当前纪元:
      check:
        - 只能在开局选择、重大节点完成或长时间跨越后更新。
        - 更新纪元时，当前年代、历史节点、节点进度、灵气浓度、天道强度、人道秩序、科技秩序要同步调整。
    当前年代:
      check:
        - 保持简短，写明大时代与局部年代；不要用长段世界观替代。
    当前时间:
      check:
        - 日常行动按时辰、日、月推进；闭关、远行、战争和王朝更替可跨更长时间。
    当前地点:
      check:
        - 旅行、传送、闭关出关、进入秘境或现代城市转场后更新。
    历史节点:
      check:
        - 记录当前阶段最重要的大势节点，如龙汉争端、巫妖摩擦、封神杀劫、末法隐修、现代复苏。
    节点进度:
      type: number
      range: 0~100
      check:
        - 每次只按剧情实际推进小幅变化；普通日常0~3，关键事件4~10，节点结算才可大幅推进。
        - 达到80以上时先演出征兆、秩序松动、人物预感和局部冲突；达到95以上才允许进入更替。
    天道强度、灵气浓度、劫气、人道秩序、科技秩序、大势偏移:
      type: number
      check:
        - 只在时代变化、重大行为、功德业力事件、灵脉兴衰、科技/王朝制度变化时更新。
        - 大势偏移代表{{user}}对既定洪荒脉络的影响，范围-100~100，普通行动不要轻易超过±5。
    近期征兆:
      type: |-
        {
          [征兆名: string]: string;
        }
      check:
        - 用于记录节点转向前的渐变现象；过期或被解决后移除。
    活跃事件:
      type: |-
        {
          [事件名: string]: string;
        }
      check:
        - 只保留正在影响当前剧情的事件，完成、过期或不再影响当前剧情后移除。

  主角:
    姓名、性别、年龄、自定义背景、自定义开局:
      check:
        - 开局界面提交后写入；用户后续明确修改时才更新。
    当前位置、身份、阵营:
      check:
        - 由剧情中的地点、公开身份、加入或背离势力决定。
    状态:
      type: |-
        {
          [状态名: string]: string;
        }
      check:
        - 记录伤势、祝福、诅咒、闭关、通缉、因果标记等真实影响。
    关系:
      type: |-
        {
          [对象名: string]: {
            立场: string;
            亲近: number;
            因果: string;
          }
        }
      check:
        - 仅当对象知晓或受{{user}}行动影响时更新亲近，单次普通接触不超过±8。
        - 因果写具体事由，如救命、夺宝、师承、盟约、血仇。

  修炼:
    大阶段、境界、小境:
      check:
        - 只在突破成功、转修体系或开局设定明确时更新。
    修为、境界进度:
      type: number
      check:
        - 修炼、战斗领悟、服丹、得传承、闭关后增长；受伤、废功、心魔反噬时下降。
        - 境界进度超过90不等于自动突破，必须检查突破条件。
    根基、悟性、肉身、神魂、灵力:
      type: number
      check:
        - 根基和悟性变化应稀少；肉身、神魂、灵力按功法和事件具体调整。
    功德、业力、气运、心魔:
      type: number
      check:
        - 功德来自护生、立教、补天、救世、守诺；业力来自滥杀、毁约、夺因果、破坏大势。
        - 气运影响奇遇、贵人、劫数；心魔影响突破失败率和叙事幻象。
    突破条件:
      type: |-
        {
          修为达标: boolean;
          根基达标: boolean;
          悟道契机: boolean;
          资源齐备: boolean;
          劫数已过: boolean;
        }
      check:
        - 每次尝试突破前逐项判断，不满足时给出具体缺口。
        - 突破成功后重置为下一境界的新条件。
    瓶颈:
      check:
        - 写明当前卡点，不能只写“有瓶颈”。

  功法:
    主修、运转状态:
      check:
        - 战斗、闭关、转修或明确切换功法时更新；主修决定剧情中的修炼方式和战斗风格。
    功法库:
      type: |-
        {
          [功法名: string]: {
            品阶: string;
            熟练度: number;
            当前装备: boolean;
            效果: string;
            代价: string;
          }
        }
      check:
        - 得到、修习、遗忘、转修功法时更新；装备主修时最多一个当前装备为true。
        - 熟练度影响可用招式、修炼速度、反噬风险和突破条件。

  装备:
    ${兵器|防具|法宝|坐骑|洞府|随身世界}:
      type: |-
        {
          名称: string;
          品阶: string;
          状态: string;
          效果: string;
        }
      check:
        - 装备、更换、祭炼、损坏、失去或封印时更新。
        - 装备效果必须在剧情中造成可见影响，如避劫、攻伐、防御、赶路、藏身、储物。

  资源:
    灵石、功德点、气运碎片:
      type: number
      check:
        - 获取和消耗都要有来源；交易、修炼、炼器、占卜、避劫时扣除。
    丹药、材料、背包:
      type: |-
        {
          [物品名: string]: number | { 数量: number; 描述: string };
        }
      check:
        - 数量归零后移除；新增物品要写清品阶、用途或限制。
