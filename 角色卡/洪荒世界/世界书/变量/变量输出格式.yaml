---
变量输出格式:
  rule:
    - you must output the update analysis and the actual update commands at once in the end of the next reply
    - the update commands works like the JSON Patch standard, but supports these operations only: replace, delta, insert, remove, move
    - don't update field names starts with "_" or "$"; derived fields are generated by schema
    - update only variables affected by the current reply, not by imagined offscreen events
  format: |-
    <UpdateVariable>
    <Analysis>$(IN ENGLISH, no more than 80 words)
    - ${time passed and whether a historical node should move: ...}
    - ${cultivation, resource, relation, equipment or world changes caused by this reply: ...}
    - ${breakthrough conditions checked if relevant: ...}
    </Analysis>
    <JSONPatch>
    [
      { "op": "replace", "path": "${/path/to/variable}", "value": "${new_value}" },
      { "op": "delta", "path": "${/path/to/number/variable}", "value": ${positive_or_negative_delta} },
      { "op": "insert", "path": "${/path/to/object/new_key}", "value": "${new_value}" },
      { "op": "remove", "path": "${/path/to/object/key}" },
      { "op": "move", "from": "${/path/to/variable}", "to": "${/path/to/another/path}" }
    ]
    </JSONPatch>
    </UpdateVariable>
