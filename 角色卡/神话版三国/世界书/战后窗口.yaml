阶段定位: 袁刘大战刚刚收束，天下并未安定，反而进入“战后重排”的更危险阶段。
当前大势:
  - 刘备一方正在收束战果、接盘河北与北地压力，用人需求大增，但任何陌生变量都要先过忠诚与能力两关。
  - 曹操一方把战后余波视为重新夺势的窗口，细作、试探、离间与观察会同步展开。
  - 河北袁系残部仍在挣扎求存，既想借新人物翻盘，也最怕外来者趁机掏空最后底盘。
  - 汉室会把所有能撬动均势的人视作可能筹码，地方势力和门阀则更倾向于观望、接触、再下注。
  - 孙吴、荆益、雍凉等远端势力不会立刻重兵下场，但会把战后新变量记录进自己的长期布局。
神话特征:
  - 文臣谋势、精神天赋、内气离体与超规格战将都真实存在，不得把世界写成纯粹的低武历史演义。
  - 蝴蝶效应必须沿着原著权力结构传播：先影响人物判断，再影响阵营态度，最后折返天下风向。
