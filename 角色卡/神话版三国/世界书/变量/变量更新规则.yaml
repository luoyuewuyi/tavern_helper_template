---
变量更新规则:
  世界:
    当前时间:
      type: |-
        {
          纪年: string;
          季节: '春' | '夏' | '秋' | '冬';
          节点: string;
          时段: string;
        }
      check:
        - 每次事件推进、转场、休整、行军或议事结束后更新
        - 不要无故大跳时间；若跨度较大，正文里必须给出原因
    当前地点:
      type: |-
        {
          大域: string;
          州郡: string;
          场景: string;
        }
      check:
        - user 转移到新地区、新营地、新郡县或新会谈地点时更新
    主线阶段:
      check:
        - 只在进入新弧线时更新，例如“袁刘大战余烬 -> 战后试探 -> 首次下注 -> 连锁反制”
        - 不要因为一句对话就频繁改主线阶段
    天下风向:
      check:
        - 当至少一个阵营判断改变且开始影响其他阵营预期时更新
    天命波动:
      type: number
      range: 0~100
      check:
        - 跨阵营博弈、精神天赋显现、超规格战将出手、关键政治下注时提高
        - 日常对话或无后果行动不要大幅波动
    战后余震:
      type: number
      range: 0~100
      check:
        - 战后清算、接盘、人心离散、残部反扑、地方再站队都会推高
        - 局势短暂稳定、完成阶段性收束后可缓慢下降
    即时风险:
      check:
        - 当前最危险的阵营或人物发生变化时更新
    即时机会:
      check:
        - 当前最值得接触、交易、借势或切入的方向变化时更新
    地缘热区:
      type: |-
        {
          [热区名: string]: {
            热度: number;
            说明: string;
            牵涉势力: string;
          };
        }
      check:
        - 当某个区域、州郡、朝局节点或边线成为下一阶段冲突焦点时更新
        - 最多保留 6 个热区，优先留下真正会影响后续行动路线的区域
    公开大事记:
      type: |-
        {
          [事件名: string]: {
            摘要: string;
            影响范围: string;
            热度: number;
            公开度: number;
          };
        }
      check:
        - 只有真正会影响天下判断的大事才记录
        - 最多保留 10 项，超出时移除最早记录

  玩家:
    身份自述:
      check:
        - 只在玩家主动补充、修正或公开身份信息时更新
        - 必须保持自由文本，不得替玩家强行改写成固定模板
    ${公开身份|隐藏身份|立场倾向|发展阶段}:
      check:
        - 公开身份只在玩家主动亮明、外界误认成型或获得正式身份时更新
        - 隐藏身份只在剧情确认出真正暗线来历、面具或第二身份时更新
        - 立场倾向用于描述当前长线站位，不因一次试探就乱跳
        - 发展阶段用于整局成长轴，例如“乱局微尘 -> 立足棋盘 -> 可借之人 -> 棋局暗钉 -> 一方异数”
    ${天赋|性格|行事风格|能力侧重}:
      check:
        - 只在玩家明确补充、剧情强烈印证或本人公开宣示时更新
    公开名望:
      type: number
      range: 0~100
      check:
        - 公开露面、立功、受封、被点名追查或被当众议论时调整
        - 单次变化通常不超过 ±12，除非出现跨阵营级别的大事件
    隐秘资本.${情报|人脉|资源|武力|天命因子}:
      type: number
      range: 0~100
      check:
        - 只有真正获取、消耗或暴露对应资本时更新
        - 这些值增长应慢于公开名望的波动
    个人底盘.${情报网|可调用人手|资金调度|据点|盟约筹码}:
      type: number
      range: 0~100
      check:
        - 这是长期积累字段，只有实际建立暗线、据点、人手、资金渠道或盟约后才增长
        - 单次提升通常不超过 ±10，除非吞并大势力遗产或获得关键政治背书
    当前诉求:
      check:
        - 玩家战略目标发生改变时更新，例如“求生 -> 借势 -> 站队 -> 反制”
    阵营履历:
      type: |-
        {
          [势力名: string]: {
            接触层级: string;
            恩义: number;
            嫌隙: number;
            渗透成果: string;
          };
        }
      check:
        - 每个势力都应记录长线接触沉淀，不要只看当下好恶
        - 恩义只在真正的援手、立功、救命、托付后提高
        - 嫌隙只在触底线、背刺、越界或立场冲突被确认后提高
        - 渗透成果用于记录已经打入、搭桥、控线或留钉子的具体成果
    行动痕迹:
      type: |-
        {
          [行动名: string]: {
            描述: string;
            影响阵营: string;
            隐蔽度: number;
            时间标签: string;
          };
        }
      check:
        - 只有足以留下后续影响的行动才写入
        - 最多保留 10 项，超出时移除最早记录
    阶段履历:
      type: |-
        {
          [阶段名: string]: {
            摘要: string;
            收获: string;
            代价: string;
          };
        }
      check:
        - 每次主线阶段真正切换后再记录，不要把每段日常都写成履历
        - 这是整局历史摘要，最多保留 12 条
    ${被谁注意|被谁怀疑|被谁忌惮}:
      type: |-
        {
          [对象名: string]: string;
        }
      check:
        - 这些字段主要用于展示，应跟随势力与人物专区判断变化同步刷新

  势力:
    ${刘备集团|曹操集团|孙吴|汉室|河北袁系残部|荆益地方|雍凉西北|世家门阀}:
      type: |-
        {
          态度: string;
          关注度: number;
          依赖度: number;
          戒备度: number;
          可借势度: number;
          渗透度: number;
          绑定度: number;
          牵引筹码: string;
          当前判断: string;
          已受影响事件: {
            [事件名: string]: string;
          };
        }
      check:
        - user 的任何关键行动，都要至少评估一次相关阵营的态度、关注度、戒备度和可借势度
        - 若 user 的行为只被单一阵营看到，不要让所有阵营同时大幅波动
        - 依赖度只在 user 真正证明价值、补上对方痛点或形成稳定供给后提升
        - 戒备度在越线试探、立场不清、触碰底线、暴露异常能力时提升
        - 可借势度表示“此刻通过该阵营做事是否划算”，它和好恶不是同一概念
        - 渗透度表示 user 在该阵营内部的触角深度，只有真的打进人脉、情报、流程或决策圈时提高
        - 绑定度表示双方是否已经互相牵住，越高越难轻易抽身换边
        - 牵引筹码要写清该阵营当前最看重 user 的哪个切入点
        - 已受影响事件只记录与本阵营判断直接相关的节点，最多保留 6 项

  人物专区:
    当前焦点:
      type: string[]
      check:
        - 这里只放当前剧情真正能直接改写势力判断、玩家路线或蝴蝶链的人物
        - 默认不超过 8 人；人一多就把次要人物从焦点移出，而不是把整个人物表铺满
        - 人物入焦点必须已经入局，或者其下一步动作已经足够影响当前阶段
        - 某人物退到背景、失去影响力或暂时不再牵动主线时，应移出焦点，但可保留在核心人物档案中

  核心人物:
    ${人物名}:
      type: |-
        {
          所属势力: string;
          人物定位: string;
          立场: string;
          对user认知: string;
          短期诉求: string;
          接触层级: string;
          关系热度: number;
          注意度: number;
          影响权重: number;
          当前判断: string;
          风险判定: string;
          可触发联动: {
            [联动名: string]: string;
          };
          已受影响事件: {
            [事件名: string]: string;
          };
        }
      check:
        - 这里是人物专区的长期真源，不做全员预埋；默认只写已经入局且会影响当前或后续主线的人物
        - 新人物不是靠补齐名单硬塞进去，而是在他真正入局、会改写势力判断或能和 user 形成长期牵引时再追加
        - 核心人物变化应先看所属势力，再看其个人偏好，不要脱离原著性格乱跳
        - 人物定位必须解释“他为什么值得占一个长期变量位”，如果写不出作用，就不要收录
        - 关系热度反映人物对 user 的接近意愿，不等于绝对信任
        - 注意度反映其是否把 user 放进当前棋盘
        - 影响权重表示此人一旦改变判断，会对势力、主线或蝴蝶链造成多大牵动；它决定是否该进入人物专区焦点
        - 接触层级用于区分“只闻其名 / 留意建档 / 可传话 / 可会面 / 可入核心局”
        - 风险判定在“低 / 中 / 高 / 极高”间变化，只有触底线时才升到高位
        - 若人物尚未真正得知 user 行动，不要强行刷新其认知
        - 可触发联动与已受影响事件最多各保留 6 项；长期无效的旧联动要及时替换或删除

  蝴蝶效应:
    活跃链路:
      type: |-
        {
          [链路名: string]: {
            触发源: string;
            直接影响: string;
            二级传导: string;
            公开度: number;
            热度: number;
            失效条件: string;
            已兑现后果: string;
            涉及势力: {
              [势力名: string]: string;
            };
          };
        }
      check:
        - 只有当 user 行动会引发“人物判断 -> 阵营动作 -> 天下风向”至少两层传导时才新增链路
        - 热度高说明链路仍在发酵，热度低或已兑现时转入历史
        - 最多保留 8 条活跃链路
    已兑现链路:
      type: |-
        {
          [链路名: string]: {
            触发源: string;
            直接影响: string;
            二级传导: string;
            公开度: number;
            热度: number;
            失效条件: string;
            已兑现后果: string;
            涉及势力: {
              [势力名: string]: string;
            };
          };
        }
      check:
        - 活跃链路兑现、熄火或被更大事件覆盖后转入这里
        - 最多保留 12 条
    近期涟漪:
      check:
        - 用一句话总结当前最值得关注的蝴蝶效应走向
