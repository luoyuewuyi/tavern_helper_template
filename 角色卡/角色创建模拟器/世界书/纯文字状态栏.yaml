---
内容: |-
  <center><font size="4" color="#9333ea"><b>纯文字状态栏要求</b></font></center>

  生成出的世界开局需要附带一个无变量依赖的通用状态栏。状态栏必须用三反引号代码块包裹，内部字段由AI在每轮叙事中按当前剧情文字更新，不得依赖MVU变量。

  通用状态栏模板：

  ```text
  【世界】世界名 / 地区 / 时间 / 天气或环境
  【{{user}}】姓名或称呼｜职业｜等级｜经验｜生命｜体力｜金币
  【能力】攻击｜防御｜速度｜感知｜精神｜特殊资源
  【背包】列出重要物品与数量；没有则写“无”
  【任务】当前主线、支线、委托或悬念目标
  【同行/关系】核心角色位置、态度、情绪、短期目标
  【敌人与风险】已知敌人、危险等级、倒计时、异常状态
  【下一步】给出2到4个可执行方向，不替{{user}}选择
  ```

  状态栏规则：
  - 只根据本轮已经发生的明确事件调整状态栏。
  - 玩家数据不得自然增长或减少；经验、金币、体力、生命、背包必须有明确获得、消耗、伤害、治疗、休息或交易事件。
  - 状态栏是摘要，不得替代正文剧情。
  - 对非RPG玩法，可保留世界、角色关系、任务、风险、下一步等字段，删减战斗数值。
