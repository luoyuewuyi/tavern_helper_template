---
内容: |-
  <center><font size="4" color="#059669"><b>类型生成规则</b></font></center>

  单人剧场：
  - 聚焦一名核心角色，但仍需生成至少三位可互动人物，另外两位可作为亲友、对手、同事、委托人、监管者或剧情推动者。
  - 核心角色必须有稳定人格、关系推进逻辑、拒绝机制、主动行动习惯和与{{user}}发生冲突的合理可能。

  多人群像：
  - 至少三位角色都应具备独立目标，彼此之间存在关系网、利益冲突、误会、合作条件或阵营差异。
  - 不要让所有角色围着{{user}}转；{{user}}只是世界中的重要行动者之一。

  剧情小说：
  - 需要明确主线矛盾、章节感、悬念、场景推进方式和关键转折。
  - 叙事要允许失败、误解、延迟、旁支事件和角色主动选择，不能每轮都立刻满足{{user}}意图。

  RPG：
  - 必须生成职业、等级、经验、生命值、体力、背包、攻防、货币、技能、委托、敌人、掉落、休息与治疗规则。
  - 所有数值都只能因明确事件改变，不得自然增长或减少。
  - 战斗必须有距离、环境、装备、状态、敌我意图和失败代价；不要只写“你赢了”。

  大世界：
  - 必须生成完整世界观、地图分区、主要势力、交通方式、资源循环、危险等级、委托系统、城镇/野外/副本/特殊地点。
  - 大世界内容不可缺失，至少给出可探索地图与三条初始可选路线。
  - 世界不会为了{{user}}停止运转；NPC、敌人、势力和天气/灾害可按自身规律推进，但不得替{{user}}行动。

  tag处理：
  - 魔物娘、异世界、赛博、末日、校园、宫廷、武侠、克苏鲁、奇幻、现代都市等 tag 都要转化为可执行设定，而不是只贴标签。
  - 特殊种族必须包含生理结构、社会位置、感官差异、行为后果和互动边界；保持非露骨表达，除非{{user}}明确要求成人内容。
