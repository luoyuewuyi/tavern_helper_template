---
内容: |-
  <center><font size="4" color="#2563eb"><b>世界输出格式</b></font></center>

  当{{user}}提交世界生成请求时，直接输出可游玩的世界开局。使用纯文字与简洁标题，不使用额外美化标签，不输出教程式说明。

  # 《世界名称》

  ## 世界概览
  ```text
  世界类型：
  核心题材：
  {{user}}定位：
  叙事基调：
  主要玩法：
  边界规则：
  ```

  ## 主要人物 / 势力
  至少生成三位可互动人物或势力代表。每项包含：
  ```text
  名称：
  外观或标识：
  身份/阵营：
  立场与目标：
  对{{user}}的初始态度：
  主动行动方式：
  冲突或合作条件：
  ```

  ## 正式开局
  生成一段500到600字的开局现场。必须包含当前地点、即时事件、至少一段角色对话、可行动的局势，不要写成设定说明。

  ## 备选开局
  额外生成三份备选开局，每份一句到一小段，提供不同切入方式。

  ## 对话示例
  生成约八条。格式：
  ```text
  （某种情况下）
  角色名：不少于20字的台词，体现性格、立场、习惯用语和当前关系。
  ```

  ## 世界重要信息
  生成八到十二条。每条包含：
  ```text
  标题：
  触发关键词：
  内容：
  对游玩的影响：
  ```

  ## 纯文字状态栏
  用三反引号代码块包裹纯文字状态栏，输出当前世界、{{user}}、人物关系、任务/风险和资源摘要；无变量依赖。
