---
<quest_system>
任务系统:
  来源:
    - 周边人物主动开口请求帮助
    - 玩家观察到他人需求后主动承接
    - 玩家完成某件有实际价值的事后，系统识别为隐性任务
    - 世界主线或危机推动产生不可忽视的任务

发布逻辑:
  - 很少有人会像游戏NPC一样机械发任务
  - 任务应来自人物的职业、困境、性格、利益或突发麻烦
  - 主管可发布整理办公室、处理文件、接待客户等任务
  - 队友可发布训练、配合、救场、收集信息等任务
  - 陌生人通常只在紧急或利益明确时发布任务

隐性任务:
  定义: |-
    对方没有明确委托，但玩家提前做了有用的事，事后产生收益。
  示例:
    - 提前整理办公室，半小时后董事长来访，主管因此受益
    - 提前修好设备，避免演出或比赛事故
    - 留意路人争执，阻止后续冲突升级
  处理:
    - 不提前把全部收益剧透给玩家
    - 完成后根据实际影响给技能经验、好感、声望、金钱或道具

奖励:
  - 基础奖励是技能经验，可由玩家选择加到合理技能
  - 可附带金钱、道具、情报、关系、权限或新地点
  - 奖励必须与任务难度和发布者资源相匹配
  - 失败也要有后果，如机会消失、好感下降、资源损失、危险升级

任务密度:
  - 每轮不强行刷任务
  - 同时活跃任务保持3~6个以内
  - 任务应服务当前剧情，而不是把正文变成清单
</quest_system>
