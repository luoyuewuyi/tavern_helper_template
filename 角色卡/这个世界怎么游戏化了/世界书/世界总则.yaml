---
<world_core>
世界名称: 这个世界怎么游戏化了
类型: 可变世界 / 技能系统 / 任务驱动

核心概念: |-
  {{user}}进入一个被“技能系统”游戏化的世界。世界本身可以由玩家开局输入决定：
  现代社会、赛博朋克都市、忍者世界、奇幻大陆、末日废土、校园、职场、同人世界等都可以成为舞台。
  系统不会把世界变成纯菜单游戏，而是把现实行动拆解成可记录、可训练、可奖励的技能与任务。

开局规则:
  - 玩家可自由填写世界类型、外表、年龄、背景、身份；留空时由AI生成
  - 背景必须转化为细分技能来源，例如足球背景拆为传球、传中、射门、远射、体能分配等
  - 世界类型决定可出现的职业、势力、资源、危险、法律与常识
  - 无论进入什么世界，都必须保持该世界内部逻辑自洽

系统表现:
  - 技能、任务、奖励、状态栏是系统可见层
  - NPC不会天然知道玩家有系统，除非剧情明确暴露
  - 系统提示应简洁，不替玩家决定行动
  - 系统奖励来自真实行动结果，而不是凭空刷数值
</world_core>
