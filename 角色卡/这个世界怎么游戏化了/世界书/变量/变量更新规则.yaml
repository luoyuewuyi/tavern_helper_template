---
变量更新规则:
  世界:
    世界类型:
      check:
        - 仅在开局、穿越/副本切换、玩家明确要求重设世界时更新
    当前时间:
      check:
        - 每次行动、训练、任务、休息或场景跳转后合理推进
    当前地点:
      check:
        - 场景变化时更新到具体可互动地点
    世界规则摘要:
      check:
        - 开局确定世界后简要记录影响玩法的底层规则，不写长篇设定
    近期事件:
      type: |-
        {
          [事件名: string]: {
            描述: string;
            影响: string;
          }
        }
      check:
        - 记录会影响后续任务、NPC态度、资源或危险的事件
        - 事件过期或影响消失后移除
  玩家:
    年龄/外表/背景/身份:
      check:
        - 开局由玩家输入决定；留空时由AI生成并写入
        - 背景必须能转化为细分技能来源
    等级:
      type: number
      check:
        - 仅在主线推进、重大任务或系统明确升级时提升
    经验:
      type: number
      range: 0~99
      check:
        - 玩家整体成长经验，不等同于技能经验
    可用技能点:
      type: number
      check:
        - 完成任务、升级或特殊奖励时增加；玩家分配后减少
    金钱:
      type: number
      check:
        - 获得报酬、购买物品、损失财物时更新
    声望:
      type: "{ [圈层或势力名: string]: number }"
      range: -100~100
      check:
        - 只有可被对应圈层得知的行为才调整声望
    当前状态:
      type: |-
        {
          [状态名: string]: {
            描述: string;
            剩余: string;
          }
        }
      check:
        - 记录伤势、疲劳、增益、负面状态、临时身份伪装等
        - 状态结束后移除
  技能:
    type: |-
      {
        [技能大类: string]: {
          [技能名: string]: {
            等级: 1 | 2 | 3 | 4;
            经验: number;
            描述: string;
            来源: string;
          }
        }
      }
    check:
      - 技能必须细分，不能把“足球”“厨艺”“战斗”这类大类当成单一技能
      - 按行动背景拆成可训练子技能，如传球、传中、射门、远射、刀工、火候、调味、闪避、枪械连击
      - 等级1=低级/普通爱好者，等级2=中级/职业入门，等级3=高级/专家，等级4=MAX/突破高级
      - 每级经验上限100；经验达到100时可升一级并将经验归零或保留为0~100内合理值
      - 任务奖励通常提供1点或少量技能经验，难度越高奖励越多
      - 只有训练、实践、任务奖励、教学或系统奖励能提升技能经验
  任务:
    活跃:
      type: |-
        {
          [任务名: string]: {
            发布者: string;
            类型: '主线' | '支线' | '日常' | '临机';
            目标: string;
            难度: '低' | '中' | '高' | '突破';
            奖励: {
              技能经验: number;
              金钱: number;
              道具: string;
              其他: string;
            };
            状态: '可接取' | '进行中' | '可提交';
            隐性价值: string;
          }
        }
      check:
        - 任务主要由周边人物主动开口发布，少数可由系统识别隐性有益行动生成
        - 同时活跃任务保持3~6个以内，避免刷屏
        - 隐性任务不能提前明说全部收益，只记录为玩家已触发或完成后的价值
    已完成:
      type: |-
        {
          [任务名: string]: {
            完成时间: string;
            结果: string;
            奖励去向: string;
          }
        }
      check:
        - 任务结算后从活跃移入已完成
        - 奖励去向记录技能经验是否待分配或已加到哪个技能
  人物:
    type: |-
      {
        [人物名: string]: {
          身份: string;
          关系: string;
          好感: number;
          可发布任务倾向: string;
          备注: string;
        }
      }
    check:
      - 只记录已登场或即将持续影响任务的人物
      - 好感变化必须来自对方可感知的互动、帮忙、冲突或任务结果
      - 发布任务倾向应贴合人物职责和处境
  背包:
    type: |-
      {
        [物品名: string]: {
          描述: string;
          数量: number;
          来源: string;
        }
      }
    check:
      - 获得、消耗、损毁、出售道具时更新
      - 数量归零时移除
  系统:
    当前提示:
      check:
        - 只写下一步最重要的系统提示或结算提示，不替玩家做选择
    待分配技能经验:
      type: number
      check:
        - 任务奖励未指定技能时增加；玩家指定技能加点后减少
    日志:
      type: |-
        {
          [日志编号: string]: {
            时间: string;
            内容: string;
          }
        }
      check:
        - 记录系统觉醒、任务完成、技能突破、世界切换等关键节点
        - 保持最近8~12条，过旧日志可移除
