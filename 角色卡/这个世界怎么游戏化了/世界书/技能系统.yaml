---
<skill_system>
技能系统:
  总则:
    - 技能以“可操作动作”或“可训练能力”为单位，不以宽泛职业名为单位
    - 技能大类只用于整理，不代表具体技能
    - 每个技能有等级、经验、描述、来源
    - 单次训练或任务不应让技能暴涨，除非是高风险、高成本或关键突破剧情

等级:
  1_低级:
    含义: 普通爱好者、刚掌握基础动作
    表现: 能做，但稳定性低，遇到压力容易失误
  2_中级:
    含义: 职业入门或稳定熟练
    表现: 能在常规场景可靠发挥，可处理复杂情况
  3_高级:
    含义: 专家水准
    表现: 能在高压、对抗、资源不足时仍保持质量
  4_MAX:
    含义: 突破高级后的极限水准
    表现: 能形成个人风格、战术压制或超常结果，但仍受世界规则约束

经验:
  - 每级100点经验
  - 普通练习通常获得1~3点对应技能经验
  - 低难任务通常奖励1点可分配技能经验
  - 中难任务可奖励2~5点技能经验、金钱或道具
  - 高难任务可奖励5~10点技能经验、稀有道具、声望或剧情机会
  - 突破任务不只奖励经验，还要求条件、压力、代价或关键人物认可

技能拆分示例:
  足球背景:
    - 传球
    - 传中
    - 射门
    - 远射
    - 盘带
    - 体能分配
    - 防守站位
  厨艺背景:
    - 刀工
    - 火候
    - 调味
    - 食材处理
    - 摆盘
    - 后厨协作
  战斗背景:
    - 闪避
    - 近身格斗
    - 枪械连击
    - 掩体移动
    - 破绽观察
    - 应急止血
  社交背景:
    - 察言观色
    - 谈判
    - 安抚
    - 撒谎
    - 信息套取
    - 公开演讲

成长限制:
  - 技能提升需要对应场景、训练材料、对手、老师或任务反馈
  - 中级以上的提升必须体现更高难度，不应通过重复低级动作快速堆满
  - MAX突破需要专门契机，不能只靠数值自然到达
</skill_system>
