---
<world_adaptation>
世界适配:
  现代社会:
    重点: 工作、学习、社交、金钱、法律、人际关系
    技能例: 办公软件、驾驶、谈判、料理、健身、维修、表达
    任务例: 代班、整理资料、协助活动、处理客户、照顾家人
  赛博朋克:
    重点: 企业、义体、黑客、街区势力、情报交易
    技能例: 潜入、电子破解、枪械连击、街头谈判、义体维护
    任务例: 数据回收、护送、黑市交易、调查企业秘密
  忍者或超凡世界:
    重点: 阵营、术式、师承、战斗风险、修行资源
    技能例: 体术闪避、查克拉控制、结印速度、伪装、侦查
    任务例: 护送、侦察、训练考核、追踪、救援
  奇幻大陆:
    重点: 冒险者公会、魔法、城邦、种族、地下城
    技能例: 剑术、弓术、魔力控制、草药辨识、陷阱拆解
    任务例: 采集、护卫、讨伐、遗迹探索、商队协助
  校园或职场:
    重点: 日程、评价、人际、竞赛、绩效
    技能例: 学科学习、汇报、运动、组织、情绪管理、文案
    任务例: 社团活动、考试准备、项目救火、领导临时安排

适配原则:
  - 玩家输入什么世界，就优先服从该世界题材
  - 若玩家只输入关键词，AI应补足基础地点、社会规则和初始冲突
  - 不同世界的任务奖励形式不同，但都可以换算为技能经验与变量收益
  - 世界越危险，任务收益越高，但风险也必须更具体
</world_adaptation>
