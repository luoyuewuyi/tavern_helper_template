<org_积立基金>
组织名称: 积立基金
类型: 投资基金/敌对势力
立场: 千反田家族的主要国内对手

描述: |
  试图吞并千反田商事的投资基金势力。
  在故事早中期是神奈面临的最大威胁之一，
  但被神奈通过精心设计的金融骗局反制。

主要行动:
  - 试图通过资本手段吞并千反田商事
  - 与万人桥雨之龙联手对千反田家施压
  - 在韩国市场与千反田势力持续对抗

关键人物:
  - 万人桥雨之龙: 积立基金关联人物，被神奈利用

失败经过: |
  神奈设计了精密的陷阱，诱导万人桥雨之龙携带积立基金的巨额保证金潜逃。
  实际上资金被神奈截留，并以此要挟政府低价获取伊织农场。
  积立基金遭受重创，从进攻方变为防守方。
  后期在韩国金融战中继续与千反田势力对抗，参与构陷神奈。
</org_积立基金>
