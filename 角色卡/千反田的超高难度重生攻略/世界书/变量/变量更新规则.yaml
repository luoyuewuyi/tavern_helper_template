---
变量更新规则:
  世界:
    当前时间:
      format: YYYY年MM月DD日 HH:MM
      check:
        - 每次事件推进、休息或旅行后更新，保持时间流逝合理
        - 若场景跳转跨度较大，应说明跳跃原因
    当前地点:
      check:
        - 角色移动到新地点时更新
    当前季节:
      type: "'春' | '夏' | '秋' | '冬'"
      check:
        - 根据当前时间的月份自动判断（3-5月春，6-8月夏，9-11月秋，12-2月冬）
    近期事务:
      type: |-
        {
          [事务名: string]: string; // 事务描述
        }
      check:
        - 记录需要完成的任务、商业计划、约定、重要事件等
        - 完成后从列表中移除，新增事务时及时添加
        - 最多保持5-8项活跃事务
  主角:
    身份:
      check:
        - 根据剧情发展和社会地位变化更新当前最主要的身份头衔
        - 身份变化会影响NPC态度，参照经营系统规则
    资金:
      type: number
      check:
        - 收入（投资回报、商业利润、工资等）和支出（生活费、投资、贿赂等）发生时更新
        - 单位为万日元
        - 大额变动需要有明确的事件触发
    声望:
      type: number
      range: 0~100
      check:
        - 根据<user>的公开行为和社会反响调整 ±(3~8)
        - 仅在有社会影响力的事件发生时更新，日常行为不更新
        - 丑闻或公开失败可导致 -10~-30 的大幅下降
    体力:
      type: number
      range: 0~100
      check:
        - 活动消耗、休息恢复时更新
        - 高强度脑力/体力劳动每次 -10~-20
        - 休息一夜恢复 +20~+30
        - 生病时恢复减半
    资产清单:
      type: |-
        {
          [资产名: string]: {
            类型: string;
            估值: string;
            状态: string;
          }
        }
      check:
        - 获得、出售、经营状况变化时更新
        - 估值应根据市场环境合理波动
    人脉网络:
      type: |-
        {
          [人物名: string]: {
            关系等级: '亲密' | '信任' | '友好' | '中立' | '警惕' | '敌对';
            备注: string;
          }
        }
      check:
        - 与指定NPC发生重要互动后更新关系等级
        - 变化需要事件驱动，每次变化不超过一级（除非重大背叛/救命之恩）
        - 备注记录最近一次关系变化的原因
    物品栏:
      type: |-
        {
          [物品名: string]: {
            描述: string;
            数量?: number;
          }
        }
      check:
        - 获取、消耗、丢弃物品时更新
        - 数量归零后移除该条目
  家族:
    千反田商事状态:
      check:
        - 公司经营出现重大变化时更新（如业务调整、财务危机、并购等）
    千家良品状态:
      check:
        - 品牌发展出现阶段性变化时更新
    总资产估值:
      type: number
      check:
        - 仅在重大资产变动后更新，单位为亿日元
        - 经济危机期间可能大幅波动
