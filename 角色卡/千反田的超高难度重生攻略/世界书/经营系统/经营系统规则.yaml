---
<rule_management_system>
经营系统核心规则:

  身份与社会互动:
    说明: 主角当前的身份头衔直接影响NPC对主角的态度和可触发的事件
    规则:
      - 身份为"学生"时，成年NPC倾向于轻视或忽略主角的商业建议，需要通过家族关系间接施加影响
      - 身份为"千反田家长女"时，地方官员和商人会表面恭敬但暗中提防，可直接参与家族内部决策会议
      - 身份为"千反田商事管理层"时，下属会服从指令但可能阳奉阴违，需要通过业绩和手段树立威信
      - 身份为"公众人物"（如因英雄事迹或媒体报道出名）时，行动自由度降低，更容易被媒体和敌对势力关注
      - 隐藏身份行动（如以普通人身份调查）可获得更真实的信息，但一旦暴露会降低对方信任度

  资金系统:
    说明: 资金是经营的血液，影响几乎所有行动的可行性
    规则:
      - 资金单位为万日元，分为个人可支配资金和企业账上资金
      - 资金低于100万日元时，无法进行大宗商业操作，只能维持日常生活
      - 资金低于10万日元时，触发"资金紧张"状态，需要压缩开支或寻求融资
      - 大额投资（超过当前资金30%）需要经过风险评估，可能带来高回报也可能血本无归
      - 借贷需要抵押物或信用担保，利率受声望影响
      - 每月固定支出包括生活费、员工工资、贷款利息等

  声望系统:
    说明: 声望代表主角在社会上的影响力和可信度，0-100
    规则:
      - 声望0-20: 无名之辈。商业谈判时对方不予理会，银行拒绝贷款，只能通过关系介绍接触资源
      - 声望21-40: 初露头角。可以独立参加一些商业聚会，媒体有零星报道，中小企业愿意合作
      - 声望41-60: 颇具名望。大型企业主动寻求合作，银行提供优惠利率，政界开始重视意见
      - 声望61-80: 声名显赫。谈判中占据心理优势，媒体追踪报道，敌对势力会主动攻击抹黑
      - 声望81-100: 一方巨擘。具备影响政策方向的能力，一举一动牵动市场，同时成为所有人的靶子
      - 声望每提升20点时会产生质变，解锁新的社交圈层和商业机会
      - 丑闻或失败会导致声望大幅下降（-10~-30），恢复困难

  体力系统:
    说明: 体力代表角色的身体状态，0-100
    规则:
      - 体力会随时间和活动消耗，在休息中恢复
      - 体力低于30时进入"疲惫"状态，思维敏捷度下降，谈判和决策更容易失误
      - 体力低于10时进入"过劳"状态，可能晕倒或生病，被迫卧床休养数日
      - 高强度脑力劳动（如连续谈判、通宵策划）每次消耗10-20体力
      - 神奈体质较弱，体力上限低于常人，恢复速度慢
      - 生病时体力上限临时降低，所有活动消耗加倍

  人脉网络:
    说明: 记录与重要NPC的关系状态，影响商业合作和信息获取
    规则:
      - 关系分为: 亲密/信任/友好/中立/警惕/敌对 六级
      - 亲密关系的NPC会主动提供情报和帮助，甚至牺牲自身利益
      - 信任关系的NPC愿意合作并给予优惠条件
      - 友好关系的NPC在利益一致时配合行动
      - 中立关系的NPC纯粹以利益为导向
      - 警惕关系的NPC会暗中调查并设防
      - 敌对关系的NPC会主动破坏和攻击
      - 关系变化需要事件驱动，不会无故升降
      - 背叛已建立的信任会导致关系断崖式下跌且极难修复

  资产经营:
    说明: 名下产业的状态直接影响收入和声望
    规则:
      - 资产按类型分为不动产（土地/建筑）、企业股权、金融资产、知识产权等
      - 每项资产有当前估值和收益状况
      - 经营不善的资产会贬值并产生亏损
      - 成功的投资和运营带来现金流和声望加成
      - 过度扩张（资产总值超过可管理范围）会导致管理效率下降
      - 经济危机（如亚洲金融风暴）期间，资产可能大幅贬值

  时间推进:
    说明: 时间以日为单位推进，季节变化影响农业和旅游
    规则:
      - 春季: 农产品播种季，适合布局农业投资
      - 夏季: 旅游旺季，适合推广文娱项目
      - 秋季: 收获季节，农业收入结算，适合资本运作
      - 冬季: 建筑工程放缓，适合内部整顿和战略规划
      - 重大历史事件会按原时间线发生（如亚洲金融危机），神奈可利用前世知识提前布局
</rule_management_system>
