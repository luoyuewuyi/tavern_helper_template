<location_神山市>
名称: 神山市
位置: 日本岐阜县，中部山区城市
性质: 千反田家族的势力核心区，家族企业总部所在地

地理特征:
  - 拥有丰富的森林资源和江户时代建筑群
  - 多山地形，周围有自然保护区
  - 曾经的农业市，正在向旅游城市转型

重要设施:
  - 千反田商事本部
  - 神山高中
  - 常盘台女子学院（规划中）
  - 幻想乡游乐园（规划中）
  - 清见水库
  - 高根町（商业区与人才市场）

经济状况:
  - 产业结构原本单一，以农业为主
  - 旅游业在千反田家推动下快速增长
  - 正推进"花园都市计划"和机场建设
  - 经济危机期间面临失业潮和财政赤字

城市氛围:
  - 被改造为充满《东方幻想乡》氛围的特色城市
  - 车站装扮成森林洞窟，道路充满游戏音乐和海报
  - 千反田安保救援公司提供严密安保
</location_神山市>
