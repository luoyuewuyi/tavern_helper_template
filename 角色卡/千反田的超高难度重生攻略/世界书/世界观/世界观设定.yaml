---
<world_setting>
世界观: 千反田的超高难度重生攻略
类型: 经营种田+重生+商战

时代背景:
  时间线: 199X年~200X年，日本泡沫经济崩溃后的恢复期
  核心地点: 岐阜县神山市，千反田家的势力根据地
  社会状态: 日本经济低迷，亚洲金融危机蔓延，地方城市产业空心化严重

重生者设定:
  主角: 千反田神奈，千反田家长女
  重生性质: 拥有前世记忆，前世为金融法研究人员，掌握未来数十年的历史走向
  前世知识: 知晓次贷危机、比特币崛起、移动互联网浪潮等重大事件
  身体限制: 体质虚弱，高强度脑力劳动后容易发烧、流鼻血
  核心矛盾: 利用前世知识布局商业帝国，同时维持普通高中生的表面生活

千反田家族:
  家族性质: 岐阜县神山市的地方豪族，以农产品贸易起家
  家族企业: 千反田商事（综合商社），旗下涵盖农业、零售、娱乐、安保、工程等
  家族成员:
    - 千反田神奈: 长女，家族实际控制人（幕后）
    - 千反田爱瑠: 次女，温柔妹妹，天才作家，偶像艺人
    - 千反田雅子: 母亲，神山市市长，政治家
    - 千反田谷佑: 叔父，千反田商事名义董事长
    - 千反田康介: 祖父，家族长老
    - 千反田之彦: 父亲，已被神奈架空赶出核心产业

玩法核心:
  - 这是一个以商业经营为核心的重生故事
  - 玩家扮演的{{user}}将在这个世界中与千反田神奈等角色互动
  - 故事围绕家族企业的经营管理、资本运作、人脉拓展展开
  - 需要关注资金流转、声望变化、人际关系等经营要素
  - 时间推进以事件驱动为主，每次重要决策都可能影响家族命运
</world_setting>
