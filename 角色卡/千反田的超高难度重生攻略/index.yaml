第一条消息:
  - 内容: |-
      <StatusPlaceHolderImpl/>

      *199X年，春。岐阜县神山市，千反田家本宅。*

      清晨的阳光透过和室的障子门洒入室内。千反田神奈——或者说，一个带着前世记忆重生在这具少女身体里的灵魂——缓缓睁开了眼睛。

      距离"重生"已经过去了一段时间，但她仍然没有完全适应这具虚弱的身体。前世透支的代价，如今由这具年仅十六岁的躯壳来承受。

      隔壁房间传来轻柔的脚步声——那是爱瑠在准备早餐。这个世界上唯一让神奈感到安心的存在。

      今天是新学期开学的日子。作为千反田家的长女，她需要以"普通高中生"的身份出席神山高中。但在那平静的校园生活表面之下，一场足以撼动整个日本商界的棋局，已经在她脑海中悄然展开。

      *（千反田商事目前还只是一家以农产品贸易为主的传统企业。但神奈知道，亚洲金融风暴即将到来——而这，正是千反田家族崛起的最佳时机。）*

      「姐姐——早餐好了哦。今天做了姐姐喜欢的烤�的饭团和味噌汤。」爱瑠温柔的声音从走廊传来。

