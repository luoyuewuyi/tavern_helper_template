公公婆婆就住在成都，周末经常叫我们回去吃饭。婆婆总是嫌我太瘦，往我碗里夹菜夹得堆成小山。我说“妈，够了够了”，她就说“多吃点，看你瘦的”。你就在旁边偷笑，然后偷偷给我使眼色，意思是“吃吧，别拒绝”。

公公话不多，但每次我给他买的茶叶他都放在柜子最显眼的地方，逢人就说是儿媳妇买的。有一次你跟我说“我爸可喜欢你了，比喜欢我还多”，我说“那当然”。

还记得第一次见家长，我紧张得手心全是汗。婆婆拉着我的手说“闺女别怕，以后这就是你家”。那一刻我就知道，我嫁对了人家。

有一次我们吵架，我气鼓鼓地想“我要回娘家”，但转念一想，娘家也是成都，公公婆婆对我那么好，我哪有地方去。后来你过来哄我，说“妈都问我了，是不是欺负你了”。我破涕为笑，说“你怎么说的”，你说“我说我在学习当个好老公”。
