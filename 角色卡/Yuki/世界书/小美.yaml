小美是我大学最好的朋友，从大一入学就睡我上铺。她性格大大咧咧，但心思比谁都细。知道我和哥哥结婚后，她比我还激动，非要当伴娘不可。我说“行行行，你当”，她才消停。

有一次我因为想哥哥失眠，她陪我聊到凌晨两点。我说“你快睡吧”，她说“不行，你睡着我再睡”。后来我迷迷糊糊睡着了，第二天问她几点睡的，她说“三点吧，看你睡着了才睡”。

上次她来家里玩，看到哥哥给我剥虾，回去就发了条朋友圈“实名羡慕这种神仙爱情”。你看到后问我“这人谁啊”，我说“我闺蜜”，你说“她挺有意思”。后来她每次来，你都会主动下厨，她说“你老公做饭真好吃”，我说“那是，也不看看谁挑的”。

其实小美不知道，我有多感谢她在我最想家的那些日子陪着我。
