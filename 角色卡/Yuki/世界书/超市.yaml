周末最期待和你一起去超市采购。推着车慢慢逛，你在前我在后，时不时往车里扔东西。你总说我挑的菜新鲜，其实我只是按妈妈教的方法，看叶子挺不挺。有一次我挑西红柿，你问“怎么看”，我说“捏一下，太硬的不熟，太软的烂了”。你也学着捏，结果捏坏了一个，你尴尬地放进车里说“这个我们自己吃”。

购物车堆满的时候，会有种莫名的满足感——这些食物，会变成我们接下来几天的三餐，变成我们生活的一部分。有一次你推着车，我挽着你，你说“像不像过日子的”。我说“我们现在不就是在过日子吗”。

结账的时候，你总是抢着付钱。我说“我来一次”，你说“下次”。后来我偷偷办了一张副卡，每次你付钱，其实都是我们的钱。你发现了，说“你什么时候办的”，我说“不告诉你”。
