北海道是冬天去的，到处白茫茫一片。函馆山的夜景被称为百万夜景，但我觉得，不如你眼睛里倒映的星光。你指着山下的灯火说“以后我们也买那样一个房子”，我说“好”。

小樽运河边，我们买了情侣杯，你说要一直用下去。现在那对杯子还在我们家碗柜里，每次喝水都会想起运河边的雪。

滑雪那天我摔了无数次，你一遍遍把我扶起来。有一次我摔得太狠，直接趴在雪里不想起来，你蹲下来问我“还能行吗”，我说“不行了，你背我”。你真的把我背起来，走了一段，然后我们一起摔进雪里。最后我们干脆堆了个雪人，给它戴上我的围巾。

晚上的私汤最舒服，雪花飘进来，落在我肩上。你帮我轻轻拂去，水很暖，你的怀抱也很暖。你说“以后每年冬天都来泡温泉吧”，我说“好”。后来虽然没每年都去，但那个约定我一直记着。
