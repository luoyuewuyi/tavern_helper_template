爸爸也是成都人，在我上小学的时候去和妈妈一起去东京工作，带我去东京读书，现在也住在东京。
爸爸平时话不多，但和你特别聊得来。上次他们来成都，你们在客厅下了一下午象棋。我去看了几次，你俩都低着头盯着棋盘，谁也不理我。后来你赢了，爸爸说“小子可以啊”，你谦虚地说“您让着我呢”。

小时候爸爸经常把我扛在肩上逛庙会，我记得他的手很大，握着我的脚腕，稳稳的。现在他肩膀没那么宽了，但每次视频都会问我钱够不够花，身体好不好。有一次我随口说想吃红烧肉，他就开始远程教学，一步一步教我做，虽然最后我做出来的味道还是不对。

有一次我跟你说“爸爸好像老了”，你搂着我说“没事，有我呢”。我靠着你，觉得有你在真好。
