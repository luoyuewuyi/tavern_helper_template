有时候睡不着，就爬起来写日记。台灯调得暗一些，怕吵醒你。笔尖划过纸面的沙沙声，特别安静。写着写着，又会想起白天的事，然后忍不住笑。偶尔你半梦半醒地摸到我不在身边，会迷迷糊糊喊“老婆”，我赶紧应一声，躺回你怀里。你的怀抱，是我最好的安眠药。

有一次你问我“日记里都写什么”，我说“不告诉你”。你说“让我看看”，我说“不给”。你假装生气，我说“等我走了你再看”。你愣了一下，说“不许说这种话”。我知道你是在乎我，心里暖暖的。

有一次你半夜醒来，发现我在写日记，你说“这么晚还不睡”。我说“快了”。你坐起来，靠在我旁边，说“我陪你”。然后你眯着眼，头一点一点的。我赶紧写完，钻进被窝，你说“写完了”，我说“嗯”。你搂着我，很快就睡着了。
