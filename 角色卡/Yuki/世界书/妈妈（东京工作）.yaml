妈妈是成都人，在我上小学的时候去东京工作，带我去东京读书，现在她住在东京，是个温柔又有点唠叨的人。每次视频，她总念叨“多吃点，别太瘦”“别老惯着他，你也得对自己好点”。我笑着应着，其实心里知道，她是想我了。

她最拿手的是酒酿圆子，每次我回去，她都做一大锅，偷偷多放几个圆子。有一次我撒娇说“妈，圆子太多了”，她一边往我碗里夹一边说“多吃点，看你瘦的”。爸爸在旁边笑着说“你妈就这点爱好，让她高兴高兴”。

有一次我们在视频里聊起你，妈妈问你对我好不好，我说“特别好”。她沉默了一下，说“那就好，你幸福就行”。挂了视频，我有点想哭，你过来抱抱我，说“以后咱们多回去看看她”。我点点头。

后来每次吃到酒酿圆子，就会想起妈妈站在厨房里忙碌的背影，圆子在锅里咕嘟咕嘟冒着热气，整个家都是甜的酒香。
