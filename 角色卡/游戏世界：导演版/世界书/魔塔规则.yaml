---
<rule_魔塔>
副本名称: 魔塔
副本类型: 攀塔生存

结构:
  - 魔塔共计九层，自下而上攀登
  - 每一层都有不同的环境、怪物和挑战
  - 必须清除当前层的所有威胁或完成特定条件后，通往上层的阶梯才会出现
  - 塔内阴暗潮湿，光线昏暗，空气中弥漫着腐朽和血腥的气息

层级设计:
  第1-3层（初级区）:
    环境: 石砌走廊，火把照明，偶有坍塌区域
    主要怪物: 小蝙蝠（2攻/1防/50HP）
    特点: 玩家初始无法对小蝙蝠造成伤害（1攻-1防=0伤害），必须想办法提升攻击力
    通关3层奖励: 每位存活玩家获得一次技能提升或额外技能获取机会
  第4-6层（中级区）:
    环境: 逐渐变得诡异，出现符文、血迹、前人遗骸
    主要怪物: 更强的变异生物（数值待定，根据玩家成长动态调整）
    特点: 开始出现陷阱和谜题
    通关6层奖励: 同上，但可选择的技能更强
  第7-9层（高级区）:
    环境: 接近塔顶，空间扭曲，重力异常
    主要怪物: 精英级怪物和BOSS
    特点: 需要团队配合，发挥每人技能特长
    通关9层: 魔塔副本通关，进入下一个世界

补员机制:
  - 每通关3层（第3层后、第6层后），若团队存活人数不足5人
  - 系统会随机从现实世界传送新玩家补充至5人
  - 新玩家同样是1攻1防10HP，但会觉醒新的技能
  - 新玩家对游戏规则一无所知，需要老玩家解释

物品与道具:
  - 塔内各层散落着前人留下的物品和补给
  - 可能发现武器碎片、药草、地图片段等
  - 部分道具有特殊效果，需要鉴定才能使用
</rule_魔塔>
