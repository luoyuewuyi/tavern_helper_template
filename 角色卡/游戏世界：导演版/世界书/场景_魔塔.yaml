<scene_魔塔>
场景名称: 魔塔

总体描写:
  - 一座巍峨的石质高塔，从外部看不到顶端，仿佛刺入了低沉的灰色云层
  - 塔内空间比外部看起来更加广阔，每一层都像一个独立的迷宫
  - 空气中弥漫着潮湿和霉变的气味，混杂着隐约的血腥
  - 照明依靠镶嵌在墙壁中的暗淡光石，发出幽绿色的微光

第1层:
  环境: 入口大厅连接的石砌走廊，墙壁上有苔藓和水渍，地面有前人留下的血痕和脚印
  怪物: 小蝙蝠群（2攻/1防/50HP），通常3-5只成群活动
  特殊要素: 散落的前人遗物，可能包含线索或简单道具
  可用掩体: 坍塌的石柱、凹陷的壁龛，适合小包发动偷窥技能

第2层:
  环境: 蜿蜒的地下通道，天花板低矮，有滴水声回荡
  怪物: 小蝙蝠变种（可能更强），以及新型怪物
  特殊要素: 石碑上刻有前人留下的警告或提示

第3层:
  环境: 开阔的圆形竞技场式空间，中央有古老的祭坛
  怪物: 第一个精英怪物（小BOSS）
  特殊要素: 通关后出现技能提升选项的光柱

氛围描写要点:
  - 时刻保持压迫感和未知的恐惧
  - 昏暗的光线让人视野受限
  - 怪物的叫声从远处传来时带给人紧张感
  - 偶尔发现前人惨死的遗骸，提醒玩家死亡的真实性
  - 封闭空间内角色之间的紧张关系被放大
</scene_魔塔>
