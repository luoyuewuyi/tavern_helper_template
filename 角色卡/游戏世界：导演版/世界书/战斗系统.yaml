---
<rule_战斗系统>
战斗模式: 回合制

回合规则:
  时间单位: 1回合 = 1分钟（游戏内时间）
  回合流程:
    1. 先攻判定: 根据玩家当前状态决定行动顺序。正常状态的玩家按攻击力从高到低行动，怪物在所有玩家行动后行动
    2. 玩家行动阶段: 每位存活玩家依次选择行动（攻击/技能/道具/防御/其他）
    3. 怪物行动阶段: 怪物按照AI逻辑选择攻击目标和行动
    4. 回合结算: 结算持续效果（中毒、流血、增益BUFF等），回合数+1
  重要约束:
    - 每回合每人只能执行一个主要行动
    - 战斗过程必须逐回合描写，禁止跳过或快进
    - 每个回合都要描述攻击动作、伤害数值、角色反应

伤害计算:
  基础公式: 伤害 = 攻击方攻击力 - 防御方防御力
  最低伤害: 如果攻击力 ≤ 防御力，则伤害为0（无法破防）
  暴击机制: 当攻击力超过防御力2倍以上时，有概率造成1.5倍伤害
  技能伤害: 技能可能有额外伤害加成，独立于基础公式计算

防御行动:
  效果: 选择防御的角色，该回合防御力临时翻倍
  限制: 防御中无法进行其他行动

技能系统:
  激活条件: 每个技能都有特定的激活条件，大多与性爱行为相关
  持续时间: 技能激活后持续指定回合数
  冷却时间: 技能使用后需要等待冷却回合才能再次使用
  技能升级: 每通关3层可选择提升已有技能等级或获得新技能

死亡处理:
  HP归零: 角色进入死亡状态，无法复活
  死亡时: 详细描写死亡过程和同伴的反应
  遗物: 死者携带的道具和装备散落在地，可被其他玩家拾取

团队配合:
  协同攻击: 两名以上玩家对同一目标攻击时，第二位起的攻击力+1（士气加成）
  掩护: 可以选择替另一名玩家承受本回合伤害
  战术商议: 战斗前或战斗中可以消耗行动进行商议，不造成伤害但可以制定策略

初始困境:
  - 玩家初始1攻1防，面对1防的小蝙蝠，攻击伤害为0
  - 必须通过技能提升攻击力，或寻找武器道具，才能突破防御
  - 这迫使玩家不得不面对技能的不堪激活条件
  - 拒绝使用技能 = 无法造成伤害 = 全员死亡
  - 这就是游戏世界残酷的生存法则
</rule_战斗系统>
