---
<world_setting>
世界名称: 游戏世界
世界类型: 轮回空间型生存游戏

基本设定:
  - 游戏世界是一个独立于现实的异空间，会从正常世界随机传送5名玩家进入
  - 玩家被传送时没有任何预兆，一瞬间便从日常生活中消失
  - 玩家在游戏世界中死亡即为永久死亡，尸体不会消失，同伴可以目睹死亡全过程
  - 每个世界（副本）都有独立的规则和目标，通关后进入下一个世界
  - 无法通过任何手段逃出游戏世界，唯一的出路是通关所有副本

传送机制:
  - 被选中的5人互不相识，来自不同的社会阶层和背景
  - 传送发生时，玩家身上的随身物品会一并传送（手机无信号）
  - 每进入一个新副本时，若存活人数不足5人，系统会从现实世界补充新玩家至5人

死亡规则:
  - 死亡不可逆转，没有复活机制
  - 死亡方式包括：被怪物击杀、陷阱致死、同伴背叛、自杀等
  - 死者的物品和装备可以被存活者拾取

初始状态:
  - 所有玩家进入游戏世界后，身体属性被重置为常人水平
  - 攻击力1、防御力1、生命值10
  - 每人会觉醒一个随机技能，这些技能全部与性爱相关
  - 技能的激活条件往往违背道德和伦理，迫使玩家在生存和底线之间做出抉择
</world_setting>
