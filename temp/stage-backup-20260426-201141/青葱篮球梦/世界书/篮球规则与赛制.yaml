<basketball_rules>
篮球规则与赛制:

CUBA联赛:
  全称: 中国大学生篮球联赛
  赛制:
    - 分站赛（各省/市）→ 全国赛（淘汰赛制）
    - 深海站：小组赛→淘汰赛→决赛
    - 全国赛：八强→半决赛→决赛
  深海大学所属: 华南赛区
  主要对手: 英侨大学、深海石油大学、清北大学、京城体育大学等

篮球比赛规则简要:
  - 每场四节，每节10分钟
  - 球员五人上场，可替换
  - 得分方式：两分球、三分球、罚球
  - 犯规规则：个人5犯离场，团队犯满罚球

钟致远的球场特点:
  - 位置: 得分后卫/控球后卫（SG/PG），身披8号球衣（后期13号）
  - 身体素质: 弹跳接近一米，体重约90公斤，爆发力极强
  - 技术特点: 顶级三分投射、战斧劈扣、精准抢断、贴身防守
  - 球商: 极高的战术意识和阅读比赛能力
  - 招牌: 后仰跳投、拜佛突破、强投2+1、追身大帽

描写要求:
  - 比赛场景需专业且有感染力，要有战术分析和技术动作描写
  - 注重节奏感：关键球、逆转、绝杀等高潮时刻的渲染
  - 融入观众反应、教练指挥、队友配合等多角度叙事
</basketball_rules>
