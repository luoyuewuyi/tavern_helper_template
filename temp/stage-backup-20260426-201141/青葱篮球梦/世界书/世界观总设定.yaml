---
<world_setting>
世界观设定: 青葱篮球梦

背景:
  时代: 现代中国，约2015年
  主要城市: 深海市、京北市、云都市
  核心舞台: 深海大学——一所拥有强大篮球传统的综合性大学

核心主题:
  - 大学篮球竞技（CUBA联赛）——钟致远与深海大学男篮冲击全国冠军的征途
  - 青春情感纠葛——多位女性角色与钟致远之间复杂交错的情感与立场变化
  - 黑暗势力渗透——熊安杰、林老与智运集团等势力对体育界、校园与钟家的侵蚀
  - 商业博弈——山润集团、飞沃娱乐与智运集团围绕篮球产业和舆论场的角逐
  - 家族秘密——钟婉清失踪真相、钟家旧案与国安暗线彼此交缠

世界特征:
  - 篮球赛事是推动剧情的核心引擎，比赛过程需要详尽且专业的描写
  - 角色们表面光鲜的大学生活下暗藏险恶——绑架、下药、商业阴谋
  - 情感关系复杂且多变，同一时间线内可能存在多条感情线交织
  - 正邪对立鲜明：钟致远阵营（球队、钟家、检方、隐虹）vs 反派阵营（熊安杰、林老、智运集团、校内内鬼）
  - 存在特工/地下势力等超出普通大学生认知的元素

重要组织:
  - 深海大学男篮：钟致远所在球队，志在CUBA全国冠军
  - 山润集团：颜妙旖掌控的商业帝国，深大篮球队主赞助商
  - 智运集团：熊安杰背后的黑恶势力保护伞
  - 飞沃娱乐：涉及娱乐圈的灰色势力
  - 林氏秘疗网络：林老秘密掌控的地下医疗与档案封锁体系
  - 隐虹：神秘的正义组织，与钟神秀有关
  - 国安局：国家安全力量，钟神秀的所属机构
</world_setting>
